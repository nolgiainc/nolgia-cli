  /agent/models:
    get:
      tags: [Agent]
      operationId: listAgentModels
      summary: Selectable agent brains (reasoning models) with their flat per-turn credit rates.
      description: >-
        Every entry is a model the platform can actually serve for an agent's reasoning loop — routed through the LLM proxy with a provider-outage fallback group — priced as a flat credit rate per chat turn. The default brain is included; premium brains cost more per turn. `gpt-6-astra` is the top tier at 170 credits a turn: OpenAI's hardest reasoning model, for long-horizon reasoning, coding and long documents. Retired brains are NOT listed: `glm-5.2` (superseded by `glm-5.3`) and `kimi-k3` left the catalogue on 2026-09-09, and an agent still pinned to one keeps running and keeps billing at its own rate — GET /agent carries a `model_advisory` for that case. Treat this catalogue as the source of truth for both the selectable ids and their rates rather than hard-coding either — it is served from the same table that prices the turn.
      responses:
        '200':
          description: The selectable brains, default first, then by ascending per-turn rate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelCatalog'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/model:
    put:
      tags: [Agent]
      operationId: setAgentModel
      summary: Choose which brain the user's agent runs; turns bill that brain's flat per-turn rate.
      description: >-
        Pins the agent's reasoning model to one of the selectable brains from GET /agent/models. The selected brain takes effect on the next newly executing chat turn, billed at that brain's flat per-turn credit rate. Existing turns keep their durable execution model and billing rate, including when resumed or retried. A running agent stays `running`: the switch does not roll or restart the pod or queue turns. The switch record is immediately `ready` with `expected_seconds: 0`, exposed via `model_switch` in the response and subsequent GET /agent responses. Selecting the brain the agent already runs is a no-op that returns the current state. Other pod surfaces, such as the dashboard UI and Telegram bot, follow the durable model pin on subsequent convergence rolls triggered by changes that require a restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAgentModelRequest'
      responses:
        '200':
          description: The updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Agent]
      operationId: clearAgentModel
      summary: Clear the agent's model pin to use the platform default brain and rate.
      description: >-
        Removes an explicit model selection so the next newly executing chat turn uses the fleet default brain and its flat per-turn credit rate. Existing turns keep their durable execution model and billing rate, including when resumed or retried. A running agent stays `running`: the switch does not roll or restart the pod or queue turns. As with PUT /agent/model, the switch record is immediately `ready` with `expected_seconds: 0`. Other pod surfaces, such as the dashboard UI and Telegram bot, follow the cleared pin on subsequent convergence rolls triggered by changes that require a restart. A no-op when the agent already uses the default brain, returning the current state.
      responses:
        '200':
          description: The updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/chat:
    post:
      tags: [Agent]
      operationId: sendAgentChatMessage
      summary: Relay a chat message to the user's deployed NOLGIA Agent and return its reply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
      responses:
        '200':
          description: Agent reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/messages:
    post:
      tags: [Agent]
      operationId: submitAgentMessage
      summary: Submit a chat message to the user's NOLGIA Agent asynchronously.
      description: |
        The async counterpart to `POST /agent/chat`: the message is persisted
        to the transcript immediately (role `user`, status `complete`)
        together with a pending agent reply row, and `202` returns both ids.
        A background worker relays the message to the agent pod with a
        generous timeout (long agent turns no longer time out at the HTTP
        boundary) and completes or fails the pending row; poll
        `GET /agent/messages` to observe it.

        One turn is in flight PER SESSION at a time: submitting while that
        session's reply is still pending returns `409` carrying the pending
        agent message id (use steering to keep talking mid-turn). Turns
        running in the user's OTHER sessions never block a submit:
        the new turn is accepted (`202`) and — when the user's
        concurrent execution slots are full — QUEUED, starting
        automatically (FIFO by submit time) as slots free up. Up to a small
        number of one user's turns execute concurrently (currently
        2) when the agent pod supports per-turn attribution credentials, so
        every generation still names the exact turn that caused it; older
        pods execute one turn at a time. A queued reply row reports
        `queued: true` until it starts; render it as waiting, not thinking.
        At most 10 turns may be pending (executing plus queued) across a
        user's sessions; past that, submits return `429`.

        Errors carry a machine-readable `code`: `409` and `429` are `session_busy`.

        **Steering**: pass `steering: true` to keep talking while a turn is
        in flight without cancelling it. If a turn is pending IN THE TARGET
        SESSION, the message is recorded immediately (transcript role
        `user` with `steering: true`, no `409`) and `202` returns only
        `user_message_id`; when that session's in-flight turn completes or
        fails, the steering messages queued behind it in the SAME session
        are automatically delivered to the agent as that session's next
        turn (joined in order, one per line, as a single relayed prompt
        whose reply row references the last steering message). Steering is
        per session: a steer typed into one chat only ever reaches that
        chat's run. If the target session has NO pending turn, a steering
        send behaves exactly like a normal send — it creates the turn and
        the response carries both ids — so clients may always set
        `steering: true` from an unlocked composer without racing turn
        completion.

        Pass `session_id` to file the turn under one of your chat sessions
        (see `/agent/sessions`). Omitting it files the turn under your
        auto-created default session, reused by later sessionless submits.
        When the session is linked to a project, the platform scopes the
        turn to that project server-side.

        **Starting a new chat**: pass `new_session` (instead of
        `session_id`) to create a fresh chat session and file this message
        under it in ONE transaction. The session only exists once its first
        message does, so opening a composer never leaves an empty chat in
        the history; the created session is returned as `session`, and
        `session_id` names it. `new_session` accepts the same fields as
        `POST /agent/sessions` (name, project link, preset, campaign) — an
        omitted name is derived from the message text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentMessageRequest'
      responses:
        '202':
          description: Message accepted; the agent reply is being produced asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAgentMessageAccepted'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          description: "This session's previous turn is still pending; steer it, or wait for it to complete or fail. Carries code: session_busy."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageConflict'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    get:
      tags: [Agent]
      operationId: listAgentMessages
      summary: Chronological agent chat transcript for the current user.
      description: |
        Returns transcript rows (both roles) in chronological order, oldest
        first. A pending agent row means the reply is still being produced —
        render it as "thinking…" and poll with `since` set to the newest
        `created_at` already seen, re-fetching pending rows until their
        status turns `complete` or `failed`.

        Pass `session_id` to restrict the transcript to one chat session;
        without it ALL messages are returned regardless of session (the
        pre-sessions behavior).
      parameters:
        - name: session_id
          in: query
          required: false
          description: Return only messages belonging to this chat session.
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          description: Return only messages created strictly after this timestamp.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum messages to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Transcript messages, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageList'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/messages/{id}:
    get:
      tags: [Agent]
      operationId: getAgentMessage
      summary: Fetch one transcript message.
      description: |
        Returns one row of the caller's transcript exactly as
        `GET /agent/messages` serves it, including feedback on rated agent
        replies. Returns `404` when it does not exist or is not the caller's.
        Clients waiting for a reply poll this with backoff instead of paging
        the transcript.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The transcript message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/messages/{id}/feedback:
    parameters:
      - name: id
        in: path
        required: true
        description: The agent reply's message id (an `agent`-role row of `GET /agent/messages`).
        schema:
          type: string
          format: uuid
    put:
      tags: [Agent]
      operationId: setAgentMessageFeedback
      summary: Record or replace the caller's thumbs up or thumbs down on an agent reply.
      description: |
        Records the caller's rating of one agent reply, replacing whatever
        they recorded before: there is exactly one feedback row per message
        and user, so changing your mind is another `PUT`, not a delete and
        re-create. An optional `note` of up to 500 characters (typically
        "what went wrong" on a thumbs down) travels with the rating and is
        reviewed internally. Whitespace-only notes are dropped.

        Feedback is personal to the transcript owner: the message must be an
        `agent`-role row of the caller's own transcript (`agent_messages` is
        keyed by the user who chatted, in every organization context), so a
        message that is not the caller's, or does not exist, answers `404`.
        A `user`-role message answers `400`; a reply that is still `pending`
        answers `409` (rate it once it has settled).

        Analytics only for now: recording feedback does not change how the
        agent behaves. `GET /agent/messages` echoes the recorded rating on
        the message's `feedback` field so clients can render the state on
        reload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageFeedbackRequest'
      responses:
        '200':
          description: The recorded feedback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageFeedback'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Agent]
      operationId: clearAgentMessageFeedback
      summary: Clear the caller's feedback on an agent reply.
      description: >
        Removes the caller's rating and note from the reply, so a second tap on the same thumb un-records it. Idempotent: `204` whether or not feedback was recorded, as long as the message is an `agent`-role row of the caller's own transcript; `404` otherwise.

      responses:
        '204':
          description: Feedback cleared (or there was none).
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/followups:
    post:
      tags: [Agent]
      operationId: suggestAgentFollowups
      summary: Suggest short next-step follow-up prompts for a chat exchange.
      description: >
        Given the most recent user message and the assistant's reply, returns up to 3 SHORT, imperative, tap-to-send next-step prompts a user could pick to continue the conversation (e.g. "Make the intro punchier", "Turn this into a 15s vertical cut", "Add captions"). This is a best-effort UX affordance: it is not credit-gated, uses a small fast model with a short upstream timeout, and NEVER fails the caller's flow — whenever the model is unavailable, errors, times out, or returns nothing usable it responds `200` with an empty `suggestions` array. Browser (JWT) sessions only — PATs are rejected.

      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentFollowupsRequest'
      responses:
        '200':
          description: >
            Suggested follow-up prompts (0 to 3). An empty array is a normal, successful response when no usable suggestions were produced.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFollowupsResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/transcriptions:
    post:
      tags: [Agent]
      operationId: transcribeAgentAudio
      summary: Transcribe an uploaded audio asset to text (browser sessions only).
      description: >
        Transcribes a short audio asset — typically a voice note recorded in the chat composer and stored via the signed-upload flow — into text using a speech-to-text model behind the platform's model proxy. The asset must be owned by the caller (`404` otherwise), have modality `audio`, be status `ready`, and be at most 25 MiB (`400` otherwise); an upstream transcription failure surfaces as `502`. Browser (JWT) sessions only — PATs are rejected.

      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscribeAgentAudioRequest'
      responses:
        '200':
          description: The transcribed text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTranscription'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/sessions:
    get:
      tags: [Agent]
      operationId: listAgentSessions
      summary: List the current user's agent chat sessions, newest first.
      description: >
