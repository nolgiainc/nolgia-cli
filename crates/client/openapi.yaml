        The pod's visibility report: which ability versions it actually has installed, so freshness drift is observable (as `installed_version` vs `latest_version` on `GET /agent/abilities`) rather than assumed from the deploy pipeline. Sent on events — after an install, on event-stream connect — never on a timer. Reports for slugs the agent does not have installed are ignored.

