          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Ability deleted.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /abilities/{slug}/content:
    get:
      tags: [Abilities]
      operationId: getAbilityContent
      summary: Download a published version's package content (base64 tar.gz) — the latest version by default, or the exact version named by `version` (how a pod materializes a pinned install). Entitlement-gated — the caller's subscription must satisfy the ability's `min_tier`.
      parameters:
        - $ref: '#/components/parameters/AbilitySlug'
        - name: version
          in: query
          required: false
          description: Exact published version to download instead of the latest — the fetch half of install version pins (an agent's manifest names the pinned version; this is how its content is retrieved). `404` when the version does not exist for the ability. Same entitlement gate as the latest-version read.
          schema:
            type: string
            examples: ['1.0.0']
      responses:
        '200':
          description: The requested version's content (latest when no `version` was named).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbilityContent'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /abilities/{slug}/files:
    get:
      tags: [Abilities]
      operationId: getAbilityFiles
      summary: Inspect the unpacked contents of the latest published version (admin only). Server-side unpacks the package tar.gz and returns each file's path, size, and (for text files) its decoded body. Not a customer feature — this is the admin abilities inspector.
      parameters:
        - $ref: '#/components/parameters/AbilitySlug'
      responses:
        '200':
          description: Unpacked ability files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbilityFiles'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /abilities/{slug}/versions:
    get:
      tags: [Abilities]
      operationId: listAbilityVersions
      summary: List every published version of an ability, highest first by semver ordering (admin only). Read companion to `deleteAbilityVersion` — the admin version-delete UI uses this to show a picker of deletable versions instead of asking the operator to type a semver. Each entry flags `is_latest` (the latest version cannot be deleted).
      parameters:
        - $ref: '#/components/parameters/AbilitySlug'
      responses:
        '200':
          description: Published versions in the same semver-first ordering that resolves `latest_version` (highest semver first; non-semver strings after, newest publish first), so the top entry is always the latest.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AbilityVersion'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Abilities]
      operationId: publishAbilityVersionFromFiles
      summary: Publish a new immutable version from an edited file set (admin only). Repacks the given files into a tar.gz, recomputes `has_code`, inserts a new immutable version and moves `latest`. This is the save path for the admin code editor — versions are immutable, so an edit is a new version. Ability metadata (name, visibility, access, min_tier) is preserved from the current ability; only the package payload and version change.
      parameters:
        - $ref: '#/components/parameters/AbilitySlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAbilityVersionRequest'
      responses:
        '201':
          description: New version published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ability'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /abilities/{slug}/versions/{version}:
    delete:
      tags: [Abilities]
      operationId: deleteAbilityVersion
      summary: Delete a single non-latest version of an ability (admin only). Deleting the latest version is refused with 409 — it would silently change what installed agents receive; publish a new version or delete the whole ability instead. Deleting the only version is likewise refused, as is deleting a version any agent install has pinned.
      parameters:
        - $ref: '#/components/parameters/AbilitySlug'
        - name: version
          in: path
          required: true
          description: Semver version to delete.
          schema:
            type: string
            pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
            examples: ['1.0.0']
      responses:
        '204':
          description: Version deleted.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /abilities/{slug}/versions/{version}/files:
    get:
      tags: [Abilities]
      operationId: getAbilityVersionFiles
      summary: Inspect the unpacked contents of one specific published version (admin only). The by-version companion of `getAbilityFiles` (which always serves the latest version) — server-side unpacks that version's package tar.gz and returns each file's path, size, and (for text files) its decoded body. Not a customer feature — this is the admin abilities inspector reading version history.
      parameters:
        - $ref: '#/components/parameters/AbilitySlug'
        - name: version
          in: path
          required: true
          description: Exact version string to inspect, as returned by `listAbilityVersions`. Deliberately not pattern-restricted — inspection must work for any stored version row, including ones written outside the strict-semver publish paths.
          schema:
            type: string
            examples: ['1.0.0']
      responses:
        '200':
          description: Unpacked ability files for that version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbilityFiles'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /presets:
    get:
      tags: [Presets]
      operationId: listPresets
      summary: List presets ordered by `sort_order`. Anonymous callers see the public catalog; admin accounts additionally see private (held) presets.
      security:
        - {}
        - bearerAuth: []
        - patAuth: []
      parameters:
        - name: featured
          in: query
          required: false
          description: >
            When `true`, return only featured presets; when `false`, only
            non-featured ones. Omit to return both.
          schema:
            type: boolean
      responses:
        '200':
          description: Presets, ascending by `sort_order` (ties break by slug).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preset'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Presets]
      operationId: upsertPreset
      summary: Create or update a preset by slug (admin only). Presets are mutable metadata — unlike abilities there are no immutable versions; posting an existing slug overwrites all of its content fields with the request body. The lifecycle fields (`sort_order`, `visibility`, `featured`) are preserved when omitted, so a catalog sync cannot unpublish or unfeature curated presets; change them explicitly here or via `PATCH /presets/{slug}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPresetRequest'
      responses:
        '201':
          description: Preset created or updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /presets/{slug}:
    get:
      tags: [Presets]
      operationId: getPreset
      summary: Get a preset's detail. Anonymous callers read public presets; private presets 404 for anonymous and non-admin callers.
      security:
        - {}
        - bearerAuth: []
        - patAuth: []
      parameters:
        - $ref: '#/components/parameters/PresetSlug'
      responses:
        '200':
          description: The preset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preset'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags: [Presets]
      operationId: updatePreset
      summary: Update a preset's lifecycle (admin only). The mutable fields here are `visibility`, `featured` and `sort_order` (at least one must be provided). Flipping `visibility` to `private` "holds" the preset (removed from the customer catalog), flipping back to `public` unholds it — mirroring abilities; `featured` curates the catalog's featured rail and `sort_order` sets the position presets are displayed in. All other fields are edited by re-POSTing `/presets` with the same slug.
      parameters:
        - $ref: '#/components/parameters/PresetSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePresetRequest'
      responses:
        '200':
          description: The updated preset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Presets]
      operationId: deletePreset
      summary: Delete a preset (admin only). Presets are metadata-only, so deletion has no install fallout — prefer holding (PATCH visibility=private) when the removal may be temporary.
      parameters:
        - $ref: '#/components/parameters/PresetSlug'
      responses:
        '204':
          description: Preset deleted.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /color-presets:
    get:
      tags: [ColorPresets]
      operationId: listColorPresets
      summary: List the built-in color-grade presets ("LUT looks") for studio compositions. Public — the embedded catalog is identical for every caller.
      security:
        - {}
        - bearerAuth: []
        - patAuth: []
      responses:
        '200':
          description: The color-preset catalog, in manifest order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColorPresetList'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /color-presets/{slug}/cube:
    get:
      tags: [ColorPresets]
      operationId: getColorPresetCube
      summary: Download a color preset's 33-point `.cube` LUT — the pure preset op chain (no manual adjustments), baked on demand from the embedded manifest. Public, aggressively cacheable.
      security:
        - {}
        - bearerAuth: []
        - patAuth: []
      parameters:
        - $ref: '#/components/parameters/ColorPresetSlug'
      responses:
        '200':
          description: The `.cube` LUT text.
          content:
            text/plain:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /masks:validate:
    post:
      tags: [Masks]
      operationId: validateMask
      summary: Sanitize a timeline mask and report what was clamped or dropped. Public and stateless — the same sanitizer the render job and the Studio preview apply.
      description: |
        Runs the platform's mask sanitizer over an arbitrary JSON value and
        returns the canonical sparse `Mask` the renderer would draw (or
        `null` when the value is not a drawable mask, or is the identity —
        a full-frame default rectangle), plus one `problems` entry per
        clamped, dropped, or undrawable field. Use it to lint authored
        `data-mask` attributes and overlay `mask` fields before a push: an
        authored value that produces problems renders differently from the
        author's intent.

        Sanitizer contract (identical in the Studio preview and the agent
        pipeline lint): unknown keys and non-numeric / non-finite numbers
        are dropped; numbers are clamped to range and rounded to 2 decimals;
        an unknown `shape`, or a `polygon` with fewer than 3 valid vertices,
        makes the whole mask absent; shape-irrelevant fields are dropped
        (`x`/`y`/`width`/`height`/`rotation`/`cornerRadius` on a polygon,
        `points` on a rectangle/ellipse, `cornerRadius` on an ellipse);
        fields equal to their default are dropped; a default full-frame
        rectangle (with or without `opacity`) is the identity and is
        reported absent (`mask: null`, `identity: true`).
      security:
        - {}
        - bearerAuth: []
        - patAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaskValidateRequest'
      responses:
        '200':
          description: The sanitized mask and its diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaskValidation'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /internal/abilities/{slug}/versions:
    post:
      tags: [Abilities]
      operationId: publishAbilityVersionInternal
      summary: Publish a new immutable version of an EXISTING PUBLIC ability from a file set. CI publish pipeline only (ABILITY_PUBLISHER_TOKEN) — the repo-to-marketplace auto-publish path. Same body as `publishAbilityVersionFromFiles`, hard-restricted — the slug must already exist and be public (unknown slug 404, private slug 403), the version must be strictly greater than the current latest (409 otherwise), and ability metadata including visibility is always preserved. New abilities and visibility changes stay human-gated in the admin panel.
      security:
        - abilityPublisherAuth: []
      parameters:
        - $ref: '#/components/parameters/AbilitySlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishAbilityVersionRequest'
      responses:
        '201':
          description: New version published; installing agents are marked pending_deploy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ability'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /internal/identity/score:
    post:
      tags: [Generation]
      operationId: scoreIdentityInternal
      summary: >
        Score face identity similarity between two of the caller's image
        assets (admin only). The test hook behind the Aura ArcFace gate
        (NOL-462): NOL-461's acceptance tests 3 and 5 assert rendered faces
        match their reference at cosine >= 0.60 through this endpoint.
        Scoring runs in-process (the same scorer the image executor gates
        with); face data never leaves the platform and no embeddings are
        persisted. 503 when the deployment carries no face-id model bundle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityScoreRequest'
      responses:
        '200':
          description: Identity similarity between the two assets' dominant faces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityScoreResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /internal/agents:
    get:
      tags: [Agent]
      operationId: listAgentsInternal
      summary: List agents, optionally filtered by status. Deploy-pipeline only.
      security:
        - provisionerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AgentStatus'
      responses:
        '200':
          description: Agents matching the filter.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /internal/agents/{id}/credentials:
    post:
      tags: [Agent]
      operationId: issueAgentCredentials
      summary: Mint (or rotate) an agent's NOLGIA_TOKEN. Deploy-pipeline only; plaintext is returned ONCE.
      security:
        - provisionerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '201':
          description: Agent token minted. Any previous agent token is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCredentials'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /internal/agents/{id}/deployment:
    put:
      tags: [Agent]
      operationId: updateAgentDeployment
      summary: Report deployment state (status, chat endpoint) for an agent. Deploy-pipeline only.
      security:
        - provisionerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentDeploymentRequest'
      responses:
        '200':
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /internal/agents/{id}/config:
    get:
      tags: [Agent]
      operationId: getAgentConfigInternal
      summary: Full (plaintext) custom configuration for an agent, for injection into the pod's Secret. Deploy-pipeline only.
      security:
        - provisionerAuth: []
      parameters:
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: The agent's configuration entries with plaintext values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfig'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth.js v5 JWT issued by nolgia.ai for browser sessions.
    patAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT
      description: Personal Access Token (prefix `nol_`) for CLI and MCP clients.
    provisionerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Static shared secret (`AGENT_PROVISIONER_TOKEN`) for the internal agent deploy pipeline.
    abilityPublisherAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Static shared secret (`ABILITY_PUBLISHER_TOKEN`) for the internal repo-to-marketplace ability publish pipeline. Deliberately narrow — it can only publish forward versions of existing public abilities.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned by a prior response.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    JobId:
      name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    PatId:
      name: id
      in: path
      required: true
      description: PAT UUID.
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: id
      in: path
      required: true
      description: Organization UUID.
      schema:
        type: string
        format: uuid
    OrganizationMemberUserId:
      name: user_id
      in: path
      required: true
      description: Member's user UUID.
      schema:
        type: string
        format: uuid
    OrganizationInviteId:
      name: invite_id
      in: path
      required: true
      description: Invite UUID.
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      description: The invite's URL token (from the invite email or the copy link).
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OrganizationDomainName:
      name: domain
      in: path
      required: true
      description: Email domain, lowercase.
      schema:
        type: string
        minLength: 3
        maxLength: 253
    OrganizationApiKeyId:
      name: key_id
      in: path
      required: true
      description: Organization API key UUID.
      schema:
        type: string
        format: uuid
    StorageConnectionId:
      name: connection_id
      in: path
      required: true
      description: Storage connection UUID.
      schema:
        type: string
        format: uuid
    AgentId:
      name: id
      in: path
      required: true
      description: Agent UUID.
      schema:
        type: string
        format: uuid
    AgentConfigKey:
      name: key
      in: path
      required: true
      description: Configuration entry key (environment-variable style).
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{0,63}$'
        examples: ['TELEGRAM_BOT_TOKEN']

    AbilitySlug:
      name: slug
      in: path
      required: true
      description: Ability slug (lowercase letters, digits, hyphens).
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        examples: ['short-film']

    PresetSlug:
      name: slug
      in: path
      required: true
      description: Preset slug (lowercase letters, digits, hyphens).
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        examples: ['ugc-ad']

    ColorPresetSlug:
      name: slug
      in: path
      required: true
      description: Color-preset slug (lowercase letters, digits, hyphens).
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        examples: ['teal-orange']

  responses:
    ProblemResponse:
      description: Error formatted per RFC 7807.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          examples: [ok]
        version:
          type: string
          description: Build version (semver or git sha).
          examples: ['0.1.0']
        uptime_seconds:
          type: integer
          minimum: 0
          examples: [1234]

    SSETicket:
      type: object
      additionalProperties: false
      required: [ticket, expires_at]
      description: Single-use credential authorizing one job status stream connection.
      properties:
        ticket:
          type: string
          description: Opaque single-use secret to pass as the `ticket` query parameter.
          examples: ['9f8c2a1e6b4d7f0a3c5e8b1d4f7a0c3e6b9d2f5a8c1e4b7d0f3a6c9e2b5d8f1a']
        expires_at:
          type: string
          format: date-time
          description: Instant after which the ticket can no longer be redeemed.

    Error:
      type: object
      additionalProperties: false
      required: [type, title, status]
      description: RFC 7807 problem object.
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          examples: ['https://nolgia.ai/errors/invalid-request']
