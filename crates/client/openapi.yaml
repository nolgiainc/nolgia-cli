        Stamps the asset's `deleted_at`, hiding it from every default listing and lookup while keeping the stored bytes. List the trash with `GET /assets?trashed=true`, bring an asset back with `POST /assets/{id}/restore`, or remove it for good with `DELETE /assets/{id}/permanent`. Trashed assets are purged automatically 30 days after deletion. Deleting an already-trashed asset returns 404.

