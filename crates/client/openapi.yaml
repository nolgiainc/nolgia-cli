        content:
          type: string
          minLength: 0
          maxLength: 8000
          description: >
            The user's message to relay to the agent. May be empty only when `attachments` is non-empty (an attachment-only send); a submit with neither content nor attachments is rejected with `400`.

        attachments:
          type: array
          maxItems: 8
          description: >
            Assets to attach to the message. Each must name an asset owned by the caller with status `ready` (`400` otherwise). Attachment metadata (filename, content type) is denormalized onto the transcript row at submit time, and the relayed turn tells the agent how to fetch the files.

          items:
            $ref: '#/components/schemas/AgentMessageAttachmentInput'
        session_id:
          type: string
          format: uuid
          description: >
            Chat session to file the turn under (must be owned by the caller). Omit to file the turn under the caller's auto-created default session, reused by later sessionless submits. The one-pending-turn limit is per session: a running turn in one session never blocks submits into another (those queue and run FIFO).

        new_session:
          allOf:
            - $ref: '#/components/schemas/SubmitAgentMessageNewSession'
          description: >
            Create a fresh chat session for this message and file the turn under it, atomically — the session row is written in the same transaction as its first message, so it never exists empty. Mutually exclusive with `session_id` (`400` when both are set). The created session comes back as `session` on the `202`.

        steering:
          type: boolean
          default: false
          description: >
            Send as a mid-turn steering message: recorded immediately even while the target session's turn is pending (no `409`) and auto-delivered to the agent as that session's next turn once its in-flight one settles. When the session has no pending turn this behaves exactly like a normal send, so clients may set it unconditionally from an unlocked composer.

