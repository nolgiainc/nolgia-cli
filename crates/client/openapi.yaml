          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        version:
          type: integer
          minimum: 1
          description: Optimistic concurrency version, increased on every successful update.
        node_count:
          type: integer
          minimum: 0
        graph:
          $ref: '#/components/schemas/CanvasGraph'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CanvasSummary:
