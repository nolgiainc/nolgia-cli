  /agent/sessions/{id}/assets:
    get:
      tags: [Agent]
      operationId: listAgentSessionAssets
      summary: List the media a chat session's agent turns produced.
      description: >
        Returns the session's agent-produced assets, newest first and
        de-duplicated by asset id. Assets whose generating job was causally
        stamped with this session (`jobs.agent_session_id`, recorded at job
        creation) are included regardless of turn state — so polling during a
        run surfaces each clip as it lands, and a run that dies before
        delivering still shows everything it produced. Assets from jobs that
        predate the stamp fall back to the legacy attribution: created inside
        a completed turn's active window and attributable to the agent by
        surface. The session must belong to the caller (`404` otherwise).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The session's produced assets, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionAssetList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /agent/sessions/{id}/events:
    get:
      tags: [Agent]
      operationId: streamAgentSessionEvents
      summary: Stream a chat session's transcript events over Server-Sent Events.
      description: >
        Opens a `text/event-stream` connection scoped to one chat session that
        pushes transcript writes as they land. This stream is the ONLY live
        transport (there is no client polling): reconnection is protocol-level
        SSE. The server opens with a `retry:` hint; every `message` frame
        carries a monotonic `id:` line (the row's change watermark in epoch
        nanoseconds); a reconnecting client presents `Last-Event-ID` and the
        server REPLAYS every write at/after that watermark from the database
        before resuming live delivery, so no event is ever lost to a
        disconnect. Comment heartbeats (`: heartbeat`) flow every 20 seconds.

        Connect sequence: `retry:` hint, then (given `Last-Event-ID`) the
        replayed `message` frames, then a `session_status` snapshot frame per
        currently-active session of the caller's, then a `ready` frame whose
        `id:` is the session's current watermark and whose `replay` field
        reports `none` (no usable Last-Event-ID; hydrate via
        `GET /agent/messages`), `complete` (fully caught up) or `truncated`
        (gap exceeded the replay budget; rehydrate).

        Event names equal the envelope's `type` — `message` (a transcript row
        was created or settled; `data` is an `AgentSessionEvent` whose
        `message` is the full row as `GET /agent/messages` serves it, omitted
        only when the row was too large for the event bus, in which case
        `message_id` alone signals "refetch"), `step` (a step batch was
        persisted for a reply row; steps are summarized, refetch
        `GET /agent/steps` with a `since` cursor), and `session_status` (a
        session of the caller's flipped between running / queued / idle;
        delivered on EVERY stream the caller has open, for any of their
        sessions, so a sessions sidebar shows live multi-session activity).
        The envelope is forward-compatible: new `type` values may appear and
        consumers must ignore event types they do not recognize.

        Authenticated by the standard bearer schemes (send the
        `Authorization` header — read the stream with `fetch`, not
        `EventSource`, which cannot send headers). The session must belong to
        the caller (`404` otherwise). Events only cover session-filed rows;
        legacy sessionless history never streams.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          description: >
            The `id:` of the last frame the client saw (epoch nanoseconds).
            Presented on reconnect; the server replays everything missed.
          schema:
            type: string
      responses:
        '200':
          description: Event stream opened.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /agent/steps:
    get:
      tags: [Agent]
      operationId: listAgentSteps
      summary: Live terminal/tool/message steps of the agent's current session.
      description: |
        Streams the fine-grained steps of the agent's current Hermes session —
        terminal commands (with their input command and captured output), other
        tool calls, file operations, and message events — as a sanitized,
        chronologically-ordered feed for the chat's expandable step chips.

        The API proxies to the agent pod's dashboard server (cookie-authed,
        server-side) and maps its raw session events to a stable schema.
        Secret-looking values (tokens, keys, passwords, bearer credentials) are
        masked, and input/output payloads are size-capped — see
        `detail_input`/`detail_output` for the caps and for how a JSON payload
        is masked and capped structurally so it stays parseable.

        Poll with `since` set to the newest `at` already seen while a turn is
        pending, then stop shortly after it settles. When the agent has no
        dashboard (older deployments or not yet provisioned) the endpoint
        returns `404` — clients should treat this as "no steps" and render
        nothing rather than an error.
      parameters:
        - name: since
          in: query
          required: false
          description: Return only steps whose `at` timestamp is strictly after this value.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum steps to return (newest session's steps, oldest first).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: session_id
          in: query
          required: false
          description: >
            Chat session the caller is rendering. REQUIRED to receive live
            steps: the feed is scoped to the pod run backing THAT session's
            in-flight turn, and returns an empty list when the session has no
            turn in flight. A request WITHOUT session_id returns an empty list
            and never proxies the agent pod. The pod's Hermes conversation is
            global across the account's chat sessions, so an unscoped feed would
            serve whichever run touched the pod last, surfacing one session's
            steps, media (asset refs), and tool output inside another's. Always
            send it; an omitted session_id is treated as a stale or older client
            and served nothing rather than another session's content.
          schema:
            type: string
            format: uuid
        - name: agent_message_id
          in: query
          required: false
          description: >
            When set, return the durably persisted steps of that completed
            agent reply row instead of proxying the live session, so a reload
            recovers the turn's steps after the pod has rolled or dropped the
            session. Returns `200` with an empty list when no steps are stored
            for the id (including when it is not the caller's).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sanitized steps, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStepList'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /admin/agent/sessions/{id}:
    get:
      tags: [Admin]
      operationId: getAdminAgentSessionTranscript
      summary: Read any user's agent chat session for debugging (admin only).
      description: >
        ADMIN-ONLY debugging surface: returns the full transcript of ANY user's
        agent chat session — the session meta and owner, every message
        (oldest first) with each agent turn's persisted steps embedded, and the
        media the session produced. Assets are attributed exactly as
        `listAgentSessionAssets` attributes them: jobs causally stamped with
        the session (`jobs.agent_session_id`) are included regardless of turn
        state, so a still-running or failed turn's output is visible, while
        jobs predating the stamp fall back to the legacy completed-turn window.
        Non-admin callers get
        `404` (the surface is invisible); an unknown session id is likewise
        `404`. Every successful read is audit-logged with the calling admin's
        email, the session id, and the owner's id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The session transcript.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentSessionTranscript'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /admin/presets/derive-media:
    post:
      tags: [Presets]
      operationId: derivePresetMedia
      summary: Derive optimized card media for presets that need it (admin).
      description: |
        Runs the preset card media derivation sweep and returns what it did.

        Derivation is normally automatic: a preset write kicks it, and a
        background reconciler re-runs it. This endpoint exists because both of
        those run OUTSIDE a request, and Cloud Run allocates CPU only while a
        request is in flight (`cpu-throttling`), so a multi-megabyte transcode
        started from a background goroutine makes almost no progress. Running
        the same sweep inside a request is what actually gives it CPU, which
        makes this the operable path for a backfill, for draining the catalog
        after a `DERIVATION_VERSION` bump, and for re-running after a failure.

        Idempotent and safe to call repeatedly: a preset already optimized at
        the current derivation version costs one GCS metadata request and is
        reported as `skipped`. `limit` bounds only the presets that need REAL
        work, so every call still sweeps the whole catalog; the remainder is
        reported as `deferred`. Call again until `derived`, `reused`, `failed`
        and `deferred` are all zero.

        Writes ONLY the derived-media columns. It cannot change visibility,
        featured or sort_order, and it never triggers a catalog sync.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 4
          description: |
            Maximum number of presets to actually transcode in this call.
            Skips do not count. Keep it low enough that the call fits inside the
            Cloud Run request timeout: a preset can mean a 15 MiB download plus
            two ffmpeg encodes.
      responses:
        '200':
          description: The sweep result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetMediaSweep'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          description: Derivation is not configured in this environment (no preset media bucket).
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /admin/catalog-audit:
    get:
      tags: [Admin]
      operationId: listCatalogAudit
      summary: Read the abilities/presets catalog audit trail (admin only).
      description: >
        ADMIN-ONLY: returns the durable, actor-attributed record of catalog
        mutations (ability publishes/edits/deletes/installs and preset
        upserts/holds/deletes), newest first. Each row carries who acted
        (actor_user_id + actor_email, when resolvable), what changed (action,
        target_type, target_slug, target_version), and a small non-secret
        `details` object. Non-admin callers get `404` — the surface is
        invisible. Optional `target_type` / `target_slug` filters narrow to one
        catalog entry; `limit`/`offset` paginate.
      parameters:
        - name: target_type
          in: query
          required: false
          description: Restrict to ability- or preset-targeted rows.
          schema:
            $ref: '#/components/schemas/CatalogAuditTargetType'
        - name: target_slug
          in: query
          required: false
          description: Restrict to a single catalog entry by slug.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum rows to return (newest first).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          description: Number of rows to skip for pagination.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Recent catalog-audit rows, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogAuditEntry'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /admin/usage/summary:
    get:
      tags: [Admin]
      operationId: getAdminUsageSummary
      summary: Product-usage summary over a trailing day window (admin only).
      description: >
        ADMIN-ONLY: aggregated product-usage metrics for the admin panel over a
        trailing window of `days` days ending now — active users, job counts
        split by status and modality, the top models and top users by job
        volume, and current marketplace ability install counts. Every number is
        aggregated live from the database at read time (`fetched_at` timestamps
        the read); nothing is precomputed. `not_instrumented` explicitly lists
        product surfaces that have no server-side usage records so the admin
        panel can label the gaps instead of implying zero. Non-admin callers
        get `404` — the surface is invisible.
      parameters:
        - name: days
          in: query
          required: false
          description: Size of the trailing window in days, ending now. Values outside 1..90 are rejected with `400`.
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        '200':
          description: The aggregated usage summary for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsageSummary'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /admin/economics/consumption:
    get:
      tags: [Admin]
      operationId: getAdminEconomicsConsumption
      summary: Credit-consumption economics over a trailing day window (admin only).
      description: >
        ADMIN-ONLY: the credits customers actually consumed over a trailing
        window of `days` days ending now, aggregated live at read time from
        `credit_reservations` joined to `jobs`. `credit_reservations.amount` on
        rows in the `consumed` state is the EXACT credits charged, net of any
        refund/release — so these figures are the authoritative consumption
        basis for unit economics (unlike raw job counts). The window is applied
        on `consumed_at`. Three groupings are returned: `by_model`
        (model+modality, all rows, credits descending), `by_surface` (the
        launching client from `jobs.surface`; NULL/historical jobs bucket as
        `unknown`), and `by_account` (top 25 users by credits, PLUS any account
        whose email is in the admin allowlist so internal R&D spend is always
        visible). Non-admin callers get `404` — the surface is invisible.
      parameters:
        - name: days
          in: query
          required: false
          description: Size of the trailing window in days, ending now. Values outside 1..365 are rejected with `400`.
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      responses:
        '200':
          description: The aggregated credit-consumption economics for the requested window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEconomicsConsumption'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /admin/credits/topup:
    post:
      tags: [Admin]
      operationId: postAdminCreditsTopup
      summary: Grant top-up credits to an account (admin only).
      description: >
        ADMIN-ONLY: grants `amount` shared top-up credits to `user_id` by
        writing an idempotent `topup_grant` ledger entry — the same primitive
        the Stripe purchase path uses (`credits.Service.GrantTopup`). Intended
        for internal R&D funding and support make-goods; the self-serve
        redeemable-code layer on top is `POST /credits/redeem`. `idempotency_key`
        makes the grant safe to retry: re-submitting the same key returns the
        existing grant instead of crediting twice. Non-admin callers get `404`
        so the surface is invisible; an unknown `user_id` is likewise `404`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreditTopupRequest'
      responses:
        '200':
          description: The grant that was applied (or the pre-existing grant for a repeated idempotency key) and the account's resulting balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreditTopupResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /admin/credits/codes:
    get:
      tags: [Admin]
      operationId: listAdminCreditCodes
      summary: List redeemable credit codes with redemption counts (admin only).
      description: >
        ADMIN-ONLY: every minted credit code, newest first (capped at 200),
        including its live `redeemed_count`. Non-admin callers get `404` so
        the surface is invisible, exactly like the other `/admin` reads.
        Browser (JWT) sessions only; PATs are rejected.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credit codes, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCreditCodeList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Admin]
      operationId: createAdminCreditCode
      summary: Mint a redeemable credit code (admin only).
      description: >
        ADMIN-ONLY: mints a high-entropy code (`NOLG-XXXXX-XXXXX-XXXXX`)
        worth `amount` shared top-up credits, redeemable by up to
        `max_redemptions` distinct accounts until `expires_at` (if set) or
        deactivation. Redemption goes through the same idempotent GrantTopup
        primitive as `/admin/credits/topup` — codes add a self-serve address
        for a grant, not a new money path. Non-admin callers get `404`.
        Browser (JWT) sessions only; PATs are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateCreditCodeRequest'
