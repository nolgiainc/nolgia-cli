          description: Agent reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /agent/messages:
    post:
      tags: [Agent]
      operationId: submitAgentMessage
      summary: Submit a chat message to the user's Hermes agent asynchronously.
      description: |
        The async counterpart to `POST /agent/chat`: the message is persisted
        to the transcript immediately (role `user`, status `complete`)
        together with a pending agent reply row, and `202` returns both ids.
        A background worker relays the message to the agent pod with a
        generous timeout (long agent turns no longer time out at the HTTP
        boundary) and completes or fails the pending row; poll
        `GET /agent/messages` to observe it.

        One turn is in flight PER SESSION at a time: submitting while that
        session's reply is still pending returns `409` carrying the pending
        agent message id (use steering to keep talking mid-turn). Turns
        running in the user's OTHER sessions never block a submit
        (NOL-187): the new turn is accepted (`202`) and — when the user's
        concurrent execution slots are full — QUEUED, starting
        automatically (FIFO by submit time) as slots free up. Up to a small
        number of one user's turns execute concurrently (NOL-207, currently
        2) when the agent pod supports per-turn attribution credentials, so
        every generation still names the exact turn that caused it; older
        pods execute one turn at a time. A queued reply row reports
        `queued: true` until it starts; render it as waiting, not thinking.
        At most 10 turns may be pending (executing plus queued) across a
        user's sessions; past that, submits return `429`.

        **Steering**: pass `steering: true` to keep talking while a turn is
        in flight without cancelling it. If a turn is pending IN THE TARGET
        SESSION, the message is recorded immediately (transcript role
        `user` with `steering: true`, no `409`) and `202` returns only
        `user_message_id`; when that session's in-flight turn completes or
        fails, the steering messages queued behind it in the SAME session
        are automatically delivered to the agent as that session's next
        turn (joined in order, one per line, as a single relayed prompt
        whose reply row references the last steering message). Steering is
        per session: a steer typed into one chat only ever reaches that
        chat's run. If the target session has NO pending turn, a steering
        send behaves exactly like a normal send — it creates the turn and
        the response carries both ids — so clients may always set
        `steering: true` from an unlocked composer without racing turn
        completion.

        Pass `session_id` to file the turn under one of your chat sessions
        (see `/agent/sessions`). Omitting it files the turn under your
        auto-created default session, reused by later sessionless submits.
        When the session is linked to a project, the platform scopes the
        turn to that project server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentMessageRequest'
      responses:
        '202':
          description: Message accepted; the agent reply is being produced asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAgentMessageAccepted'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          description: This session's previous turn is still pending; steer it, or wait for it to complete or fail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageConflict'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    get:
      tags: [Agent]
      operationId: listAgentMessages
      summary: Chronological agent chat transcript for the current user.
      description: |
        Returns transcript rows (both roles) in chronological order, oldest
        first. A pending agent row means the reply is still being produced —
        render it as "thinking…" and poll with `since` set to the newest
        `created_at` already seen, re-fetching pending rows until their
        status turns `complete` or `failed`.

        Pass `session_id` to restrict the transcript to one chat session;
        without it ALL messages are returned regardless of session (the
        pre-sessions behavior).
      parameters:
        - name: session_id
          in: query
          required: false
          description: Return only messages belonging to this chat session.
          schema:
            type: string
            format: uuid
        - name: since
          in: query
          required: false
          description: Return only messages created strictly after this timestamp.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum messages to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
