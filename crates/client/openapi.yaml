      operationId: approveDeviceAuth
      summary: Approve a pending device-code authorization for the signed-in user.
      description: >
        Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_authorize_credentials` and detail "The NOLGIA Agent cannot authorize new credentials. Do it in the app."

      requestBody:
