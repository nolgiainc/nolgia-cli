  /assets/{id}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Fetch one of the current user's assets with a fresh signed URL.
      description: >
        Unlike the list endpoint, the response includes `projects`: the asset's project memberships (newest membership first, `[]` when the asset belongs to no project).

      parameters:
