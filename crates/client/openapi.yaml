          $ref: '#/components/responses/ProblemResponse'

  /generate/video:
    post:
      tags: [Generate]
      operationId: generateVideo
      summary: Submit a video generation job (asynchronous).
      description: |
        Returns immediately with a job. Default model is Kling v3.0 text-to-video.
        Use `GET /jobs/{id}` or `GET /jobs/{id}/wait` to retrieve the final asset.

        **Duplicate submissions are refused, not billed.** Submitting the same
        request twice within five minutes returns `409` naming the job that
        already exists, so a lost response — a closed tab, a dropped
        connection, a `wait` that timed out — cannot turn into a second
        charge. Send a distinct `Idempotency-Key` header to declare a
        deliberate new take of an identical prompt; repeat the same key to
        make your own retries collapse onto one job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateVideoRequest'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /restore/video:
    post:
      tags: [Generate]
      operationId: restoreVideo
      summary: Submit a video restoration/upscale job (asynchronous).
      description: |
        The AI footage-restorer lane: re-renders existing footage (a video
        asset you generated or uploaded, or a URL you host) at a target
        resolution tier with de-noise, de-haze and detail recovery. Restore
        models take NO prompt — the source clip and the chosen engine are the
        whole input. Returns immediately with a job (modality `video`); use
        `GET /jobs/{id}` or `GET /jobs/{id}/wait` to retrieve the restored
        asset.

        Pick the model to match the footage: `seedvr2-restore` is the general
        AI restorer, and the `topaz-*` master upscalers expose one Topaz
        engine each (faces, CG, interlaced, generative, and so on) — see
        `RestoreVideoModel`.

        Credits scale with the source clip length at the selected quality
        tier's per-5-second rate — see the model's `quality.options` on
        `GET /models`. Restore-lane models carry `restore: true` in the
        model catalog.

        **Duplicate submissions are refused, not billed.** Same idempotency
        contract as `POST /generate/video`: an identical request within five
        minutes returns `409` naming the existing job; send a distinct
        `Idempotency-Key` header to declare a deliberate new run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreVideoRequest'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs for the current user.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: modality
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Modality'
        - name: agent_session_id
          in: query
          required: false
          description: >
            Return only jobs whose agent turn ran in the given chat session
            (`jobs.agent_session_id`, stamped at submit). Scoped to the
            caller's own jobs. Jobs created before this attribution shipped,
            and generations launched outside an agent turn, are not matched.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated list of jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get a single job.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /jobs/{id}/wait:
    get:
      tags: [Jobs]
      operationId: waitForJob
      summary: Block until the job reaches a terminal state (or timeout).
      description: Long-poll variant; server holds the connection up to `timeout_seconds` (max 900).
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: timeout_seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 900
            default: 300
      responses:
        '200':
          description: Job reached a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '408':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /jobs/{id}/sse-ticket:
    post:
      tags: [Jobs]
      operationId: createJobSSETicket
      summary: Mint a single-use ticket for the job status stream.
      description: >
        Returns a short-lived, single-use ticket that authorizes one
        `GET /jobs/{id}/sse` connection. Required because `EventSource`
        cannot send an `Authorization` header. The ticket is consumed on
        first use and expires after 60 seconds.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '201':
          description: Ticket issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSETicket'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /jobs/{id}/sse:
    get:
      tags: [Jobs]
      operationId: streamJobSSE
      summary: Stream job status updates over Server-Sent Events.
      description: >
        Opens a `text/event-stream` connection that emits the current job
        state immediately, then a `status` event per update and a final
        `complete` event when the job reaches a terminal state. Authorized
        by a single-use `ticket` query parameter from `POST /jobs/{id}/sse-ticket`,
        not by the bearer schemes.
      security: []
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: ticket
          in: query
          required: true
          description: Single-use ticket from `POST /jobs/{id}/sse-ticket`.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Event stream opened.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List the current user's assets.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: modality
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Modality'
        - name: job_id
          in: query
          required: false
          description: Return only assets produced by the given job.
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: Return only assets carrying the given tag.
          schema:
            type: string
            minLength: 1
            maxLength: 40
        - name: project_id
          in: query
          required: false
          description: Return only assets belonging to the given project.
          schema:
            type: string
            format: uuid
        - name: collection_id
          in: query
          required: false
          description: >
            Return only assets belonging to the given collection (owned by
            the caller). Composes with the other filters and is reflected in
            the page `total`.
          schema:
            type: string
            format: uuid
        - name: agent_session_id
          in: query
          required: false
          description: >
            Return only assets attributed to the given chat session — either
            the generating job's `agent_session_id` (causal attribution
            recorded at job creation, not a time window, so it holds for
            async video that lands long after the turn) or, for agent uploads
            with no job (NOL-207), the asset's `metadata.agent_session_id`.
            Jobs created before this attribution shipped are not matched.
            Composes with the other filters and is reflected in the page
            `total`.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: >
            Filter by asset lifecycle status. Defaults to `ready`, hiding
            assets whose signed upload has not been completed yet.
          schema:
            $ref: '#/components/schemas/AssetStatus'
        - name: favorite
          in: query
          required: false
          description: >
            When `true`, return only favorited assets; when `false`, only
            non-favorited ones. Omit to return both. Composes with the other
            filters.
          schema:
            type: boolean
        - name: model
          in: query
          required: false
          description: >
            Return only assets generated by the given model id (exact match,
            e.g. `gpt-image-2` or `veo-3.1`). Composes with the other
            filters.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: search
          in: query
          required: false
          description: >
            Case-insensitive substring match against the asset's display
            name, prompt, and model id. Composes with the other filters and
            is reflected in the page `total`.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: sort
          in: query
          required: false
          description: >
            Result ordering; `created_at_desc` (newest first) when omitted.
            `name_asc`/`name_desc` order case-insensitively by the asset's
            effective title — display name, falling back to prompt, then to
            the model id. Cursor pagination follows the selected ordering.
          schema:
            $ref: '#/components/schemas/AssetSort'
        - name: trashed
          in: query
          required: false
          description: >
            When `true`, list the trash instead: only soft-deleted assets
            (`deleted_at` set) are returned. Omitted or `false`, trashed
            assets are excluded — the default listing is unchanged. Composes
            with the other filters and is reflected in the page `total`.
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Assets]
      operationId: uploadAsset
      summary: Upload a source image for image-to-image or image-to-video.
      description: >
        Stores the supplied bytes and returns an asset whose signed_url can be
        passed as image_url to generation endpoints. Accepts base64 JSON up to
        ~10MB decoded, which only suits small images: for large media files
        (video/audio artifacts, hundreds of MB) use the signed-upload flow
        instead — `POST /assets/uploads` followed by a direct PUT and
        `POST /assets/uploads/{id}/complete`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadAssetRequest'
      responses:
        '201':
          description: Asset stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '413':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /asset-usage:
    get:
      tags: [Assets]
      operationId: listAssetUsage
      summary: Which of the user's timelines use each asset.
      description: >
        Scans the current documents (index.html, other HTML files, and the
        nolgia-edits overlay) of the caller's newest compositions for asset
        references and returns, per referenced asset, the compositions that
        use it. Advisory UI data is incomplete when more than 200
        compositions exist or stored documents cannot be listed or read.
      parameters:
        - name: ids
          in: query
          required: false
          description: Return usage only for these asset ids (repeat the param per id).
          style: form
          explode: true
          x-go-type-skip-optional-pointer: true
          schema:
            type: array
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Per-asset usage across the user's compositions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUsage'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/{id}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Fetch one of the current user's assets with a fresh signed URL.
      description: >
        Unlike the list endpoint, the response includes `projects`: the
        asset's project memberships (newest membership first, `[]` when the
        asset belongs to no project).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: disposition
          in: query
          required: false
          description: >
            When set to `attachment`, the returned `signed_url` serves the
            asset with a `Content-Disposition: attachment` header (bound into
            the signature) so browsers download the file instead of rendering
            it inline. The download filename is derived from the asset's
            display name (with an extension inferred from its MIME type),
            falling back to the original upload filename, then to
            `<id>.<ext>`. Omit for the default inline-viewing URL.
          schema:
            type: string
            enum: [attachment]
      responses:
        '200':
          description: Asset found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Update one of the current user's assets (tags, display name, prompt, metadata, favorite).
      description: >
        Partial update: `tags` replaces the asset's full tag set (trimmed,
        lowercased, and de-duplicated server-side), `display_name` renames
        the asset, `prompt` overwrites the stored prompt (intended for
        backfilling provenance on uploaded assets), `metadata` is merged
        into the existing metadata object (patch keys overwrite, other keys
        are kept), and `favorite` sets or clears the favorite flag. At least
        one field is required; omitted fields are left unchanged.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
      responses:
        '200':
          description: Asset updated; returned with a fresh signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: Move one of the current user's assets to the trash (soft delete).
      description: >
        Stamps the asset's `deleted_at`, hiding it from every default
        listing and lookup while keeping the stored bytes. List the trash
        with `GET /assets?trashed=true`, bring an asset back with
        `POST /assets/{id}/restore`, or remove it for good with
        `DELETE /assets/{id}/permanent`. Trashed assets are purged
        automatically 30 days after deletion. Deleting an already-trashed
        asset returns 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Asset moved to the trash.
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/{id}/restore:
    post:
      tags: [Assets]
      operationId: restoreAsset
      summary: Restore a trashed asset back into the library.
      description: >
        Clears the asset's `deleted_at` stamp so it reappears in the default
        listings. Restoring an asset that is not in the trash is an
        idempotent no-op; the asset is returned either way with a fresh
        signed URL.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asset restored; returned with a fresh signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/{id}/permanent:
    delete:
      tags: [Assets]
      operationId: permanentlyDeleteAsset
      summary: Permanently delete one of the current user's assets.
      description: >
        Irreversibly removes the asset row and deletes the stored bytes
        (immediately when possible, otherwise via the deferred cleanup
        queue). Works on both live and trashed assets — this is the
        "delete forever" action of the trash view.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Asset permanently deleted.
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/{id}/frames:
    post:
      tags: [Assets]
      operationId: extractAssetFrame
      summary: Extract a still frame from a video asset as a new image asset.
      description: >
        Extracts a single frame from one of the current user's video assets
        with ffmpeg and stores it as a new IMAGE asset (model
        `frame-extract`, tagged `frame`, linked back to the source asset via
        its generation metadata). Omit `t_seconds` to grab the LAST frame —
        useful as the `image_url` (start frame) of a follow-up
        image-to-video generation to chain clips seamlessly. Returns 400 for
        non-video assets, 422 when no frame can be decoded at the requested
        timestamp, and 501 when ffmpeg is not available on the deployment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractAssetFrameRequest'
      responses:
        '201':
          description: Frame extracted; the new image asset with a fresh signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '501':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/{id}/duplicate:
    post:
      tags: [Assets]
      operationId: duplicateAsset
      summary: Duplicate one of the current user's assets.
      description: |
        Creates an independent copy of the asset: a new `assets` row owned by
        the caller pointing at a **new** stored object, with the source's
        modality, model, prompt, MIME type, size, duration, tags, and
        metadata carried over. The bytes are duplicated with a server-side
        GCS object copy — they never travel through the API or the client, so
        duplicating a large video costs one storage-to-storage copy rather
        than a download plus a re-upload.

        The copy inherits the source's filing: it joins the same projects and
        the same collections the source belongs to (falling back to the
        default "Library" project when the source has no project). It is a
        genuine second copy of the bytes, so it consumes storage
        accordingly — nothing about it is a reference to the original, and
        deleting either one leaves the other intact.

        The copy's display name defaults to the source's name plus " copy"
        (truncated to fit 200 characters) unless `display_name` is provided.
        An unknown, foreign, or trashed asset returns 404; an asset whose
        upload has not been completed returns 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateAssetRequest'
      responses:
        '201':
          description: Duplicate created; the new asset with a fresh signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '501':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/uploads:
    post:
      tags: [Assets]
      operationId: createAssetUpload
      summary: Start a signed upload for a large media asset.
      description: >
        Pre-creates an asset in status `uploading` and returns a short-lived
        signed PUT URL for uploading the bytes directly to storage, bypassing
        the base64 JSON limit of `POST /assets`. PUT the file to `upload_url`
        with a `Content-Type` header exactly matching the declared
        `content_type` (the signature covers it), then call
        `POST /assets/uploads/{upload_id}/complete` to verify the object and
        flip the asset to `ready`. The URL expires after 30 minutes.
        Uploading assets are hidden from `GET /assets` until completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetUploadRequest'
      responses:
        '201':
          description: Upload slot created; PUT the bytes to `upload_url`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetUpload'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '413':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/uploads/{id}/complete:
    post:
      tags: [Assets]
      operationId: completeAssetUpload
      summary: Finish a signed upload and make the asset available.
      description: >
        Verifies that the object was uploaded to storage and that its size
        matches the declared `size_bytes`, then flips the asset to `ready`
        and applies tag-based project auto-association. Completing an upload
        whose object is missing (or whose size does not match the
        declaration) returns 409 with details. Completing an
        already-completed upload is idempotent and returns the asset with
        200.
      parameters:
        - name: id
          in: path
          required: true
          description: The `upload_id` returned by `POST /assets/uploads`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asset is ready; returned with a fresh signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/imports/google-drive:
    post:
      tags: [Assets]
      operationId: importGoogleDriveFile
      summary: Import a Google Drive file into the library.
      description: >
        Server-side import: the API reads the file's Drive metadata, streams
        its bytes into NOLGIA storage through the signed-upload machinery and
        returns the ready asset. `access_token` is a short-lived Google OAuth
        token with the `drive.file` scope, obtained by the client (Google
        Picker); it is used for this request only and never stored or
        logged. Google Docs, Sheets and Slides (`application/vnd.google-apps.*`)
        cannot be imported (400 `Unsupported Drive file`); the accepted
        media types and size limits are those of `POST /assets/uploads`.
        Plan gate: Studio plans, Team and Enterprise. Other plans get 402
        `Upgrade Required` (a plan limit, not a credit balance). Organization
        viewers get 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleDriveImportRequest'
      responses:
        '201':
          description: Asset imported and ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '413':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /assets/{id}/exports/google-drive:
    post:
      tags: [Assets]
      operationId: exportAssetToGoogleDrive
      summary: Save an asset to Google Drive.
      description: >
        Streams the asset's bytes from NOLGIA storage into a new Drive file
        (resumable upload, shared drives supported). `access_token` is a
        short-lived Google OAuth token with the `drive.file` scope obtained
        by the client; it is used for this request only and never stored or
        logged. `folder_id` places the file in that folder (My Drive root
        when omitted); `name` overrides the file name (default: the asset's
        download filename). Same plan gate as the import.
      parameters:
        - name: id
          in: path
          required: true
          description: Asset UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleDriveExportRequest'
      responses:
        '200':
          description: File created in Drive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleDriveExportResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /characters/autopilot:
    post:
      tags: [Characters]
      operationId: autopilotCharacter
      summary: Roll a new Aura character and start its portrait render.
      description: |
        Runs the Aura variety engine (8 deterministic axes with an anti-clone
        rule across consecutive rolls) to produce a canonical character
        description, and submits its photoreal portrait as an image job on
        grok-imagine-image. Returns the queued job plus the rolled description
        and axes; create the character with `POST /characters` once the
        portrait asset is ready, passing the description as
        `canonical_description` verbatim.

        Billed exactly like the equivalent `POST /generate/image` call.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutopilotCharacterRequest'
      responses:
        '202':
          description: Portrait job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutopilotCharacterResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /characters/{id}/sheets:
    post:
      tags: [Characters]
      operationId: createCharacterSheet
      summary: Generate a one-tap character sheet (split, five-view turnaround, or expression).
      description: |
        Composes the requested sheet scaffold with the character's canonical
        description and the full Aura layer on gpt-image-2, with the
        character's primary reference attached as identity conditioning. The
        character must have at least one reference image. Optional wearable
        references ride the same request and are rendered exactly as shown in
        every view - a request whose references exceed what the sheet lane can
        carry is refused (400), never silently dropped.

        Billed exactly like the equivalent gpt-image-2 `POST /generate/image`
        call.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCharacterSheetRequest'
      responses:
        '202':
