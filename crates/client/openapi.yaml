        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this project belongs to. Omitted for a personal project.

        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Launch teaser']
        description:
          type: string
          maxLength: 2000
          examples: ['Assets for the spring launch teaser campaign.']
        asset_count:
          type: integer
          minimum: 0
          description: >
            Number of ready assets currently in the project (pending signed uploads are excluded until completion, matching the default asset listing).

        composition_count:
          type: integer
          minimum: 0
          description: Number of compositions currently linked to the project. Always present in responses.
        is_default:
          type: boolean
          description: >
            True for the user's default "Library" project: created on demand, it receives every new asset that is not explicitly filed into a project. Always present in responses. Read-only: it cannot be set via create or update requests (unknown request fields are rejected with 400).

        auto_tags:
          type: array
          maxItems: 10
          description: >
            Label set for the project. Auto-tags never move assets (the historical tag-overlap auto-filing is retired — assets join projects only by explicit project_id attribution); they flow into linked agent sessions as project context and are stamped onto session-attributed generations as searchable labels.

          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        favorite:
          type: boolean
          description: User-set favorite flag. Always present in responses.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the project was archived; omitted while active. Archived projects are hidden from the default listing but behave normally otherwise.

        parent_project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The series root this project is an episode of (set by `POST /projects/{id}/clone`). Omitted for a project that is not an episode. Always names a root: a series is one level deep.

        series:
          $ref: '#/components/schemas/ProjectSeries'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectSeries:
      type: object
      additionalProperties: false
      required: [parent, episodes]
      description: >
        Where a project sits in its series. Present on every episode and on a root that has at least one episode; omitted for a standalone project. `parent` is the series root (Episode 1) and `episodes` lists every project cloned from it, oldest first, including the project itself when it is an episode.

      properties:
        parent:
          $ref: '#/components/schemas/ProjectSeriesEntry'
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSeriesEntry'
    ProjectSeriesEntry:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: When this project was archived; omitted while active.
    CloneProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Name for the new episode.
          examples: ['Neon Courier Episode 2']
    ProjectList:
      type: object
      additionalProperties: false
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Launch teaser']
        description:
          type: string
          nullable: true
          maxLength: 2000
        auto_tags:
          type: array
          maxItems: 10
          description: Label set for the project (agent context + searchable labels; never a filing mechanism).
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        style_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Pin one of your saved styles as the project's style key, or `null` to unpin. An unknown or foreign style is a 400. Omit to leave the pinned style unchanged.
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        description:
          type: string
          nullable: true
          maxLength: 2000
        auto_tags:
          type: array
          nullable: true
          maxItems: 10
          description: Replaces the project's full auto-tag set when provided (labels/agent context only; never a filing mechanism).
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        favorite:
          type: boolean
          nullable: true
          description: Sets the project's favorite flag when provided.
        archived:
          type: boolean
          nullable: true
          description: >
            `true` archives the project (idempotent; an existing archive timestamp is kept), `false` restores it. Omit to leave the archive state unchanged.

    ProjectCastMember:
      type: object
      additionalProperties: false
      required: [character_id, role, sort_order, character]
      description: One character in a project's cast.
      properties:
        character_id:
          type: string
          format: uuid
        role:
          type: string
          maxLength: 80
          description: The part the character plays in this project (free text, may be empty).
          examples: ['lead']
        sort_order:
          type: integer
          minimum: 0
          description: Display and auto-attach position, dense from 0.
        character:
          $ref: '#/components/schemas/Character'
    ProjectCastList:
      type: object
      additionalProperties: false
      required: [cast]
      properties:
        cast:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProjectCastMember'
    ProjectCastEntry:
      type: object
      additionalProperties: false
      required: [character_id]
      properties:
        character_id:
          type: string
          format: uuid
          description: A character in the caller's library.
        role:
          type: string
          maxLength: 80
          description: The part the character plays in this project; omitted or empty means none.
    SetProjectCastRequest:
      type: object
      additionalProperties: false
      required: [cast]
      properties:
        cast:
          type: array
          maxItems: 50
          description: The full cast in display order; an empty list clears it.
          items:
            $ref: '#/components/schemas/ProjectCastEntry'
    ProjectLocationMember:
      type: object
      additionalProperties: false
      required: [location_id, role, sort_order, location]
      description: One location in a project's locations list.
      properties:
        location_id:
          type: string
          format: uuid
        role:
          type: string
          maxLength: 80
          description: The part the place plays in this project (free text, may be empty).
          examples: ['hero set']
        sort_order:
          type: integer
          minimum: 0
          description: Display and attach position, dense from 0.
        location:
          $ref: '#/components/schemas/Location'
    ProjectLocationList:
      type: object
      additionalProperties: false
      required: [locations]
      properties:
        locations:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProjectLocationMember'
    ProjectLocationEntry:
      type: object
      additionalProperties: false
      required: [location_id]
      properties:
        location_id:
          type: string
          format: uuid
          description: A location in the caller's library.
        role:
          type: string
          maxLength: 80
          description: The part the place plays in this project; omitted or empty means none.
    SetProjectLocationsRequest:
      type: object
      additionalProperties: false
      required: [locations]
      properties:
        locations:
          type: array
          maxItems: 50
          description: The full list in display order; an empty list clears it.
          items:
            $ref: '#/components/schemas/ProjectLocationEntry'
    ProjectProductMember:
      type: object
      additionalProperties: false
      required: [product_id, sort_order, product]
      description: One product in a project's products list.
      properties:
        product_id:
          type: string
          format: uuid
        sort_order:
          type: integer
          minimum: 0
          description: Display and attach position, dense from 0.
        product:
          $ref: '#/components/schemas/Product'
    ProjectProductList:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProjectProductMember'
    ProjectProductEntry:
      type: object
      additionalProperties: false
      required: [product_id]
      properties:
        product_id:
          type: string
          format: uuid
          description: A product in the caller's library.
    SetProjectProductsRequest:
      type: object
      additionalProperties: false
      required: [products]
      properties:
        products:
          type: array
          maxItems: 50
          description: The full list in display order; an empty list clears it.
          items:
            $ref: '#/components/schemas/ProjectProductEntry'
    AddProjectAssetsRequest:
      type: object
      additionalProperties: false
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          minItems: 1
          maxItems: 100
          description: IDs of existing assets owned by the caller.
          items:
            type: string
            format: uuid
    Collection:
      type: object
      additionalProperties: false
      required: [id, user_id, name, asset_count, created_at, updated_at]
      description: >
        User-named Library collection of assets. Many-to-many: an asset can live in any number of collections. Deleting a collection never deletes its assets.

      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this collection belongs to. Omitted for a personal collection.

        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Moodboard — spring campaign']
        asset_count:
          type: integer
          minimum: 0
          description: >
            Number of listable assets currently in the collection (pending signed uploads and trashed assets are excluded, matching `GET /collections/{id}/assets`).

        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CollectionList:
      type: object
      additionalProperties: false
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
    CreateCollectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Collection name, unique per user (conflicts answer 409).
          examples: ['Moodboard — spring campaign']
    UpdateCollectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: New collection name, unique per user (conflicts answer 409).
          examples: ['Moodboard — summer campaign']
    FigmaImportRequest:
      type: object
      additionalProperties: false
      required: [access_token, file_key, node_ids]
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 512
          writeOnly: true
          description: 'Figma personal access token with the `file_content:read` scope. Sent to Figma as `X-Figma-Token` for this request only; never stored or logged.'
        file_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9]+$'
          description: 'The key in the Figma file URL (`figma.com/design/<file_key>/...`).'
        node_ids:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: "Node ids to import, usually the one frame from the URL's `node-id` parameter. The URL form `12-34` is accepted and normalised to `12:34`. A frame, group, component, instance or section is expanded into its direct children; any other node is imported as one layer."
    FigmaImportResponse:
      type: object
      additionalProperties: false
      required: [file_name, canvas, layers, asset_ids, skipped]
      properties:
        file_name:
          type: string
          description: Figma file name.
        canvas:
          $ref: '#/components/schemas/FigmaImportCanvas'
        layers:
          type: array
          description: "Layers ordered bottom to top in Figma child order. An expanded container's background layer comes right before its children."
          items:
            $ref: '#/components/schemas/FigmaImportLayer'
        asset_ids:
          type: array
          description: Every asset this import created, in layer order.
          items:
            type: string
            format: uuid
        skipped:
          type: array
          description: 'Hidden nodes are silently omitted. Lists nodes with no bounding box ("has no size"), no rendered image ("Figma could not render this layer"), empty text ("empty text"), or non-SOLID container backgrounds ("background fill is not a solid color, so it was not imported").'
          items:
            $ref: '#/components/schemas/FigmaImportSkipped'
    FigmaImportCanvas:
      type: object
      additionalProperties: false
      required: [width, height]
      description: Union bounding box of the requested nodes, rounded outward by flooring the origin and taking the ceiling of each resulting size.
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        background:
          type: string
          nullable: true
          description: 'Hex #rrggbb of the first requested expanded container''s top visible SOLID fill, null when none.'
    FigmaImportSkipped:
      type: object
      additionalProperties: false
      required: [node_id, name, reason]
      properties:
        node_id:
          type: string
        name:
          type: string
        reason:
          type: string
    FigmaImportLayer:
      type: object
      additionalProperties: false
      required: [node_id, name, kind, role, box, opacity]
      properties:
        node_id:
          type: string
        name:
          type: string
          maxLength: 255
          description: Figma layer name, truncated to 255 characters.
        kind:
          type: string
          enum: [media, text]
        role:
          type: string
          enum: [background, layer]
        box:
          $ref: '#/components/schemas/FigmaImportBox'
        opacity:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Node opacity, defaulting to 1 when absent.
        asset_id:
          type: string
          format: uuid
          nullable: true
          description: Created image asset id, for media layers only.
        asset_name:
          type: string
          nullable: true
          description: Display name given to the asset, for media layers only.
        text:
          type: string
          nullable: true
          description: Text characters with UPPER, LOWER or TITLE textCase applied, for text layers only.
        text_style:
          allOf:
            - $ref: '#/components/schemas/FigmaImportTextStyle'
          nullable: true
          description: Style for text layers only.
    FigmaImportBox:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      description: Absolute bounding box translated to canvas pixels from its top-left origin, with y increasing downward. Values are rounded to 2 decimals.
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
    FigmaImportTextStyle:
      type: object
      additionalProperties: false
      required: [font_family, source_font_family, font_weight, italic, font_size, color, align, rotation]
      properties:
        font_family:
          type: string
          enum: [Anton, Bebas Neue, Lobster, Oswald, Pacifico, JetBrains Mono, Roboto Mono, Inter, Manrope, Montserrat, Nunito, Open Sans, Poppins, Raleway, Roboto, Work Sans, Caveat, Dancing Script, EB Garamond, Lora, Playfair Display, Roboto Slab]
        source_font_family:
          type: string
          description: Figma fontFamily as given.
        font_weight:
          type: integer
          minimum: 100
          maximum: 900
          description: Figma weight rounded to the nearest 100 and clamped to 100 through 900.
        italic:
          type: boolean
        font_size:
          type: number
          format: double
          minimum: 8
          maximum: 800
          description: Figma pixel size clamped to 8 through 800 and rounded to 2 decimals.
        color:
          type: string
          pattern: '^#[0-9a-f]{6}([0-9a-f]{2})?$'
          description: 'Lowercase #rrggbb or #rrggbbaa. The alpha byte is included only when effective alpha (color.a multiplied by paint.opacity) is less than 1.'
        align:
          type: string
          enum: [left, center, right]
          description: Horizontal alignment, with JUSTIFIED mapped to left.
        rotation:
          type: number
          format: double
          description: 'Clockwise degrees on screen from relativeTransform [[a,c,e],[b,d,f]], using atan2(b,a) * 180/pi, rounded to 2 decimals. Zero when absent.'
    Composition:
      type: object
      additionalProperties: false
      required: [id, user_id, name, description, meta, created_at, updated_at]
      description: |
        HyperFrames-style HTML video composition: a user-owned bundle of files
        rendered by the web UI as a scrubbable timeline. Names are unique per
        user.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this composition belongs to. Omitted for a personal composition.

        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['spring-launch-teaser']
        description:
          type: string
          maxLength: 2000
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Project the composition belongs to; omitted/null when unlinked. Deleting the project detaches the composition without deleting it.
        meta:
          type: object
          description: >
            Free-form composition metadata (mirrors the bundle's meta.json), e.g. duration, fps, scene list. By convention, compositions in a version series share a `series` string key and carry an integer `version` key; both are returned here verbatim in list and single responses.

        files:
          type: array
          nullable: true
          description: File inventory; present on the single-composition GET and clone responses, omitted from list responses.
          items:
            $ref: '#/components/schemas/CompositionFile'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompositionExportFormat:
      type: string
      enum: [fcpxml, aejsx]
      description: "`fcpxml` = Final Cut Pro 7 XML for Premiere Pro and DaVinci Resolve; `aejsx` = an After Effects ExtendScript."
    CompositionFile:
      type: object
      additionalProperties: false
      required: [path, content_type, size_bytes, updated_at]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 200
          description: Relative path inside the bundle.
          examples: ['compositions/scene1.html']
        content_type:
          type: string
          examples: ['text/html']
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        revision:
          type: integer
          minimum: 1
          description: >
            Monotonic per-file revision for optimistic-concurrency autosave. Bumped on every overwrite. Always present in responses. Send it back in the `If-Match` request header on the next `PUT /compositions/{id}/file` to detect a concurrent overwrite.

        updated_at:
          type: string
          format: date-time
    CompositionList:
      type: object
      additionalProperties: false
      required: [compositions]
      properties:
        compositions:
          type: array
          items:
            $ref: '#/components/schemas/Composition'
    CreateCompositionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['spring-launch-teaser']
        description:
          type: string
          nullable: true
          maxLength: 2000
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Existing project owned by the caller to link the composition to; an unknown or foreign project returns 404.
        meta:
          type: object
          nullable: true
          description: Free-form composition metadata (at most 64 KiB serialized).
    UpdateCompositionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        description:
          type: string
          nullable: true
          maxLength: 2000
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Set to a project id to link the composition to that caller-owned project (an unknown or foreign project returns 404), or to `null` to unlink it. Omit the field to leave the link unchanged.

        meta:
          type: object
          nullable: true
          description: >
            JSON Merge Patch (RFC 7386) applied over the stored meta when provided: nested objects are merged recursively, a provided key overwrites that key's value, an explicit null deletes that key, and keys you omit are preserved. The merged result must be at most 64 KiB serialized.

    CloneCompositionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
          description: Name for the clone; defaults to the source name plus " copy". A duplicate name returns 409.
          examples: ['spring-launch-teaser v2']
        meta_patch:
          type: object
          nullable: true
          description: >
            Shallow-merged over the source meta (`source.meta || meta_patch`): top-level keys replace the source's keys wholesale. The merged result must serialize to at most 64 KiB. Typically used to bump `version` (and set `series`) under the version-series convention.

          examples: [{'series': 'spring-launch-teaser', 'version': 2}]
    PutCompositionFileRequest:
      type: object
      additionalProperties: false
      required: [content_base64, content_type]
      properties:
        content_base64:
          type: string
          minLength: 1
          maxLength: 35000000
          description: Base64-encoded file contents (max 25 MiB decoded).
        content_type:
          type: string
          minLength: 1
          maxLength: 255
          description: 'MIME type of the file. Allowed: text/html, text/css, application/javascript, application/json, image/*, video/*, audio/*, font/*.'
          examples: ['text/html']
    CompositionSignedUrlsRequest:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 200
          description: >
            Entries to sign: relative bundle paths of existing composition files, or `asset:<uuid>` references to the caller's own ready platform assets.

          items:
            type: string
            minLength: 1
            maxLength: 200
    CompositionSignedUrl:
      type: object
      additionalProperties: false
      required: [path, signed_url, expires_at]
      properties:
        path:
          type: string
          description: The requested entry, echoed back — a bundle path or an `asset:<uuid>` reference.
        signed_url:
          type: string
          format: uri
          description: >-
            Short-lived signed GET URL for the stored file or asset object. Stable for about an hour: repeated requests inside the same clock hour return the identical URL, so the bytes are cacheable client-side. `expires_at` reports the exact expiry.
        expires_at:
          type: string
          format: date-time
    CompositionSignedUrlsResponse:
      type: object
      additionalProperties: false
      required: [urls]
      properties:
        urls:
          type: array
          items:
            $ref: '#/components/schemas/CompositionSignedUrl'
    CreateRenderRequest:
      type: object
      additionalProperties: false
      description: Render request body. Defaults to video; still options are allowed only with target still. Non-empty params are rejected with 400 because params remains reserved.
      properties:
        target:
          $ref: '#/components/schemas/RenderTarget'
        still:
          $ref: '#/components/schemas/RenderStillOptions'
        params:
          type: object
          nullable: true
          description: Reserved for future render options; must be empty or omitted today.
    RenderTarget:
      type: string
      enum: [video, still]
      default: video
      description: 'Output target: video exports an MP4; still exports a single-frame PNG. Invalid values return 400 with "target must be video or still". With still and no still object, defaults are frame 0, opaque background, and native resolution.'
    RenderStillOptions:
      type: object
      additionalProperties: false
      description: >-
        Single-frame PNG options. Only allowed with target still; otherwise returns 400 with "still is only allowed with target: still". at_seconds and frame are mutually exclusive; setting both returns 400 with "still.frame and still.at_seconds are mutually exclusive". Neither selects frame 0. Native resolution is capped at 3840x2160; larger canvases fail the render with a message naming the canvas, unless max_dimension brings the output under that cap.
      properties:
        at_seconds:
          type: number
          format: double
          minimum: 0
          maximum: 86400
          description: 'Timestamp rounded to the nearest frame using the plan FPS in the worker, then clamped to the last frame with a warning when past the end. Omitted selects frame 0. Cannot accompany frame. Invalid values return 400 with "still.at_seconds must be between 0 and 86400". No schema default is declared on purpose: a declared default generates as a REQUIRED property in openapi-typescript and as a materialized value in the Python client, which would send at_seconds on every request and collide with frame.'
        frame:
          type: integer
          minimum: 0
          maximum: 2592000
          description: 'Zero-based frame index, clamped to the last frame with a warning when past the end. Cannot accompany at_seconds. Invalid values return 400 with "still.frame must be between 0 and 2592000".'
        background:
          type: string
          enum: [opaque, transparent]
          description: 'Opaque includes the black backdrop; omitted means opaque. Transparent omits it, preserving a real PNG alpha channel for canvas areas the timeline does not cover. Invalid values return 400 with "still.background must be opaque or transparent". No schema default is declared, for the same codegen reason as at_seconds.'
        max_dimension:
          type: integer
          minimum: 64
          maximum: 3840
