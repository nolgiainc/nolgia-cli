        An agent preset is a production: several shots, a timeline, captions, an identity held across cuts. That needs a NOLGIA Agent session or the Studio, and neither is reachable from a surface that can only call a tool and read the answer, so a chat client had no way to finish one and simply stopped at the brief.


        This is the representative scene it can finish: the preset's own visual language as a prompt, with the customer's answers appended as the brief, rendered in one call. It does NOT replace the production and must never be described as one. It exists so a conversation ends with something the person can watch, next to the brief that runs the whole thing.


