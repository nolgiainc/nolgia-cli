  /jobs/{id}/sse:
    get:
      tags: [Jobs]
      operationId: streamJobSSE
      summary: Stream job status updates over Server-Sent Events.
      description: >
        Opens a `text/event-stream` connection that emits the current job state immediately, then a `status` event per update and a final `complete` event when the job reaches a terminal state. Authorized by a single-use `ticket` query parameter from `POST /jobs/{id}/sse-ticket`, not by the bearer schemes.

      security: []
      parameters:
