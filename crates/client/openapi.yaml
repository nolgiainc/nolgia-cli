openapi: 3.0.3
info:
  title: Nolgia API
  version: 0.1.0
  summary: Generative media platform (image, audio, video) — single contract for web, CLI, and MCP clients.
  description: |
    Nolgia API is the single backend serving the Nolgia website, Rust CLI, and MCP server.
    It orchestrates three generation paths:
      * **image** — synchronous (5–15s typical)
      * **audio** — long-poll synchronous (up to 900s)
      * **video** — asynchronous via job orchestrator
    All non-public endpoints require either an Auth.js bearer JWT (web) or a Personal Access Token (CLI/MCP).
  contact:
    name: Nolgia Engineering
    url: https://nolgia.ai
  license:
    name: Proprietary
    url: https://nolgia.ai/terms
servers:
  - url: https://api.nolgia.ai/v1
    description: Production
  - url: https://api.stg.nolgia.ai/v1
    description: Staging
  - url: http://localhost:8080/v1
    description: Local development
tags:
  - name: Arena
    description: Public creative challenges; entries are the submitter's own finished Outputs shared through a public share link; community votes and admin moderation.
  - name: Auth
    description: Sign-in flows for CLI/MCP (device code) and current-user info.
  - name: Sets
    description: Coordinated image Outputs sharing one visual system.
  - name: Generate
    description: Image, audio, and video generation endpoints.
  - name: Models
    description: Model catalog and per-model capabilities.
  - name: Jobs
    description: Async job lifecycle (used primarily for video).
  - name: Assets
    description: Generated media stored in GCS with signed URLs.
  - name: Characters
    description: User-owned reusable subjects (name, description, reference images) for generation.
  - name: Locations
    description: User-owned reusable places (name, canonical description, reference images) for generation; the place-twin of a character.
  - name: Products
    description: User-owned products imported from a store link or built from your images; reused in every ad.
  - name: BrandKits
    description: Reusable brand palettes, fonts, logos and never-rules for generation.
  - name: Canvases
    description: Versioned node graph production plans for projects, shared by the web editor and NOLGIA Agent.
  - name: Styles
    description: "Saved styles: a reusable look, a prompt fragment plus reference images, applied with style_id."
  - name: EditSessions
    description: "Chained edit sessions: keep editing one image step by step, revert to any earlier step, estimate the cost of the chain."
  - name: TweakScopes
    description: Measured scopes for narrow image tweaks, including known-unavailable scopes and their evidence.
  - name: Projects
    description: User-owned groupings of assets; an asset can belong to multiple projects.
  - name: Collections
    description: |
      User-named Library collections: lightweight, user-curated groupings of
      assets for the Library navigator. Many-to-many — an asset can live in
      any number of collections — and membership is the only thing a
      collection owns: deleting a collection never deletes its assets.
      Collection names are unique per user (conflicts answer 409). Unlike
      projects, collections carry no compositions, agent context, or
      default-filing semantics.
  - name: Compositions
    description: |
      HyperFrames-style HTML video compositions: a bundle of files
      (index.html + compositions/*.html + assets/* + meta.json) authored by a
      user's NOLGIA Agent and rendered by the web UI as a scrubbable timeline.
      The API stores the files in GCS and serves them back via short-lived
      signed URLs; it never renders or executes composition content.

      Version series convention: compositions that are versions of the same
      work share a `meta.series` string and carry an integer `meta.version`.
      These are ordinary meta keys — the API stores them verbatim and never
      assigns or increments them; clients own the numbering. Create a new
      version with `POST /compositions/{id}/clone` (typically bumping
      `meta.version` via `meta_patch`) and list a series with
      `GET /compositions?series=...`.
  - name: Activity
    description: |
      Read-only chronological feed of platform events (generations, assets,
      compositions, renders), assembled at read time from the underlying
      resources — nothing extra is stored to serve it.
  - name: Billing
    description: Subscription state and Stripe Customer Portal.
  - name: PAT
    description: Personal Access Token issuance and revocation.
  - name: Organizations
    description: |
      Team and enterprise organizations: memberships and roles, invites,
      verified email domains, the audit trail and organization-scoped API
      keys. A user works either in their personal space or inside ONE active
      organization (`PUT /me/active-organization`); the context is server
      state and is resolved at authentication time, so every credential the
      user holds follows it.
  - name: Sharing
    description: Durable, revocable public share links for finished media (assets and renders) and the public resolver behind them.
  - name: Agent
    description: Per-customer NOLGIA Agent provisioning, usage, and chat relay.
  - name: Abilities
    description: Marketplace of admin-published ability packages that customers' NOLGIA Agents install and run.
  - name: Presets
    description: |
      Customer-facing, outcome-named workflow wrappers ("Social media ad", "Short film")
      that power the /presets page. Metadata only — no package content: a
      preset either deep-links into a creation endpoint (`create_image` /
      `create_video` / `create_audio` targets with `{prompt, model}` params) or
      hands off to the Studio agent lane (`studio_intent` with `{intent}`).
      A preset may reference the marketplace ability powering it via
      `ability_slug`. Admin-managed and mutable by slug (no versions);
      visibility-gated like abilities.
  - name: ColorPresets
    description: |
      Built-in color-grade presets ("LUT looks") for studio compositions.
      The catalog is embedded in the service (no database) and identical for
      every caller. Grades attach to compositions as `data-color-grade`
      attributes — per timed element, and on the canvas element for the whole
      frame — and as `colorGrade` fields in the `nolgia-edits.json` overlay;
      the render job bakes them into the exported MP4.
  - name: Motions
    description: |
      The camera-move library for video generation: a static, model-agnostic
      catalog of named camera moves (push-in, pull-back, orbit, crane, truck,
      tracking, zoom, dolly zoom, pan, tilt, rack focus, handheld, parallax,
      drone fly-through, locked off), each with a prompt fragment per
      strength (subtle / medium / strong). A `POST /generate/video` request
      names one by `motion_id` (+ `motion_strength`) and the server appends
      the move's fragment to the prompt; the prompt is never replaced.
      Embedded in the service, identical for every caller, no auth needed.
  - name: Masks
    description: |
      Per-clip timeline masks (Adobe Premiere's Opacity masks): a `rectangle`,
      `ellipse`, or `polygon` shape with `feather`, `expansion`, `opacity`, and
      `inverted` controls that hides part of one visual clip so the layers
      beneath show through. Masks attach to compositions as `data-mask`
      attributes on timed elements and as `mask` fields in the
      `nolgia-edits.json` overlay (`elements.<key>.mask`, `additions[].mask`,
      object-level replacement — `{}` clears); the Studio preview applies
      them live and the render job bakes them into the exported MP4. The
      sanitizer (`POST /masks:validate`) is public and stateless: it reports
      exactly what the renderer will draw.
  - name: Motion
    description: |
      Per-clip timeline motion (Adobe Premiere's Motion effect): `x`/`y`
      position of the clip's anchor as % of the canvas, `scale` (uniform,
      1 = fit-to-frame) with optional per-axis `scaleX`/`scaleY`
      multipliers, `rotation` in degrees clockwise, `opacity` 0..100, and the
      `anchor` point as % of the clip box. Since phase 2 every one of those
      properties except `anchor` is a CONSTANT or a KEYFRAME LIST
      (`[{t, v, ease}, ...]`, `t` seconds from the clip start, `ease` one of
      `linear | ease-in | ease-out | ease-in-out | hold`; see the
      `MotionKeyframe` schema): the Studio preview samples it every frame and
      the render job samples it at the export frame rate, both with the same
      curves, so the export matches the editor. Motion lives in the
      `nolgia-edits.json` overlay only (`elements.<key>.motion`,
      `additions[].motion`, object-level replacement: `{}` clears back to the
      default fit-to-frame centered placement; there is no authored
      `data-motion` attribute yet); the render job bakes it into the exported
      MP4, with the clip's mask riding inside the transform. Text clips are
      placed by their `textStyle` (x/y/rotation/opacity) instead; a `motion`
      on a text clip is ignored with a warning. The sanitizer
      (`POST /motion:validate`) is public and stateless: it reports exactly
      what the renderer will apply, keyframe lists included.
  - name: Health
    description: Service health probes.
security:
  - bearerAuth: []
  - patAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List available models and their capabilities.
      responses:
        '200':
          description: Model catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /motions:
    get:
      tags: [Motions]
      operationId: listMotions
      summary: List the camera-move library for video generation. Public, embedded, identical for every caller.
      description: |
        The named camera moves a video request may pick with `motion_id` +
        `motion_strength` on `POST /generate/video` (and tell the prompt
        rewrite about on `POST /generate/video/enhance-prompt`). Each entry
        carries its display `name`, a one-line `description` of what the
        move does on screen, its `category`, the `default_strength`, and one
        `prompt_fragment` per strength: the exact text the server appends to
        the prompt, so a client can preview the composed prompt without a
        round trip. `preview_url` is reserved for an example clip per move
        and is `null` on every entry today.
      security:
        - {}
        - bearerAuth: []
        - patAuth: []
      responses:
        '200':
          description: The camera-move library, in display order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraMoveList'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /pricing/models:
    get:
      tags: [Models]
      operationId: listModelPricing
      summary: Public per-model credit prices (no authentication).
      description: |
        The published price list, readable without a token, so a pricing page
        can print what a generation costs from the same source of truth the
        API bills from. Per model: the catalog `id` a request sends, its
        `modality`, the plan floor (`min_tier`), the credit `cost` with its
        billing `unit`, the per-quality-tier credit costs (`quality.options`)
        and the `aspect_ratios` it renders.

        This is a strict projection of the pricing half of `GET /models` —
        identical numbers, same registry, same
        deployed-proxy capability filter — with everything else dropped. It
        carries NO per-user data (no balance, entitlement, or history), no
        provider cost, and no internal routing name, so the response is byte
        identical for every caller and safe to cache and to serve from a
        marketing page.

        Read `GET /models` instead when you hold a credential and need the
        full capability surface (durations, references, voices, seeds).
        Rate limited per client IP (`429`).
      security: []
      responses:
        '200':
          description: The public model price list.
          headers:
            Cache-Control:
              description: '`public, max-age=300` — the list only changes with a deploy or a proxy capability change.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPricingList'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /providers/status:
    get:
      tags: [Models]
      operationId: listProviderStatus
      summary: List generation provider availability.
      description: >-
        Reports each video generation provider's current availability as seen by the platform's hard-down detector: "degraded" while ~all recent submissions to the provider are failing server-side (jobs targeting it are parked and resume automatically on recovery), otherwise "operational". Clients use this to explain a "provider_down" job status instead of showing a generic failure.
      responses:
        '200':
          description: Provider availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatusList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the currently authenticated user.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /me/settings:
    get:
      tags: [Auth]
      operationId: getUserSettings
      summary: Get the current user's notification settings.
      responses:
        '200':
          description: Notification settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Auth]
      operationId: putUserSettings
      summary: Update the current user's notification settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsRequest'
      responses:
        '200':
          description: Updated notification settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /me/active-organization:
    put:
      tags: [Organizations]
      operationId: putActiveOrganization
      summary: Switch the current user between their personal space and one of their organizations.
      description: >
        Sets `users.active_organization_id`. This is SERVER state, so the web app, CLI, MCP and the user's agent credentials all follow it on their next request. `organization_id: null` returns to the personal space. The user must be a member of the organization (`404` otherwise). Answers the refreshed `User`, including `active_organization`. Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_change_organization` and detail "The NOLGIA Agent cannot change your organization. Do it in the app."

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveOrganizationRequest'
      responses:
        '200':
          description: Updated current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/OrganizationMutationForbidden'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /me/deletion:
    get:
      tags: [Auth]
      operationId: getAccountDeletionPreflight
      summary: Preview what deleting the current account will do.
      description: >
        Browser (JWT) sessions only; PATs are rejected. Lists the organizations that block the deletion (ones the caller owns that still have other members: transfer ownership or delete the organization first), the organizations that will be deleted with the account (owned, no other members), the organizations the caller will leave, and the grace period before the purge starts.

      responses:
        '200':
          description: What a deletion requested now would do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionPreflight'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Auth]
      operationId: requestAccountDeletion
      summary: Delete the current account.
      description: >
        Browser (JWT) sessions only; PATs are rejected, so a leaked token can never delete an account. `confirmation` must equal the account's email address (case-insensitive). On success the account is locked at once: every session, personal access token, API key and OAuth grant stops working, share links are revoked, Arena entries are withdrawn, paid subscriptions are cancelled at Stripe (immediately, without proration), and the NOLGIA Agent is stopped. The purge that deletes the account's content and anonymizes its billing records starts when `purge_after` passes (the grace period, 7 days) and normally finishes within the hour. `409` when the caller owns an organization that still has other members.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: Deletion scheduled; the account is locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletion'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List the organizations the current user belongs to, with their role in each.
      responses:
        '200':
          description: Memberships, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create a team organization owned by the current user.
      description: >
        Creates a `kind: team` organization with the caller as `owner`, makes it the caller's active organization and creates its default Library project. `slug` is derived from `name` when omitted. A taken slug answers `409`. Team billing (seats, Stripe) is attached afterwards through the web app; until then the organization has no subscription and is quota'd like a free account. Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_change_organization` and detail "The NOLGIA Agent cannot change your organization. Do it in the app."

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/OrganizationMutationForbidden'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get one organization the current user belongs to.
      responses:
        '200':
          description: The organization and the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Update an organization's name or settings (owner or admin).
      description: >
        Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_change_organization` and detail "The NOLGIA Agent cannot change your organization. Do it in the app."

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/OrganizationMutationForbidden'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      summary: Soft-delete an organization (owner only).
      description: >
        Marks the organization deleted and returns every member to their personal space. Library rows keep their `organization_id` for the retention window; nothing is hard-deleted here. Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_change_organization` and detail "The NOLGIA Agent cannot change your organization. Do it in the app."

      responses:
        '204':
          description: Organization deleted.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/OrganizationMutationForbidden'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /organizations/{id}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      summary: List an organization's members (any member may read).
      responses:
        '200':
          description: Members, owner first then by join time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /organizations/{id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationMemberUserId'
    patch:
      tags: [Organizations]
      operationId: updateOrganizationMember
      summary: Change a member's role or monthly credit budget (owner or admin).
      description: >
        `role` cannot be set to `owner` here (use transfer-ownership) and the current owner cannot be demoted. `monthly_credit_budget: null` removes the cap; omitting it leaves it unchanged. Promoting a viewer to a seat-consuming role is checked against `seat_limit` (`409`). Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_change_organization` and detail "The NOLGIA Agent cannot change your organization. Do it in the app."

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationMemberRequest'
      responses:
        '200':
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/OrganizationMutationForbidden'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Organizations]
      operationId: removeOrganizationMember
      summary: Remove a member (owner or admin), or leave the organization (self).
      description: >
        The owner cannot be removed and cannot leave without first transferring ownership (`409`). A removed member whose active organization this was is returned to their personal space; their organization-scoped API keys stop authenticating immediately. Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_change_organization` and detail "The NOLGIA Agent cannot change your organization. Do it in the app."

      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/OrganizationMutationForbidden'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /organizations/{id}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Organizations]
      operationId: transferOrganizationOwnership
      summary: Transfer ownership to another member (owner only).
      description: >
        The new owner must already be a member. The previous owner becomes `admin`. Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_change_organization` and detail "The NOLGIA Agent cannot change your organization. Do it in the app."

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: Organization with the new owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/OrganizationMutationForbidden'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /organizations/{id}/invites:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: listOrganizationInvites
      summary: List pending invites (owner or admin).
      responses:
        '200':
