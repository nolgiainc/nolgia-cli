  /projects/{id}/clone:
    post:
      tags: [Projects]
      operationId: cloneProject
      summary: Start the next episode of a project (series link).
      description: >
        Creates a new project in the caller's library from an existing one so the next episode does not start over: the brief (`description`) and the label set (`auto_tags`) are copied, the cast filed on the source project is carried over when that table exists, and the new project's `parent_project_id` names the series root. Cloning an episode files the new project under the SAME root as its source, so a series stays one level deep (root plus episodes). Assets, compositions and renders are never copied: assets are shareable across projects already and each episode starts with an empty timeline list. The default "Library" project cannot be cloned (400). An unknown or foreign project returns 404.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneProjectRequest'
      responses:
        '201':
          description: Episode created; `parent_project_id` and `series` describe its place in the series.
