    GenerateImageRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        confirmation_token:
          type: string
          description: >-
            Optional proof that this exact request and price were shown to the customer, from `POST /jobs/cost`. Omit it and nothing changes. Send it and it is verified: an expired, malformed, foreign, or mismatched token is a `422` with `error.code` `confirmation_rejected`.
        model:
          $ref: '#/components/schemas/ImageModel'
        prompt:
          type: string
          maxLength: 4000
          x-go-type-skip-optional-pointer: true
          description: |
            What to generate. Required on every generation model, and refused
            on `remove-background` and the `image_enhance` models, which process the reference image
            from its own pixels and have no prompt slot at all: sending one
            there is a 400 rather than a result that quietly ignored it.
            Optional on the `image_expand` model (`flux-expand`), where it
            describes what the newly painted margins should contain.
          examples: ['A neon cyberpunk cat DJing on a rooftop, cinematic']
        negative_prompt:
          type: string
          nullable: true
          maxLength: 4000
          description: |
            Negative prompt text. The shared contract accepts up to 4,000
            characters; models with a lower provider limit publish it as
            `image.negative_prompt_max_length` in `GET /models` and reject
            longer values before reserving credits. Refused on `remove-background`.
        image_size:
          $ref: '#/components/schemas/ImageSize'
        aspect_ratio:
          $ref: '#/components/schemas/ImageAspectRatio'
        num_images:
          description: >-
            How many images to render from this one request. Each one is billed, so four images cost four times one. The ceiling is per-model (`image.num_images_max`); most models allow four.
          type: integer
          minimum: 1
          maximum: 4
          default: 1
        seed:
          description: >-
            Reproducibility seed. The same seed with the same prompt and settings gives the same image on a model whose provider honors one; omit it for a different result every time. Not every provider honors it.
          type: integer
          nullable: true
          minimum: 0
        guidance_scale:
          type: number
          nullable: true
          minimum: 0
          maximum: 20
        image_url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Source image (https URL) for image-to-image restyle. When set, the model transforms this image instead of generating from scratch.
        image_urls:
          type: array
          nullable: true
          maxItems: 4
          description: >-
            Multiple reference images (https URLs) for models that support multi-reference input (OpenAI gpt-image models — e.g. character + outfit + style references combined — Kling Image 3.0 multi-reference i2i, `seedream-v5-pro` (up to 4) and `qwen-image-3` (up to 3)). Mutually additive with `image_url` (it is treated as the first reference); at most 4 references total, and never more than the model's `image.reference_images_max`. OpenAI references are fetched server-side under one 10 MB combined download budget; every other model fetches the URLs itself, so they must stay reachable until the render completes. Rejected (400) on models without multi-reference support.
          items:
            type: string
            format: uri
            maxLength: 2048
          examples: [['https://assets.nolgia.ai/ref-character.png', 'https://assets.nolgia.ai/ref-outfit.png']]
        reference_asset_ids:
          type: array
          nullable: true
          maxItems: 4
          description: >-
            Reference images given as ids of your own image assets — the server resolves each to a signed URL and it rides the same multi-reference path as `image_urls` (the image lane's sibling of the video lane's `element_asset_ids`). Counted against the same per-model cap as `image_url` + `image_urls` combined (`image.reference_images_max` on `GET /models` — 4 on gpt-image-2, Kling Image 3.0 and seedream-v5-pro, 3 on qwen-image-3, 1 on single-reference models, 0 on models with no reference input, where any reference is rejected with a 400 rather than silently dropped). Prefer this over `image_urls` for assets already in your Library: the server re-signs the underlying objects at execution time, so a queued job never runs with an expired URL.
          items:
            type: string
            format: uuid
        render_quality:
          type: string
          enum: [auto, low, medium, high, xhigh, max]
          x-enum-varnames: [RenderQualityAuto, RenderQualityLow, RenderQualityMedium, RenderQualityHigh, RenderQualityXhigh, RenderQualityMax]
          description: |
            How much detail the model spends on the render itself, on models
            that publish `image.render_quality` (the GPT Image family). This
            is a SECOND axis and not a rename of `quality`: `quality` is the
            native/2k/4k UPSCALE ladder, which re-renders the finished image
            larger, while this changes how the picture is drawn in the first
            place. They compose — `quality: 4k` with `render_quality: max` is
            a legitimate request and pays for both.

            `auto` (the default) is the model's own choice and costs the base
            rate, exactly as an omitted field always has. `low`, `medium` and
            `high` spend LESS than auto and are charged the same, so they buy
            speed rather than savings. `xhigh` and `max` spend substantially
            more and add credits — see `image.render_quality.options` for the
            exact figure per model, and read it there rather than assuming,
            because it is per model.

            `xhigh` and `max` exist only on the GPT Image 2.5 models. Sending
            a value a model does not publish is a 400 naming what it accepts,
            before any credit hold — never a silent downgrade.
          examples: ['xhigh']
        mask_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Edit only PART of the reference image. The id of one of your own image assets holding a MASK: a PNG with an alpha channel, the same pixel dimensions as the reference image, whose TRANSPARENT areas mark the region the model may repaint. Everything the mask leaves opaque is preserved.

            Accepted only on models publishing `image.inpaint_mask: true` on `GET /models` (`gpt-image-2` and the GPT Image 2.5 pair), and only alongside exactly one reference image — `image_url`, one entry in `image_urls`, or one `reference_asset_ids` entry, including any reference a `character_id`, `face_reference_asset_id` or `element_ids` attaches. A mask on an unsupported model, with the wrong number of references, or on a non-PNG asset is rejected with a 400 before any credit hold, so a rejected request never costs credits; a mask with no alpha channel or the wrong dimensions fails the job with the same explanation and a full refund.

            The mask is guidance the model follows, not a hard clip, and the prompt decides what it does with it. Describe the WHOLE picture you want, including what should now fill the see-through area ("a desk with a red mug on the left and a potted fern in the centre"), not just the change ("add a fern"): a prompt that names only the change returns the see-through area painted flat black with the change placed elsewhere. Paint the full footprint of the new content with some margin, because an object larger than its window spills past the edge, and keep a fair share of the image opaque — a mask that leaves almost everything see-through is also returned black on the 2.5 models. The preserved area is re-rendered rather than copied, so expect it to match to the eye, not byte for byte.

            A masked edit costs exactly what the same model's ordinary generation costs — a mask changes no price.
          examples: ['9a3e1a1a-6c1e-4a4f-9f3e-2d4b6c8e0a11']
        quality:
          type: string
          nullable: true
          maxLength: 16
          description: >-
            Quality/resolution tier for the selected model. Allowed values and per-tier credit costs are model-specific — see the model's `quality.options` on `GET /models`. Omit for the model's default tier at its base price. Rejected (400) when the model declares no quality tiers or the value is not one of its options.
          examples: ['2k']
        tags:
          type: array
          maxItems: 10
          description: Applied to the resulting asset(s); normalized to lowercase.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        project_id:
          type: string
          format: uuid
          description: >-
            Files the generated asset(s) into this project at creation. The project must exist and belong to the caller (400 otherwise). Honored on every auth channel (JWT and PAT), and takes precedence over server-side agent-session attribution.
        preset_slug:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            Slug of the preset this generation was launched from, if any. Set by the web app on preset-launched generations to enable server-side preset→usage attribution (the admin usage panel's top-presets leaderboard); omit on direct API/CLI/MCP/pipeline calls. Stored verbatim and NOT validated against the preset catalog (a preset may be deleted later).
          examples: ['cinematic-portrait']
        aura:
          type: boolean
          nullable: true
          description: >-
            Applies Aura, the Nolgia character engine: server-side photoreal composition layered onto the prompt (people render as photographs, real skin, real light, no AI gloss). Honored only on models whose catalog entry publishes `image.aura_compatible: true`; a true value on any other model is a no-op, never an error. When OMITTED, the server applies the product default: ON for prompts that read as a person subject on aura_compatible models, OFF otherwise. An explicit false always wins. The job's persisted params echo the effective value for audit and gallery badging.
        face_reference_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Image asset (owned by the caller) whose face conditions the render for identity. A face reference IS an Aura identity request: it turns the pipeline on (an explicit `aura: false` alongside it is a 400) and needs a model that accepts reference images (`image.reference_images_max` above the number of references already attached) - rejected with a 400 otherwise, so a reference is never silently dropped. Rides alongside `image_url`/`image_urls` and counts against the model's combined reference budget. The delivered render is subject to the ArcFace identity acceptance gate (>= 0.60 against this reference, one automatic re-roll) once the scoring runtime is enabled; that gate scores and re-rolls a single render, so `num_images` must be 1 (or omitted) alongside a face reference - a batch is a 400 rather than a set of renders where only one was actually scored. The gate runs only when consent to the face check is recorded for this photo (`face_check_consent`); without it the photo still conditions the render and nothing is face-compared.
        face_check_consent:
          type: boolean
          nullable: true
          description: >-
            Records your consent to the face identity check for the `face_reference_asset_id` photo (once per photo; it stays recorded for later requests). Send true only after the person using NOLGIA has agreed to this wording, version 2026-09-23: "I am the person in this photo, or I have their permission to use it. I agree that NOLGIA checks the face in this photo and compares it with the faces in the images I make with it, as described in the Privacy Policy." Without consent on record the photo still conditions the render, but no face is compared, no identity gate or re-roll runs and no `identity_score` is stored. Requires `face_reference_asset_id`; a character's photos take consent on `PATCH /characters/{id}` instead, so it is a 400 alongside `character_id`/`character_ids`. A request sent by the platform agent is refused (403): consent must be the user's own.
        character_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your characters (`GET /characters`, created on the Create Characters page). The character's `primary_reference_asset_id` becomes this render's face reference and its `canonical_description` rides into the prompt verbatim as the continuity contract, so the same character renders consistently across generations. The character must belong to the caller - an unknown or foreign id is a 400, never silently ignored. Because it supplies the face reference it inherits every `face_reference_asset_id` rule (an `aura_compatible` model with spare `image.reference_images_max` capacity, `num_images` of 1), and each of those is a 400 rather than a dropped reference. Passing `character_id` and `face_reference_asset_id` together is a 400: two competing identities are refused rather than silently resolved in favor of one. A character with no reference image still contributes its description; that render carries no face reference, so its `identity_score` is null. The job's persisted params echo `character_id` alongside `aura` for audit. `character_id` is the single-member sugar for `character_ids`.
        character_ids:
          type: array
          nullable: true
          maxItems: 4
          description: >-
            An ORDERED cast of up to 4 of your characters rendered together (two-person dialogue scenes, duets, family commercials). The first member is the lead: its primary reference becomes the face reference exactly as `character_id` does; every further member's primary reference is attached as an image reference after it (before any `element_ids`), and each member's `canonical_description` rides into the prompt verbatim as a "Cast:" block in cast order, so a `@Name` mention in the prompt addresses the right subject. All references count against `image.reference_images_max` - a cast the model has no room for is a 400, never a silent drop. A member listed twice, more than 4 members, or a foreign id is a 400. `character_id` may be passed alongside as sugar for a one-member cast; when both are present, `character_id` must be one of the members. The identity gate scores EVERY member against the render: the asset's `identity_score` is the weakest member's, delivery re-rolls once when any member misses the 0.60 gate, and `character_scores` records each member's own score.
          items:
            type: string
            format: uuid
          examples: [['5a2f7c58-9e5a-4f1a-9c7f-2f0b6c3d1e42', 'b2fbb51e-3c33-4a54-b87b-9c2b1e4f9a11']]
        location_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your locations (`GET /locations`): the place this render is set in. The location's `primary_reference_asset_id` is appended to `reference_asset_ids` (after the caller's own references, so their order is unchanged) and its `canonical_description` rides into the prompt verbatim after any `character_id` description, so the same room, storefront or set comes back scene after scene. Its own additive field beside `character_id`: a shot casts a character INTO a location, so the two never compete for one slot. The location must belong to the caller - an unknown or foreign id is a 400. The reference counts against `image.reference_images_max`; a model with no reference input or no spare slot is a 400 NAMING location_id, never a silent drop. A location with no reference image contributes its description only. The job's persisted params echo `location_id` for audit.
        brand_kit_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your brand kits (`GET /brand-kits`). When omitted, the kit linked to the generation's project applies: the explicit `project_id`, or the active agent session's project. The kit's logo rides as a reference only where the model has a spare slot; it never displaces a reference you, a character, a location or an element attached, and is skipped on lanes where a reference changes what the request means. Image enhance, expand and masked requests never attach the logo. The compact brand block (palette names and hex, font names, never-rules) is appended after your own words, which are never replaced. Whether the logo rode is recorded as `brand_logo_attached` in the asset's generation metadata.
        brand_kit_mode:
          $ref: '#/components/schemas/BrandKitMode'
        product_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your products (`GET /products`): the product this render shows. Up to three of its images, primary first, are appended to `reference_asset_ids` after the caller's own, the location's and the cast's references, within the model's remaining `image.reference_images_max` budget, and its `canonical_description` rides into the prompt verbatim after any character and location description. The product must belong to the caller - an unknown or foreign id is a 400. A model with no reference input, or no room for the primary image, is a 400 NAMING product_id, never a silent drop; gallery images past the budget do not ride. A product with no image contributes its description only. The job's persisted params echo `product_id` for audit.
        style_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your saved styles (`GET /styles`). Its prompt fragment is appended after your own words, which are never replaced, and its reference images ride as extra references after every reference you, a location, a product or a character attached, only within the model's remaining `image.reference_images_max` budget: a style reference that does not fit is left out rather than refused, because the style is a look, not a subject. An unknown or foreign id is a 400. The job's persisted params and the asset's generation metadata echo `style_id`. When omitted, the project the output is filed into (explicit `project_id` or the session's project) contributes its pinned style key; pass `style_id` to override it for one generation.
        element_ids:
          type: array
          nullable: true
          maxItems: 4
          description: >-
            Registry elements (`GET /elements`) to condition this render: each element's reference images are attached as image references (after any `image_url`/`image_urls` and any face/character reference, which keeps its slot) and its `canonical_description` rides into the prompt verbatim with the binding clause ("100% matches the reference") - the belt-and-braces continuity stack. A character id is accepted here too and injects exactly what `character_id` would (primary reference + description); naming the SAME character in both fields is a 400. All the injected references count against the model's `image.reference_images_max` budget (gpt-image-2: 4) - an overflow is a 400 NAMING which elements to drop, raised before any credits are held, never a silent truncation. Elements must be visible in the caller's library (their own, or the active organization's); an unknown or out-of-scope id is a 400.
          items:
            type: string
            format: uuid
          examples: ['5a2f7c58-9e5a-4f1a-9c7f-2f0b6c3d1e42']
    AudioFormat:
      type: string
      description: >-
        Container for the returned audio file. `mp3` is the default and the smallest; `wav` and `flac` are lossless and much larger. The format does not change what the model renders, and it never changes the price.
      enum: [mp3, wav, ogg, flac]
    GenerateAudioRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      properties:
        confirmation_token:
          type: string
          description: >-
            Optional proof that this exact request and price were shown to the customer, from `POST /jobs/cost`. Omit it and nothing changes. Send it and it is verified: an expired, malformed, foreign, or mismatched token is a `422` with `error.code` `confirmation_rejected`.
        model:
          $ref: '#/components/schemas/AudioModel'
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            For TTS this is the text to speak; for music/SFX it is the
            description. On a text-to-speech model it is also what the request
            is BILLED BY: see the endpoint description.

            4000 characters is the most any audio model takes; some take
            fewer, and publish their own ceiling as `audio.max_prompt_chars`
            on GET /models (minimax-music-v2.6 takes 2000). A prompt above the
            model's ceiling is a 400 naming it, before any credit hold.
        voice:
          type: string
          nullable: true
          maxLength: 128
          description: TTS voice id (model-specific).
          examples: ['af_bella']
        speed:
          type: number
          format: double
          nullable: true
          minimum: 0.7
          maximum: 1.3
          description: >-
            Speaking rate as a multiple of the voice's natural pace; 1 is natural. Accepted only on text-to-speech models that publish audio.speed on GET /models (ElevenLabs voices take 0.7 to 1.2, MiniMax and Kokoro 0.7 to 1.3); a model without audio.speed, or a value outside its range, is a 400 naming the model and its range. Does not change the price: text to speech bills per input character. Use it to fit a long narration take before rewriting it.
          examples: [1.1]
        character_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your characters. With no voice, the request speaks with the character's catalog voice (its voice_id, which must be in THIS request model's audio.voices); an explicit voice wins. A character with no voice, a clip voice (text to speech cannot speak a clip, voice cloning is not available), or a voice this model does not publish is a 400. An unknown or foreign id is a 400.
        duration_seconds:
          type: integer
          nullable: true
          deprecated: true
          description: Currently ignored; never forwarded to audio providers.
          minimum: 1
          maximum: 600
        format:
          $ref: '#/components/schemas/AudioFormat'
        tags:
          type: array
          maxItems: 10
          description: Applied to the resulting asset(s); normalized to lowercase.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        project_id:
          type: string
          format: uuid
          description: >-
            Files the generated asset into this project at creation. The project must exist and belong to the caller (400 otherwise). Honored on every auth channel (JWT and PAT), and takes precedence over server-side agent-session attribution.
        preset_slug:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            Slug of the preset this generation was launched from, if any. Set by the web app on preset-launched generations to enable server-side preset→usage attribution (the admin usage panel's top-presets leaderboard); omit on direct API/CLI/MCP/pipeline calls. Stored verbatim and NOT validated against the preset catalog (a preset may be deleted later).
          examples: ['cinematic-portrait']
    AssetUsage:
      type: object
      required: [usage, complete]
      properties:
        usage:
          type: array
          items:
            $ref: '#/components/schemas/AssetUsageEntry'
        complete:
          type: boolean
    AssetUsageEntry:
      type: object
      required: [asset_id, compositions]
      properties:
        asset_id:
          type: string
          format: uuid
        compositions:
          type: array
          description: The user's compositions whose current document references the asset.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              project_id:
                type: string
                format: uuid
                nullable: true
              project_name:
                type: string
                nullable: true
    ProjectAssetUsage:
      type: object
      required: [usage]
      properties:
        usage:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAssetUsageEntry'
    ProjectAssetUsageEntry:
      type: object
      required: [asset_id, compositions]
      properties:
        asset_id:
          type: string
          format: uuid
        compositions:
          type: array
          description: The project's compositions whose current document references the asset.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
    GenerateVideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      properties:
        confirmation_token:
          type: string
          description: >-
            Optional proof that this exact request and price were shown to the customer, from `POST /jobs/cost`. Omit it and nothing changes. Send it and it is verified: an expired, malformed, foreign, or mismatched token is a `422` with `error.code` `confirmation_rejected`.
        model:
          $ref: '#/components/schemas/VideoModel'
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: >-
            Text prompt. On reference-to-video models, address the supplied references as `@Video1`..`@Video3` and `@Image1`..`@Image9`, and optionally use `[0-3s]`-style timeline markers to time actions; these tokens are passed through verbatim (including inside multi-shot `shots[]` prompts).
        negative_prompt:
          description: >-
            What to keep OUT of the clip. Phrase it as the thing itself ("text overlay", "camera shake"), not as an instruction not to do it. Providers differ in how much weight they give it and several ignore it entirely; it never changes the price.
          type: string
          nullable: true
          maxLength: 4000
        image_url:
          type: string
          nullable: true
          format: uri
          description: Required for image-to-video models; ignored for text-to-video.
        end_image_url:
          type: string
          nullable: true
          format: uri
          description: >-
            Final-frame image (https URL) for start+end frame pinning on models that support it (Seedance 2.0 Pro i2v, Seedance 2.5, Seedance 2.0 Fast and Mini, FLUX 3 Video, MiniMax Hailuo 3, MiniMax H3 Max i2v). See `references.end_frame` on `GET /models`, which is authoritative; Kling v3 i2v does not take an end frame. Requires `image_url` (the start frame). Mutually exclusive with `end_image_asset_id`.
        end_image_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your image assets to use as the final frame (server resolves it to a signed URL). Same semantics as `end_image_url`; provide at most one of the two.
        video_asset_ids:
          type: array
          nullable: true
          maxItems: 10
          description: >-
            Reference videos for models with `references.video_refs_max > 0` on `GET /models` (`seedance-2.5`: up to 10; `seedance-2.0-pro-r2v`: up to 3; `minimax-h3` takes none), given as ids of your video assets — the server resolves each to a signed URL and forwards them as the provider's `video_urls`. Address them in the prompt as `@Video1`..`@VideoN` (optionally with `[0-3s]`-style timeline markers). Provider constraints, enforced where asset metadata allows: at most `video_refs_max` videos combined with `video_urls` (never more than 10), MP4/MOV, 50MB total. Seedance 2.5 takes 2–30 seconds combined (extend or edit a clip of up to 30 seconds on its SeeGen omni-reference route); Seedance 2.0 Pro r2v takes 2–15 seconds combined and additionally requires 480p–720p input. This is the recommended way to pass reference videos.


            Pricing: on `flux-3-video`, attaching a reference video selects the provider's video-continuation mode, which it bills well above the text/image rate — such a request is charged the continuation price (120 credits per 5s at `hd`, 150 at `fhd`) rather than the 48/81 published on `GET /pricing/models`, and scales with duration from there. The job's reservation carries the exact amount charged. No other model charges a continuation premium.
          items:
            type: string
            format: uuid
        video_urls:
          type: array
          nullable: true
          maxItems: 10
          description: >-
            Raw https reference-video URLs, for callers that host media outside Nolgia. Counted against the same per-model cap as `video_asset_ids` (`references.video_refs_max`, never more than 10; external URLs cannot be validated for duration/size/resolution server-side — the provider rejects violations). Prefer `video_asset_ids`.
          items:
            type: string
            format: uri
        video_task:
          $ref: '#/components/schemas/VideoTask'
        element_asset_ids:
          type: array
          nullable: true
          maxItems: 9
          description: >-
            Element/reference images for reference-to-video models, given as ids of your image assets — resolved to signed URLs and forwarded as the provider's `image_urls`. Address them in the prompt as `@Image1`..`@Image9`. At most 9 combined with `image_urls`. Images-only requests (no reference video) are allowed and bill at exactly the published reference-to-video credit price, the same as a request carrying a reference video: both execute on the same provider route at the same rate.
          items:
            type: string
            format: uuid
        image_urls:
          type: array
          nullable: true
          maxItems: 9
          description: >-
            Raw https element-image URLs. Counted against the same 9-image cap as `element_asset_ids`. Prefer `element_asset_ids`.
          items:
            type: string
            format: uri
        audio_asset_ids:
          type: array
          nullable: true
          maxItems: 10
          description: >-
            Reference audio tracks for models with `references.audio_refs_max > 0` on `GET /models` (`seedance-2.5`: up to 10 with no per-track ceiling; `minimax-h3`: up to 3, each at most 15 seconds; Seedance 2.0 Pro r2v takes none, its primary route has no reference-audio slot), given as ids of your audio assets — resolved to signed URLs and forwarded as the provider's `audio_urls`. At most `audio_refs_max` combined with `audio_urls` (never more than 10); where the model publishes a per-track ceiling (`references.audio_refs_max_seconds`) it is enforced where the asset's stored duration allows.
          items:
            type: string
            format: uuid
        audio_urls:
          type: array
          nullable: true
          maxItems: 10
          description: >-
            Raw https reference-audio URLs. Counted against the same per-model cap as `audio_asset_ids` (`references.audio_refs_max`, never more than 10). Prefer `audio_asset_ids`.
          items:
            type: string
            format: uri
        reference_voice_ids:
          type: array
          nullable: true
          maxItems: 3
          description: >-
            Preset voices for Grok Imagine 1.5 reference-to-video (models with `references.voice_refs_max > 0` on `GET /models`), each a `voice_id` from xAI's Text-to-Speech roster (for example `eve`, the default; case-insensitive, validated by xAI). Address them in the prompt as `<AUDIO_0>`..`<AUDIO_2>`. These are roster voice selections, NOT uploaded audio — unlike `audio_asset_ids`/`audio_urls`, which take your own audio tracks. At most 3. Reference audio is US-only / trusted-partners on xAI and caps output at 720p, so pairing voices with a 1080p quality tier is rejected. Forwarded upstream as the provider's `reference_audios` `[{voice_id}]`.
          items:
            type: string
            minLength: 1
        bitrate_mode:
          $ref: '#/components/schemas/BitrateMode'
        aspect_ratio:
          $ref: '#/components/schemas/AspectRatio'
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 60
          description: |
            Clip length in seconds. Omit it to let the server pick a duration
            the selected model actually renders: models with a discrete
            duration list (video.durations on GET /models) get the listed
            value nearest the 5s baseline (ties resolve upward, so Veo
            defaults to 6s), ranged models clamp the baseline into
            [min, max], and a request that attaches reference images takes
            the model's element_refs_duration_seconds pin (8s on Veo 3.1).
            An explicit value is validated strictly against the model's
            capabilities — note that 5 itself is not a valid Veo duration, so
            omit the field rather than sending the old baseline. The schema
            deliberately declares no `default`, so generated clients leave
            the field out instead of pinning 5.
        seed:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Reproducibility seed. Only meaningful on models whose provider actually takes one: check `video.seed` on `GET /models`, where `false` means the provider has no seed field and sending one is refused with a 400, and an omitted value means unverified. It is NOT a universal video option — most providers here have no seed in their API at all.
        generate_audio:
          type: boolean
          nullable: true
          description: |
            Ask the model to generate a synchronized audio track
            (dialogue/ambient/SFX).

            What this achieves is decided by the selected model's
            `video.audio` capability on `GET /models`, never by the provider's
            default: on `optional` models the flag is honored and OMITTING it
            resolves to `true`; on `none` models the clip is silent whatever
            you pass; on `always` models audio is native and
            `generate_audio: false` is refused with a 400. The delivered asset
            records the resolved outcome as
            `generation.generate_audio_effective`.
        quality:
          type: string
          nullable: true
          maxLength: 16
          description: >-
            Quality/resolution tier for the selected model (e.g. `720p`, `1080p`, `4k` on Seedance 2.0 Pro and Kling v3). Allowed values and per-tier credit costs are model-specific — see the model's `quality.options` on `GET /models`; the charge scales with clip duration like the base cost. Omit for the model's default tier at its base price. Rejected (400) when the model declares no quality tiers or the value is not one of its options.
          examples: ['4k']
        shots:
          type: array
          nullable: true
          minItems: 1
          maxItems: 8
          description: >-
            Multi-shot sequence: divide the clip into sequential shots, each with its own prompt, duration, and optional sound direction. The server composes a structured multi-shot prompt (the top-level prompt becomes overall style/context direction) and derives the clip duration from the shot durations; if duration_seconds is also set it must equal their sum. Best on Seedance, which cuts between shots natively.
          items:
            $ref: '#/components/schemas/VideoShot'
        tags:
          type: array
          maxItems: 10
          description: Applied to the resulting asset(s); normalized to lowercase.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        project_id:
          type: string
          format: uuid
          description: >-
            Files the generated asset into this project at creation (the async video asset lands in the project when the job completes). The project must exist and belong to the caller (400 otherwise). Honored on every auth channel (JWT and PAT), and takes precedence over server-side agent-session attribution.
        preset_slug:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            Slug of the preset this generation was launched from, if any. Set by the web app on preset-launched generations to enable server-side preset→usage attribution (the admin usage panel's top-presets leaderboard); omit on direct API/CLI/MCP/pipeline calls. Stored verbatim and NOT validated against the preset catalog (a preset may be deleted later).
          examples: ['cinematic-portrait']
        source_video_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Regenerate one of your completed videos at the model's top resolution: the referenced video asset is re-rendered at 2K via the provider's native regeneration flow (models with `video.regeneration` on `GET /models` — MiniMax Hailuo 3's 768P→2K Video Regeneration). The source asset must have been generated by the same model and have a recorded duration; the output re-renders the full clip, so `duration_seconds`, `shots`, and `aspect_ratio` must be omitted (length and geometry follow the source) and `quality` must be omitted or `2k`. Reference videos (`video_asset_ids`/`video_urls`) cannot be combined with it. `prompt` should re-state the source generation's prompt (see the asset's `prompt` field). Billing covers the 2K output seconds PLUS the source clip's own input seconds at the 2k tier rate — e.g. a 5s source charges 130 credits (65cr/5s × 10 billed seconds).
          examples: ['b2fbb51e-3c33-4a54-b87b-9c2b1e4f9a11']
        character_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your characters (`GET /characters`). The character's `primary_reference_asset_id` is attached as an element reference (appended after any `element_asset_ids`/`image_urls`, so it takes the next `@Image` slot in the prompt) and its `canonical_description` rides into the prompt verbatim, keeping the character consistent between a still and a clip. The character must belong to the caller - an unknown or foreign id is a 400. Requires a model with room for one more element reference (`references.element_refs_max` on `GET /models`); a model that cannot carry the character reference is a 400, never a silent drop. The delivered clip is subject to the Aura ArcFace identity gate: frames sampled at 2fps are scored against the character's primary reference, the clip's `identity_score` is the best frame's cosine, and a clip under the 0.60 gate re-rolls automatically EXACTLY ONCE with the better attempt delivered either way (`identity_score` / `identity_gate_passed` / `identity_rerolls` on the video asset). When the scoring runtime is unavailable the clip delivers ungated with those fields null - the reference still conditioned the render. A character with no reference image contributes its description only; that clip is unscored. `character_id` is the single-member sugar for `character_ids`.
          examples: ['5a2f7c58-9e5a-4f1a-9c7f-2f0b6c3d1e42']
        use_character_voice:
          type: boolean
          nullable: true
          description: >-
            Attaches the lead character's (character_id, or the first of character_ids) voice clip as a reference audio track (audio_asset_ids, emitted after your own audio tracks and audio_urls, taking the next @Audio slot) and adds a voice line to the prompt. Only on models with references.audio_refs_max > 0. Refused with a 400 when the model cannot take it, when there is no room, when the clip is longer than references.audio_refs_max_seconds, when the character has no clip voice, or without a character. Never applied unless set: it can change the output and the cost (a model billed on the voice track's length bills the clip's length).
        character_ids:
          type: array
          nullable: true
          maxItems: 4
          description: >-
            An ORDERED cast of up to 4 of your characters rendered together in one clip. Each member's primary reference is attached as an element reference in cast order (appended after any `element_asset_ids`/`image_urls`/`element_ids` references, so the caller's own `@Image` slots never move), and each member's `canonical_description` rides into the prompt verbatim as a "Cast:" block that names the member against its slot ("@Image3 is Nova: ..."); a `@Name` mention in the prompt is rewritten to that member's `@ImageN` slot. A member whose primary reference the caller already attached through `element_asset_ids` reuses that slot instead of being attached twice. The whole cast must fit `references.element_refs_max` on `GET /models` - a cast the model has no room for is a 400 naming the cap, never a silent drop. A member listed twice, more than 4 members, or a foreign id is a 400. `character_id` may be passed alongside as sugar for a one-member cast; when both are present, `character_id` must be one of the members. The delivered clip is scored against EVERY member (frames at 2fps, each member matched to its best-matching face): the asset's `identity_score` is the weakest member's clip score, a clip where any member misses the 0.60 gate re-rolls automatically exactly once, and `character_scores` records each member's own clip score.
          items:
            type: string
            format: uuid
          examples: [['5a2f7c58-9e5a-4f1a-9c7f-2f0b6c3d1e42', 'b2fbb51e-3c33-4a54-b87b-9c2b1e4f9a11']]
        location_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your locations (`GET /locations`): the place this clip is set in. The location's `primary_reference_asset_id` is attached as an element reference (appended after any `element_asset_ids`/`image_urls` and after the `character_id` reference, so it takes the next `@Image` slot) and its `canonical_description` rides into the prompt verbatim after the character's, keeping the place consistent between a still and a clip. Its own additive field beside `character_id`. The location must belong to the caller - an unknown or foreign id is a 400. Requires a model with room for one more element reference (`references.element_refs_max` on `GET /models`); a model that cannot carry it is a 400 NAMING location_id, never a silent drop. A location with no reference image contributes its description only. Not identity-scored (the Aura gate scores faces, not places).
        brand_kit_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your brand kits (`GET /brand-kits`). When omitted, the kit linked to the generation's project applies: the explicit `project_id`, or the active agent session's project. The kit's logo rides as a reference only where the model has a spare slot; it never displaces a reference you, a character, a location or an element attached, and is skipped on lanes where a reference changes what the request means. Only lanes with optional element image references, no required video or reference duration, and a supported logo MIME type attach it; edit and extend tasks do not. Regeneration with `source_video_asset_id` refuses an explicit kit and skips an implied project kit. The compact brand block (palette names and hex, font names, never-rules) is appended after your own words, which are never replaced. Whether the logo rode is recorded as `brand_logo_attached` in the asset's generation metadata.
        brand_kit_mode:
          $ref: '#/components/schemas/BrandKitMode'
        product_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your products (`GET /products`): the product this clip shows. Up to three of its images, primary first, are attached as element references (after any `element_asset_ids`/`image_urls`, the character's and the location's references, so they take the next `@Image` slots) within the model's remaining `references.element_refs_max` budget, and its `canonical_description` rides into the prompt verbatim after the character's and the location's. The product must belong to the caller - an unknown or foreign id is a 400. A model that cannot carry the primary image is a 400 NAMING product_id, never a silent drop. Cannot be combined with `source_video_asset_id` (a regeneration composes no new shot). A product with no image contributes its description only.
        style_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your saved styles (`GET /styles`). Its prompt fragment is appended after your own words, which are never replaced, and its swatch (first reference image) rides as one element reference after every reference you, a character, a location or a product attached, only within the model's remaining `references.element_refs_max` budget. The swatch rides ONLY when the clip already carries something to style (your own `element_asset_ids` or `image_urls`, a start or end frame, a reference video, or a character, location or product reference). On a clip with no other visual input the style contributes its prompt fragment alone, because a reference-to-video model reads a lone swatch as the content and renders the swatch instead of your scene: a style is a look, not a subject. A swatch that does not fit the budget, and a model that takes no references, likewise leave the fragment alone. An unknown or foreign id is a 400. Cannot be combined with `source_video_asset_id` (a regeneration composes no new shot). The job's persisted params and the asset's generation metadata echo `style_id`. When omitted, the project the output is filed into (explicit `project_id` or the session's project) contributes its pinned style key; pass `style_id` to override it for one generation. Regeneration with `source_video_asset_id` skips the project's pinned style.
        element_ids:
          type: array
          nullable: true
          maxItems: 9
          description: >-
            Registry elements (`GET /elements`) to condition this clip: each element's reference images are appended to the element-reference slots (before any `character_id` reference, which stays appended last) and its `canonical_description` rides into the prompt verbatim with the binding clause ("100% matches the reference") - the belt-and-braces continuity stack. A character id is accepted here too and injects exactly what `character_id` would; naming the SAME character in both fields is a 400. All injected references count against `references.element_refs_max` on `GET /models` (minimax-h3: 9, Seedance: 9) - an overflow is a 400 NAMING which elements to drop, raised before any credits are held, never a silent truncation. On the Seedance 2.0 text-to-video and image-to-video entries an element-carrying request silently dispatches on the reference-to-video route's reference twin (the only Seedance 2.0 route that executes image references); a start/end frame is passed through with it (if the provider rejects that combination, the error surfaces as the usual provider 400). `seedance-2.5`, `seedance-2.0-fast` and `seedance-2.0-mini` take up to 9 element images on their own direct routes. Elements must be visible in the caller's library (their own, or the active organization's); an unknown or out-of-scope id is a 400. Cannot be combined with `source_video_asset_id` (a regeneration re-renders existing footage; there is nothing for an element to condition).
          items:
            type: string
            format: uuid
        motion_id:
          type: string
          nullable: true
          maxLength: 64
          description: >-
            A camera move from the library on `GET /motions` (for example `push-in`, `orbit-left`, `crane-up`, `rack-focus`). The server APPENDS the move's prompt fragment at the chosen strength to the prompt as its own sentence; the prompt is never replaced or shortened, and a prompt that already carries the exact fragment (an enhanced prompt that kept the move) is left as it is. Works on every video model, text-to-video and image-to-video alike, and with `shots[]` (the fragment rides the overall direction). An unknown id is a 400 naming the library. Recorded on the job as `motion_id` / `motion_strength`.
          examples: ['push-in']
        motion_strength:
          $ref: '#/components/schemas/CameraMoveStrength'
    VideoShot:
      type: object
      additionalProperties: false
      required: [prompt, duration_seconds]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 15
        audio:
          type: string
          nullable: true
          maxLength: 500
          description: Sound-design direction for this shot (written into the composed prompt).
    Generate3DModel:
      type: string
      enum: [hunyuan3d-v3, trellis]
    Generate3DRequest:
      type: object
      additionalProperties: false
      properties:
        confirmation_token:
          type: string
          description: >-
            Optional proof that this exact request and price were shown to the customer, from `POST /jobs/cost`. Omit it and nothing changes. Send it and it is verified: an expired, malformed, foreign, or mismatched token is a `422` with `error.code` `confirmation_rejected`.
        model:
          allOf:
            - $ref: '#/components/schemas/Generate3DModel'
          description: Defaults to hunyuan3d-v3 when both model and quality are omitted.
        quality:
          type: string
          enum: [draft, standard]
          x-enum-varnames: [Generate3DRequestQualityDraft, Generate3DRequestQualityStandard]
          description: Draft selects trellis; standard selects hunyuan3d-v3. A value that contradicts an explicit model returns 400.
        image_asset_ids:
          type: array
          minItems: 1
          maxItems: 4
          description: Your image assets in front, back, left, right order. Trellis takes exactly one. Supply exactly one of image_asset_ids and image_url.
          items:
            type: string
            format: uuid
        image_url:
          type: string
          format: uri
          description: Hosted HTTPS front image. Supply exactly one of image_asset_ids and image_url.
        texture:
          type: boolean
          description: Defaults to true. False creates an untextured white model and is available only with hunyuan3d-v3.
        pbr:
          type: boolean
          description: Defaults to false. PBR materials require hunyuan3d-v3 with textures enabled.
        tags:
          type: array
          maxItems: 10
          description: Applied to the 3D asset; normalized to lowercase.
          items:
            type: string
            minLength: 1
            maxLength: 40
        project_id:
          type: string
          format: uuid
          description: >-
            Files the 3D asset into this project when the job completes. The project must exist and belong to the caller (400 otherwise).
        preset_slug:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            Slug of the preset this generation was launched from, if any. Same semantics as on `POST /generate/video`.
    RestoreVideoRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          $ref: '#/components/schemas/RestoreVideoModel'
        source_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your video assets to restore (the server resolves it to a signed URL). Exactly one of `source_asset_id` and `source_url` is required. When the asset's stored metadata carries a duration, billing uses it and `duration_seconds` is ignored.
        source_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Raw https URL of the footage to restore, for callers that host media outside Nolgia. Exactly one of `source_asset_id` and `source_url` is required. `duration_seconds` is required with a raw URL (the server cannot measure external media). Prefer `source_asset_id`.
        quality:
          type: string
          nullable: true
          maxLength: 16
          description: >-
            Target output resolution tier (`720p`, `1080p`, `1440p`, `2160p`, and `4320p` on the Topaz engines that support 8K). Omit for the model's default, which is `1080p` on every restore-lane model. The tiers are per-model: allowed values and per-tier credit rates are on the model's `quality.options` on `GET /models`, and a tier the selected model does not publish is rejected (400). The charge scales with the source clip length like a generation's does.
          examples: ['2160p']
        noise_scale:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: >-
            Detail-injection strength on `seedvr2-restore` (the provider's `noise_scale`; omit for the provider default, 0.1). Higher values recover more texture but hallucinate more; keep low for archival fidelity. The Topaz engines expose no equivalent control — the engine choice and the resolution tier are the whole input — so sending this field with a `topaz-*` model is rejected (400) rather than accepted and dropped.
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 120
          description: |
            Source clip length in seconds (round up), used to compute the
            credit charge before the job runs. Required when the source is a
            raw `source_url` or an asset without stored duration metadata;
            when the asset's stored duration is known the server bills from
            that instead and this field is ignored.
        source_fps:
          type: integer
          nullable: true
          minimum: 1
          maximum: 60
          description: >-
            Source frame rate. The provider bills per output frame, so the charge scales with the source's frame rate as well as its length: the published per-tier rates price 30 fps, and a higher declared rate scales the charge proportionally (60 fps costs twice a 30 fps clip of the same length). Values at or below 30 are billed at the 30 fps basis, so declaring a slower rate never buys a discount. Footage above 60 fps is not supported (400) — downsample it before restoring.

            **Required on the `topaz-*` engines** (400 when omitted): their rates price the 30 fps basis exactly, and the server cannot measure a source clip's true frame rate, so the lane refuses to guess rather than under-reserve a 60 fps restore. Optional on `seedvr2-restore`, whose rates carry the headroom to absorb an undeclared faster source; omit it there for footage at or below 30 fps.
        source_width:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Source frame width in pixels. Send with `source_height`.
          examples: [1080]
        source_height:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Source frame height in pixels. Send with `source_width`.

            The restored output KEEPS THE SOURCE'S ASPECT RATIO: the quality
            tier names a resolution class, and the class is resolved against
            these dimensions rather than a fixed 16:9 frame, so a 1080x1920
            vertical clip restored at `2160p` comes back 2160x3840 and a
            1440x1080 4:3 clip comes back 2880x2160. The output never exceeds
            the tier's nominal pixel area.

            **Required on the `topaz-*` engines** (400 when omitted) unless the
            source is an asset whose stored metadata already carries them. The
            server cannot measure an external clip's geometry, and guessing
            16:9 would both reshape footage that was never 16:9 and misprice
            the job — those engines run over the SOURCE's frames, so the charge
            tracks the source geometry as well as the output tier. Declared
            values win over an asset's stored metadata.

            Topaz sources are capped at DCI 4K (4096x2160 pixels); a larger
            master is rejected (400) rather than restored at a rate that does
            not cover it. Not used by `seedvr2-restore`, which resolves its
            own output geometry from the footage.
          examples: [1920]
        seed:
          type: integer
          nullable: true
          minimum: 0
        tags:
          type: array
          maxItems: 10
          description: Applied to the restored asset; normalized to lowercase.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['restored', 'archive']]
        project_id:
          type: string
          format: uuid
          description: >-
            Files the restored asset into this project at creation (the async asset lands in the project when the job completes). The project must exist and belong to the caller (400 otherwise).
        preset_slug:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            Slug of the preset this restoration was launched from, if any. Same semantics as on `POST /generate/video`.
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
      x-enum-varnames: [JobStatusQueued, JobStatusRunning, JobStatusSucceeded, JobStatusFailed, JobStatusCanceled]
    Job:
      type: object
      additionalProperties: false
      required: [id, user_id, modality, model, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        modality:
          $ref: '#/components/schemas/Modality'
        model:
          type: string
          examples: ['kling-v3-t2v']
        status:
          $ref: '#/components/schemas/JobStatus'
        status_detail:
          type: string
          nullable: true
          description: >-
            Machine-readable refinement of a non-terminal status. "provider_down" marks a queued job parked because its model provider is temporarily unavailable; the job resumes automatically when the provider recovers. "upstream_at_capacity" marks a queued job waiting for a free slot because the provider is at its ceiling for simultaneous generations; the provider is healthy and the job submits automatically as in-flight renders finish. Both are non-terminal and neither is an error: the job is still going to run, and the credit hold is not settled while it waits. Treat any unrecognized value as a plain queued job.
          examples: ['provider_down', 'upstream_at_capacity']
        status_message:
          type: string
          nullable: true
          description: >-
            Human-readable companion to status_detail, safe to render to the customer as-is.
        fal_request_id:
          type: string
          nullable: true
        agent_session_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The chat session whose agent turn caused this job (`jobs.agent_session_id`, stamped at submit). Null for jobs not created inside an agent turn and for jobs predating this attribution. Lets a client group a session's generations without inferring ownership from the account-wide feed.

        asset:
          oneOf:
            - $ref: '#/components/schemas/Asset'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
        failure:
          $ref: '#/components/schemas/JobFailure'
        progress:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          nullable: true
          format: date-time
    JobFailure:
      type: object
      additionalProperties: false
      required: [kind, message]
      description: >-
        Typed reason a job failed. Present only when `status` is `failed`, alongside `error` (which is unchanged). `status` stays `failed` for every failure, including a content-filter refusal, so clients that read only `status` keep working; branch on `kind` for the reason.
      properties:
        code:
          $ref: '#/components/schemas/GenerationErrorCode'
          description: >-
            Stable refinement of `kind`, present on every job that failed after this field shipped and derived from the recorded reason for older ones. `kind: moderated` narrows to `prompt_nsfw` or `ip_detected`; `kind: error` narrows to `timeout` or `job_failed`. Branch on `code` when you need the distinction and on `kind` when you do not.
        kind:
          type: string
          description: >-
            What stopped the job. `moderated`: a provider's content filter refused the request or blocked the result it generated (safety systems, real-person likeness and protected-work checks); editing the prompt or the reference media, or switching models, is the fix. `error`: any other failure. This is an open set: treat any value you do not recognize as `error`.
          examples: ['moderated', 'error']
        message:
          type: string
          description: >-
            Human-readable reason, safe to show the customer as-is. The same text as `error.detail`.
        credits_refunded:
          type: boolean
          nullable: true
          description: >-
            What the credit ledger actually did with this job's credit hold, recorded when the hold settled. `true`: the hold was released and the job cost nothing. `false`: the hold was consumed and the credits were charged (a content-filter refusal the provider billed for is charged; one the provider did not bill for is refunded). Absent or null when there is no ledger outcome to report: the job took no hold, the hold is still settling (`GET /jobs/{id}/wait` waits a few seconds for it), or the job failed before this field existed. Never read an absent value as "no charge".
    JobPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer
          description: Total number of jobs matching the status/modality filter, ignoring pagination.
    AssetOriginal:
      type: object
      additionalProperties: false
      required: [mime_type, size_bytes]
      description: >
        The provider's own file for a video the platform re-encoded for playback. Some models deliver video that browsers cannot all decode (HEVC 10-bit from Seedance 2.5 at 1080p, Seedance 2.0 Pro at 4K and the Topaz restore models; VP9 in an MP4). For those the asset's `signed_url` is an 8-bit H.264 MP4 that every browser and editor plays, and this is the full-quality original. Fetch it with `GET /assets/{id}?variant=original`. Absent for every other asset.

      properties:
        mime_type:
          type: string
          examples: ['video/mp4']
        size_bytes:
          type: integer
          format: int64
        video_codec:
          type: string
          description: The original's video codec as ffmpeg names it.
          examples: ['hevc']
        pix_fmt:
          type: string
          description: The original's pixel format; `yuv420p10le` is 10-bit.
          examples: ['yuv420p10le']
    Asset:
      type: object
      additionalProperties: false
      required: [id, user_id, modality, model, signed_url, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this asset belongs to. Omitted for a personal asset. In organization context every teammate sees the asset; `user_id` still names who created it.

        modality:
          $ref: '#/components/schemas/Modality'
        model:
          type: string
        agent_session_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The chat session that produced this asset — the generating job's `agent_session_id`, or the agent upload's `metadata.agent_session_id` for job-less uploads. Null when the asset carries no session attribution. Populated on list responses (`GET /assets`) so a client can group a session's media directly instead of inferring it.

        display_name:
          type: string
          maxLength: 200
          description: >
            Human-readable display name. Always present in responses; empty string when unset. Set it at upload time from `filename`, on either upload route (`POST /assets` and `POST /assets/uploads`), or later via `PATCH /assets/{id}`.

          examples: ['Hero shot v2']
        prompt:
          type: string
          nullable: true
          description: >
            The prompt as the customer submitted it. On image generations this is the primary prompt field: when the server enhanced the prompt before rendering (the Aura realism layer, a character or element description folded in), the customer's own words stay here and the composed text is in `enhanced_prompt`. Video and audio assets carry the prompt as dispatched.

        enhanced_prompt:
          type: string
          nullable: true
          description: >
            Image generations only: the server-composed prompt that was actually rendered, present only when it differs from `prompt` (the Aura layer enhanced the prompt, or a character's or element's canonical description was folded in). Null or absent when the render used the customer's prompt verbatim, on video and audio assets, and on assets generated before this field existed. Lets a client show the enhanced prompt next to the customer's own.

          examples: ['a red fox in tall grass at golden hour, RENARD: a slender red fox with a white-tipped tail, shallow depth of field']
        signed_url:
          type: string
          format: uri
          description: >-
            Time-limited GCS signed URL for download. Stable for about an hour: every read of the same asset inside the same clock hour returns the identical URL, so clients may cache the media it points to and reuse it across list refreshes. The URL always has at least an hour of validity left; `expires_at` reports the exact expiry.
          examples: ['https://storage.googleapis.com/nolgia-generations-prod/u/abc/img/xyz.png?X-Goog-Signature=...']
        expires_at:
          type: string
          format: date-time
          description: Expiry of `signed_url`.
        mime_type:
          type: string
          examples: ['image/png']
        size_bytes:
          type: integer
          nullable: true
          minimum: 0
        width:
          type: integer
          nullable: true
          minimum: 1
        height:
          type: integer
          nullable: true
          minimum: 1
        duration_seconds:
          type: number
          nullable: true
          minimum: 0
          description: >
            Media duration in seconds for video/audio assets. Recorded at creation time for generated videos and backfilled asynchronously (ffprobe) for uploaded/legacy assets; null until known.

        has_audio:
          type: boolean
          nullable: true
          description: >
            Whether the asset's media carries an audio stream. `true` for audio assets and for video/audio media with an audio track; `false` for images and for video definitively without audio; `null`/absent when not yet probed (legacy/uploaded media awaiting the async media sweep) or not applicable. Recorded at creation for audio (`true`) and image (`false`) assets; video is determined by the sweep (ffprobe).

        original:
          $ref: '#/components/schemas/AssetOriginal'
        waveform_peaks:
          type: array
          nullable: true
          description: >
            Downsampled, peak-normalized amplitude envelope of the asset's audio for client-side waveform rendering. Each value is the RMS amplitude of one contiguous window, normalized so the loudest window is `1.0` and rounded to 3 decimals; up to ~400 points for a full-length clip (fewer for very short clips). Present only for audio-bearing assets once the media sweep has computed it (ffmpeg PCM decode); `null` for assets with no audio or not yet probed. Populated on every asset read that carries it (list and single-asset).

          items:
            type: number
            minimum: 0
            maximum: 1
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Time-limited signed URL for a server-generated thumbnail (image downscale or video poster frame). Null when the asset has no thumbnail. Stable for about an hour like `signed_url`, so the thumbnail bytes are cacheable client-side across list refreshes.
        tags:
          type: array
          maxItems: 10
          description: Free-form lowercase tags attached to the asset.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        status:
          $ref: '#/components/schemas/AssetStatus'
        favorite:
          type: boolean
          description: >
            User-curated favorite flag. Always present in responses; defaults to false. Set it via `PATCH /assets/{id}` and filter listings with `GET /assets?favorite=true`.

        projects:
          type: array
          description: >
            The asset's project memberships, newest membership first. Only returned by `GET /assets/{id}` (always present there, `[]` when the asset belongs to no project); omitted from list responses.

          items:
            $ref: '#/components/schemas/AssetProjectRef'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the asset was moved to the trash (soft-deleted). Omitted for live assets; only trash listings (`GET /assets?trashed=true`) return trashed assets. Trashed assets are purged permanently 30 days after this timestamp.

        mirrors:
          type: array
          description: >
            Bring-your-own storage mirror state per organization storage connection (Enterprise). Only returned by `GET /assets/{id}` for assets in an organization library with at least one connection; omitted otherwise.

          items:
            $ref: '#/components/schemas/AssetMirror'
        identity_score:
          type: number
          nullable: true
          minimum: -1
          maximum: 1
          description: >
            ArcFace-family cosine similarity against the generation's identity reference (Aura identity gate). On image assets generated with a `face_reference_asset_id`, the render's dominant face scored against that reference; on video assets generated with a `character_id`, the best frame sampled at 2fps scored against the character's primary reference. Both lanes gate delivery at >= 0.60 with one automatic re-roll. Absent when no identity reference rode the generation, when no consent to the face check was recorded for the reference photo (see `Character.face_check`), or when scoring was unavailable.

          examples: [0.81]
        identity_rerolls:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1
          description: >
            Number of completed automatic identity re-rolls behind this render (0 or 1 — the gate re-rolls at most once, then delivers the better-scoring attempt). Present only alongside `identity_score`.

        identity_gate_passed:
          type: boolean
          nullable: true
          description: >
            Whether `identity_score` clears the 0.60 identity gate. A render can be delivered with `false` when both the original and the one automatic re-roll scored under the gate (the better attempt is delivered and labeled). Present only alongside `identity_score`.

        character_scores:
          type: array
          nullable: true
          description: >
            Per-character identity outcome of a multi-character cast render (`character_ids`), in cast order: each member's own ArcFace-family cosine (its best-matching face in the render, or the best frame of a clip) and whether it clears the 0.60 gate. `identity_score` is the weakest member's score. Absent when the generation carried no cast or scoring was unavailable.

          items:
            $ref: '#/components/schemas/AssetCharacterScore'
        created_at:
          type: string
          format: date-time
    AssetCharacterScore:
      type: object
      additionalProperties: false
      required: [character_id, identity_score, identity_gate_passed]
      properties:
        character_id:
          type: string
          format: uuid
          description: The cast member (`GET /characters/{id}`).
        identity_score:
          type: number
          minimum: -1
          maximum: 1
          description: This member's cosine against the delivered render.
          examples: [0.74]
        identity_gate_passed:
          type: boolean
          description: Whether this member clears the 0.60 identity gate.
    AssetProjectRef:
      type: object
      additionalProperties: false
      required: [id, name, is_default]
      description: A project an asset belongs to.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: ['Launch teaser']
        is_default:
          type: boolean
          description: True when this is the user's default "Library" project.
    AssetPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer
          format: int64
          description: Total number of assets matching the request's filters across all pages.
    UpdateAssetRequest:
      type: object
      additionalProperties: false
      description: >
        Partial asset update. All fields are optional but at least one must be provided; omitted fields are left unchanged.

      properties:
        tags:
          type: array
          maxItems: 10
          description: Replaces the asset's full tag set. Tags are trimmed, lowercased, and de-duplicated.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        display_name:
          type: string
          maxLength: 200
          description: >
            Replaces the asset's display name (trimmed). An empty string clears it.

          examples: ['Hero shot v2']
        prompt:
          type: string
          maxLength: 4000
          description: >
            Overwrites the asset's prompt. Intended for backfilling provenance on uploaded assets (e.g. recording the prompt a file was generated from elsewhere).

        metadata:
          type: object
          description: >
            Merged into the asset's existing metadata object (existing keys not present in the patch are kept; patch keys overwrite). At most 16 KiB serialized.

        favorite:
          type: boolean
          description: Sets (true) or clears (false) the asset's favorite flag.
    Character:
      type: object
      additionalProperties: false
      required: [id, user_id, name, description, reference_assets, created_at, updated_at]
      description: User-owned reusable subject for image/video generation.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this character belongs to. Omitted for a personal character.

        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Captain Nova']
        description:
          type: string
          maxLength: 2000
          examples: ['A silver-haired astronaut with a scarred left cheek and a teal flight suit.']
        canonical_description:
          type: string
          maxLength: 2000
          description: |
            The character's canonical written description - the asset bible
            entry (face, hair, build, wardrobe, anchor) reused VERBATIM by
            every downstream generation. This is the continuity contract:
            downstream prompts must fold it in unchanged, never paraphrased.
            Falls back to `description` when the record predates this field.
            Optional in the schema only so existing clients keep parsing; the
            API always sends it (empty string when never set).
        primary_reference_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The reference asset that anchors the character's identity: sheet
            actions attach it as the character reference and identity scoring
            runs against it. Defaults to the first reference asset when unset.
        reference_assets:
          type: array
          maxItems: 8
          description: Reference images (image assets) in display order, each with a fresh signed URL.
          items:
            $ref: '#/components/schemas/Asset'
        motion_reference_assets:
          type: array
          maxItems: 3
          description: |
            Motion reference clips (video assets, display order, fresh signed
            URLs): short walking or gesture footage of the subject. A video
            generation that casts this character on a model with
            `references.video_refs_max > 0` attaches these clips as reference
            videos (`video_asset_ids`) up to the model's cap, so later
            generations carry the subject's motion and body, not only the
            face. Optional in the schema only so existing clients keep
            parsing; the API always sends it (empty when none).
          items:
            $ref: '#/components/schemas/Asset'
        wardrobe:
          type: array
          maxItems: 12
          description: |
            Named outfits stored on the character (the wardrobe sheet): each
            carries up to 3 exact-garment reference images and costume notes.
            A sheet generation picks one by name (`outfit` on
            `POST /characters/{id}/sheets`) and its references ride as
            `wearable_reference_asset_ids`. Always sent (empty when none).
          items:
            $ref: '#/components/schemas/CharacterWardrobeOutfit'
        voice:
          $ref: '#/components/schemas/CharacterVoice'
          description: Used by POST /generate/audio (character_id) and by video generation with use_character_voice true; absent when the character has no voice.
        preferred_models:
          $ref: '#/components/schemas/CharacterPreferredModels'
          description: Optional in the schema only so existing clients keep parsing; the API always sends it, with null fields when unset.
        readiness:
          type: string
          description: |
            Whether the character's PRIMARY reference can anchor its identity,
            derived from the face verdict stored when the
            reference joined the character. One of `ready`,
            `needs_front_view`, `no_face`, `multiple_faces`, `unverified`
            (a closed set, not declared as an enum so its `ready` value does
            not rename generated `AssetStatus` constants): `ready` (exactly one face,
            presented front-on), `needs_front_view` (one face, turned away
            or in profile), `no_face` (no face detected, or no references at
            all), `multiple_faces` (a group shot), `unverified` (the primary
            has no verdict yet: saved before verdicts existed, no consent to
            the face check is recorded for it (see `face_check`), or the
            check could not run). Advisory: a save is never refused on it, but a
            render cast on a character that is not `ready` is likely to
            fail the identity gate. Always sent.
        reference_verdicts:
          type: array
          maxItems: 8
          description: |
            The stored face verdict of every CHECKED reference image, in
            display order (a reference the detector has not seen yet is
            absent). Always sent (empty when none checked).
          items:
            $ref: '#/components/schemas/CharacterReferenceVerdict'
        fidelity_history:
          type: array
          maxItems: 10
          description: |
            The character's most recent identity-gated renders, newest
            first: the `identity_score` the Aura gate measured against the
            primary reference on each image or video generated with this
            `character_id`. Only `GET /characters/{id}` carries it; the list
            and write responses omit it.
          items:
            $ref: '#/components/schemas/CharacterFidelitySample'
        face_check:
          $ref: '#/components/schemas/CharacterFaceCheck'
          description: >-
            Whether the face identity check runs for this character and whether any of its photos still needs consent. Optional in the schema only so existing clients keep parsing; the API always sends it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CharacterFaceCheck:
      type: object
      additionalProperties: false
      required: [enabled, needs_consent, consented_asset_ids]
      description: |
        Consent to the face identity check for a character's reference
        photos. The check compares the faces in images and videos cast on
        the character against its primary reference photo (ArcFace-family
        embeddings computed and discarded in memory on NOLGIA's own
        servers, a 0.60 gate, one automatic re-roll, video sampled at 2
        frames per second) and, when a photo joins the character, judges
        whether the photo shows one clear, front-facing face. It runs ONLY
        on photos whose consent is recorded. Consent is recorded per photo
        (the same photo on another character, or a duplicate, is covered
        too) with who gave it, when and the wording version. A photo
        without consent still rides every generation as a reference; it is
        simply never face-compared and no `identity_score` is stored.
      properties:
        enabled:
          type: boolean
          description: True when consent covers the primary reference photo, so renders cast on this character are face-checked.
        needs_consent:
          type: boolean
          description: |
            True when at least one reference photo has never been consented
            (a photo whose consent was withdrawn does not count: that was the
            user's choice). Clients show the consent prompt; generation is
            never blocked on it.
        consented_asset_ids:
          type: array
          maxItems: 8
          description: The reference photos currently covered by consent.
          items:
            type: string
            format: uuid
        consented_at:
          type: string
          format: date-time
          nullable: true
          description: When the most recent active consent among the photos was given.
        consent_version:
          type: string
          nullable: true
          description: The consent wording version of that most recent consent.
          examples: ['2026-09-23']
    CharacterReferenceVerdict:
      type: object
      additionalProperties: false
      required: [asset_id, face_count, quality, frontal, is_primary_ok]
      description: |
        What the in-process face detector found in one character reference
        image. Counts and a rounded quality figure only; face
        geometry never leaves the process.
      properties:
        asset_id:
          type: string
          format: uuid
        face_count:
          type: integer
          minimum: 0
          description: Confident, non-overlapping face detections in the image.
        quality:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Detector confidence of the dominant face, scaled down when the
            face is small relative to the frame. 0 when no face is detected.
          examples: [0.92]
        frontal:
          type: boolean
          description: Whether the dominant face is presented front-on (false in profile, three-quarter or back view).
        is_primary_ok:
          type: boolean
          description: |
            Whether this reference can anchor the character's identity:
            exactly one face, presented front-on. The primary reference's
            value decides `readiness`.
    CharacterFidelitySample:
      type: object
      additionalProperties: false
      required: [asset_id, modality, identity_score, created_at]
      description: One identity-gated render attributed to a character.
      properties:
        asset_id:
          type: string
          format: uuid
        modality:
          type: string
          description: '`image` or `video`.'
          examples: [image]
        identity_score:
          type: number
          minimum: -1
          maximum: 1
          description: The render's ArcFace-family cosine against the character's primary reference (see `Asset.identity_score`).
          examples: [0.81]
        identity_gate_passed:
          type: boolean
          nullable: true
          description: Whether the score cleared the 0.60 gate.
        created_at:
          type: string
          format: date-time
    CharacterVoiceKind:
      type: string
      enum: [catalog, clip]
      x-enum-varnames: [CharacterVoiceKindCatalog, CharacterVoiceKindClip]
      description: |
        `catalog`: a voice from a text to speech model's published voice list
        (`audio.voices` on `GET /models`). `clip`: one of your own audio assets,
        3 to 30 seconds, used as a reference audio track on video models that
        take reference audio.
    CharacterVoiceInput:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        A catalog voice requires non-empty, trimmed `tts_model` and `voice_id`.
        The model must be a visible audio model with a published `audio.voices`
        list on `GET /models`, and the voice id must appear in that list.
        `clip_asset_id` must be absent; `speaker_consent` is not stored.
        A clip voice requires `clip_asset_id`, one of your audio assets that
        is not uploading and has a recorded duration of 3 to 30 seconds
        (inclusive). `tts_model` and `voice_id` must be absent, and
        `speaker_consent` must be true; the consent time is stored in UTC.
        Optional `language` is trimmed and, when non-empty, must match
        `^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8}){0,3}$`, such as en or en-US.
      properties:
        kind:
          $ref: '#/components/schemas/CharacterVoiceKind'
        tts_model:
          type: string
          nullable: true
          maxLength: 128
          description: Catalog only, an audio model id with a published voice list.
        voice_id:
          type: string
          nullable: true
          maxLength: 128
          description: Catalog only, one of that model's audio.voices ids.
        clip_asset_id:
          type: string
          format: uuid
          nullable: true
          description: Clip only, one of your audio assets, 3 to 30 seconds.
        language:
          type: string
          nullable: true
          maxLength: 35
          description: Optional BCP 47 language tag such as en or en-US, what the character speaks.
        speaker_consent:
          type: boolean
          nullable: true
          description: 'Clip only and REQUIRED true: "this is my voice, or I have the speaker''s permission". Stored with the voice (consented_at).'
    CharacterVoice:
      type: object
      additionalProperties: false
      required: [kind]
      description: |
        The character's stored catalog or clip voice. Catalog voices include
        the published voice label when available. Clip voices include speaker
        consent and its timestamp, and a freshly signed clip asset when the
        asset still exists. Deleting the asset does not remove the stored voice.
      properties:
        kind:
          $ref: '#/components/schemas/CharacterVoiceKind'
        tts_model:
          type: string
          nullable: true
          maxLength: 128
          description: Catalog only, an audio model id with a published voice list.
        voice_id:
          type: string
          nullable: true
          maxLength: 128
          description: Catalog only, one of that model's audio.voices ids.
        clip_asset_id:
          type: string
          format: uuid
          nullable: true
          description: Clip only, one of your audio assets, 3 to 30 seconds.
        language:
          type: string
          nullable: true
          maxLength: 35
          description: Optional BCP 47 language tag such as en or en-US, what the character speaks.
        speaker_consent:
          type: boolean
          nullable: true
          description: 'Clip only and REQUIRED true: "this is my voice, or I have the speaker''s permission". Stored with the voice (consented_at).'
        voice_label:
          type: string
          nullable: true
          readOnly: true
          description: The catalog voice's label from GET /models (read only).
        consented_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When the speaker consent was given (clip voices, read only).
        clip_asset:
          $ref: '#/components/schemas/Asset'
          readOnly: true
          description: The voice clip with a fresh signed URL (read only); omitted when the clip asset was deleted.
    CharacterPreferredModels:
      type: object
      additionalProperties: false
      description: |
        The models this character renders best on, used by clients as the default
        model when the character is attached (web composers, NOLGIA Agent).
        image must be an image model on GET /models that can carry a character
        (image.aura_compatible true and image.reference_images_max > 0);
        video must be a video model with references.element_refs_max > 0.
        null or an empty string means no preference. Generation requests still
        name model explicitly.
      properties:
        image:
          type: string
          nullable: true
          x-omitempty: false
          maxLength: 128
        video:
          type: string
          nullable: true
          x-omitempty: false
          maxLength: 128
    CharacterWardrobeOutfit:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        One named outfit of a character's wardrobe. `name` identifies it
        within the character (unique, case-insensitive); `reference_asset_ids`
        name image assets owned by the caller showing the exact garments;
        `notes` are costume notes folded into the sheet prompt after the
        canonical description. On a read the API also sends
        `reference_assets` (the same ids resolved to signed assets, deleted
        assets dropped) and echoes `reference_asset_ids` and `notes`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Flight suit']
        reference_asset_ids:
          type: array
          maxItems: 3
          description: IDs of existing image assets owned by the caller, in display order.
          items:
            type: string
            format: uuid
        notes:
          type: string
          maxLength: 500
          description: Costume notes (fabric, fit, colour, accessories) for this outfit.
        reference_assets:
          type: array
          readOnly: true
          maxItems: 3
          description: The outfit's reference images with fresh signed URLs (read only).
          items:
            $ref: '#/components/schemas/Asset'
    CharacterList:
      type: object
      additionalProperties: false
      required: [characters]
      properties:
        characters:
          type: array
          items:
            $ref: '#/components/schemas/Character'
    CreateCharacterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Captain Nova']
        description:
          type: string
          nullable: true
          maxLength: 2000
        canonical_description:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            The canonical written description reused verbatim by downstream
            generations (see `Character.canonical_description`). Defaults to
            `description` when omitted, so every new character has one.
        primary_reference_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The identity-anchor reference. Must be one of
            `reference_asset_ids`. Defaults to the first reference asset.
        reference_asset_ids:
          type: array
          minItems: 0
          maxItems: 8
          description: IDs of existing image assets owned by the caller, in display order.
          items:
            type: string
            format: uuid
        motion_reference_asset_ids:
          type: array
          minItems: 0
          maxItems: 3
          description: |
            IDs of existing VIDEO assets owned by the caller (short walking or
            gesture clips), in display order. See
            `Character.motion_reference_assets`.
          items:
            type: string
            format: uuid
        wardrobe:
          type: array
          maxItems: 12
          description: Named outfits stored on the character. See `Character.wardrobe`.
          items:
            $ref: '#/components/schemas/CharacterWardrobeOutfit'
        voice:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CharacterVoiceInput'
          description: The character's voice; omitted or null means no voice.
        preferred_models:
          $ref: '#/components/schemas/CharacterPreferredModels'
          description: Models this character renders best on; clients use these as defaults when attached.
        face_check_consent:
          type: boolean
          nullable: true
          description: >-
            true records your consent to the face identity check for every reference photo the character holds after this write (see `Character.face_check`). Send true only after the person using NOLGIA has agreed to this wording, version 2026-09-23: "I am the person in these photos, or I have their permission to use them. I agree that NOLGIA checks the faces in these photos and compares them with the faces in the images and videos I make with this character, as described in the Privacy Policy." Omitted leaves consent as it is: photos added without it stay unchecked. A request sent by the platform agent is refused (403): consent must be the user's own.
    UpdateCharacterRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        description:
          type: string
          nullable: true
          maxLength: 2000
        canonical_description:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            Replaces the canonical written description (see
            `Character.canonical_description`) when provided.
        primary_reference_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Replaces the identity-anchor reference when provided. Must name
            one of the character's reference assets after this update.
        reference_asset_ids:
          type: array
          nullable: true
          minItems: 0
          maxItems: 8
          description: Replaces the full set of reference images when provided.
          items:
            type: string
            format: uuid
        motion_reference_asset_ids:
          type: array
          nullable: true
          minItems: 0
          maxItems: 3
          description: Replaces the full set of motion reference clips (video assets) when provided.
          items:
            type: string
            format: uuid
        wardrobe:
          type: array
          nullable: true
          maxItems: 12
          description: Replaces the full wardrobe (every named outfit) when provided.
          items:
            $ref: '#/components/schemas/CharacterWardrobeOutfit'
        voice:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CharacterVoiceInput'
          description: Omitted leaves the voice unchanged, null clears it, an object replaces it (validated as on create).
        preferred_models:
          $ref: '#/components/schemas/CharacterPreferredModels'
          description: When provided, REPLACES both preferences (send {} or null fields to clear); omitted leaves them unchanged.
        face_check_consent:
          type: boolean
          nullable: true
          description: >-
            true records your consent to the face identity check for every reference photo the character holds after this write (see `Character.face_check`). Send true only after the person using NOLGIA has agreed to this wording, version 2026-09-23: "I am the person in these photos, or I have their permission to use them. I agree that NOLGIA checks the faces in these photos and compares them with the faces in the images and videos I make with this character, as described in the Privacy Policy." Omitted leaves consent as it is: photos added without it stay unchecked. false withdraws consent for every reference photo the character holds, which turns the face check off for them. A request sent by the platform agent is refused (403): consent must be the user's own.
