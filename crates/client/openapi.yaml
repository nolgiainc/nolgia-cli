          examples: ['minimax']
        state:
          type: string
          enum: [operational, degraded]
          x-enum-varnames: [ProviderStateOperational, ProviderStateDegraded]
        degraded_since:
          type: string
          format: date-time
          nullable: true
          description: When the hard-down detector tripped, if degraded.
        parked_jobs:
          type: integer
          description: >-
            Jobs currently parked "provider temporarily down" for this
            provider; they resume automatically when it recovers.
        oldest_parked_at:
          type: string
          format: date-time
          nullable: true
          description: Creation time of the oldest parked job, if any.
        message:
          type: string
          nullable: true
          description: Customer-safe explanation of a degraded state.

    Model:
      type: object
      additionalProperties: false
      required: [id, modality, recommended]
      properties:
        id:
          type: string
          examples: ['veo-3.1']
        modality:
          $ref: '#/components/schemas/Modality'
        recommended:
          type: boolean
          description: Whether this model is surfaced as a priority/recommended option.
        min_tier:
          allOf:
            - $ref: '#/components/schemas/SubscriptionTier'
          description: >-
            Minimum subscription plan required to run this model. `starter`
            means every plan can run it. A model published as `pro` needs Pro
            or Studio, and submitting it on a lower plan is refused with a 402
            "Upgrade Required" - that is a plan limit, so adding credits does
            not unlock it. Sent for every model so a picker can mark or disable
            what the account cannot run, rather than letting the user submit
            and be refused. Cost and eligibility are independent: an affordable
            model can still be out of plan. Optional in the schema only so that
            existing clients keep parsing; the API always sends it.
        cost:
          $ref: '#/components/schemas/ModelCost'
        video:
          $ref: '#/components/schemas/VideoCapabilities'
        audio:
          $ref: '#/components/schemas/AudioCapabilities'
        image:
          $ref: '#/components/schemas/ImageCapabilities'
        quality:
          $ref: '#/components/schemas/QualityCapabilities'
        references:
          $ref: '#/components/schemas/ReferenceCapabilities'
        restore:
          type: boolean
          description: >-
            True for video-restoration lane models: they are submitted via
            `POST /restore/video` with a source clip and NO prompt, not via
            `POST /generate/video`. Absent for generation models.

    ReferenceCapabilities:
      type: object
      additionalProperties: false
      description: |
        Per-model reference-media support, published for every video model so
        clients can gate controls to exactly what the selected model can
        achieve. The API enforces the same limits: parameters outside a
        model's declared capabilities are rejected with a 400 naming the
        capability.
      required: [start_frame, start_frame_required, end_frame, video_refs_max, element_refs_max, audio_refs_max]
      properties:
        start_frame:
          type: boolean
          description: |
            Whether the model accepts an `image_url` start frame. Dedicated
            image-to-video variants require one; models like Veo and Omni
            Flash take one optionally alongside the text prompt.
        start_frame_required:
          type: boolean
          description: |
            Whether the start frame is MANDATORY: the model is
            image-to-video only and text-only requests are rejected with a
            400 (dedicated `image-to-video` variants, Grok Imagine 1.5,
            MiniMax Hailuo 2.3 Fast). False when `start_frame` is accepted
            but optional, and always false when `start_frame` is false.
            Clients must require an image before submitting when this is
            true.
        end_frame:
          type: boolean
          description: |
            Whether the model accepts `end_image_url` / `end_image_asset_id`
            alongside `image_url` (start+end frame pinning: Seedance 2.0
            Pro i2v, Seedance 2.5, FLUX 3 Video, MiniMax Hailuo 3). Kling v3
            i2v does NOT support it: those entries route to the direct Kling
            provider, which has no end-frame field. Read this flag rather
            than assuming a family supports it.
        video_refs_max:
          type: integer
          minimum: 0
          description: |
            Maximum reference videos per request (`video_asset_ids` +
            `video_urls` combined). 0 when the model takes no reference
            videos.
        element_refs_max:
          type: integer
          minimum: 0
          description: |
            Maximum element/reference images per request
            (`element_asset_ids` + `image_urls` combined). 0 when
            unsupported.
        element_refs_duration_seconds:
          type: integer
          minimum: 1
          description: |
            When present, requests that attach element/reference images must
            use exactly this `duration_seconds` (Veo 3.1 reference images
            require 8-second clips). Clients should snap the duration when
            references are attached. Absent when references carry no
            duration constraint.
        audio_refs_max:
          type: integer
          minimum: 0
          description: |
            Maximum reference audio tracks per request (`audio_asset_ids` +
            `audio_urls` combined, each at most 15s). 0 when unsupported.
        voice_refs_max:
          type: integer
          minimum: 1
          description: |
            Maximum PRESET reference voices per request (`reference_voice_ids`),
            each a `voice_id` from xAI's Text-to-Speech roster addressed in the
            prompt as `<AUDIO_0>`..`<AUDIO_2>`. Distinct from `audio_refs_max`,
            which counts UPLOADED audio tracks: these are roster voice
            selections, not user uploads. Present only on models that expose the
            preset-voice reference-to-video path (Grok Imagine 1.5 exposes 3;
            xAI reference audio is US-only / trusted-partners and caps output at
            720p). Absent when unsupported.
        bitrate_modes:
          type: array
          description: Selectable `bitrate_mode` values; absent when the model has no bitrate knob.
          items:
            $ref: '#/components/schemas/BitrateMode'

    ModelCost:
      type: object
      additionalProperties: false
      description: |
        Credit pricing for a model. Absent when pricing has not been published
        for the model; clients must render an unknown/pending state instead of
        inventing a rate.
      required: [credits, unit]
      properties:
        credits:
          type: integer
          minimum: 1
          description: |
            Credits charged per unit at the model's DEFAULT audio state. For a
            model with native audio on by default (most video models), this
            includes `audio_surcharge`; subtract it for the silent
            (generate_audio=false) price.
          examples: [42]
        unit:
          $ref: '#/components/schemas/ModelCostUnit'
        audio_surcharge:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Extra credits (per the model's `unit`) that a soundtrack adds, when
            the provider charges more to render audio. Included in `credits`
            because audio is on by default; a request with generate_audio=false
            is charged `credits - audio_surcharge`. Absent when audio has no
            price impact (the price is identical with or without audio) or the
            model cannot toggle audio.
          examples: [11]
        baseline_seconds:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Present only when unit is per_clip. The clip duration in seconds that
            `credits` assumes. The actual charge scales with the requested duration
            as ceil(credits * duration_seconds / baseline_seconds).
          examples: [5]

    ModelCostUnit:
      type: string
      description: |
        Billing dimension for a model's credit cost. per_image multiplies by the
        requested image count, per_clip scales with video duration against
        baseline_seconds, per_generation is a flat charge per request.
      enum: [per_image, per_clip, per_generation]

    QualityCapabilities:
      type: object
      additionalProperties: false
      description: |
        Model-specific quality/resolution tiers. Absent when the model has a
        single fixed quality. Each option carries its own credit cost (in the
        model's `cost.unit` — for video, per `baseline_seconds` clip, scaling
        with duration like the base cost) so clients can price the choice
        before submitting.
      required: [options]
      properties:
        default:
          type: string
          description: |
            Tier applied when the request omits `quality`; it costs the
            model's base `cost.credits`.
          examples: ['720p']
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QualityOption'

    QualityOption:
      type: object
      additionalProperties: false
      required: [id, credits, premium]
      properties:
        id:
          type: string
          description: Tier identifier accepted by the `quality` request parameter.
          examples: ['4k']
        credits:
          type: integer
          minimum: 1
          description: |
            Credits charged per the model's `cost.unit` when this tier is
            selected (for video, per `baseline_seconds` clip), at the model's
            DEFAULT audio state. Includes `audio_surcharge` when audio is on by
            default; subtract it for the silent price of this tier.
          examples: [778]
        audio_surcharge:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Extra credits this tier's soundtrack adds when the provider charges
            more for audio. Included in `credits` (audio on by default); a
            generate_audio=false request charges `credits - audio_surcharge`.
            Absent when audio has no price impact on this tier.
          examples: [11]
        premium:
          type: boolean
          description: |
            Marks a premium (highest-quality, higher credit cost) tier so
            clients can present it distinctly from standard options.

    VideoCapabilities:
      type: object
      additionalProperties: false
      description: Per-model duration and aspect-ratio support for video models.
      properties:
        durations:
          type: array
          description: Discrete set of supported durations in seconds, when the model only allows specific values.
          items:
            type: integer
          examples: [[4, 6, 8]]
        min_duration:
          type: integer
          nullable: true
          description: Minimum supported duration in seconds, when durations form a continuous range.
        max_duration:
          type: integer
          nullable: true
          description: Maximum supported duration in seconds, when durations form a continuous range.
        aspect_ratios:
          type: array
          items:
            $ref: '#/components/schemas/AspectRatio'
        image_input:
          type: boolean
          description: |
            Whether the model accepts an `image_url`. Dedicated image-to-video
            variants require one; models like Veo and Omni Flash take one
            optionally alongside the text prompt. Mirrors
            `references.start_frame`, which carries the full reference-media
            capability set. Read `references.start_frame_required` to tell
            an optional start frame from a mandatory one.
        audio:
          type: string
          enum: [none, always, optional]
          description: |
            What this model does about a soundtrack, and therefore what
            `generate_audio` can achieve on it. The API resolves and enforces
            exactly this value, so an omitted `generate_audio` never falls
            through to the provider's own default.

            * `none`: renders silent, always. `generate_audio: true` is
              accepted but cannot add a track at generation time; supply one
              with a separate `POST /generate/audio` pass.
            * `always`: native audio that cannot be switched off.
              `generate_audio: false` is refused with a 400, because nothing
              downstream can take the soundtrack back out of the render.
            * `optional`: the model honors `generate_audio`. Omitting it
              resolves to `true`.
          examples: ['optional']
        speech:
          type: string
          enum: [none, native]
          description: |
            Whether this model renders SPEECH — the words of a dialogue or
            voice-over line, spoken in the same pass that renders the picture,
            so a visible mouth matches them.

            A strictly narrower claim than `audio`, and the one to route
            on-camera dialogue by. `audio` answers "does a track come back";
            plenty of models return a real soundtrack that is ambience only.
            Grok Imagine is `audio: always` and `speech: none` — it returns a
            measured aac track with no words in it — so choosing a lip-work
            model by `audio != none` picks a model that cannot say the line.

            * `none`: the model does not render spoken words, or has not been
              measured doing so. Dialogue for these clips comes from a separate
              `POST /generate/audio` pass mixed in afterwards, which is fine for
              off-camera narration and wrong for a talking head — nothing binds
              the muxed voice to the rendered mouth.
            * `native`: the model speaks the line itself, synchronized to the
              picture. Declared only from measurement, never from a provider's
              marketing claim.

            `speech: native` always implies `audio` is `always` or `optional`;
            a silent model cannot speak. Note this flag says nothing about
            WHO the model will render: Seedance speaks but its provider refuses
            photoreal human likenesses, so its speech is product-only and never
            a talking head. Check the human-subject constraints too.
          examples: ['native']
        regeneration:
          type: boolean
          description: >-
            Whether the model can re-render one of your completed videos at
            its top resolution tier via the provider's native regeneration
            flow (`source_video_asset_id` on `POST /generate/video`; MiniMax
            Hailuo 3's 768P→2K Video Regeneration). The charge covers the
            re-rendered 2K output seconds plus the source clip's own input
            seconds, both at the model's 2k tier rate. Omitted means
            unsupported.
        seed:
          type: boolean
          description: >-
            Whether this model's provider honors the request's `seed`.

            `false` means the provider's API has no seed field at all, so a
            seed could only ever be discarded — sending one is refused with a
            400 rather than accepted and ignored, because a discarded seed
            returns a DIFFERENT video than the reproducible one you asked for
            and still bills you for it.

            Omitted means nobody has verified this model's provider yet, and
            the field is accepted with no promise that it does anything.
            Absence is deliberately not the same as `false`: refusing on an
            unchecked assumption would delete a capability that may work.

    ImageCapabilities:
      type: object
      additionalProperties: false
      description: |
        Per-model image-generation options beyond the shared `image_size`
        aliases. Every published image model declares its supported
        `aspect_ratio` values here — clients should drive their ratio
        pickers from this list.

        Published for EVERY image model (a model with no selectable ratios
        still declares `reference_images_max`), so a client can always tell
        whether an image model accepts a reference image.
      properties:
        aspect_ratios:
          type: array
          description: Selectable `aspect_ratio` values for this model.
          items:
            $ref: '#/components/schemas/ImageAspectRatio'
        reference_images_max:
          type: integer
          description: |
            How many reference images this model accepts across `image_url`
            and `image_urls` for identity-preserving edits.

            `0` means the model generates from the prompt ONLY: it has no way
            to consume a reference, and sending one is rejected up front with
            a 400 (before any credit hold is taken, so a rejected request
            never costs credits). Clients MUST NOT offer a reference-image
            affordance for these models, and should filter or disable them in
            the model picker once the user has attached a reference.

            `1` means a single reference via `image_url`; sending `image_urls`
            is rejected. Values above 1 additionally accept `image_urls`, up
            to this many references combined.

            Absent on responses from an API build older than this field: treat
            unknown as permitted rather than blocking the user.
          minimum: 0
          example: 4
        num_images_max:
          type: integer
          description: |
            The largest `num_images` this model accepts in one request. Most
            models allow the contract maximum of 4; a model whose provider
            returns exactly one image per call publishes `1`, and a request
            above its ceiling is rejected up front with a 400 (before any
            credit hold, so it never costs credits).

            Clients should bound their image-count control by this value.
            Absent on responses from an API build older than this field: fall
            back to the schema maximum for `num_images`.
          minimum: 1
          maximum: 4
          example: 4
        aura_compatible:
          type: boolean
          description: |
            Whether Aura (the Nolgia character engine) composes on this model:
            true for photoreal person lanes, false for vector, anime, and
            illustration models (the recraft family). Clients drive the Aura
            toggle from this flag - show it (default ON for person prompts)
            when true, hide it entirely when false. The API mirrors the same
            stance: `aura: true` on an incompatible model is a no-op. Absent
            on responses from an API build older than this field: treat as
            false (hide the toggle).
          example: true

    AudioCapabilities:
      type: object
      additionalProperties: false
      description: Per-model voice catalog for audio (text-to-speech) models.
      properties:
        voices:
          type: array
          description: Selectable voice identifiers for this model. Absent when the model has no enumerable voice catalog.
          items:
            $ref: '#/components/schemas/Voice'

    Voice:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          examples: ['af_bella']
        label:
          type: string
          nullable: true
          description: Human-friendly display name for the voice.
          examples: ['Bella (American female)']

    UploadAssetRequest:
      type: object
      additionalProperties: false
      required: [content_type, data]
      properties:
        content_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          description: MIME type of the uploaded bytes.
        data:
          type: string
          format: byte
          minLength: 1
          maxLength: 14000000
          description: Base64-encoded file contents (max ~10MB decoded).
        filename:
          type: string
          nullable: true
          maxLength: 255
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Files the uploaded asset into this caller-owned project directly;
            an unknown or foreign project returns 400. Without it, the asset
            lands in the default "Library" project.

    CreateAssetUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, content_type, size_bytes]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Original filename, kept as asset metadata.
          examples: ['final-cut.mp4']
        content_type:
          type: string
          enum:
            - video/mp4
            - video/quicktime
            - video/webm
            - audio/mpeg
            - audio/wav
            - audio/ogg
            - audio/webm
            - audio/mp4
            - image/png
            - image/jpeg
            - image/webp
          description: >
            MIME type of the file. The signed PUT URL is bound to it, so the
            upload request must send exactly this Content-Type header.
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: >
            Exact size of the file in bytes. Verified against the uploaded
            object on completion. Limits: 50 GiB for video, 5 GiB for
            audio, 100 MiB for images.
        tags:
          type: array
          maxItems: 10
          description: Tags to apply to the asset; trimmed, lowercased, and de-duplicated.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['final-cut', 'campaign-x']]
        display_name:
          type: string
          nullable: true
          maxLength: 200
          description: >
            Optional human-readable display name stored on the pre-created
            asset (trimmed). Defaults to empty.
          examples: ['Hero shot v2']
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Files the uploaded asset into this caller-owned project directly
            (no tag matching involved); an unknown or foreign project returns
            400. Without it, the asset lands in the default "Library"
            project.

    AssetUpload:
      type: object
      additionalProperties: false
      required: [upload_id, asset_id, upload_url, expires_at]
      properties:
        upload_id:
          type: string
          format: uuid
          description: Identifier for `POST /assets/uploads/{id}/complete`.
        asset_id:
          type: string
          format: uuid
          description: The pre-created asset (status `uploading`) the bytes will belong to.
        upload_url:
          type: string
          format: uri
          description: >
            Signed PUT URL. Upload with `PUT <upload_url>` and a
            `Content-Type` header exactly matching the declared
            `content_type`; no Authorization header is needed.
        expires_at:
          type: string
          format: date-time
          description: Expiry of `upload_url` (30 minutes after creation).

    AssetStatus:
      type: string
      enum: [uploading, ready]
      description: >
        Lifecycle status of an asset. `uploading` marks a signed-upload
        asset whose bytes have not been verified yet; `ready` assets are
        fully stored and downloadable.

    AssetSort:
      type: string
      enum: [created_at_desc, created_at_asc, name_asc, name_desc]
      description: >
        Orderings accepted by `GET /assets`. `created_at_desc` is the
        default (newest first). The `name_*` orderings compare the asset's
        effective title case-insensitively: display name when set, else
        prompt, else the model id.

    ImageModel:
      type: string
      description: Image model identifier exposed by the public API.
      enum:
        - gpt-image-2
        - gpt-image-1
        - imagen-4
        - nano-banana-2
        - flux/schnell
        - flux-ultra
        - flux-pro
        - flux-2-pro
        - flux-2-max
        - flux-2-flex
        - flux-2-klein
        - flux-kontext-pro
        - flux-kontext-max
        - grok-imagine-image
        - grok-imagine-image-quality
        - recraft-v3
        - recraft-v2
        - recraft-v4.1
        - recraft-v4.1-pro
        - recraft-v4.1-utility
        - recraft-v4.1-utility-pro
        - recraft-v4
        - recraft-v4-pro
        - ideogram-v3
        - stable-diffusion-3.5
        - kling-image-v3
        - minimax-image-01

    AudioModel:
      type: string
      description: Audio model identifier (TTS, music, or SFX).
      enum:
        - fal-ai/kokoro/american-english
        - fal-ai/dia-tts
        - fal-ai/inworld-tts
        - fal-ai/orpheus-tts
        - fal-ai/minimax/speech-2.8-hd
        - fal-ai/minimax/speech-2.8-turbo
        - fal-ai/elevenlabs/tts/eleven-v3
        - fal-ai/elevenlabs/tts/multilingual-v2
        - fal-ai/elevenlabs/tts/turbo-v2.5
        - fal-ai/elevenlabs/music
        - fal-ai/elevenlabs/sound-effects/v2
        - fal-ai/minimax-music/v2.6
        - fal-ai/lyria3/pro
        - fal-ai/stable-audio-25/text-to-audio
        - fal-ai/stable-audio-3/medium/text-to-audio
        - fal-ai/mmaudio-v2/text-to-audio

    VideoModel:
      type: string
      description: |
        Video model identifier. Priority models are Kling v3.0, Seedance 2.0 Pro,
        and MiniMax Hailuo 3 (`minimax-h3`, the 2K multimodal flagship). BFL
        FLUX 3 (`flux-3-video`) is the native-audio t2v/i2v flagship with hd/fhd
        resolution tiers. Alibaba Wan 3.0 (`wan-3.0`) renders 2-30 second
        clips at 480p/720p/1080p from text, a start image, or reference
        images. MiniMax H3 Max (`minimax/h3-max/text-to-video` and
        `minimax/h3-max/image-to-video`) is the post-trained H3 variant with
        480p/768p tiers. Seedance 2.5 (`seedance-2.5`): 4 to 30 second clips
        at 480p/720p from text, a start and/or end image, or up to 9
        reference images, optional audio. Default is
        `fal-ai/kling-video/v3/text-to-video`.
      enum:
        - fal-ai/kling-video/v3/text-to-video
        - fal-ai/kling-video/v3/master/text-to-video
        - fal-ai/kling-video/v3/pro/text-to-video
        - fal-ai/kling-video/v3/image-to-video
        - fal-ai/kling-video/v3/master/image-to-video
        - fal-ai/kling-video/v3/pro/image-to-video
        - fal-ai/bytedance/seedance/v2/pro/text-to-video
        - fal-ai/bytedance/seedance/v2/pro/image-to-video
        - fal-ai/bytedance/seedance/v2/pro/reference-to-video
        - veo-3.1
        - veo-3.1-fast
        - omni-flash
        - omni-1.1-flash
        - grok-imagine-video
        - grok-imagine-video-1.5
        - minimax-h3
        - minimax-hailuo-2.3
        - minimax-hailuo-2.3-fast
        - flux-3-video
        - wan-3.0
        - seedance-2.5
        - minimax/h3-max/text-to-video
        - minimax/h3-max/image-to-video

    RestoreVideoModel:
      type: string
      description: |
        Video-restoration lane model, submitted via `POST /restore/video`.
        Every member re-renders existing footage — de-noise, de-haze, detail
        recovery and up-res to a target resolution tier — and takes no prompt.

        `seedvr2-restore` is the AI footage restorer (SeedVR2), tiers
        720p/1080p/1440p/2160p.

        The `topaz-*` ids are the Topaz master upscalers, one per engine, so
        you pick the engine that matches the footage:

        - `topaz-proteus` — general live action
        - `topaz-rhea` — texture-heavy upscales
        - `topaz-iris` — faces
        - `topaz-nyx` — denoise plus detail
        - `topaz-theia` — fine-tuned detail
        - `topaz-artemis` — high-quality restore
        - `topaz-gaia` — CG and animation
        - `topaz-dione` — interlaced footage
        - `topaz-starlight-fast` — fast generative restore
        - `topaz-starlight` — precise generative restore
        - `topaz-wonder` — generative restore
        - `topaz-hyperion` — generative flagship

        Topaz tiers are 720p/1080p/1440p/2160p, plus 4320p (8K) on the eight
        engines above `topaz-starlight-fast` and on `topaz-starlight-fast`
        itself; the generative trio (`topaz-starlight`, `topaz-wonder`,
        `topaz-hyperion`) tops out at 2160p. Read each model's real tier list
        and per-tier credit rates from `quality.options` on `GET /models`
        rather than hard-coding this paragraph.
      enum:
        - seedvr2-restore
        - topaz-proteus
        - topaz-rhea
        - topaz-iris
        - topaz-nyx
        - topaz-theia
        - topaz-artemis
        - topaz-gaia
        - topaz-dione
        - topaz-starlight-fast
        - topaz-starlight
        - topaz-wonder
        - topaz-hyperion

    ImageSize:
      type: string
      enum: [square, square_hd, portrait_4_3, portrait_16_9, landscape_4_3, landscape_16_9]

    ImageAspectRatio:
      type: string
      description: >-
        Native output aspect ratio for image models. Every published image
        model declares its supported values as `image.aspect_ratios` on
        `GET /models`; a ratio outside the selected model's list is rejected
        (400). Prefer this over `image_size`, whose closed aliases only
        express the 16:9/4:3/1:1 families.
      enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '3:2', '2:3', '21:9', '9:21', '2:1', '1:2', '5:4', '4:5', '3:1', '1:3', '4:1', '1:4']

    AspectRatio:
      type: string
      enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '3:2', '2:3', '21:9']

    BitrateMode:
      type: string
      description: >-
        Output bitrate profile for models that support it (see the model's
        `video.bitrate_modes` on `GET /models`, which is authoritative — no
        currently published model exposes one). `standard` is the provider
        default; `high`
        trades larger files for higher visual fidelity. Rejected (400) on
        models without bitrate selection.
      enum: [standard, high]

    DuplicateAssetRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          nullable: true
          maxLength: 200
          description: >-
            Display name for the copy; defaults to the source's display name
            plus " copy" (truncated to fit 200 characters).
          examples: ['hero-shot copy']

    ExtractAssetFrameRequest:
      type: object
      additionalProperties: false
      properties:
        t_seconds:
          type: number
          nullable: true
          minimum: 0
          description: >-
            Timestamp (seconds from the start) of the frame to extract.
            Omit to extract the LAST frame of the video.
          examples: [2.5]

    GenerateImageRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      properties:
        model:
          $ref: '#/components/schemas/ImageModel'
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          examples: ['A neon cyberpunk cat DJing on a rooftop, cinematic']
        negative_prompt:
          type: string
          nullable: true
          maxLength: 4000
        image_size:
          $ref: '#/components/schemas/ImageSize'
        aspect_ratio:
          $ref: '#/components/schemas/ImageAspectRatio'
        num_images:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
        seed:
          type: integer
          nullable: true
          minimum: 0
        guidance_scale:
          type: number
          nullable: true
          minimum: 0
          maximum: 20
        image_url:
          type: string
          format: uri
          nullable: true
          maxLength: 2048
          description: Source image (https URL) for image-to-image restyle. When set, the model transforms this image instead of generating from scratch.
        image_urls:
          type: array
          nullable: true
          maxItems: 4
          description: >-
            Multiple reference images (https URLs) for models that support
            multi-reference input (OpenAI gpt-image models — e.g. character +
            outfit + style references combined — and Kling Image 3.0
            multi-reference i2i). Mutually additive with `image_url` (it is
            treated as the first reference); at most 4 references total.
            OpenAI references are fetched server-side under one 10 MB combined
            download budget; Kling fetches the URLs itself. Rejected (400) on
            models without multi-reference support.
          items:
            type: string
            format: uri
            maxLength: 2048
          examples: [['https://assets.nolgia.ai/ref-character.png', 'https://assets.nolgia.ai/ref-outfit.png']]
        reference_asset_ids:
          type: array
          nullable: true
          maxItems: 4
          description: >-
            Reference images given as ids of your own image assets — the
            server resolves each to a signed URL and it rides the same
            multi-reference path as `image_urls` (the image lane's sibling of
            the video lane's `element_asset_ids`). Counted against the same
            per-model cap as `image_url` + `image_urls` combined
            (`image.reference_images_max` on `GET /models` — 4 on gpt-image-2
            and Kling Image 3.0, 1 on single-reference models, 0 on models
            with no reference input, where any reference is rejected with a
            400 rather than silently dropped). Prefer this over `image_urls`
            for assets already in your Library: the server re-signs the
            underlying objects at execution time, so a queued job never runs
            with an expired URL.
          items:
            type: string
            format: uuid
        quality:
          type: string
          nullable: true
          maxLength: 16
          description: >-
            Quality/resolution tier for the selected model. Allowed values and
            per-tier credit costs are model-specific — see the model's
            `quality.options` on `GET /models`. Omit for the model's default
            tier at its base price. Rejected (400) when the model declares no
            quality tiers or the value is not one of its options.
          examples: ['2k']
        tags:
          type: array
          maxItems: 10
          description: Applied to the resulting asset(s); normalized to lowercase.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        project_id:
          type: string
          format: uuid
          description: >-
            Files the generated asset(s) into this project at creation. The
            project must exist and belong to the caller (400 otherwise).
            Honored on every auth channel (JWT and PAT), and takes precedence
            over server-side agent-session attribution.
        preset_slug:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            Slug of the preset this generation was launched from, if any. Set by
            the web app on preset-launched generations to enable server-side
            preset→usage attribution (the admin usage panel's top-presets
            leaderboard); omit on direct API/CLI/MCP/pipeline calls. Stored
            verbatim and NOT validated against the preset catalog (a preset may
            be deleted later).
          examples: ['cinematic-portrait']
        aura:
          type: boolean
          nullable: true
          description: >-
            Applies Aura, the Nolgia character engine: server-side photoreal
            composition layered onto the prompt (people render as photographs,
            real skin, real light, no AI gloss). Honored only on models whose
            catalog entry publishes `image.aura_compatible: true`; a true value
            on any other model is a no-op, never an error. When OMITTED, the
            server applies the product default: ON for prompts that read as a
            person subject on aura_compatible models, OFF otherwise. An
            explicit false always wins. The job's persisted params echo the
            effective value for audit and gallery badging.
        face_reference_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Image asset (owned by the caller) whose face conditions the render
            for identity. A face reference IS an Aura identity request: it
            turns the pipeline on (an explicit `aura: false` alongside it is a
            400) and needs a model that accepts reference images
            (`image.reference_images_max` above the number of references
            already attached) - rejected with a 400 otherwise, so a reference
            is never silently dropped. Rides alongside
            `image_url`/`image_urls` and counts against the model's combined
            reference budget. The delivered render is subject to the ArcFace
            identity acceptance gate (>= 0.60 against this reference, one
            automatic re-roll) once the scoring runtime is enabled; that gate
            scores and re-rolls a single render, so `num_images` must be 1
            (or omitted) alongside a face reference - a batch is a 400 rather
            than a set of renders where only one was actually scored.
        character_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your characters (`GET /characters`, created on the Create
            Characters page). The character's `primary_reference_asset_id`
            becomes this render's face reference and its
            `canonical_description` rides into the prompt verbatim as the
            continuity contract, so the same character renders consistently
            across generations. The character must belong to the caller - an
            unknown or foreign id is a 400, never silently ignored.
            Because it supplies the face reference it inherits every
            `face_reference_asset_id` rule (an `aura_compatible` model with
            spare `image.reference_images_max` capacity, `num_images` of 1),
            and each of those is a 400 rather than a dropped reference.
            Passing `character_id` and `face_reference_asset_id` together is
            a 400: two competing identities are refused rather than silently
            resolved in favor of one. A character with no reference image
            still contributes its description; that render carries no face
            reference, so its `identity_score` is null. The job's persisted
            params echo `character_id` alongside `aura` for audit.
          examples: ['5a2f7c58-9e5a-4f1a-9c7f-2f0b6c3d1e42']

    GenerateImageResponse:
      type: object
      additionalProperties: false
      required: [request_id, asset, assets]
      properties:
        request_id:
          type: string
          examples: ['req_01J5R2M9YBX2K4Z3WQH6P8VNA1']
        asset:
