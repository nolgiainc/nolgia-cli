          x-enum-varnames: [PresetIntakeAssetStepKindAsset]
        label:
          type: string
          minLength: 1
          maxLength: 120
        help:
          type: string
          maxLength: 400
        required:
          type: boolean
        modality:
          type: string
          enum: [image, video, audio, any]
          x-enum-varnames: [PresetIntakeAssetModalityImage, PresetIntakeAssetModalityVideo, PresetIntakeAssetModalityAudio, PresetIntakeAssetModalityAny]
          description: What the library filter shows and the drop zone accepts. Must agree with the binding (`video_asset_ids` takes video, `audio_asset_ids` audio, every other field image; `any` is accepted everywhere).
        role:
          type: string
          enum: [logo, product, reference, footage, audio, face, style, photo, data]
          x-enum-varnames: [PresetIntakeAssetRoleLogo, PresetIntakeAssetRoleProduct, PresetIntakeAssetRoleReference, PresetIntakeAssetRoleFootage, PresetIntakeAssetRoleAudio, PresetIntakeAssetRoleFace, PresetIntakeAssetRoleStyle, PresetIntakeAssetRolePhoto, PresetIntakeAssetRoleData]
          description: What the picks ARE to the preset, so the app can word the drop zone and the agent brief can name them.
        min:
          type: integer
          minimum: 0
          description: Fewest picks accepted. Defaults to 0, or 1 when `required`.
        max:
          type: integer
          minimum: 1
          maximum: 12
          description: Most picks accepted. Defaults to 1. Bindings that take one value (`face_reference_asset_id`, `mask_asset_id`, `image_url`, `end_image_asset_id`) require 1.
        accept:
          type: array
          minItems: 1
          items:
            type: string
            enum: [upload, library]
          description: Which sources the step offers. Defaults to both.
        binds_to:
          $ref: '#/components/schemas/PresetIntakeAssetBinding'
    PresetIntakeCharacterStep:
      type: object
      additionalProperties: false
      required: [id, kind, label, required, binds_to]
      description: >-
        One or more of the caller's characters (the compact grid capped at six with a searchable side panel). `binds_to` is `character_id` (the endpoint's character field; `max` must be 1 and the target model must carry a character reference: `image.aura_compatible` with a reference slot on `create_image`, `references.element_refs_max` > 0 on `create_video`), `prompt_slot:<NAME>` (the character's description fills a labelled slot of the baked prompt) or `attach`.
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
        kind:
          type: string
          enum: [character]
          x-enum-varnames: [PresetIntakeCharacterStepKindCharacter]
        label:
          type: string
          minLength: 1
          maxLength: 120
        help:
          type: string
          maxLength: 400
        required:
          type: boolean
        max:
          type: integer
          minimum: 1
          maximum: 4
          description: Most characters accepted. Defaults to 1.
        binds_to:
          type: string
          pattern: "^(character_id|prompt_slot:[A-Z][A-Z0-9']*( [A-Z][A-Z0-9']*){0,4}|attach)$"
          examples: ['character_id', 'prompt_slot:THE CHARACTERS']
    PresetIntakeTimelineStep:
      type: object
      additionalProperties: false
      required: [id, kind, label, required, binds_to]
      description: >-
        One of the caller's Studio compositions (poster and duration; "Open Studio" when they have none). `binds_to` is `composition_id` (needs `submit.kind: agent`; no generate endpoint takes a composition) or `attach`.
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
        kind:
          type: string
          enum: [timeline]
          x-enum-varnames: [PresetIntakeTimelineStepKindTimeline]
        label:
          type: string
          minLength: 1
          maxLength: 120
        help:
          type: string
          maxLength: 400
        required:
          type: boolean
        binds_to:
          type: string
          enum: [composition_id, attach]
          x-enum-varnames: [PresetIntakeTimelineBindingCompositionId, PresetIntakeTimelineBindingAttach]
    PresetIntakeTextStep:
      type: object
      additionalProperties: false
      required: [id, kind, label, required, binds_to]
      description: >-
        Free text. `binds_to` is `prompt_slot:<NAME>` (fills the labelled slot `<NAME>:` of the baked prompt; the slot must exist), `prompt` (replaces the whole prompt; `create_*` targets only), `brief` (the agent's first message; needs `submit.kind: agent`) or `attach`.
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
        kind:
          type: string
          enum: [text]
          x-enum-varnames: [PresetIntakeTextStepKindText]
        label:
          type: string
          minLength: 1
          maxLength: 120
        help:
          type: string
          maxLength: 400
        required:
          type: boolean
        placeholder:
          type: string
          maxLength: 200
        max_chars:
          type: integer
          minimum: 1
          maximum: 8000
          description: Defaults to 2000.
        binds_to:
          type: string
          pattern: "^(prompt_slot:[A-Z][A-Z0-9']*( [A-Z][A-Z0-9']*){0,4}|prompt|brief|attach)$"
          examples: ['prompt_slot:THE MARK', 'brief']
    PresetIntakeChoiceStep:
      type: object
      additionalProperties: false
      required: [id, kind, label, required, options, binds_to]
      description: >-
        Chips or cards. `binds_to` is `option:<key>` (the pick selects one of the CARD's option chips; `<key>` must match a card option by label or by its slug), `prompt_slot:<NAME>` (the pick's value fills a labelled slot of the baked prompt), `param:<field>` (the pick sets a request parameter of the target endpoint such as `aspect_ratio`, `duration_seconds` or `quality`; `create_*` targets only, and `multiple` must be false) or `attach`.
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
        kind:
          type: string
          enum: [choice]
          x-enum-varnames: [PresetIntakeChoiceStepKindChoice]
        label:
          type: string
          minLength: 1
          maxLength: 120
        help:
          type: string
          maxLength: 400
        required:
          type: boolean
        multiple:
          type: boolean
          description: Whether more than one option may be picked. Defaults to false.
        default:
          type: string
          description: The preselected option `value`, if any.
        options:
          type: array
          minItems: 1
          maxItems: 24
          items:
            $ref: '#/components/schemas/PresetIntakeChoiceOption'
        binds_to:
          type: string
          pattern: "^(option:.+|prompt_slot:[A-Z][A-Z0-9']*( [A-Z][A-Z0-9']*){0,4}|param:[a-z][a-z0-9_]{0,39}|attach)$"
          examples: ['option:Chrome', 'prompt_slot:THE STYLE', 'param:aspect_ratio']
    PresetIntakeDataStep:
      type: object
      additionalProperties: false
      required: [id, kind, label, required, binds_to]
      description: >-
        A pasted or uploaded table (live preview, header detection). `binds_to` is `prompt_slot:<NAME>` (the table, rendered as text, fills a labelled slot of the baked prompt) or `attach`.
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,39}$'
        kind:
          type: string
          enum: [data]
          x-enum-varnames: [PresetIntakeDataStepKindData]
        label:
          type: string
          minLength: 1
          maxLength: 120
        help:
          type: string
          maxLength: 400
        required:
          type: boolean
        formats:
          type: array
          minItems: 1
          items:
            type: string
            enum: [paste, csv]
          description: Defaults to both.
        max_rows:
          type: integer
          minimum: 1
          maximum: 500
          description: Defaults to 50.
        max_cols:
          type: integer
          minimum: 1
          maximum: 50
          description: Defaults to 12.
        binds_to:
          type: string
          pattern: "^(prompt_slot:[A-Z][A-Z0-9']*( [A-Z][A-Z0-9']*){0,4}|attach)$"
          examples: ['prompt_slot:THE DATA']
    PresetIntakeStep:
      description: One step of a guided intake, discriminated on `kind`. Each renders one screen (mobile) or one card (desktop).
      oneOf:
        - $ref: '#/components/schemas/PresetIntakeAssetStep'
        - $ref: '#/components/schemas/PresetIntakeCharacterStep'
        - $ref: '#/components/schemas/PresetIntakeTimelineStep'
        - $ref: '#/components/schemas/PresetIntakeTextStep'
        - $ref: '#/components/schemas/PresetIntakeChoiceStep'
        - $ref: '#/components/schemas/PresetIntakeDataStep'
      discriminator:
        propertyName: kind
        mapping:
          asset: '#/components/schemas/PresetIntakeAssetStep'
          character: '#/components/schemas/PresetIntakeCharacterStep'
          timeline: '#/components/schemas/PresetIntakeTimelineStep'
          text: '#/components/schemas/PresetIntakeTextStep'
          choice: '#/components/schemas/PresetIntakeChoiceStep'
          data: '#/components/schemas/PresetIntakeDataStep'
    PresetIntake:
      type: object
      additionalProperties: false
      required: [version, steps, submit]
      description: |
        A preset's guided intake flow (founder decision 2026-09-10): the
        ordered inputs the preset needs from a customer, so the app asks for
        them (files, library picks, characters, a timeline, a few questions)
        and only then runs the thing. The one-tap starter stays as the
        secondary `lucky` path. Stored on `presets.intake`; a child preset
        inherits its parent's at read time unless it carries its own.

        Validated on write against the preset's TARGET, refusing with a `400`
        whose detail names the step id and the reason: `version` is 1; 1 to 8
        steps with unique ids; each kind's required fields present; every
        `binds_to` a field the target endpoint accepts AND the target model
        supports (`video_asset_ids` needs `references.video_refs_max` > 0,
        `mask_asset_id` needs `image.inpaint_mask`, `character_id` and
        `face_reference_asset_id` only where the endpoint takes them and the
        model carries the reference, `prompt_slot:<NAME>` needs the labelled
        slot `<NAME>:` in the baked prompt, `option:<key>` needs a matching
        card option, `param:<field>` needs a parameter of the endpoint;
        `attach` is always legal); asset maxima summed within the model's
        reference limits; `submit.kind` `agent` for `studio_intent` targets,
        where every asset binding must be `attach`. Customer copy (labels,
        help, placeholders, options, the lucky label, the note) follows the
        no-em-dash rule like the card copy.
      properties:
        version:
          type: integer
          enum: [1]
        lucky:
          $ref: '#/components/schemas/PresetIntakeLucky'
        steps:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/PresetIntakeStep'
        submit:
          $ref: '#/components/schemas/PresetIntakeSubmit'
    PresetIntakeContextTarget:
      type: object
      additionalProperties: false
      required: [kind]
      description: The preset's target as the flow submits to it.
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/OutputSetMemberInput'
        set_kind:
          $ref: '#/components/schemas/OutputSetKind'
        kind:
          $ref: '#/components/schemas/PresetTargetKind'
        model:
          type: string
          description: The target model id (`target.params.model`) for a `create_*` target.
          examples: ['gpt-image-2.5-flare']
        intent:
          type: string
          description: The studio intent (`target.params.intent`) for a `studio_intent` target.
        endpoint:
          type: string
          description: The generate endpoint a `generate` submit calls, for display and routing.
          examples: ['POST /generate/image']
    PresetIntakeModelLimits:
      type: object
      additionalProperties: false
      required: [id, modality, reference_images_max, element_refs_max, video_refs_max, audio_refs_max, inpaint_mask, start_frame, end_frame, character, face_reference, aura_compatible]
      description: >-
        The target model's capability limits the flow renders against, read through the same predicates the write path validates with and the generate endpoints enforce, so the context never advertises a slot the API would refuse. Zero / false means the input is not available on this model.
      properties:
        id:
          type: string
        modality:
          $ref: '#/components/schemas/Modality'
        reference_images_max:
          type: integer
          description: Reference images per request on `create_image` (`image.reference_images_max`); 0 on video models.
        element_refs_max:
          type: integer
          description: Element images per request (`references.element_refs_max` on video; the reference budget on image).
        video_refs_max:
          type: integer
          description: Reference videos per request (`references.video_refs_max`); 0 where unsupported.
        audio_refs_max:
          type: integer
          description: Reference audio tracks per request (`references.audio_refs_max`); 0 where unsupported.
        inpaint_mask:
          type: boolean
          description: Whether `mask_asset_id` is honored (`image.inpaint_mask`).
        start_frame:
          type: boolean
          description: Whether `image_url` is accepted (a start frame on video; a reference image on image).
        end_frame:
          type: boolean
          description: Whether `end_image_asset_id` is accepted (`references.end_frame`).
        character:
          type: boolean
          description: Whether `character_id` is accepted on this model.
        face_reference:
          type: boolean
          description: Whether `face_reference_asset_id` is accepted (image models with Aura and a reference slot).
        aura_compatible:
          type: boolean
    PresetIntakeEstimate:
      type: object
      additionalProperties: false
      required: [credits, model, basis]
      description: >-
        The credit estimate for ONE run at the default tier, priced by the same pricer the generate endpoints reserve with: the target's baked duration, quality and audio flags where it carries them, the model's defaults otherwise. A `studio_intent` quotes the flat agent-turn rate (`basis: agent_turn`); the generations the agent then makes bill separately. A set target quotes all its members at the shared image settings (`basis: set_run`), members times one image generation.
      properties:
        credits:
          type: integer
        model:
          type: string
          description: The model (or `agent-turn`) the estimate is priced on.
        basis:
          type: string
          enum: [one_generation, agent_turn, set_run]
          x-enum-varnames: [PresetIntakeEstimateBasisOneGeneration, PresetIntakeEstimateBasisAgentTurn, PresetIntakeEstimateBasisSetRun]
        duration_seconds:
          type: integer
          description: The clip length the estimate assumes (video targets).
        quality:
          type: string
          description: The quality tier the estimate assumes, when the model has one.
    PresetIntakeContext:
      type: object
      additionalProperties: false
      required: [slug, intake, intake_from_parent, target, options, prompt_slots]
      description: What `GET /presets/{slug}/intake/context` returns; see that operation.
      properties:
        assembly:
          $ref: '#/components/schemas/PresetIntakeContextAssembly'
        slug:
          type: string
        intake:
          $ref: '#/components/schemas/PresetIntake'
        intake_from_parent:
          type: boolean
          description: '`true` when `intake` is the parent''s (the preset has none of its own).'
        target:
          $ref: '#/components/schemas/PresetIntakeContextTarget'
        model:
          allOf:
            - $ref: '#/components/schemas/PresetIntakeModelLimits'
          nullable: true
          description: The target model's limits; null for a `studio_intent` target or a model the registry does not know.
        options:
          type: array
          items:
            $ref: '#/components/schemas/PresetOption'
          description: The card's option chips, what `option:<key>` bindings resolve against.
        prompt_slots:
          type: array
          items:
            type: string
          description: The labelled slots found in the baked prompt, in order of first appearance (`THE MARK`, `THE STYLE`); empty for a `studio_intent`.
          examples: [['THE MARK', 'THE STYLE']]
        estimate:
          allOf:
            - $ref: '#/components/schemas/PresetIntakeEstimate'
          nullable: true
    PresetIntakeContextAssembly:
      type: object
      additionalProperties: false
      required: [doctrine, doctrine_from_parent, hold_credits]
      properties:
        doctrine:
          type: boolean
        doctrine_from_parent:
          type: boolean
        hold_credits:
          type: integer
          description: One credit held when doctrine is present; zero otherwise.
    AssemblePresetPromptRequest:
      type: object
      additionalProperties: false
      properties:
        answers:
          type: object
          additionalProperties: true
          description: Step id to an intake answer (text, string list, or table), using the same loose shapes as nolgia_run_preset.
        brief:
          type: string
          maxLength: 2000
        chips:
          type: array
          maxItems: 8
          items:
            type: string
          description: Card option labels; unknown labels are refused and repeated selections are deduplicated.
        reference_asset_ids:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
          description: Extra library image references, mapped to reference_asset_ids for images or element_asset_ids for video; refused for audio.
        count:
          type: integer
          minimum: 1
          maximum: 4
          description: How many prompts to write (1 to 4, 1 when omitted); more than one needs the preset's prompt doctrine.
        project_id:
          type: string
          format: uuid
    AssemblePresetPromptResponse:
      type: object
      additionalProperties: false
      required: [prompt, params, notes, mode, credits_charged, model, endpoint]
      properties:
        prompt:
          type: string
        negative_prompt:
          type: string
        params:
          type: object
          additionalProperties: true
          description: Generate body without prompt and negative_prompt. Its model is always the preset target model.
        notes:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [slot_fill, doctrine]
        credits_charged:
          type: integer
        model:
          type: string
          description: The preset target model, never the assembly writer model.
        endpoint:
          type: string
          example: POST /generate/image
        variants:
          type: array
          items:
            type: string
          description: Further complete prompts, count minus one, only when doctrine is present and count exceeds one.
        writer_model:
          type: string
        doctrine_from_parent:
          type: boolean
    PresetSuggestionsRequest:
      type: object
      additionalProperties: false
      properties:
        brief:
          type: string
          maxLength: 2000
          description: >-
            What the customer wants, in their own words: the brand, the mood, the occasion, anything. Optional; without it the suggestions are directions the preset itself is good for.
          examples: ['A cosy coffee roaster called Ember, warm and quiet, for the top of our YouTube videos']
        count:
          type: integer
          minimum: 3
          maximum: 5
          default: 4
          description: How many suggestions to return (3 to 5).
    PresetSuggestion:
      type: object
      additionalProperties: false
      required: [title, description, prompt, options, child_slug]
      description: One AI-written direction for a preset, tailored to the brief.
      properties:
        title:
          type: string
          maxLength: 60
          description: A short name for the direction.
          examples: ['Ember lantern']
        description:
          type: string
          maxLength: 200
          description: One or two plain-English sentences on what the customer would get.
        prompt:
          type: string
          maxLength: 1200
          description: >-
            A complete prompt the customer can run on this preset as it is, written to the preset's guardrails and runnable on its model.
        options:
          type: object
          additionalProperties:
            type: string
          description: >-
            The preset's option chips this direction picks, keyed by the chip's `label` with the chip's published `description` as the value. Only labels the preset's `options` publish appear; empty when the preset has no chips or the direction picks none.
          examples: [{'Whimsical': 'A small, gentle, slightly odd scene with a soft glow and a touch of wonder, resolving into your mark.'}]
        child_slug:
          type: string
          nullable: true
          description: >-
            The existing public child preset that is the best match for this direction, when there is one; `null` when the direction is new.
          examples: ['logo-racetrack-circuit']
    PresetSuggestionsResponse:
      type: object
      additionalProperties: false
      required: [suggestions, credits_charged, model]
      properties:
        suggestions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PresetSuggestion'
          description: >-
            The validated suggestions, at most `count`. A suggestion the model returned that failed validation (an unknown option, an over-long field, a real brand the brief never named) is dropped rather than repaired, so the list can be shorter than asked.
        credits_charged:
          type: integer
          description: >-
            Credits taken for this call: `ceil(provider cost / $0.018)` with a floor of 1. On the current brain a call is 1 credit.
          examples: [1]
        model:
          type: string
          description: The brain that wrote the suggestions.
          examples: ['deepseek-v4-flash']
    AgentDashboardTicket:
      type: object
      additionalProperties: false
      required: [iframe_url, expires_at]
      properties:
        iframe_url:
          type: string
          format: uri
          description: URL on the public dashboard host to load in an iframe; carries a single short-lived ticket.
          examples: ['https://dash.nolgia.ai/?ticket=eyJhbGciOi...']
        expires_at:
          type: string
          format: date-time
          description: When the embedded ticket stops being redeemable (~120s). The cookie session it mints lasts 12h.
    OAuthAuthorizationServerMetadata:
      type: object
      description: RFC 8414 authorization server metadata. Additional members may appear.
      required: [issuer, authorization_endpoint, token_endpoint, response_types_supported, code_challenge_methods_supported]
      properties:
        issuer:
          type: string
          format: uri
          description: >
            Must equal, byte for byte, the entry a connector read from the MCP server's protected-resource metadata. Clients compare it exactly and will not normalize a trailing slash or a differing case.

          examples: ['https://api.nolgia.ai']
        authorization_endpoint:
          type: string
          format: uri
          examples: ['https://api.nolgia.ai/oauth/authorize']
        token_endpoint:
          type: string
          format: uri
          examples: ['https://api.nolgia.ai/oauth/token']
        registration_endpoint:
          type: string
          format: uri
          examples: ['https://api.nolgia.ai/oauth/register']
        revocation_endpoint:
          type: string
          format: uri
          examples: ['https://api.nolgia.ai/oauth/revoke']
        response_types_supported:
          type: array
          items:
            type: string
          examples: [['code']]
        grant_types_supported:
          type: array
          items:
            type: string
          examples: [['authorization_code', 'refresh_token']]
        code_challenge_methods_supported:
          type: array
          description: Always contains `S256`. PKCE is required on every authorization.
          items:
            type: string
          examples: [['S256']]
        token_endpoint_auth_methods_supported:
          type: array
          description: Always `["none"]` — every client here is a public client with no secret.
          items:
            type: string
          examples: [['none']]
        revocation_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          examples: [['none']]
        scopes_supported:
          type: array
          items:
            type: string
          examples: [['mcp']]
        service_documentation:
          type: string
          format: uri
          examples: ['https://nolgia.com/mcp']
        authorization_response_iss_parameter_supported:
          type: boolean
          description: >
            RFC 9207. `iss` is returned on every authorization response, success and error alike, which is what lets a client detect a mix-up between two authorization servers.

          examples: [true]
    OAuthClientRegistrationRequest:
      type: object
      required: [redirect_uris]
      properties:
        client_name:
          type: string
          maxLength: 200
          examples: ['ChatGPT']
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 10
          description: >
            Absolute, fragment-free URIs. `https` is required unless the host is a loopback literal, which is how a native client receives its callback.

          items:
            type: string
            format: uri
          examples: [['https://claude.ai/api/mcp/auth_callback']]
        grant_types:
          type: array
          description: >
            When supplied, must include `authorization_code` to establish the connection; list `refresh_token` as well to be issued refresh tokens. Omitted means `authorization_code` alone (RFC 7591 §2). Unsupported grants are dropped from the response, not refused.

          items:
            type: string
          examples: [['authorization_code', 'refresh_token']]
        response_types:
          type: array
          items:
            type: string
          examples: [['code']]
        token_endpoint_auth_method:
          type: string
          description: Anything other than `none` is narrowed to `none` in the response, not refused.
          examples: ['none']
        scope:
          type: string
          examples: ['mcp']
        client_uri:
          type: string
          maxLength: 500
        logo_uri:
          type: string
          maxLength: 500
    OAuthClientRegistration:
      type: object
      description: >
        The registered client. No `client_secret` is ever issued; the absence of that member is what tells a client it is a public client.

      required: [client_id, client_id_issued_at, redirect_uris, grant_types, response_types, token_endpoint_auth_method]
      properties:
        client_id:
          type: string
          examples: ['mcp_x7Qd...']
        client_id_issued_at:
          type: integer
          format: int64
          description: Seconds since the Unix epoch.
        client_name:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        grant_types:
          type: array
          description: >
            The grants this client may use at the token endpoint: always `authorization_code`, plus `refresh_token` when the registration asked for it. Authoritative (RFC 7591 §3.2.1) and enforced.

          items:
            type: string
          examples: [['authorization_code', 'refresh_token']]
        response_types:
          type: array
          items:
            type: string
          examples: [['code']]
        token_endpoint_auth_method:
          type: string
          examples: ['none']
        scope:
          type: string
          examples: ['mcp']
    OAuthAuthorizationRequest:
      type: object
      description: A pending authorization, as the consent page renders it.
      required: [request_id, redirect_uri, scope, expires_at]
      properties:
        request_id:
          type: string
        client_name:
          type: string
          description: Self-reported by the client at registration; render it as untrusted text.
          examples: ['ChatGPT']
        client_uri:
          type: string
        logo_uri:
          type: string
        redirect_uri:
          type: string
          format: uri
        scope:
          type: string
          examples: ['mcp']
        resource:
          type: string
          description: RFC 8707 resource indicator the client asked for, if any.
        expires_at:
          type: string
          format: date-time
    OAuthAuthorizationDecisionRequest:
      type: object
      additionalProperties: false
      required: [request_id, approve]
      properties:
        request_id:
          type: string
        approve:
          type: boolean
    OAuthAuthorizationDecisionResponse:
      type: object
      additionalProperties: false
      required: [redirect_to]
      properties:
        redirect_to:
          type: string
          format: uri
          description: >
            Where the browser must be sent. On approval it carries `code`, `state` and `iss`; on denial, `error=access_denied`.

    OAuthTokenRequest:
      type: object
      description: >
        For `authorization_code`, supply `code` and `code_verifier`. For `refresh_token`, supply `refresh_token` instead. Identify the client using `client_id` or the HTTP Basic username.

      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
          description: >
            Required for `authorization_code`. Single use. A replay is refused with `invalid_grant`, indistinguishably from an unknown code.

        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: Required for `authorization_code`; not needed for `refresh_token`.
        refresh_token:
          type: string
          description: >
            Required for `refresh_token`. The single-use refresh token from a previous token response, issued to this client. A successful refresh consumes it; use the replacement from the response for the next refresh.

        client_id:
          type: string
          description: Identifies the client. May instead be carried as the HTTP Basic username.
        redirect_uri:
          type: string
          format: uri
          description: For `authorization_code`, must match the authorization request when supplied.
        resource:
          type: string
          format: uri
    OAuthTokenResponse:
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          description: >
            A personal API token (`nol_...`), listed and revocable in /settings/api-tokens like any other. No `expires_in` is returned: it remains valid until revoked, including during refresh rotation.

          examples: ['nol_1a2b3c4d...']
        token_type:
          type: string
          examples: ['Bearer']
        refresh_token:
          type: string
          description: >
            Single-use refresh token bound to the client. Present on both grants when the client registered for `refresh_token`; absent for a client registered for `authorization_code` alone. On a refresh response it replaces the submitted token, which must not be reused. Access and refresh tokens are issued atomically.

        scope:
          type: string
          examples: ['mcp']
    OAuthRevocationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Access token or refresh token to revoke. Possession is sufficient.
        token_type_hint:
          type: string
          description: Advisory only; either token type is accepted regardless of the hint.
          examples: ['access_token', 'refresh_token']
        client_id:
          type: string
          description: >
            Optional client identifier, also accepted as the HTTP Basic username. If supplied when revoking a refresh token, it must match the token's client; a mismatch returns a silent 200 without revoking anything.

    OAuthErrorResponse:
      type: object
      description: An RFC 6749 §5.2 error body. Distinct from the Problem responses used elsewhere.
      required: [error]
      properties:
        error:
          type: string
          examples: ['invalid_grant']
        error_description:
          type: string
    DeviceAuthRequest:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id:
          type: string
          minLength: 1
          maxLength: 64
          examples: ['nolgia-cli']
        scope:
          type: string
          nullable: true
          maxLength: 256
          examples: ['generate:* assets:read']
    DeviceAuthResponse:
      type: object
      additionalProperties: false
      required: [device_code, user_code, verification_uri, expires_in, interval]
      properties:
        device_code:
          type: string
          minLength: 1
        user_code:
          type: string
          minLength: 1
          examples: ['BDWP-HQPK']
        verification_uri:
          type: string
          format: uri
          examples: ['https://nolgia.ai/device']
        verification_uri_complete:
          type: string
          nullable: true
          format: uri
        expires_in:
          type: integer
          minimum: 1
          examples: [900]
        interval:
          type: integer
          minimum: 1
          examples: [5]
    DeviceApproveRequest:
      type: object
      additionalProperties: false
      required: [user_code]
      properties:
        user_code:
          type: string
          minLength: 1
          maxLength: 16
          examples: ['BDWP-HQPK']
    DeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [device_code, client_id]
      properties:
        device_code:
          type: string
          minLength: 1
        client_id:
          type: string
          minLength: 1
    DeviceTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Personal Access Token (prefix `nol_`).
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          examples: [2592000]
        scope:
          type: string
          nullable: true
