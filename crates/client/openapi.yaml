    GenerateVideoRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      properties:
        model:
          $ref: '#/components/schemas/VideoModel'
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: >-
            Text prompt. On reference-to-video models, address the supplied
            references as `@Video1`..`@Video3` and `@Image1`..`@Image9`, and
            optionally use `[0-3s]`-style timeline markers to time actions;
            these tokens are passed through verbatim (including inside
            multi-shot `shots[]` prompts).
        negative_prompt:
          type: string
          nullable: true
          maxLength: 4000
        image_url:
          type: string
          nullable: true
          format: uri
          description: Required for image-to-video models; ignored for text-to-video.
        end_image_url:
          type: string
          nullable: true
          format: uri
          description: >-
            Final-frame image (https URL) for start+end frame pinning on
            models that support it (Seedance 2.0 Pro i2v, Seedance 2.5,
            FLUX 3 Video, MiniMax Hailuo 3, MiniMax H3 Max i2v). See
            `references.end_frame` on `GET /models`, which is authoritative;
            Kling v3 i2v does not take an end frame.
            Requires `image_url` (the start frame). Mutually exclusive with
            `end_image_asset_id`.
        end_image_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your image assets to use as the final frame (server
            resolves it to a signed URL). Same semantics as `end_image_url`;
            provide at most one of the two.
        video_asset_ids:
          type: array
          nullable: true
          maxItems: 3
          description: >-
            Reference videos for models with `references.video_refs_max > 0`
            on `GET /models` (`fal-ai/bytedance/seedance/v2/pro/reference-to-video`;
            `minimax-h3` takes none), given as ids of your video assets — the server
            resolves each to a signed URL and forwards them as the provider's
            `video_urls`. Address them in the prompt as `@Video1`..`@Video3`
            (optionally with `[0-3s]`-style timeline markers). Provider
            constraints, enforced where asset metadata allows: at most 3
            videos combined with `video_urls`, MP4/MOV, 2–15 seconds
            combined; Seedance additionally requires 480p–720p input and 50MB
            total. This is the recommended way to pass reference videos.
          items:
            type: string
            format: uuid
        video_urls:
          type: array
          nullable: true
          maxItems: 3
          description: >-
            Raw https reference-video URLs, for callers that host media
            outside Nolgia. Counted against the same 3-video cap as
            `video_asset_ids` (external URLs cannot be validated for
            duration/size/resolution server-side — the provider rejects
            violations). Prefer `video_asset_ids`.
          items:
            type: string
            format: uri
        element_asset_ids:
          type: array
          nullable: true
          maxItems: 9
          description: >-
            Element/reference images for reference-to-video models, given as
            ids of your image assets — resolved to signed URLs and forwarded
            as the provider's `image_urls`. Address them in the prompt as
            `@Image1`..`@Image9`. At most 9 combined with `image_urls`.
            Images-only requests (no reference video) are allowed but bill
            at the model's full undiscounted rate — the published
            reference-to-video credit price assumes a reference video is
            attached (the provider's with-video discount).
          items:
            type: string
            format: uuid
        image_urls:
          type: array
          nullable: true
          maxItems: 9
          description: >-
            Raw https element-image URLs. Counted against the same 9-image
            cap as `element_asset_ids`. Prefer `element_asset_ids`.
          items:
            type: string
            format: uri
        audio_asset_ids:
          type: array
          nullable: true
          maxItems: 3
          description: >-
            Reference audio tracks for models with
            `references.audio_refs_max > 0` on `GET /models` (`minimax-h3`;
            Seedance 2.0 Pro r2v takes none, its primary route has no
            reference-audio slot), given as ids of your audio assets —
            resolved to signed URLs and forwarded as the provider's
            `audio_urls`. At most 3 combined with
            `audio_urls`; each track at most 15 seconds (enforced where the
            asset's stored duration allows).
          items:
            type: string
            format: uuid
        audio_urls:
          type: array
          nullable: true
          maxItems: 3
          description: >-
            Raw https reference-audio URLs. Counted against the same 3-track
            cap as `audio_asset_ids`. Prefer `audio_asset_ids`.
          items:
            type: string
            format: uri
        reference_voice_ids:
          type: array
          nullable: true
          maxItems: 3
          description: >-
            Preset voices for Grok Imagine 1.5 reference-to-video (models with
            `references.voice_refs_max > 0` on `GET /models`), each a `voice_id`
            from xAI's Text-to-Speech roster (for example `eve`, the default;
            case-insensitive, validated by xAI). Address them in the prompt as
            `<AUDIO_0>`..`<AUDIO_2>`. These are roster voice selections, NOT
            uploaded audio — unlike `audio_asset_ids`/`audio_urls`, which take
            your own audio tracks. At most 3. Reference audio is US-only /
            trusted-partners on xAI and caps output at 720p, so pairing voices
            with a 1080p quality tier is rejected. Forwarded upstream as the
            provider's `reference_audios` `[{voice_id}]`.
          items:
            type: string
            minLength: 1
        bitrate_mode:
          $ref: '#/components/schemas/BitrateMode'
        aspect_ratio:
          $ref: '#/components/schemas/AspectRatio'
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 60
          description: |
            Clip length in seconds. Omit it to let the server pick a duration
            the selected model actually renders: models with a discrete
            duration list (video.durations on GET /models) get the listed
            value nearest the 5s baseline (ties resolve upward, so Veo
            defaults to 6s), ranged models clamp the baseline into
            [min, max], and a request that attaches reference images takes
            the model's element_refs_duration_seconds pin (8s on Veo 3.1).
            An explicit value is validated strictly against the model's
            capabilities — note that 5 itself is not a valid Veo duration, so
            omit the field rather than sending the old baseline. The schema
            deliberately declares no `default`, so generated clients leave
            the field out instead of pinning 5.
        seed:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Reproducibility seed. Only meaningful on models whose provider
            actually takes one: check `video.seed` on `GET /models`, where
            `false` means the provider has no seed field and sending one is
            refused with a 400, and an omitted value means unverified. It is
            NOT a universal video option — most providers here have no seed
            in their API at all.
        generate_audio:
          type: boolean
          nullable: true
          description: |
            Ask the model to generate a synchronized audio track
            (dialogue/ambient/SFX).

            What this achieves is decided by the selected model's
            `video.audio` capability on `GET /models`, never by the provider's
            default: on `optional` models the flag is honored and OMITTING it
            resolves to `true`; on `none` models the clip is silent whatever
            you pass; on `always` models audio is native and
            `generate_audio: false` is refused with a 400. The delivered asset
            records the resolved outcome as
            `generation.generate_audio_effective`.
        quality:
          type: string
          nullable: true
          maxLength: 16
          description: >-
            Quality/resolution tier for the selected model (e.g. `720p`,
            `1080p`, `4k` on Seedance 2.0 Pro and Kling v3). Allowed values and per-tier
            credit costs are model-specific — see the model's
            `quality.options` on `GET /models`; the charge scales with clip
            duration like the base cost. Omit for the model's default tier at
            its base price. Rejected (400) when the model declares no quality
            tiers or the value is not one of its options.
          examples: ['4k']
        shots:
          type: array
          nullable: true
          minItems: 1
          maxItems: 8
          description: >-
            Multi-shot sequence: divide the clip into sequential shots, each
            with its own prompt, duration, and optional sound direction. The
            server composes a structured multi-shot prompt (the top-level
            prompt becomes overall style/context direction) and derives the
            clip duration from the shot durations; if duration_seconds is
            also set it must equal their sum. Best on Seedance, which cuts
            between shots natively.
          items:
            $ref: '#/components/schemas/VideoShot'
        tags:
          type: array
          maxItems: 10
          description: Applied to the resulting asset(s); normalized to lowercase.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        project_id:
          type: string
          format: uuid
          description: >-
            Files the generated asset into this project at creation (the
            async video asset lands in the project when the job completes).
            The project must exist and belong to the caller (400 otherwise).
            Honored on every auth channel (JWT and PAT), and takes precedence
            over server-side agent-session attribution.
        preset_slug:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            Slug of the preset this generation was launched from, if any. Set by
            the web app on preset-launched generations to enable server-side
            preset→usage attribution (the admin usage panel's top-presets
            leaderboard); omit on direct API/CLI/MCP/pipeline calls. Stored
            verbatim and NOT validated against the preset catalog (a preset may
            be deleted later).
          examples: ['cinematic-portrait']
        source_video_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Regenerate one of your completed videos at the model's top
            resolution: the referenced video asset is re-rendered at 2K via
            the provider's native regeneration flow (models with
            `video.regeneration` on `GET /models` — MiniMax Hailuo 3's
            768P→2K Video Regeneration). The source asset must have been
            generated by the same model and have a recorded duration; the
            output re-renders the full clip, so `duration_seconds`, `shots`,
            and `aspect_ratio` must be omitted (length and geometry follow
            the source) and `quality` must be omitted or `2k`. Reference
            videos (`video_asset_ids`/`video_urls`) cannot be combined with
            it. `prompt` should re-state the source generation's prompt (see
            the asset's `prompt` field). Billing covers the 2K output seconds
            PLUS the source clip's own input seconds at the 2k tier rate —
            e.g. a 5s source charges 130 credits (65cr/5s × 10 billed
            seconds).
          examples: ['b2fbb51e-3c33-4a54-b87b-9c2b1e4f9a11']
        character_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your characters (`GET /characters`). The character's
            `primary_reference_asset_id` is attached as an element reference
            (appended after any `element_asset_ids`/`image_urls`, so it takes
            the next `@Image` slot in the prompt) and its
            `canonical_description` rides into the prompt verbatim, keeping
            the character consistent between a still and a clip. The
            character must belong to the caller - an unknown or foreign id is
            a 400. Requires a model with room for one more element reference
            (`references.element_refs_max` on `GET /models`); a model that
            cannot carry the character reference is a 400, never a silent
            drop. The delivered clip is subject to the Aura ArcFace identity
            gate: frames sampled at 2fps are scored against the character's
            primary reference, the clip's `identity_score` is the best
            frame's cosine, and a clip under the 0.60 gate re-rolls
            automatically EXACTLY ONCE with the better attempt delivered
            either way (`identity_score` / `identity_gate_passed` /
            `identity_rerolls` on the video asset). When the scoring runtime
            is unavailable the clip delivers ungated with those fields null -
            the reference still conditioned the render. A character with no
            reference image contributes its description only; that clip is
            unscored.
          examples: ['5a2f7c58-9e5a-4f1a-9c7f-2f0b6c3d1e42']

    VideoShot:
      type: object
      additionalProperties: false
      required: [prompt, duration_seconds]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 15
        audio:
          type: string
          nullable: true
          maxLength: 500
          description: Sound-design direction for this shot (written into the composed prompt).

    RestoreVideoRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          $ref: '#/components/schemas/RestoreVideoModel'
        source_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your video assets to restore (the server resolves it to a
            signed URL). Exactly one of `source_asset_id` and `source_url`
            is required. When the asset's stored metadata carries a
            duration, billing uses it and `duration_seconds` is ignored.
        source_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Raw https URL of the footage to restore, for callers that host
            media outside Nolgia. Exactly one of `source_asset_id` and
            `source_url` is required. `duration_seconds` is required with a
            raw URL (the server cannot measure external media). Prefer
            `source_asset_id`.
        quality:
          type: string
          nullable: true
          maxLength: 16
          description: >-
            Target output resolution tier (`720p`, `1080p`, `1440p`,
            `2160p`, and `4320p` on the Topaz engines that support 8K). Omit
            for the model's default, which is `1080p` on every restore-lane
            model. The tiers are per-model: allowed values and per-tier
            credit rates are on the model's `quality.options` on
            `GET /models`, and a tier the selected model does not publish is
            rejected (400). The charge scales with the source clip length
            like a generation's does.
          examples: ['2160p']
        noise_scale:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: >-
            Detail-injection strength on `seedvr2-restore` (the provider's
            `noise_scale`; omit for the provider default, 0.1). Higher values
            recover more texture but hallucinate more; keep low for archival
            fidelity. The Topaz engines expose no equivalent control — the
            engine choice and the resolution tier are the whole input — so
            sending this field with a `topaz-*` model is rejected (400)
            rather than accepted and dropped.
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 120
          description: |
            Source clip length in seconds (round up), used to compute the
            credit charge before the job runs. Required when the source is a
            raw `source_url` or an asset without stored duration metadata;
            when the asset's stored duration is known the server bills from
            that instead and this field is ignored.
        source_fps:
          type: integer
          nullable: true
          minimum: 1
          maximum: 60
          description: >-
            Source frame rate. The provider bills per output frame, so the
            charge scales with the source's frame rate as well as its
            length: the published per-tier rates price 30 fps, and a higher
            declared rate scales the charge proportionally (60 fps costs
            twice a 30 fps clip of the same length). Values at or below 30
            are billed at the 30 fps basis, so declaring a slower rate never
            buys a discount. Footage above 60 fps is not supported (400) —
            downsample it before restoring.

            **Required on the `topaz-*` engines** (400 when omitted): their
            rates price the 30 fps basis exactly, and the server cannot
            measure a source clip's true frame rate, so the lane refuses to
            guess rather than under-reserve a 60 fps restore. Optional on
            `seedvr2-restore`, whose rates carry the headroom to absorb an
            undeclared faster source; omit it there for footage at or below
            30 fps.
        source_width:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Source frame width in pixels. Send with `source_height`.
          examples: [1080]
        source_height:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Source frame height in pixels. Send with `source_width`.

            The restored output KEEPS THE SOURCE'S ASPECT RATIO: the quality
            tier names a resolution class, and the class is resolved against
            these dimensions rather than a fixed 16:9 frame, so a 1080x1920
            vertical clip restored at `2160p` comes back 2160x3840 and a
            1440x1080 4:3 clip comes back 2880x2160. The output never exceeds
            the tier's nominal pixel area.

            **Required on the `topaz-*` engines** (400 when omitted) unless the
            source is an asset whose stored metadata already carries them. The
            server cannot measure an external clip's geometry, and guessing
            16:9 would both reshape footage that was never 16:9 and misprice
            the job — those engines run over the SOURCE's frames, so the charge
            tracks the source geometry as well as the output tier. Declared
            values win over an asset's stored metadata.

            Topaz sources are capped at DCI 4K (4096x2160 pixels); a larger
            master is rejected (400) rather than restored at a rate that does
            not cover it. Not used by `seedvr2-restore`, which resolves its
            own output geometry from the footage.
          examples: [1920]
        seed:
          type: integer
          nullable: true
          minimum: 0
        tags:
          type: array
          maxItems: 10
          description: Applied to the restored asset; normalized to lowercase.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['restored', 'archive']]
        project_id:
          type: string
          format: uuid
          description: >-
            Files the restored asset into this project at creation (the
            async asset lands in the project when the job completes). The
            project must exist and belong to the caller (400 otherwise).
        preset_slug:
          type: string
          nullable: true
          maxLength: 128
          description: >-
            Slug of the preset this restoration was launched from, if any.
            Same semantics as on `POST /generate/video`.

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]
      # Pin generated Go constant names (see SubscriptionStatus note).
      x-enum-varnames: [JobStatusQueued, JobStatusRunning, JobStatusSucceeded, JobStatusFailed, JobStatusCanceled]

    Job:
      type: object
      additionalProperties: false
      required: [id, user_id, modality, model, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        modality:
          $ref: '#/components/schemas/Modality'
        model:
          type: string
          examples: ['fal-ai/kling-video/v3/text-to-video']
        status:
          $ref: '#/components/schemas/JobStatus'
        status_detail:
          type: string
          nullable: true
          description: >-
            Machine-readable refinement of a non-terminal status.
            "provider_down" marks a queued job parked because its model
            provider is temporarily unavailable; the job resumes
            automatically when the provider recovers.
            "upstream_at_capacity" marks a queued job waiting for a free slot
            because the provider is at its ceiling for simultaneous
            generations; the provider is healthy and the job submits
            automatically as in-flight renders finish. Both are non-terminal
            and neither is an error: the job is still going to run, and the
            credit hold is not settled while it waits. Treat any unrecognized
            value as a plain queued job.
          examples: ['provider_down', 'upstream_at_capacity']
        status_message:
          type: string
          nullable: true
          description: >-
            Human-readable companion to status_detail, safe to render to the
            customer as-is.
        fal_request_id:
          type: string
          nullable: true
        agent_session_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The chat session whose agent turn caused this job
            (`jobs.agent_session_id`, stamped at submit). Null for jobs not
            created inside an agent turn and for jobs predating this
            attribution. Lets a client group a session's generations without
            inferring ownership from the account-wide feed.
        asset:
          oneOf:
            - $ref: '#/components/schemas/Asset'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
        progress:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          nullable: true
          format: date-time

    JobPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer
          description: Total number of jobs matching the status/modality filter, ignoring pagination.
    Asset:
      type: object
      additionalProperties: false
      required: [id, user_id, modality, model, signed_url, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this asset belongs to. Omitted for a personal asset. In organization context every teammate sees the asset; `user_id` still names who created it.
        modality:
          $ref: '#/components/schemas/Modality'
        model:
          type: string
        agent_session_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The chat session that produced this asset — the generating job's
            `agent_session_id`, or the agent upload's
            `metadata.agent_session_id` for job-less uploads (NOL-207). Null
            when the asset carries no session attribution. Populated on list
            responses (`GET /assets`) so a client can group a session's media
            directly instead of inferring it.
        display_name:
          type: string
          maxLength: 200
          description: >
            Human-readable display name. Always present in responses; empty
            string when unset. Set it at upload time (`POST /assets/uploads`)
            or later via `PATCH /assets/{id}`.
          examples: ['Hero shot v2']
        prompt:
          type: string
          nullable: true
        signed_url:
          type: string
          format: uri
          description: Time-limited GCS signed URL for download.
          examples: ['https://storage.googleapis.com/nolgia-generations-prod/u/abc/img/xyz.png?X-Goog-Signature=...']
        expires_at:
          type: string
          format: date-time
          description: Expiry of `signed_url`.
        mime_type:
          type: string
          examples: ['image/png']
        size_bytes:
          type: integer
          nullable: true
          minimum: 0
        width:
          type: integer
          nullable: true
          minimum: 1
        height:
          type: integer
          nullable: true
          minimum: 1
        duration_seconds:
          type: number
          nullable: true
          minimum: 0
          description: >
            Media duration in seconds for video/audio assets. Recorded at
            creation time for generated videos and backfilled asynchronously
            (ffprobe) for uploaded/legacy assets; null until known.
        has_audio:
          type: boolean
          nullable: true
          description: >
            Whether the asset's media carries an audio stream. `true` for audio
            assets and for video/audio media with an audio track; `false` for
            images and for video definitively without audio; `null`/absent when
            not yet probed (legacy/uploaded media awaiting the async media
            sweep) or not applicable. Recorded at creation for audio (`true`)
            and image (`false`) assets; video is determined by the sweep
            (ffprobe).
        waveform_peaks:
          type: array
          nullable: true
          description: >
            Downsampled, peak-normalized amplitude envelope of the asset's audio
            for client-side waveform rendering. Each value is the RMS amplitude
            of one contiguous window, normalized so the loudest window is `1.0`
            and rounded to 3 decimals; up to ~400 points for a full-length clip
            (fewer for very short clips). Present only for audio-bearing assets
            once the media sweep has computed it (ffmpeg PCM decode); `null` for
            assets with no audio or not yet probed. Populated on every asset
            read that carries it (list and single-asset).
          items:
            type: number
            minimum: 0
            maximum: 1
        thumbnail_url:
          type: string
          format: uri
          nullable: true
          description: Time-limited signed URL for a server-generated thumbnail (image downscale or video poster frame). Null when the asset has no thumbnail.
        tags:
          type: array
          maxItems: 10
          description: Free-form lowercase tags attached to the asset.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        status:
          $ref: '#/components/schemas/AssetStatus'
        favorite:
          type: boolean
          description: >
            User-curated favorite flag. Always present in responses; defaults
            to false. Set it via `PATCH /assets/{id}` and filter listings
            with `GET /assets?favorite=true`.
        projects:
          type: array
          description: >
            The asset's project memberships, newest membership first. Only
            returned by `GET /assets/{id}` (always present there, `[]` when
            the asset belongs to no project); omitted from list responses.
          items:
            $ref: '#/components/schemas/AssetProjectRef'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the asset was moved to the trash (soft-deleted). Omitted
            for live assets; only trash listings
            (`GET /assets?trashed=true`) return trashed assets. Trashed
            assets are purged permanently 30 days after this timestamp.
        mirrors:
          type: array
          description: >
            Bring-your-own storage mirror state per organization storage
            connection (Enterprise). Only returned by `GET /assets/{id}` for
            assets in an organization library with at least one connection;
            omitted otherwise.
          items:
            $ref: '#/components/schemas/AssetMirror'
        identity_score:
          type: number
          nullable: true
          minimum: -1
          maximum: 1
          description: >
            ArcFace-family cosine similarity against the generation's
            identity reference (Aura identity gate, NOL-462/NOL-542). On
            image assets generated with a `face_reference_asset_id`, the
            render's dominant face scored against that reference; on video
            assets generated with a `character_id`, the best frame sampled
            at 2fps scored against the character's primary reference. Both
            lanes gate delivery at >= 0.60 with one automatic re-roll.
            Absent when no identity reference rode the generation or scoring
            was unavailable.
          examples: [0.81]
        identity_rerolls:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1
          description: >
            Number of completed automatic identity re-rolls behind this
            render (0 or 1 — the gate re-rolls at most once, then delivers
            the better-scoring attempt). Present only alongside
            `identity_score`.
        identity_gate_passed:
          type: boolean
          nullable: true
          description: >
            Whether `identity_score` clears the 0.60 identity gate. A render
            can be delivered with `false` when both the original and the one
            automatic re-roll scored under the gate (the better attempt is
            delivered and labeled). Present only alongside `identity_score`.
        created_at:
          type: string
          format: date-time

    AssetProjectRef:
      type: object
      additionalProperties: false
      required: [id, name, is_default]
      description: A project an asset belongs to.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: ['Launch teaser']
        is_default:
          type: boolean
          description: True when this is the user's default "Library" project.

    IdentityScoreRequest:
      type: object
      additionalProperties: false
      required: [reference_asset_id, candidate_asset_id]
      properties:
        reference_asset_id:
          type: string
          format: uuid
          description: Image asset holding the reference face (must belong to the caller).
        candidate_asset_id:
          type: string
          format: uuid
          description: Image asset whose dominant face is scored against the reference (must belong to the caller).

    IdentityScoreResult:
      type: object
      additionalProperties: false
      required: [score, threshold, passes]
      properties:
        score:
          type: number
          minimum: -1
          maximum: 1
          description: ArcFace-family cosine similarity between the two dominant faces.
          examples: [0.81]
        threshold:
          type: number
          description: The Aura identity gate threshold (0.60).
        passes:
          type: boolean
          description: Whether `score` clears the gate (`score >= threshold`).

    AssetPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
        next_cursor:
          type: string
          nullable: true
        total:
          type: integer
          format: int64
          description: Total number of assets matching the request's filters across all pages.

    UpdateAssetRequest:
      type: object
      additionalProperties: false
      description: >
        Partial asset update. All fields are optional but at least one must
        be provided; omitted fields are left unchanged.
      properties:
        tags:
          type: array
          maxItems: 10
          description: Replaces the asset's full tag set. Tags are trimmed, lowercased, and de-duplicated.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        display_name:
          type: string
          maxLength: 200
          description: >
            Replaces the asset's display name (trimmed). An empty string
            clears it.
          examples: ['Hero shot v2']
        prompt:
          type: string
          maxLength: 4000
          description: >
            Overwrites the asset's prompt. Intended for backfilling
            provenance on uploaded assets (e.g. recording the prompt a file
            was generated from elsewhere).
        metadata:
          type: object
          description: >
            Merged into the asset's existing metadata object (existing keys
            not present in the patch are kept; patch keys overwrite). At most
            16 KiB serialized.
        favorite:
          type: boolean
          description: Sets (true) or clears (false) the asset's favorite flag.
    Character:
      type: object
      additionalProperties: false
      required: [id, user_id, name, description, reference_assets, created_at, updated_at]
      description: User-owned reusable subject for image/video generation.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this character belongs to. Omitted for a personal character.
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Captain Nova']
        description:
          type: string
          maxLength: 2000
          examples: ['A silver-haired astronaut with a scarred left cheek and a teal flight suit.']
        canonical_description:
          type: string
          maxLength: 2000
          description: |
            The character's canonical written description - the asset bible
            entry (face, hair, build, wardrobe, anchor) reused VERBATIM by
            every downstream generation. This is the continuity contract:
            downstream prompts must fold it in unchanged, never paraphrased.
            Falls back to `description` when the record predates this field.
            Optional in the schema only so existing clients keep parsing; the
            API always sends it (empty string when never set).
        primary_reference_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The reference asset that anchors the character's identity: sheet
            actions attach it as the character reference and identity scoring
            runs against it. Defaults to the first reference asset when unset.
        reference_assets:
          type: array
          maxItems: 8
          description: Reference images (image assets) in display order, each with a fresh signed URL.
          items:
            $ref: '#/components/schemas/Asset'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CharacterList:
      type: object
      additionalProperties: false
      required: [characters]
      properties:
        characters:
          type: array
          items:
            $ref: '#/components/schemas/Character'

    CreateCharacterRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Captain Nova']
        description:
          type: string
          nullable: true
          maxLength: 2000
        canonical_description:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            The canonical written description reused verbatim by downstream
            generations (see `Character.canonical_description`). Defaults to
            `description` when omitted, so every new character has one.
        primary_reference_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The identity-anchor reference. Must be one of
            `reference_asset_ids`. Defaults to the first reference asset.
        reference_asset_ids:
          type: array
          minItems: 0
          maxItems: 8
          description: IDs of existing image assets owned by the caller, in display order.
          items:
            type: string
            format: uuid

    UpdateCharacterRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        description:
          type: string
          nullable: true
          maxLength: 2000
        canonical_description:
          type: string
          nullable: true
          maxLength: 2000
          description: |
            Replaces the canonical written description (see
            `Character.canonical_description`) when provided.
        primary_reference_asset_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Replaces the identity-anchor reference when provided. Must name
            one of the character's reference assets after this update.
        reference_asset_ids:
          type: array
          nullable: true
          minItems: 0
          maxItems: 8
          description: Replaces the full set of reference images when provided.
          items:
            type: string
            format: uuid

    CharacterSheetKind:
      type: string
      enum: [split, turnaround, expression]
      description: |
        One-tap character-sheet scaffolds: `split` (full-body plus close-up
        split screen), `turnaround` (five consistent views: close up, medium,
        full front, side profile, back), `expression` (full-body reference
        plus an expression grid).

    CreateCharacterSheetRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/CharacterSheetKind'
        wearable_reference_asset_ids:
          type: array
          maxItems: 3
          description: |
            Image assets (owned by the caller) showing exact wearable items -
            garments, jewelry, eyewear, footwear - that must render EXACTLY as
            shown on the character in every view: never redesigned, restyled,
            recolored, or reinterpreted. They ride the generation as
            additional reference conditioning alongside the character's
            primary reference (the sheet lane carries up to 4 references
            total, so at most 3 wearables).
          items:
            type: string
            format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Files the generated sheet into this caller-owned project.

    AutopilotCharacterRequest:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Files the generated portrait into this caller-owned project.

    AutopilotCharacterResponse:
      type: object
      additionalProperties: false
      required: [job, canonical_description, axes]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        canonical_description:
          type: string
          description: |
            The rolled canonical written description. Store it on the
            character record unchanged when creating the character from this
            roll - it is the continuity contract for every downstream
            generation.
        axes:
          type: object
          additionalProperties:
            type: string
          description: |
            The variety-engine roll: all 8 axis values (heritage, age_band,
            hair_color, build, hair_style, eye_color, wardrobe, anchor).
            Consecutive rolls are guaranteed to differ on at least 2 of the 4
            core axes (heritage, age_band, hair_color, build).

    Project:
      type: object
      additionalProperties: false
      required: [id, user_id, name, description, asset_count, created_at, updated_at]
      description: User-owned grouping of assets; an asset can belong to multiple projects.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this project belongs to. Omitted for a personal project.
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Launch teaser']
        description:
          type: string
          maxLength: 2000
          examples: ['Assets for the spring launch teaser campaign.']
        asset_count:
          type: integer
          minimum: 0
          description: >
            Number of ready assets currently in the project (pending signed
            uploads are excluded until completion, matching the default asset
            listing).
        composition_count:
          type: integer
          minimum: 0
          description: Number of compositions currently linked to the project. Always present in responses.
        is_default:
          type: boolean
          description: >
            True for the user's default "Library" project: created on demand,
            it receives every new asset that is not explicitly filed into a
            project. Always present in responses. Read-only: it cannot be set
            via create or update requests (unknown request fields are
            rejected with 400).
        auto_tags:
          type: array
          maxItems: 10
          description: >
            Label set for the project. Auto-tags never move assets (the
            historical tag-overlap auto-filing is retired — assets join
            projects only by explicit project_id attribution); they flow into
            linked agent sessions as project context and are stamped onto
            session-attributed generations as searchable labels.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        favorite:
          type: boolean
          description: User-set favorite flag. Always present in responses.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the project was archived; omitted while active. Archived
            projects are hidden from the default listing but behave normally
            otherwise.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProjectList:
      type: object
      additionalProperties: false
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Launch teaser']
        description:
          type: string
          nullable: true
          maxLength: 2000
        auto_tags:
          type: array
          maxItems: 10
          description: Label set for the project (agent context + searchable labels; never a filing mechanism).
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]

    UpdateProjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        description:
          type: string
          nullable: true
          maxLength: 2000
        auto_tags:
          type: array
          nullable: true
          maxItems: 10
          description: Replaces the project's full auto-tag set when provided (labels/agent context only; never a filing mechanism).
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['hero', 'draft']]
        favorite:
          type: boolean
          nullable: true
          description: Sets the project's favorite flag when provided.
        archived:
          type: boolean
          nullable: true
          description: >
            `true` archives the project (idempotent; an existing archive
            timestamp is kept), `false` restores it. Omit to leave the archive
            state unchanged.

    AddProjectAssetsRequest:
      type: object
      additionalProperties: false
      required: [asset_ids]
      properties:
        asset_ids:
          type: array
          minItems: 1
          maxItems: 100
          description: IDs of existing assets owned by the caller.
          items:
            type: string
            format: uuid

    Collection:
      type: object
      additionalProperties: false
      required: [id, user_id, name, asset_count, created_at, updated_at]
      description: >
        User-named Library collection of assets. Many-to-many: an asset can
        live in any number of collections. Deleting a collection never
        deletes its assets.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this collection belongs to. Omitted for a personal collection.
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['Moodboard — spring campaign']
        asset_count:
          type: integer
          minimum: 0
          description: >
            Number of listable assets currently in the collection (pending
            signed uploads and trashed assets are excluded, matching
            `GET /collections/{id}/assets`).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CollectionList:
      type: object
      additionalProperties: false
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'

    CreateCollectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Collection name, unique per user (conflicts answer 409).
          examples: ['Moodboard — spring campaign']

    UpdateCollectionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: New collection name, unique per user (conflicts answer 409).
          examples: ['Moodboard — summer campaign']

    Composition:
      type: object
      additionalProperties: false
      required: [id, user_id, name, description, meta, created_at, updated_at]
      description: |
        HyperFrames-style HTML video composition: a user-owned bundle of files
        rendered by the web UI as a scrubbable timeline. Names are unique per
        user.
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >
            The organization whose shared library this composition belongs to. Omitted for a personal composition.
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['spring-launch-teaser']
        description:
          type: string
          maxLength: 2000
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Project the composition belongs to; omitted/null when unlinked. Deleting the project detaches the composition without deleting it.
        meta:
          type: object
          description: >
            Free-form composition metadata (mirrors the bundle's meta.json),
            e.g. duration, fps, scene list. By convention, compositions in a
            version series share a `series` string key and carry an integer
            `version` key; both are returned here verbatim in list and single
            responses.
        files:
          type: array
          nullable: true
          description: File inventory; present on the single-composition GET and clone responses, omitted from list responses.
          items:
            $ref: '#/components/schemas/CompositionFile'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CompositionFile:
      type: object
      additionalProperties: false
      required: [path, content_type, size_bytes, updated_at]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 200
          description: Relative path inside the bundle.
          examples: ['compositions/scene1.html']
        content_type:
          type: string
          examples: ['text/html']
        size_bytes:
          type: integer
          format: int64
          minimum: 0
        revision:
          type: integer
          minimum: 1
          description: >
            Monotonic per-file revision for optimistic-concurrency autosave.
            Bumped on every overwrite. Always present in responses. Send it
            back in the `If-Match` request header on the next
            `PUT /compositions/{id}/file` to detect a concurrent overwrite.
        updated_at:
          type: string
          format: date-time

    CompositionList:
      type: object
      additionalProperties: false
      required: [compositions]
      properties:
        compositions:
          type: array
          items:
            $ref: '#/components/schemas/Composition'

    CreateCompositionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          examples: ['spring-launch-teaser']
        description:
          type: string
          nullable: true
          maxLength: 2000
        project_id:
          type: string
          format: uuid
          nullable: true
          description: Existing project owned by the caller to link the composition to; an unknown or foreign project returns 404.
        meta:
          type: object
          nullable: true
          description: Free-form composition metadata (at most 64 KiB serialized).

    UpdateCompositionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
        description:
          type: string
          nullable: true
          maxLength: 2000
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Set to a project id to link the composition to that caller-owned
            project (an unknown or foreign project returns 404), or to `null`
            to unlink it. Omit the field to leave the link unchanged.
        meta:
          type: object
          nullable: true
          description: >
            JSON Merge Patch (RFC 7386) applied over the stored meta when provided:
            nested objects are merged recursively, a provided key overwrites that
            key's value, an explicit null deletes that key, and keys you omit are
            preserved. The merged result must be at most 64 KiB serialized.

    CloneCompositionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
          description: Name for the clone; defaults to the source name plus " copy". A duplicate name returns 409.
          examples: ['spring-launch-teaser v2']
        meta_patch:
          type: object
          nullable: true
          description: >
            Shallow-merged over the source meta (`source.meta || meta_patch`):
            top-level keys replace the source's keys wholesale. The merged
            result must serialize to at most 64 KiB. Typically used to bump
            `version` (and set `series`) under the version-series convention.
          examples: [{'series': 'spring-launch-teaser', 'version': 2}]

    PutCompositionFileRequest:
      type: object
      additionalProperties: false
      required: [content_base64, content_type]
      properties:
        content_base64:
          type: string
          minLength: 1
          maxLength: 35000000
          description: Base64-encoded file contents (max 25 MiB decoded).
        content_type:
          type: string
          minLength: 1
          maxLength: 255
          description: 'MIME type of the file. Allowed: text/html, text/css, application/javascript, application/json, image/*, video/*, audio/*, font/*.'
          examples: ['text/html']

    CompositionSignedUrlsRequest:
      type: object
      additionalProperties: false
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 200
          description: >
            Entries to sign: relative bundle paths of existing composition
            files, or `asset:<uuid>` references to the caller's own ready
            platform assets.
          items:
            type: string
            minLength: 1
            maxLength: 200

    CompositionSignedUrl:
      type: object
      additionalProperties: false
      required: [path, signed_url, expires_at]
      properties:
        path:
          type: string
          description: The requested entry, echoed back — a bundle path or an `asset:<uuid>` reference.
        signed_url:
          type: string
          format: uri
          description: Short-lived signed GET URL for the stored file or asset object.
        expires_at:
          type: string
          format: date-time

    CompositionSignedUrlsResponse:
      type: object
      additionalProperties: false
      required: [urls]
      properties:
        urls:
          type: array
          items:
            $ref: '#/components/schemas/CompositionSignedUrl'

    CreateRenderRequest:
      type: object
      additionalProperties: false
      description: Render request body. Empty today; `params` is reserved for future render options (fps, format, quality).
      properties:
        params:
          type: object
          nullable: true
          description: Reserved for future render options; must be empty or omitted today.

    RenderStatus:
      type: string
      enum: [queued, running, succeeded, failed]
      description: queued = waiting for the render job; running = job in progress; succeeded = asset_id set; failed = error set.

    Render:
      type: object
      additionalProperties: false
      required: [id, composition_id, user_id, status, params, warnings, created_at, updated_at]
      description: |
        One server-side MP4 export of a composition's effective timeline.
        `asset_id` references the produced platform asset once the render
        succeeds (null if the asset was later deleted). `warnings` lists
        timeline nodes the renderer skipped — the export completed, but those
        elements are not in the output.
      properties:
        id:
          type: string
          format: uuid
        composition_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RenderStatus'
        params:
          type: object
          description: Render options the row was enqueued with (reserved; empty today).
        asset_id:
          type: string
          format: uuid
          nullable: true
          description: The produced video asset, set when status is succeeded.
        warnings:
          type: array
          description: Human-readable notes about skipped/unsupported timeline nodes.
          items:
            type: string
        error:
          type: string
          nullable: true
          description: Failure reason, set when status is failed (truncated to 2000 characters).
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    RenderList:
      type: object
      additionalProperties: false
      required: [renders]
      properties:
        renders:
          type: array
          items:
            $ref: '#/components/schemas/Render'

    ActivityEventKind:
      type: string
      description: |
        What happened. `generation.*` events come from jobs
        (created_at/completed_at), `asset.created` from assets,
        `composition.updated` from compositions (updated_at), and
        `render.requested`/`render.finished` from renders
        (created_at/finished_at).
      enum:
        - generation.submitted
        - generation.succeeded
        - generation.failed
        - asset.created
        - composition.updated
        - render.requested
        - render.finished
      # Pin generated Go constant names (see SubscriptionStatus note).
      x-enum-varnames:
        - ActivityGenerationSubmitted
        - ActivityGenerationSucceeded
        - ActivityGenerationFailed
        - ActivityAssetCreated
        - ActivityCompositionUpdated
        - ActivityRenderRequested
        - ActivityRenderFinished

    ActivityEventRefs:
      type: object
      additionalProperties: false
      description: >
        Ids of the resources the event refers to. Only the ids that apply to
        the event kind are present; `project_id` is set when the event's
        composition is project-linked or when the feed was project-filtered.
      properties:
        job_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        composition_id:
          type: string
          format: uuid
        render_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        agent_session_id:
          type: string
          format: uuid
          description: >
            The chat session whose agent turn caused this event's job or
            asset — the job's `agent_session_id`, or an agent upload's
            `metadata.agent_session_id`. Present on generation and asset
            events attributed to a session; absent for events with no session
            attribution (compositions, renders).

    ActivityEvent:
      type: object
      additionalProperties: false
      required: [at, kind, summary, refs]
      properties:
        at:
          type: string
          format: date-time
          description: When the event happened (source-row timestamp).
        kind:
          $ref: '#/components/schemas/ActivityEventKind'
        summary:
          type: string
          maxLength: 160
          description: Server-built human-readable one-liner.
          examples: ['Video generation succeeded (fal-ai/kling-video/v3)']
        refs:
