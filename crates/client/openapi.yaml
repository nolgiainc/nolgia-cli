  /billing/transactions:
    get:
      tags: [Billing]
      operationId: listCreditTransactions
      summary: List the itemized credit ledger, newest first.
      description: >
        Every credit movement on the wallets the caller can spend from, as customer-facing rows: plan grants, top-ups, code redemptions, generation and agent-turn charges, refunds and adjustments, newest first, each with the running balance of its wallet after the row. In the personal space the rows are the caller's own wallets. Inside an organization they are the ORGANIZATION's wallets (the only pool spendable there): owner, admin and billing roles see every member's rows and may narrow them with `member_id`; member and viewer roles see only the rows they caused, and a `member_id` naming anyone else is `403`. A charge appears when the hold is taken (the debit IS the charge; a delivered generation writes no second row) and a hold that was released appears as a `refund` row for the same amount. `model` is the catalog id and `preset` the preset slug: the web labels model ids through its `modelLabel` helper, the API does not resolve them. Descriptions are plain language and never contain an em dash. `balance_after` is per wallet row (`wallet_id`), so an expired subscription cycle's leftover stays visible as the last balance of that cycle's wallet.

      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          required: false
          description: Rows per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: from
          in: query
          required: false
          description: Inclusive window start (RFC 3339). Omit for no lower bound.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive window end (RFC 3339). Omit for no upper bound.
          schema:
            type: string
            format: date-time
        - name: kind
          in: query
          required: false
          description: Only rows of this kind.
          schema:
            $ref: '#/components/schemas/CreditTransactionKind'
