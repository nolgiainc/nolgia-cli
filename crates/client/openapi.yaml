          $ref: '#/components/responses/ProblemResponse'
  /presets/{slug}/intake/context:
    get:
      tags: [Presets]
      operationId: getPresetIntakeContext
      summary: Everything the app needs to render a preset's guided intake flow in one read (signed in).
      description: |
        Returns the preset's resolved `intake` (its own, or its parent's when
        it has none) together with what the flow renders against: the target
        endpoint and model, the model's capability limits (reference image
        max, element/video/audio reference max, inpaint mask, start and end
        frame, character and face-reference support), the card's option chips,
        the labelled slots found in the baked prompt (`THE MARK`, `THE STYLE`,
        ...) and a credit estimate for ONE run at the default tier, priced by
        the same pricer the generate endpoints reserve with (a studio intent
        quotes the flat agent-turn rate; its generations bill separately).

        Signed in only (JWT or PAT). `404` when the preset does not exist, is
        private and the caller is not an admin, or has no intake to resolve.
      parameters:
        - $ref: '#/components/parameters/PresetSlug'
      responses:
        '200':
          description: The resolved intake and its rendering context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetIntakeContext'
              examples:
                imagePreset:
                  summary: A logo design preset on gpt-image-2.5-flare
                  value:
                    slug: 'logo-design'
                    intake_from_parent: false
                    intake:
                      version: 1
                      lucky: {enabled: true, label: 'Just make one'}
                      steps:
                        - {id: 'mark', kind: 'asset', label: 'Your current mark or sketch', help: 'Optional. A logo, a sketch or a reference we should stay close to.', required: false, modality: 'image', role: 'logo', min: 0, max: 1, accept: ['upload', 'library'], binds_to: 'reference_asset_ids'}
                        - {id: 'brand', kind: 'text', label: 'What is the brand?', help: 'The name, what it sells and the feeling it should give.', required: true, placeholder: 'Ember, a small coffee roaster: warm, quiet, honest', max_chars: 600, binds_to: 'prompt_slot:THE BRAND'}
                        - {id: 'style', kind: 'choice', label: 'Pick a style', required: true, multiple: false, default: 'wordmark', options: [{value: 'wordmark', label: 'Wordmark'}, {value: 'emblem', label: 'Emblem'}, {value: 'monogram', label: 'Monogram'}], binds_to: 'prompt_slot:THE STYLE'}
                      submit: {kind: 'generate'}
                    target: {kind: 'create_image', model: 'gpt-image-2.5-flare', endpoint: 'POST /generate/image'}
                    model: {id: 'gpt-image-2.5-flare', modality: 'image', reference_images_max: 4, element_refs_max: 4, video_refs_max: 0, audio_refs_max: 0, inpaint_mask: true, start_frame: true, end_frame: false, character: true, face_reference: true, aura_compatible: true}
                    options: [{label: 'Wordmark', description: 'The name set in type, nothing else.'}]
                    prompt_slots: ['THE BRAND', 'THE STYLE']
                    estimate: {credits: 22, model: 'gpt-image-2.5-flare', basis: 'one_generation', quality: 'native'}
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /presets/{slug}/assemble:
    post:
      tags: [Presets]
      operationId: assemblePresetPrompt
      summary: Assemble a preset's final generation prompt from intake answers.
      description: |
        Signed-in JWT or PAT callers can assemble a create_image, create_video
        or create_audio preset, including one whose intake submits through an
        agent. Studio-intent targets and targets without a model return 400;
        private presets return 404 to non-admin callers.

        Uses the resolved intake (own, otherwise parent's), its published model
        limits, prompt slots and card options to decode and validate answers.
        Fills the baked prompt, adds selected chips and references, then appends
        the brief. Image URL bindings resolve fresh signed URLs within the
        caller's library scope (404 outside it, 503 when resolution is unavailable).
        Assembly never changes the target model or generates media.

        Without authored prompt doctrine, returns slot_fill with zero credits,
        no rate limit and no AI call. A count above one adds a note explaining
        that variations need doctrine and returns no variants. With doctrine
        (own non-empty value, otherwise parent's), returns doctrine and writes
        the final prompt under that craft contract and the preset's guardrails,
        using model-aware guidance. Returned prompts preserve the customer's
        request and reference tokens and are checked for invalid placeholders,
        unsupported syntax and unnamed brands or people. Invalid replies are
        retried once; JSON mode falls back when unsupported. Negative prompts
        are returned only when the target model supports them and they validate.
        A count above one returns count minus one further complete prompts.

        Doctrine calls share the suggestions rate-limit window (429, or 503
        if unavailable), require an organization library writer, and reserve
        one credit (402 if insufficient). Settlement meters provider cost with
        a one-credit floor; provider or validation failure refunds the hold and
        returns 502. The ledger label is "Prompt assembly" plus the preset slug.
        params excludes prompt and negative_prompt and always retains the preset
        target model, regardless of anything the writer returns.
      parameters:
        - $ref: '#/components/parameters/PresetSlug'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssemblePresetPromptRequest'
            example:
              answers:
                subject: A ceramic teapot
              brief: Soft morning light
              count: 1
      responses:
        '200':
          description: The assembled prompt, generate parameters and actual charge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssemblePresetPromptResponse'
              example:
                prompt: 'THE SUBJECT: A ceramic teapot. Soft morning light'
                params:
                  model: gpt-image-2.5-flare
                  num_images: 1
                notes: ["Your answers were placed into the preset's own prompt as written."]
                mode: slot_fill
                credits_charged: 0
                model: gpt-image-2.5-flare
                endpoint: POST /generate/image
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /presets/{slug}/suggestions:
    post:
      tags: [Presets]
      operationId: suggestPresetDirections
      summary: Ask the AI for three to five directions tailored to a preset and the customer's brief (signed in; 1 credit).
      description: |
        Writes `count` (3 to 5, default 4) concrete directions for this
        preset from the customer's `brief`: a title, a one-line description,
        a complete runnable prompt and the option chips it picks, plus the
        slug of an existing public child when one is the best match. The
        system prompt is built from the preset's OWN card (name, description,
        best_for, guardrails as hard constraints, options, long description,
        use cases and its public children) plus standing law: never a real
        brand, logo, trademark or real person the customer did not name, no
        em dashes, no cent signs, plain English, prompts runnable on this
        preset's model. Every suggestion is validated against that contract
        and the option whitelist; one that fails is dropped, not repaired.

        Billed like a generation: a one-credit hold is taken before the call
        (`402` when the account cannot cover it), the call runs on the
        cheapest brain in the roster with strict JSON output (one retry on
        invalid JSON), and the hold settles at `ceil(provider cost / $0.018)`
        with a floor of 1 credit, refunded if the provider fails. The ledger
        row reads "Preset suggestions · {slug}". Rate limited to 20 calls per
        minute per account (`429`). Private presets `404` for non-admins, as
        on `GET /presets/{slug}`.
      parameters:
        - $ref: '#/components/parameters/PresetSlug'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetSuggestionsRequest'
            examples:
              brief:
                summary: A brief for the logo family
                value:
                  brief: 'A cosy coffee roaster called Ember, warm and quiet, for the top of our YouTube videos'
                  count: 3
      responses:
        '200':
          description: The validated suggestions and what the call charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetSuggestionsResponse'
              examples:
                logo:
                  summary: Three directions for "Animate your logo"
                  value:
                    suggestions:
                      - title: 'Ember lantern'
                        description: 'A paper lantern glows awake in a dark cafe window and its light settles into your mark.'
                        prompt: 'Studio ident, 16:9, one continuous shot with no cuts. THE MARK: the customer''s Ember mark, matching the reference exactly. THE SCENE: a single paper lantern in a dark cafe window flickers awake, its warm light spreading across the glass until the glow tightens into the shape of the mark. THE MOOD: whimsical, warm and quiet, late evening. THE RESOLVE: the mark holds still and centred with clear room beneath it for a wordmark. No letters, words or numbers anywhere. Soft paper rustle and one warm settle tone, no music. No on-screen text, no watermark.'
                        options:
                          Whimsical: 'A small, gentle, slightly odd scene with a soft glow and a touch of wonder, resolving into your mark.'
                        child_slug: null
                      - title: 'Racetrack ident'
                        description: 'Your mark laid out as a toy race circuit, a chase behind the pack, then the top down reveal.'
                        prompt: 'Toy racing flythrough, 16:9, one continuous aerial shot with no cuts. A closed race circuit whose plan shape is the customer''s Ember mark, matching the reference exactly, on a warm sunset landscape. A pack of small cartoon race cars runs it nose to tail. The camera flies a chase behind the pack, then climbs until the whole circuit reads as the mark from above. No letters, words or numbers anywhere. Engine hum and a light crowd murmur, no music. No on-screen text, no watermark.'
                        options:
                          Playful: 'Bright colours, bouncy timing and one visual gag that snaps into your mark.'
                        child_slug: 'logo-racetrack-circuit'
                      - title: 'Steam script'
                        description: 'Steam rises from a cup on a quiet counter and curls into your mark.'
                        prompt: 'Studio ident, 16:9, one continuous shot with no cuts. THE MARK: the customer''s Ember mark, matching the reference exactly. THE SCENE: a cup on a bare wooden counter at dawn, steam rising in slow ribbons that loop and close into the mark. THE MOOD: minimal, warm, hushed. THE RESOLVE: the mark holds still and centred with clear room beneath it for a wordmark. No letters, words or numbers anywhere. A soft room tone and one warm settle tone, no music. No on-screen text, no watermark.'
                        options:
                          Minimal: 'One shape, one move, one sound on a clean ground, resolving into your mark with nothing else in frame.'
                        child_slug: null
                    credits_charged: 1
                    model: 'deepseek-v4-flash'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /color-presets:
    get:
      tags: [ColorPresets]
