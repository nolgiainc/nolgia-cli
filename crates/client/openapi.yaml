openapi: 3.0.3
info:
  title: Nolgia API
  version: 0.1.0
  summary: Generative media platform (image, audio, video) — single contract for web, CLI, and MCP clients.
  description: |
    Nolgia API is the single backend serving the Nolgia website, Rust CLI, and MCP server.
    It orchestrates three generation paths:
      * **image** — synchronous (5–15s typical)
      * **audio** — long-poll synchronous (up to 900s)
      * **video** — asynchronous via job orchestrator
    All non-public endpoints require either an Auth.js bearer JWT (web) or a Personal Access Token (CLI/MCP).
  contact:
    name: Nolgia Engineering
    url: https://nolgia.ai
  license:
    name: Proprietary
    url: https://nolgia.ai/terms

servers:
  - url: https://api.nolgia.ai/v1
    description: Production
  - url: https://api.stg.nolgia.ai/v1
    description: Staging
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Auth
    description: Sign-in flows for CLI/MCP (device code) and current-user info.
  - name: Generate
    description: Image, audio, and video generation endpoints.
  - name: Models
    description: Model catalog and per-model capabilities.
  - name: Jobs
    description: Async job lifecycle (used primarily for video).
  - name: Assets
    description: Generated media stored in GCS with signed URLs.
  - name: Characters
    description: User-owned reusable subjects (name, description, reference images) for generation.
  - name: Projects
    description: User-owned groupings of assets; an asset can belong to multiple projects.
  - name: Collections
    description: |
      User-named Library collections: lightweight, user-curated groupings of
      assets for the Library navigator. Many-to-many — an asset can live in
      any number of collections — and membership is the only thing a
      collection owns: deleting a collection never deletes its assets.
      Collection names are unique per user (conflicts answer 409). Unlike
      projects, collections carry no compositions, agent context, or
      default-filing semantics.
  - name: Compositions
    description: |
      HyperFrames-style HTML video compositions: a bundle of files
      (index.html + compositions/*.html + assets/* + meta.json) authored by a
      user's Hermes agent and rendered by the web UI as a scrubbable timeline.
      The API stores the files in GCS and serves them back via short-lived
      signed URLs; it never renders or executes composition content.

      Version series convention: compositions that are versions of the same
      work share a `meta.series` string and carry an integer `meta.version`.
      These are ordinary meta keys — the API stores them verbatim and never
      assigns or increments them; clients own the numbering. Create a new
      version with `POST /compositions/{id}/clone` (typically bumping
      `meta.version` via `meta_patch`) and list a series with
      `GET /compositions?series=...`.
  - name: Activity
    description: |
      Read-only chronological feed of platform events (generations, assets,
      compositions, renders), assembled at read time from the underlying
      resources — nothing extra is stored to serve it.
  - name: Billing
    description: Subscription state and Stripe Customer Portal.
  - name: PAT
    description: Personal Access Token issuance and revocation.
  - name: Organizations
    description: |
      Team and enterprise organizations: memberships and roles, invites,
      verified email domains, the audit trail and organization-scoped API
      keys. A user works either in their personal space or inside ONE active
      organization (`PUT /me/active-organization`); the context is server
      state and is resolved at authentication time, so every credential the
      user holds follows it.
  - name: Agent
    description: Per-customer Hermes agent provisioning, usage, and chat relay.
  - name: Abilities
    description: Marketplace of admin-published ability packages that customer Hermes agents install and run.
  - name: Presets
    description: |
      Customer-facing, outcome-named workflow wrappers ("UGC ad", "Short film")
      that power the /presets page. Metadata only — no package content: a
      preset either deep-links into a creation endpoint (`create_image` /
      `create_video` / `create_audio` targets with `{prompt, model}` params) or
      hands off to the Studio agent lane (`studio_intent` with `{intent}`).
      A preset may reference the marketplace ability powering it via
      `ability_slug`. Admin-managed and mutable by slug (no versions);
      visibility-gated like abilities.
  - name: ColorPresets
    description: |
      Built-in color-grade presets ("LUT looks") for studio compositions.
      The catalog is embedded in the service (no database) and identical for
      every caller. Grades attach to compositions as `data-color-grade`
      attributes — per timed element, and on the canvas element for the whole
      frame — and as `colorGrade` fields in the `nolgia-edits.json` overlay;
      the render job bakes them into the exported MP4.
  - name: Masks
    description: |
      Per-clip timeline masks (Adobe Premiere's Opacity masks): a `rectangle`,
      `ellipse`, or `polygon` shape with `feather`, `expansion`, `opacity`, and
      `inverted` controls that hides part of one visual clip so the layers
      beneath show through. Masks attach to compositions as `data-mask`
      attributes on timed elements and as `mask` fields in the
      `nolgia-edits.json` overlay (`elements.<key>.mask`, `additions[].mask`,
      object-level replacement — `{}` clears); the Studio preview applies
      them live and the render job bakes them into the exported MP4. The
      sanitizer (`POST /masks:validate`) is public and stateless: it reports
      exactly what the renderer will draw.
  - name: Admin
    description: >
      Internal admin-only debugging surfaces. Invisible to non-admin callers
      (reads return 404), and every successful read is audit-logged with the
      calling admin's email.
  - name: Health
    description: Service health probes.

security:
  - bearerAuth: []
  - patAuth: []

paths:

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /models:
    get:
      tags: [Models]
      operationId: listModels
      summary: List available models and their capabilities.
      responses:
        '200':
          description: Model catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /providers/status:
    get:
      tags: [Models]
      operationId: listProviderStatus
      summary: List generation provider availability.
      description: >-
        Reports each video generation provider's current availability as seen
        by the platform's hard-down detector: "degraded" while ~all recent
        submissions to the provider are failing server-side (jobs targeting
        it are parked and resume automatically on recovery), otherwise
        "operational". Clients use this to explain a "provider_down" job
        status instead of showing a generic failure.
      responses:
        '200':
          description: Provider availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderStatusList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the currently authenticated user.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /me/settings:
    get:
      tags: [Auth]
      operationId: getUserSettings
      summary: Get the current user's notification settings.
      responses:
        '200':
          description: Notification settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    put:
      tags: [Auth]
      operationId: putUserSettings
      summary: Update the current user's notification settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsRequest'
      responses:
        '200':
          description: Updated notification settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /me/active-organization:
    put:
      tags: [Organizations]
      operationId: putActiveOrganization
      summary: Switch the current user between their personal space and one of their organizations.
      description: >
        Sets `users.active_organization_id`. This is SERVER state, so the web
        app, CLI, MCP and the user's agent credentials all follow it on their
        next request. `organization_id: null` returns to the personal space.
        The user must be a member of the organization (`404` otherwise).
        Answers the refreshed `User`, including `active_organization`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveOrganizationRequest'
      responses:
        '200':
          description: Updated current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List the organizations the current user belongs to, with their role in each.
      responses:
        '200':
          description: Memberships, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create a team organization owned by the current user.
      description: >
        Creates a `kind: team` organization with the caller as `owner`, makes it
        the caller's active organization and creates its default Library
        project. `slug` is derived from `name` when omitted. A taken slug
        answers `409`. Team billing (seats, Stripe) is attached afterwards
        through the web app; until then the organization has no subscription
        and is quota'd like a free account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get one organization the current user belongs to.
      responses:
        '200':
          description: The organization and the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags: [Organizations]
      operationId: updateOrganization
      summary: Update an organization's name or settings (owner or admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      summary: Soft-delete an organization (owner only).
      description: >
        Marks the organization deleted and returns every member to their
        personal space. Library rows keep their `organization_id` for the
        retention window; nothing is hard-deleted here.
      responses:
        '204':
          description: Organization deleted.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: listOrganizationMembers
      summary: List an organization's members (any member may read).
      responses:
        '200':
          description: Members, owner first then by join time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMemberList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationMemberUserId'
    patch:
      tags: [Organizations]
      operationId: updateOrganizationMember
      summary: Change a member's role or monthly credit budget (owner or admin).
      description: >
        `role` cannot be set to `owner` here (use transfer-ownership) and the
        current owner cannot be demoted. `monthly_credit_budget: null` removes
        the cap; omitting it leaves it unchanged. Promoting a viewer to a
        seat-consuming role is checked against `seat_limit` (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationMemberRequest'
      responses:
        '200':
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Organizations]
      operationId: removeOrganizationMember
      summary: Remove a member (owner or admin), or leave the organization (self).
      description: >
        The owner cannot be removed and cannot leave without first transferring
        ownership (`409`). A removed member whose active organization this was
        is returned to their personal space; their organization-scoped API
        keys stop authenticating immediately.
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Organizations]
      operationId: transferOrganizationOwnership
      summary: Transfer ownership to another member (owner only).
      description: The new owner must already be a member. The previous owner becomes `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          description: Organization with the new owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/invites:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: listOrganizationInvites
      summary: List pending invites (owner or admin).
      responses:
        '200':
          description: Pending invites, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInviteList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Organizations]
      operationId: createOrganizationInvite
      summary: Invite an email address to the organization (owner or admin).
      description: >
        Creates a 7-day invite and emails the link when mail is configured
        (best effort). The plaintext `token` and `invite_url` are ALSO returned
        once here so the UI can offer a copy link; they are never readable
        again. When `seat_limit` is set, seat-consuming members plus pending
        seat-consuming invites must stay below it (`409` with title
        `Seat limit reached`); `viewer` invites never count. One pending
        invite per address (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationInviteRequest'
      responses:
        '201':
          description: Invite created; `token` is returned once and never again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationInviteResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/invites/{invite_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationInviteId'
    delete:
      tags: [Organizations]
      operationId: revokeOrganizationInvite
      summary: Revoke a pending invite (owner or admin).
      responses:
        '204':
          description: Invite revoked.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/invites/{invite_id}/resend:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationInviteId'
    post:
      tags: [Organizations]
      operationId: resendOrganizationInvite
      summary: Rotate a pending invite's token, extend its expiry and re-send the email (owner or admin).
      responses:
        '200':
          description: Invite with a fresh `token`, returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrganizationInviteResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /invites/{token}:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    get:
      tags: [Organizations]
      operationId: getInvitePreview
      summary: Public preview of an invite (no authentication).
      description: >
        Shows enough for the accept page to render before sign-in: the
        organization name, who invited, the masked invitee address, the role
        and the expiry. `status` says whether the invite can still be
        accepted. Unknown tokens answer `404`.
      security: []
      responses:
        '200':
          description: Invite preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /invites/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InviteToken'
    post:
      tags: [Organizations]
      operationId: acceptInvite
      summary: Accept an invite as the signed-in user.
      description: >
        The signed-in account's email must match the invited address
        (case-insensitive; `403` otherwise). Creates the membership with the
        invited role, and makes the organization active when the user has no
        active organization yet. Expired, revoked or already-accepted invites
        answer `410`.
      responses:
        '200':
          description: The new membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '410':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/domains:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: listOrganizationDomains
      summary: List the organization's claimed email domains (owner or admin).
      responses:
        '200':
          description: Domains, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomainList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Organizations]
      operationId: addOrganizationDomain
      summary: Claim an email domain (owner or admin); returns the DNS TXT record to publish.
      description: >
        Publish a TXT record named `_nolgia.<domain>` with the value
        `nolgia-verification=<verification_token>`, then call `verify`. A
        domain already VERIFIED by another organization answers `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddOrganizationDomainRequest'
      responses:
        '201':
          description: Domain claimed (unverified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomain'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/domains/{domain}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationDomainName'
    patch:
      tags: [Organizations]
      operationId: updateOrganizationDomain
      summary: Toggle auto-join or SSO enforcement on a domain (owner or admin).
      description: >
        `sso_enforced` requires a verified domain on an `enterprise`
        organization (`402` with title `Upgrade Required` on a team
        organization; `409` while unverified).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationDomainRequest'
      responses:
        '200':
          description: Updated domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomain'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Organizations]
      operationId: deleteOrganizationDomain
      summary: Remove a claimed domain (owner or admin).
      responses:
        '204':
          description: Domain removed.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/domains/{domain}/verify:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/OrganizationDomainName'
    post:
