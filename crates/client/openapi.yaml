          $ref: '#/components/schemas/JobCostKind'
        image:
          $ref: '#/components/schemas/GenerateImageRequest'
        video:
          $ref: '#/components/schemas/GenerateVideoRequest'
        audio:
          $ref: '#/components/schemas/GenerateAudioRequest'
        three_d:
          $ref: '#/components/schemas/Generate3DRequest'
        set:
          $ref: '#/components/schemas/GenerateSetRequest'
    JobCostSetting:
      type: object
      additionalProperties: false
      required: [label, value]
      description: One row of the human-readable settings summary, ready to render in a confirmation dialog.
      properties:
        label:
          type: string
          examples: ['Duration']
        value:
          type: string
          examples: ['8s']
    JobCostQuote:
      type: object
      additionalProperties: false
      required: [kind, model, credits, basis, settings, confirmation_token, expires_at, sufficient_credits]
      description: |
        What a generation will cost, and the proof a client showed that price.
        `credits` is not an estimate: it is produced by the submit path's own
        pricer, running over this exact body, so a quote and a submit for the
        same body agree to the credit.
      properties:
        kind:
          $ref: '#/components/schemas/JobCostKind'
        model:
          type: string
          description: The model id the quote is for, after defaulting — not necessarily the one you sent.
        credits:
          type: integer
          description: >-
            Display credits. This is the number the submit will hold, computed by the same pricer the submit path uses, for exactly these settings. It is what to show the customer.
        basis:
          type: string
          enum: [one_generation, set_run]
          x-enum-varnames: [JobCostBasisOneGeneration, JobCostBasisSetRun]
          description: Whether `credits` covers one generation or a whole set run.
        members:
          type: integer
          nullable: true
          description: Number of set members `credits` covers. Present only when `basis` is `set_run`.
        duration_seconds:
          type: integer
          nullable: true
          description: The billed duration the price is for, on a video quote.
        quality:
          type: string
          nullable: true
          description: The resolved quality tier the price is for, when the model has one.
        settings:
          type: array
          items:
            $ref: '#/components/schemas/JobCostSetting'
          description: >-
            The settings that made this price, in the order a dialog should show them. Human-readable; do not parse it.
        balance_credits:
          type: integer
          nullable: true
          description: The wallet balance this quote was compared against, when one could be read.
        sufficient_credits:
          type: boolean
          description: Whether the balance covers `credits` right now. Advisory — the submit re-checks.
        confirmation_token:
          type: string
          description: >-
            Short-lived, single-request proof that this price was quoted. Send it back as `confirmation_token` on the matching generate request. Opaque: do not parse or construct it.
        expires_at:
          type: string
          format: date-time
          description: After this the token is refused and a submit carrying it fails with `confirmation_rejected`. Re-quote.
    GenerationErrorCode:
      type: string
      enum: [out_of_credits, rate_limit, prompt_nsfw, ip_detected, job_failed, timeout, validation, confirmation_rejected]
      x-enum-varnames: [GenerationErrorCodeOutOfCredits, GenerationErrorCodeRateLimit, GenerationErrorCodePromptNsfw, GenerationErrorCodeIpDetected, GenerationErrorCodeJobFailed, GenerationErrorCodeTimeout, GenerationErrorCodeValidation, GenerationErrorCodeConfirmationRejected]
      description: |
        Stable machine-readable class of a generation failure, on the
        `/generate/*` submit responses (as `error.code`) and on a failed job
        (as `failure.code`). The human-readable `detail`/`message` is
        unchanged and stays the text to show a customer; the code is what a
        client branches on. This is a closed enum today but treat an
        unrecognised value as `job_failed`.
        - `out_of_credits`: the wallet cannot pay for the job. Nothing was submitted and nothing was charged. Top up, or submit a cheaper model or fewer seconds.
        - `rate_limit`: refused for now, not refused outright — the caller's own concurrency ceiling, or the provider's. Retry later; the same request will be accepted.
        - `prompt_nsfw`: a content filter refused the request or the result it produced, on safety grounds. Editing the prompt or the reference media is the fix. Whether the credits were refunded is `failure.credits_refunded`, not this code.
        - `ip_detected`: a content filter refused it for a real person's likeness or a protected work, rather than for safety. The fix is different from `prompt_nsfw` — change the reference image or the named subject, not the tone of the prompt — which is why it is its own code.
        - `job_failed`: the job ran and did not produce an asset for any other reason, including a provider error. The default for an unclassified failure.
        - `timeout`: the job ran past its time budget, or a `GET /jobs/{id}/wait` returned before the job reached a terminal status. On a failed job the work is over; on a `wait` the job may still be running.
        - `validation`: the request itself is not acceptable — a missing or malformed field, a model that does not support the capability asked of it, a duration the model will not render. Nothing was submitted and nothing was charged. Retrying unchanged will fail identically.
        - `confirmation_rejected`: the cost confirmation gate did not pass. Either a client showed the customer a quote and the customer declined, or a supplied confirmation token was refused. A submit that carries no confirmation token is never refused for this reason.
    AgentMessageConflict:
      type: object
      additionalProperties: false
      required: [pending_agent_message_id]
      properties:
        code:
          $ref: '#/components/schemas/AgentErrorCode'
          description: Always `session_busy`.
        pending_agent_message_id:
          type: string
          format: uuid
          description: Id of the agent reply that is still pending for this user.
    AgentMessageAttachmentInput:
      type: object
      additionalProperties: false
      required: [asset_id]
      description: One asset attached to a submitted chat message.
      properties:
        asset_id:
          type: string
          format: uuid
          description: >
            Asset to attach. Must be owned by the caller and have status `ready` (`400` otherwise).

        kind:
          type: string
          enum: [file, voice]
          default: file
          description: >
            How the attachment was produced: `voice` marks a recorded voice note; `file` (the default) is any other uploaded file.

    AgentMessageAttachment:
      type: object
      additionalProperties: false
      required: [asset_id, kind]
      description: >
        One asset attached to a transcript message, with filename and content type denormalized from the asset at submit time.

      properties:
        asset_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [file, voice]
        filename:
          type: string
          description: Original filename of the attached asset, when known.
        content_type:
          type: string
          description: MIME type of the attached asset, when known.
    AgentMessageRole:
      type: string
      enum: [user, agent]
      description: Who authored the message.
    AgentMessageStatus:
      type: string
      enum: [pending, complete, failed, interrupted]
      description: >
        User messages are always `complete`; agent replies start `pending`. `interrupted` means the turn was stopped with `POST /agent/sessions/{id}/interrupt` before it settled; credits still held for it were returned.

    AgentQuestionOption:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
        description:
          type: string
    AgentQuestion:
      type: object
      additionalProperties: false
      required: [text, options]
      properties:
        text:
          type: string
          description: The closing question, one sentence ending in `?`.
        options:
          type: array
          description: The short option list the agent offered directly above the question, in order; empty when it offered none.
          items:
            $ref: '#/components/schemas/AgentQuestionOption'
    AgentMessage:
      type: object
      additionalProperties: false
      required: [id, role, content, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AgentMessageRole'
        content:
          type: string
          description: Message text. Empty while an agent reply is `pending` or when it `failed`.
        status:
          $ref: '#/components/schemas/AgentMessageStatus'
        error:
          type: string
          description: Failure reason, set when status is `failed` or `interrupted`.
        error_code:
          $ref: '#/components/schemas/AgentErrorCode'
          description: "Present on `failed` agent replies: the machine-readable class of `error`."
        question:
          $ref: '#/components/schemas/AgentQuestion'
          description: >
            Present on a `complete` agent reply whose last line is a question: the agent is waiting for your answer. Answer with a normal `POST /agent/messages` in the same session.

        user_message_id:
          type: string
          format: uuid
          description: For agent replies, the id of the user message that prompted them.
        session_id:
          type: string
          format: uuid
          description: >
            Chat session the message belongs to. Absent only on legacy/default-conversation rows created before sessionless submits began using an auto-created default session.

        steering:
          type: boolean
          description: >
            Present and true on user messages that were sent mid-turn as steering: they were recorded while another turn was in flight and delivered to the agent with the following turn. Absent means false.

        attachments:
          type: array
          description: >
            Assets attached to this message at submit time. Absent when the message carries no attachments.

          items:
            $ref: '#/components/schemas/AgentMessageAttachment'
        work_observed:
          type: boolean
          description: >
            Present on completed agent replies the platform evaluated. `false` means the turn completed without calling a tool or producing an asset; absent means the result was not determined.

        queued:
          type: boolean
          description: >
            Present and true on a `pending` agent reply that has not started executing yet: a user's turns execute in a bounded number of concurrent slots (one on older pods, currently up to 2 when the pod supports per-turn attribution), so a turn submitted while the slots are full waits its turn (FIFO by submit time). Absent once execution starts (and on settled rows) - render queued rows as "queued", not "thinking".

        feedback:
          $ref: '#/components/schemas/AgentMessageFeedback'
        cost:
          $ref: '#/components/schemas/AgentTurnCost'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          description: When the agent reply completed or failed. Absent while pending and on user messages.
    AgentTurnCost:
      type: object
      additionalProperties: false
      required: [credits, model, metered]
      description: >
        What one agent chat turn cost. A turn is billed on its ACTUAL provider cost and never less than the published per-turn rate for the brain it ran on: `credits = max(flat_rate(model), ceil(provider_cost_usd / 0.01))`. Most turns bill the flat rate, and for those `metered` is `false` and the token and cost fields are absent — the published rate is the whole explanation of the charge. A turn that reasoned for many iterations bills what it burned, and `metered` is `true` with the numbers that account for it.


        Absent on user messages, on pending replies, on failed replies (a failed turn is refunded in full), and on any turn that was not billed at all.

      properties:
        credits:
          type: integer
          description: >
            Credits this turn actually charged, in total. On the rare turn whose metered price exceeded the balance, this is what the account could cover, not what the turn priced at.

        model:
          type: string
          description: The brain the turn ran on, for example `kimi-k3`. Label it client-side.
        metered:
          type: boolean
          description: >
            `true` when `credits` came from the turn's measured provider cost rather than the flat per-turn rate — that is, when the turn cost more than its published rate.

        tokens:
          type: integer
          format: int64
          description: >
            Tokens the run reported across every iteration of its reasoning loop. Absent when the turn was not metered. It covers the main agent loop; delegated subagents and auxiliary passes are not included in the pod's report.

        provider_cost_usd:
          type: number
          format: double
          description: >
            Measured provider cost of `tokens` at the brain's rate, in US dollars. Absent when the turn was not metered.

    AgentMessageFeedbackRating:
      type: string
      enum: [up, down]
      x-enum-varnames: [AgentMessageFeedbackRatingUp, AgentMessageFeedbackRatingDown]
      description: Thumbs up or thumbs down on an agent reply.
    AgentMessageFeedbackRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          $ref: '#/components/schemas/AgentMessageFeedbackRating'
        note:
          type: string
          maxLength: 500
          description: >
            Optional free-text note, typically "what went wrong" on a thumbs down. Trimmed; a whitespace-only note is dropped. Longer than 500 characters is rejected with `400`.

    AgentMessageFeedback:
      type: object
      additionalProperties: false
      required: [rating, created_at, updated_at]
      description: The caller's recorded feedback on one agent reply.
      properties:
        rating:
          $ref: '#/components/schemas/AgentMessageFeedbackRating'
        note:
          type: string
          description: The note recorded with the rating; absent when none was given.
        created_at:
          type: string
          format: date-time
          description: When feedback was first recorded on this reply.
        updated_at:
          type: string
          format: date-time
          description: When the rating or note last changed.
    AgentMessageList:
      type: object
      additionalProperties: false
      required: [messages]
      properties:
        messages:
          type: array
          description: Transcript rows in chronological order (oldest first).
          items:
            $ref: '#/components/schemas/AgentMessage'
    AgentSessionInterrupt:
      type: object
      additionalProperties: false
      required: [session_id, interrupted, run_stopped, credits_released]
      properties:
        session_id:
          type: string
          format: uuid
        interrupted:
          type: boolean
          description: True when the session's newest turn is interrupted after this call, whether this call stopped it or an earlier one did.
        agent_message_id:
          type: string
          format: uuid
          description: The session's newest agent reply; absent when the session has no turns.
        status:
          $ref: '#/components/schemas/AgentMessageStatus'
          description: That reply's status after the call.
        run_stopped:
          type: boolean
          description: >
            True when the agent acknowledged the stop request for a running turn; false for a queued turn, a turn whose run had not started yet, a repeat call, or when the agent could not be reached (the turn is still marked interrupted and its reply is discarded).

        credits_released:
          type: integer
          description: Credits this call returned to the wallet from the turn's hold; 0 on repeat calls and for turns that had no hold.
    AgentSession:
      type: object
      additionalProperties: false
      required: [id, user_id, name, message_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          description: User-chosen session name.
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Project this session is scoped to, or null when unlinked. While linked, relayed turns carry the project's context (name and auto-tags) and assets created during a turn are associated to the project.

        preset_slug:
          type: string
          nullable: true
          description: >
            Preset this session runs under, or null. Soft reference by slug (like ability_slug): relayed turns gain the preset's guardrails and output context while the preset exists and is public; a later-deleted or held (private) preset is skipped gracefully.

        campaign:
          allOf:
            - $ref: '#/components/schemas/SessionCampaign'
          nullable: true
          description: >-
            The marketing attribution recorded when the session was launched, or null for an organic launch. Written once at creation and never updated: it describes how the session STARTED, so a later visit from another link cannot rewrite the credit. Marketing dimensions only, never a user identifier.
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: When the session was archived; null while active.
        message_count:
          type: integer
          description: Number of transcript messages filed under this session.
        last_message_at:
          type: string
          format: date-time
          nullable: true
          description: Creation time of the session's newest message; null while empty.
        last_turn_status:
          allOf:
            - $ref: '#/components/schemas/AgentMessageStatus'
          nullable: true
          description: >
            Status of the session's newest agent turn: `pending` while a production is still running (the session is actively producing), `complete`, `failed`, or `interrupted` once it settled. Null when the session has no agent turns yet. Lets a sessions list surface a live "producing" indicator and a finished/failed outcome without opening each session — the durable-run surface's find-your-run signal. Sessions run independently: several sessions may be `pending` at once (up to the concurrent execution cap executing, the rest queued — see `last_turn_queued`).

        last_turn_work_observed:
          type: boolean
          nullable: true
          description: >
            Whether the session's newest agent turn produced work: the `work_observed` verdict of that turn's reply (`false` means it completed without calling a tool or producing an asset, `true` means it did). Null while the last turn is pending or when unknown (a failed turn, a turn the platform did not evaluate, a session with no agent turns yet). Lets a sessions list say "replied" instead of "ready" for a chat that only answered, without opening its transcript.

        last_turn_queued:
          type: boolean
          nullable: true
          description: >
            True when the newest agent turn is `pending` but has not started executing: it is queued behind the user's other sessions' turns (a bounded number execute concurrently — currently up to 2 on pods with per-turn attribution, one otherwise — FIFO). Null or absent otherwise. Render queued sessions as waiting, not producing.

        last_turn_completed_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the newest agent turn settled (completed or failed). Null while that turn is still pending, and when the session has no agent turns yet.

        turn_status:
          type: string
          enum: [running, queued, idle, awaiting_input]
          description: >
            The session's coarse live activity, derived from `last_turn_status` + `last_turn_queued`: `running` while an agent turn is executing, `queued` while one waits for an execution slot, `idle` otherwise. Convenience for multi-session activity indicators (a sessions sidebar's status chips); live flips ride `GET /agent/sessions/{id}/events` as `session_status` frames. `awaiting_input` when the newest turn completed with a question for you (see `question`).

        question:
          $ref: '#/components/schemas/AgentQuestion'
          description: The newest turn's closing question while `turn_status` is `awaiting_input`; absent otherwise.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentSessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          description: Sessions newest first.
          items:
            $ref: '#/components/schemas/AgentSession'
    SessionCampaign:
      type: object
      additionalProperties: false
      description: |
        Marketing attribution for a chat-session launch: the five standard UTM
        dimensions a campaign link carries, and nothing else.

        This is a CLOSED set on purpose. It is written by the web app from the
        query string of a marketing link, so an open map would let arbitrary
        caller-supplied query params (an email address in a mistyped link, a
        session token pasted into a tracking parameter) become durable rows.
        Every member is an optional bounded string; the object is stored only
        when at least one is non-empty.

        These are campaign dimensions, not a user profile: nothing here
        identifies a person, and the admin aggregate that reads them counts
        launches without listing who made them.
      properties:
        source:
          type: string
          maxLength: 128
          description: '`utm_source` — where the click came from (e.g. `newsletter`, `x`, `partner-blog`).'
        medium:
          type: string
          maxLength: 128
          description: '`utm_medium` — the channel class (e.g. `email`, `cpc`, `social`).'
        campaign:
          type: string
          maxLength: 128
          description: '`utm_campaign` — the named campaign (e.g. `launch-week`).'
        content:
          type: string
          maxLength: 128
          description: '`utm_content` — which creative or placement within the campaign.'
        term:
          type: string
          maxLength: 128
          description: '`utm_term` — the paid keyword, for search campaigns.'
    CreateAgentSessionRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        project_id:
          type: string
          format: uuid
          description: Project (owned by the caller) to scope the session to.
        preset_slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          description: >-
            Preset to run the session under. Must name an existing public preset (400 otherwise); the agent receives the preset's guardrails and output context on every turn.
        campaign:
          allOf:
            - $ref: '#/components/schemas/SessionCampaign'
          description: >-
            Marketing attribution for this launch, when the session was started from a campaign link (`nolgia.ai/p/<slug>?utm_source=...`). Recorded on the session so a campaign can be measured against the launches it produced; ignored for anything else. Blank and whitespace-only members are dropped, and a campaign whose members are all blank is stored as absent.
    UpdateAgentSessionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        project_id:
          type: string
          format: uuid
          nullable: true
          description: New project link, or null to unlink. Omit to leave unchanged.
        archived:
          type: boolean
          description: true archives the session; false restores it.
    AgentStep:
      type: object
      additionalProperties: false
      required: [at, kind, title]
      properties:
        at:
          type: string
          format: date-time
          description: When the step occurred, used as the poll cursor.
        kind:
          type: string
          enum: [terminal, tool, file, message]
          description: |
            `terminal` — a shell command execution; `file` — a file read/write/search;
            `tool` — any other agent tool call; `message` — an assistant or user message.
        title:
          type: string
          description: Short human label, e.g. the tool name or a truncated command.
        detail_input:
          type: string
          description: >
            Input payload (e.g. the terminal command or tool arguments), secret-masked and size-capped: 4KB for a generic tool payload, 64KB for the agent's plan/todo payload (the checklist clients render). A payload that is a JSON document is masked and capped STRUCTURALLY so it stays parseable — values under credential-looking keys are replaced, and an over-cap document has trailing elements dropped from its longest array plus a `_truncated` object (`omitted_items`, `original_bytes`) recording what went missing, so a client can render the view as partial instead of silently showing a stale one. Non-JSON text is cut on a rune boundary with a trailing `…[truncated]` marker.

        detail_output:
          type: string
          description: >
            Output payload (e.g. captured terminal output or tool result), secret-masked and size-capped on the same rules as `detail_input`.

        refs:
          type: array
          description: Related identifiers surfaced by the step (e.g. file paths touched).
          items:
            type: string
    AgentStepList:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        attribution:
          type: string
          enum: [run, session]
          description: >
            How the returned steps were tied to their turn. `run`: read from the agent pod's own record of the turn's run, exact even when several of the account's turns execute at once. `session`: sliced by time from the pod's shared conversation, which the platform only does for a turn that ran with no other turn executing (older transports that carry no run id). Absent when no steps are returned or the turn could not be looked up. Steps persisted before 2026-09-19 may predate run attribution.

        steps:
          type: array
          description: Sanitized steps in chronological order (oldest first).
          items:
            $ref: '#/components/schemas/AgentStep'
    AgentSessionAsset:
      type: object
      additionalProperties: false
      required: [id]
      description: >
        One asset a chat session's agent turns produced, including turns still running or ones that failed before delivering. A light identity for the session gallery, not the full asset resource; fetch `GET /assets/{id}` for a fresh signed download URL and metadata.

      properties:
        id:
          type: string
          format: uuid
          description: The asset id.
        type:
          type: string
          description: The asset's media kind (e.g. `image`, `video`, `audio`).
        url:
          type: string
          description: The asset's stored object URL as recorded at creation (not a fresh signed URL).
        created_at:
          type: string
          format: date-time
          description: When the asset was created.
    AgentSessionAssetList:
      type: object
      additionalProperties: false
      required: [assets]
      properties:
        assets:
          type: array
          description: The session's produced assets, newest first.
          items:
            $ref: '#/components/schemas/AgentSessionAsset'
    AgentConfigEntry:
      type: object
      additionalProperties: false
      required: [key, value, secret, updated_at]
      properties:
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
          description: Environment variable name injected into the agent pod.
          examples: ['TELEGRAM_BOT_TOKEN']
        value:
          type: string
          description: Entry value. Redacted (empty string) for secret entries on customer endpoints; plaintext on the internal deploy-pipeline endpoint.
        secret:
          type: boolean
          description: Secret entries are write-only for customers — reads return an empty value.
        updated_at:
          type: string
          format: date-time
    AgentConfig:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/AgentConfigEntry'
    AgentConfigEntryInput:
      type: object
      additionalProperties: false
      required: [key, value]
      properties:
        key:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,63}$'
          description: Environment variable name. Platform-managed names (NOLGIA_TOKEN, OPENAI_API_KEY, API_SERVER_KEY, GNOSIS_*, HERMES_*, ...) are rejected. `HERMES_*` is a legacy reserved prefix from the agent runtime's original internal name; it is matched literally and is not a product name.
        value:
          type: string
          maxLength: 4096
        secret:
          type: boolean
          default: true
          description: Store as a secret (redacted on reads). Defaults to true.
    UpdateAgentConfigRequest:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/AgentConfigEntryInput'
          description: Entries to upsert. Existing keys not listed are left untouched; delete keys with `DELETE /agent/config/{key}`.
    AbilityVisibility:
      type: string
      enum: [public, private]
      x-enum-varnames: [AbilityVisibilityPublic, AbilityVisibilityPrivate]
      description: Audience of an ability. `public` abilities appear in the customer catalog; `private` abilities are invisible to non-admin callers (listings omit them, direct reads 404) and their content is only obtainable by admin accounts.
    AbilityAccess:
      type: string
      enum: [included, premium_addon]
      x-enum-varnames: [AbilityAccessIncluded, AbilityAccessPremiumAddon]
      description: |
        Commercial access model of an ability. `included` abilities are bundled with Studio at
        no extra cost. `premium_addon` abilities carry a standalone price (`price_cents` +
        `interval`) and are surfaced as paid add-ons. This is metadata only for now — no
        billing enforcement gates content download on `access` (min_tier still governs
        entitlement); it drives marketplace presentation and a future purchase flow.
    AbilityInterval:
      type: string
      enum: [month]
      x-enum-varnames: [AbilityIntervalMonth]
      description: Billing interval for a `premium_addon` ability's price. Only monthly is supported for now.
    AbilityMinTier:
      type: string
      enum: ['', starter, pro, studio, studio_min, studio_mid, studio_max]
      x-enum-varnames: [AbilityTierFree, AbilityTierStarter, AbilityTierPro, AbilityTierStudio, AbilityTierStudioMin, AbilityTierStudioMid, AbilityTierStudioMax]
      description: Minimum subscription tier required to install/download the ability. Empty (default) means free for any account.
    Ability:
      type: object
      additionalProperties: false
      required: [slug, name, description, required_env, credit_cost_hint, min_tier, visibility, entitled, access, has_code, latest_version, created_at, updated_at]
      properties:
        slug:
          type: string
          description: Marketplace identity of the ability; also the install directory name under `$HERMES_HOME/skills/` (the on-disk install root is unchanged for backward compatibility).
          examples: ['short-film']
        name:
          type: string
          examples: ['Short Film Production']
        description:
          type: string
        required_env:
          type: array
          items:
            type: string
          description: Environment variables the ability expects on the agent pod.
          examples: [['NOLGIA_TOKEN', 'NOLGIA_API_URL']]
        credit_cost_hint:
          type: string
          description: Free-text hint of how the ability spends credits.
        min_tier:
          type: string
          description: Minimum subscription tier required to install or download this ability's content. Empty means free for any account.
          examples: ['studio_min']
        visibility:
          $ref: '#/components/schemas/AbilityVisibility'
        entitled:
          type: boolean
          description: Whether the calling account may download this ability's content (subscription satisfies `min_tier`, or admin). Listings are metadata-only; content download is refused (402) when false.
        access:
          $ref: '#/components/schemas/AbilityAccess'
        price_cents:
          type: integer
          nullable: true
          minimum: 0
          description: For `premium_addon` abilities, the add-on price in cents. `null` for `included` abilities. Metadata only — no purchase flow enforces it yet.
          examples: [1500]
        interval:
          allOf:
            - $ref: '#/components/schemas/AbilityInterval'
          nullable: true
          description: For `premium_addon` abilities, the billing interval of `price_cents`. `null` for `included` abilities.
        has_code:
          type: boolean
          description: |
            True when the package carries a code payload — any file beyond the
            manifest files (`SKILL.md` and `ability.json`). Computed at publish
            time. Drives the marketplace "Package" vs "Ability"
            (instructions-only) kind badge.
        latest_version:
          type: string
          description: >-
            Latest published version by SEMVER ordering (highest major.minor.patch wins), not by publish time — a 1.0.1 published after a 1.2.0 does not become latest. Version strings that are not plain numeric triples (each field at most 18 digits) sort below every well-formed one, ordered among themselves by publish time.
          examples: ['1.0.0']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AbilityContent:
      type: object
      additionalProperties: false
