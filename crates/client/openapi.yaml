        Credits the organization actually paid for delivered work: CONSUMED reservations against the organization's wallets created in `[from, to)`, grouped by `group_by` (default `member`). Held and released holds are excluded. Defaults to the current UTC calendar month; the window may span at most 366 days. Owner, admin and billing roles see the whole organization; member and viewer roles see only their own spend. Non-members get `404`.

