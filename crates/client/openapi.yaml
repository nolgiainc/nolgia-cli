  /.well-known/oauth-authorization-server:
    get:
      tags: [Auth]
      operationId: getAuthorizationServerMetadata
      summary: OAuth 2.0 authorization server metadata (RFC 8414).
      description: >
        Unauthenticated by definition: an MCP connector fetches this before it holds any credential. It is the second hop of a connector handshake — the first is the MCP server's own protected-resource metadata (RFC 9728) at `https://mcp.nolgia.ai/.well-known/oauth-protected-resource`, whose `authorization_servers` entry points here.


        `code_challenge_methods_supported` carrying `S256` is not decorative: a connector that cannot find it treats this server as unsupported and refuses to connect at all.

      security: []
      responses:
        '200':
          description: Authorization server metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationServerMetadata'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /oauth/register:
    post:
      tags: [Auth]
      operationId: registerOAuthClient
      summary: Dynamic client registration for MCP connectors (RFC 7591).
      description: >
        Open registration, which is what "dynamic" means: an assistant that has never seen this server registers itself rather than asking a human for a client id. Every client registered here is a PUBLIC client with no secret whose only power is to send a user to a consent screen that user must approve while signed in, so a client id on its own grants nothing.


        The response is authoritative (RFC 7591 §3.2.1): a request asking for more than this server implements, such as a confidential `token_endpoint_auth_method`, succeeds and is answered with the narrowed set it actually got. When provided, `grant_types` must include `authorization_code`; `response_types` must include `code`. The `grant_types` answered are the ones the token endpoint enforces for this client: list `refresh_token` to be issued refresh tokens, since an omitted `grant_types` registers `authorization_code` alone.

      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegistrationRequest'
      responses:
        '201':
          description: Client registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientRegistration'
        '400':
          description: The registration metadata is unusable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /oauth/authorize:
    get:
      tags: [Auth]
      operationId: startOAuthAuthorization
      summary: Begin an OAuth 2.1 authorization-code flow (browser redirect).
      description: >
        Validates the connector's request, parks it, and redirects the browser to the web consent page, which hosts sign-in and the Allow/Deny step. Nothing is decided here — the user has not been seen yet.


        PKCE is mandatory: `code_challenge` with `code_challenge_method=S256`. An invalid `client_id` or `redirect_uri` is answered as a direct problem response rather than a redirect, because redirecting to an unvalidated URI is the open-redirect this rule exists to prevent; every other error is delivered to the validated `redirect_uri` as an OAuth error carrying `iss` (RFC 9207).

      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: false
          description: >
            Must match one the client registered. For a loopback redirect the port is ignored (RFC 8252 §7.3), because a native client binds an ephemeral port it could not know at registration time.

          schema:
            type: string
            format: uri
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: scope
          in: query
          required: false
          schema:
            type: string
        - name: resource
          in: query
          required: false
          description: >
            RFC 8707 resource indicator — the MCP server the token is for. Recorded on the authorization for audit; see `OAuthTokenResponse` for what the issued credential is scoped to.

          schema:
            type: string
            format: uri
      responses:
        '303':
          description: Redirect to the consent page, or to the client's redirect URI carrying an OAuth error.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: The client or redirect URI could not be validated, so no redirect was safe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /oauth/authorize/request:
    get:
      tags: [Auth]
      operationId: getOAuthAuthorizationRequest
      summary: Read a pending authorization so the consent page can render it.
      description: >
        Requires the user's own bearer, so an unauthenticated caller cannot enumerate pending authorizations.

      parameters:
        - name: request_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The pending authorization request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationRequest'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /oauth/authorize/decision:
    post:
      tags: [Auth]
      operationId: decideOAuthAuthorization
      summary: Record the signed-in user's Allow or Deny for a pending authorization.
      description: >
        Answers with the URL the browser must be sent to; the API never redirects here itself, because the consent page is a fetch client. Approving mints a single-use authorization code (only its digest is stored) and the response URL carries `code`, `state` and `iss`. Callers using agent PATs, turn tokens, or the legacy `X-Nolgia-Surface: hermes` header receive 403 with code `agent_cannot_authorize_credentials` and detail "The NOLGIA Agent cannot authorize new credentials. Do it in the app."

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizationDecisionRequest'
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationDecisionResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/CredentialAuthorizationForbidden'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /oauth/token:
    post:
      tags: [Auth]
      operationId: exchangeOAuthToken
      summary: Exchange an authorization code or refresh token for an access token.
      description: >
        Form-encoded per RFC 6749; a JSON body is also accepted because some MCP clients send one. The `authorization_code` grant requires `code` and a PKCE `code_verifier` matching the challenge recorded at authorization time. The `refresh_token` grant requires `refresh_token` instead, without a code or PKCE verifier. Identify the client with `client_id` in the body or the HTTP Basic username.


        The issued access token is a normal personal API token (`nol_...`), using the same billing channel, per-user cap and revocation UI as one created by hand. There is no `expires_in`: the access token remains valid until revoked, including replacement during refresh rotation.


        Both successful grants return an access token, plus a refresh token when the client registered for the `refresh_token` grant, issued atomically with consumption of the code or refresh token. A client registered for `authorization_code` alone is refused the refresh grant with `unauthorized_client`. A temporary issuance failure returns `503 temporarily_unavailable` with `Retry-After`, without issuing a PAT or consuming the code or refresh token. Retry the same grant after the indicated delay.


        Refresh tokens are single use and bound to the client. Store the replacement returned by each refresh rather than reusing the previous token. Replaying a spent refresh token revokes its family and associated access tokens; the connector must authorize again.

      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: Access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: The grant could not be redeemed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '503':
          description: >
            Temporarily unavailable. Token issuance was rolled back without issuing a PAT or consuming the authorization code or refresh token. Retry the same grant after the Retry-After delay.

          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                examples: [5]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
              example:
                error: temporarily_unavailable
                error_description: the token operation failed; retry the request
        default:
          $ref: '#/components/responses/ProblemResponse'
  /oauth/revoke:
    post:
      tags: [Auth]
      operationId: revokeOAuthToken
      summary: Revoke an access or refresh token issued to a connector (RFC 7009).
      description: >
        Answers `200` for an unknown, malformed or already-revoked token, as RFC 7009 §2.2 requires: any other answer would make this endpoint an oracle for guessing tokens.


        Possession of the refresh token is sufficient for revocation; no `client_id` is required. If supplied in the body or HTTP Basic username, the client identifier must match the refresh token's client. A mismatch returns a silent `200` without revoking anything. `token_type_hint` is advisory and does not restrict which token type can be revoked.


        Revoking a refresh token atomically revokes its entire refresh family and associated personal API tokens. Database failures return `503 temporarily_unavailable` with `Retry-After`, rather than falsely acknowledging revocation. Retry after the indicated delay.

      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthRevocationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRevocationRequest'
      responses:
        '200':
          description: Revocation processed. Returned whether or not a token was actually revoked.
        '400':
          description: The request could not be parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '503':
          description: >
            Temporarily unavailable. Revocation could not be completed due to an infrastructure failure. Refresh-family revocation is atomic, including associated PATs. Retry after the Retry-After delay.

          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                examples: [5]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
              example:
                error: temporarily_unavailable
                error_description: the token operation failed; retry the request
        default:
          $ref: '#/components/responses/ProblemResponse'
  /generate/image:
    post:
      tags: [Generate]
      operationId: generateImage
      summary: Submit an image generation job (asynchronous).
      description: |
        Returns immediately with a queued job. Use `GET /jobs/{id}` or
        `GET /jobs/{id}/wait` to track completion, then `GET /assets?job_id={id}`
        to retrieve the produced asset(s).

        **Duplicate submissions are refused, not billed.** Submitting the same
        request twice within five minutes returns `409` naming the job that
        already exists, so a lost response — a closed tab, a dropped
        connection, a timed-out request — cannot turn into a second charge.
        Send a distinct `Idempotency-Key` header to declare a deliberate new
        generation of an identical prompt; repeat the same key to make your
        own retries collapse onto one job.

        **Failures carry a machine-readable code.** A refusal sets `error.code` and a failed job sets
        `failure.code` to a `GenerationErrorCode`, so a client can branch without parsing prose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateImageRequest'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /generate/audio:
    post:
      tags: [Generate]
      operationId: generateAudio
      summary: Submit an audio generation job (asynchronous).
      description: |
        Returns immediately with a queued job. Use `GET /jobs/{id}` or
        `GET /jobs/{id}/wait` to track completion, then `GET /assets?job_id={id}`
        to retrieve the produced asset.

        **Duplicate submissions are refused, not billed.** Submitting the same
        request twice within five minutes returns `409` naming the job that
        already exists. Send a distinct `Idempotency-Key` header to declare a
        deliberate new generation of an identical prompt; repeat the same key
        to make your own retries collapse onto one job.

        **Text to speech is billed by the length of `prompt`**, in characters,
        not per request. `GET /models` publishes the meter for each voice as
        `cost.unit: per_character` with `cost.characters_per_credit` and
        `cost.minimum_credits`, and the charge is

          max(minimum_credits, ceil(characters / characters_per_credit))

        so a caller can price a script exactly before submitting it. Music and
        sound-effects models are billed per track (`cost.unit: per_generation`)
        and their prompt length does not change the price.

        **Failures carry a machine-readable code.** A refusal sets `error.code` and a failed job sets
        `failure.code` to a `GenerationErrorCode`, so a client can branch without parsing prose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAudioRequest'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /generate/video:
    post:
      tags: [Generate]
      operationId: generateVideo
      summary: Submit a video generation job (asynchronous).
      description: |
        Returns immediately with a job. Default model is Kling v3.0 text-to-video.
        Use `GET /jobs/{id}` or `GET /jobs/{id}/wait` to retrieve the final asset.

        **Duplicate submissions are refused, not billed.** Submitting the same
        request twice within five minutes returns `409` naming the job that
        already exists, so a lost response — a closed tab, a dropped
        connection, a `wait` that timed out — cannot turn into a second
        charge. Send a distinct `Idempotency-Key` header to declare a
        deliberate new take of an identical prompt; repeat the same key to
        make your own retries collapse onto one job.

        **Failures carry a machine-readable code.** A refusal sets `error.code` and a failed job sets
        `failure.code` to a `GenerationErrorCode`, so a client can branch without parsing prose.
      requestBody:
        required: true
