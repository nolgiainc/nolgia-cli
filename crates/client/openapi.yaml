      tags: [Collections]
      operationId: addCollectionAsset
      summary: Add an asset to a collection (idempotent).
      description: >
        The asset must exist, belong to the caller, and not be in the trash; otherwise 404. Adding an asset that is already in the collection is a no-op.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Asset is in the collection.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Collections]
      operationId: removeCollectionAsset
      summary: Remove an asset from a collection. The asset itself is not deleted.
      description: Removing an asset that is not in the collection is a no-op.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Asset removed from the collection (or was not a member).
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions:
    get:
      tags: [Compositions]
      operationId: listCompositions
      summary: List the current user's compositions, newest first.
      description: Listing omits per-composition files; fetch a single composition for its file inventory.
      parameters:
        - name: project_id
          in: query
          required: false
          description: Return only compositions linked to the given project.
          schema:
            type: string
            format: uuid
        - name: series
          in: query
          required: false
          description: >
            Return only compositions whose `meta.series` equals this value (the version-series convention). Series and version are part of each composition's `meta`, which list responses already include.

          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '200':
          description: Compositions owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Compositions]
      operationId: createComposition
      summary: Create an empty composition.
      description: Composition names are unique per user; a duplicate name returns 409. An optional `project_id` links the composition to a caller-owned project; an unknown or foreign project returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompositionRequest'
      responses:
        '201':
          description: Composition created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions/{id}:
    get:
      tags: [Compositions]
      operationId: getComposition
      summary: Fetch one of the current user's compositions, including its file inventory.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Composition found; `files` lists every stored file (path, content type, size).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    patch:
      tags: [Compositions]
      operationId: updateComposition
      summary: Update a composition's name, description, project link, or meta.
      description: Partial update; only provided fields change. Renaming to another composition's name returns 409; linking to an unknown or foreign project returns 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompositionRequest'
      responses:
        '200':
          description: Composition updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Compositions]
      operationId: deleteComposition
      summary: Delete a composition and all of its files.
      description: File rows are removed transactionally; the underlying GCS objects are deleted best-effort.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Composition deleted.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions/{id}/file:
    put:
      tags: [Compositions]
      operationId: putCompositionFile
      summary: Upload or overwrite one file in a composition.
      description: |
        Upserts the file at the relative bundle path given by the `path` query
        parameter (uploading the same path again overwrites it). The path is a
        query parameter rather than a path parameter because bundle paths
        contain slashes (e.g. `compositions/scene1.html`) and the generated
        chi router does not support greedy path parameters.

        Constraints: the path must be relative (no leading `/`), must not
        contain `.` or `..` segments, and is at most 200 characters; the
        decoded content is at most 25 MiB; a composition holds at most 200
        files; the content type must be one of text/html, text/css,
        application/javascript, application/json, or any image/*, video/*,
        audio/*, or font/* type.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: path
          in: query
          required: true
          description: Relative path of the file inside the bundle, e.g. `index.html` or `assets/vo.ogg`.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: If-Match
          in: header
          required: false
          description: >
            Optimistic-concurrency precondition: the `revision` the client last loaded for this file (plain integer or an ETag-quoted form). When it does not match the stored revision the write is rejected with 409 and the current revision in both the `ETag` response header and the problem detail. Omit for last-write-wins (existing behavior).

          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCompositionFileRequest'
      responses:
        '200':
          description: File stored.
          headers:
            ETag:
              description: The file's new `revision` after this write.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionFile'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          description: The file was modified concurrently; the current revision is in the ETag header and problem detail.
          headers:
            ETag:
              description: The file's current `revision`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Compositions]
      operationId: deleteCompositionFile
      summary: Delete one file from a composition.
      description: The GCS object is deleted best-effort. The `path` query parameter names the file (see putCompositionFile for why it is not a path parameter).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: path
          in: query
          required: true
          description: Relative path of the file inside the bundle.
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        '204':
          description: File deleted.
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions/{id}/files:signed-urls:
    post:
      tags: [Compositions]
      operationId: signCompositionFiles
      summary: Mint fresh signed GET URLs for composition files and referenced platform assets.
      description: |
        Returns a short-lived (15-minute) signed URL for each requested entry
        so the web UI can build the preview iframe. Every requested entry
        must resolve, otherwise 404 naming the entry.

        Each `paths` entry is either a relative bundle path naming an
        existing composition file, or a platform-asset reference of the form
        `asset:<uuid>` — the same scheme composition HTML may use in media
        `src` attributes (e.g. `<video src="asset:550e8400-...">`). Asset
        references resolve to the caller's own assets in status `ready` and
        return a signed GET URL for the asset's stored object; an unknown,
        foreign, or not-yet-ready asset returns 404 naming the entry. The
        `asset:` prefix is reserved: bundle file paths must not use it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompositionSignedUrlsRequest'
      responses:
        '200':
          description: One signed URL per requested path, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionSignedUrlsResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions/{id}/clone:
    post:
      tags: [Compositions]
      operationId: cloneComposition
      summary: Clone a composition, copying its full file bundle.
      description: |
        Creates a new composition owned by the caller from an existing one:
        the description, project link, and meta are copied, and every stored
        file is duplicated (rows and underlying GCS objects, via server-side
        copy) into the new composition — except `nolgia-edits.json`, which is
        intentionally skipped so a new version starts with a clean edit
        overlay.

        This is the version-series primitive: give the source composition a
        `meta.series` and `meta.version`, then clone with a `meta_patch`
        bumping `meta.version` to mint the next version. `meta_patch` is
        shallow-merged over the source meta (`source.meta || meta_patch`):
        top-level keys in the patch replace the source's keys wholesale.

        The clone's name defaults to the source name plus " copy" (truncated
        to fit 80 characters) unless `name` is provided; either way a name
        already used by another of the caller's compositions returns 409.
        An unknown or foreign composition returns 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloneCompositionRequest'
      responses:
        '201':
          description: Clone created; `files` lists the copied file inventory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Composition'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions/{id}/imports/figma:
    post:
      tags: [Compositions]
      operationId: importFigmaFrame
      summary: Import a Figma frame into a composition as text layers and PNG stills.
      description: |
        Requires a Figma personal access token (PAT) with `file_content:read`.
        The token is sent to Figma as `X-Figma-Token`, used for this request
        only, and never stored or logged. TEXT children become text layers;
        every other top-level child becomes a PNG still (scale 2) stored as
        an image asset in the composition's project. The response describes
        layers and does not modify the composition; the client writes its
        edit overlay. Available on every plan with composition write permission.

        Limited to 40 layers per import, returning 400 above that limit before
        anything is exported. Figma 401/403 returns 400 `Figma access denied`.
        Figma 404 or unknown node ids returns 404. Figma 429 returns 429 with
        `Retry-After` passed through. Other Figma failures return 502.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FigmaImportRequest'
      responses:
        '201':
          description: Imported layer descriptions and created image assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FigmaImportResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions/{id}/render:
    post:
      tags: [Compositions]
      operationId: createCompositionRender
      summary: Queue a server-side MP4 or single-frame PNG export of the composition's effective timeline.
      description: |
        Enqueues a render of the composition's *effective* timeline — the
        authored HTML timing plus the `nolgia-edits.json` overlay (v1/v2) — to
        an MP4 by default or a single-frame PNG with `target: still`, written
        back as a platform asset (tags `render` and
        `composition:<slug>`). Returns 202 immediately; poll
        `GET /renders/{id}` for completion. A Cloud Run job is triggered
        best-effort; if triggering fails the render stays `queued` and is
        picked up by the next scheduled job tick.

        **Still target.** Set `target: still` to render one frame as PNG using
        the same plan, clips, grades, masks, motion sampling, and text
        rasterization as the MP4 at that frame. The result is an `image/png`
        platform asset with the same `render` and `composition:<slug>` tags.
        It is asynchronous exactly like MP4: receive 202 and poll
        `GET /renders/{id}`. A still with `max_dimension` is a cheap way for
        an agent to inspect what a mutation did at a named timestamp and
        compare it against a reference at the same timestamp. Transparent
        background omits the renderer's black backdrop and preserves real
        PNG alpha wherever the timeline leaves the canvas uncovered.
        Native still resolution is capped at 3840x2160; an oversized canvas
        fails with its dimensions unless `max_dimension` brings it under
        that cap. A timestamp past the end renders the last frame and adds
        a warning naming the requested and rendered timestamps.

        **Supported timeline subset.** The renderer interprets *placement and
        visibility timing only* — it does not execute scripts or interpret
        GSAP tweens. From `index.html` and any `data-composition-src`
        sub-compositions it renders elements carrying
        `data-start`/`data-duration` (`data-track-index` = z-order,
        default 0):

        - `<video>`, `<audio>`, `<img>` whose `src` resolves to a composition
          file or is an `asset:<uuid>` reference to one of the owner's ready
          platform assets — video/img as visual clips (img = still with
          duration; the `muted` attribute is respected), audio mixed into the
          master track. Asset references are placed by the asset's actual
          modality; unresolvable references are skipped with a warning.
        - Edits overlay v2: element overrides (`start`/`duration`/`track`/
          `hidden`/`srcOffset`/`muted`) and additions (kind `media` with
          `assetId` or `path`; kind `text`). A `muted` element (or added
          clip) renders silent — its embedded audio is stripped. Optional
          top-level `tracks` toggles apply per section by a clip's effective
          track index: `tracks.video.<idx>.hidden` skips those clips,
          `tracks.video.<idx>.muted` strips their audio, and
          `tracks.audio.<idx>.muted`/`.hidden` drops those audio items from
          the mix. Hidden/muted items still reserve their timeline extent, so
          the exported duration is unchanged. The overlay's `unlinked` field
          is editor-only and ignored by the renderer.
        - Color grades (`data-color-grade` / overlay `colorGrade`, see the
          ColorPresets tag) and per-clip masks (`data-mask` / overlay
          `mask`, see the Masks tag and the `Mask` schema) are baked in:
          grades per clip then on the composited canvas; masks as the
          clip's alpha (video and image clips — a mask on a text clip is
          preview-only and recorded as a warning, on audio it is ignored).
        - Per-clip motion (overlay `motion` on element overrides and
          additions, see the Motion tag and the `Motion` schema): a video or
          image clip is fitted to the canvas, scaled about its anchor,
          rotated about its anchor, its anchor placed at `x`/`y` % of the
          canvas, then faded by `opacity`; the mask moves with the clip and
          the letterbox area of a moved clip is transparent. Keyframed
          properties are sampled at every output frame (`frame / fps`
          exactly, the same curves the Studio preview interpolates with;
          `hold` segments step at the next keyframe) and the whole chain is
          re-evaluated per frame, so a keyframed clip moves, scales, rotates
          and fades with its mask. A motion on a text clip is ignored with a
          warning (text additions are placed by their `textStyle`
          x/y/rotation/opacity, defaulting to the canvas center like the Studio
          preview; authored text elements keep the lower-third caption
          placement), on audio it is ignored.
        - Authored plain-text elements (an element whose content is plain text
          with no child elements) remain animated white-on-dark-pill captions
          with a safe-zone margin; authored CSS is NOT applied.
        - Text additions are NOT animated captions: they are rasterized as
          static text using Studio `textStyle`, including stroke, shadows,
          letter spacing, uppercase, and placement (x/y/rotation/opacity),
          with no entrance fade, no title animation and no dark pill behind
          the glyphs. An addition that carries no `textStyle` is rasterized
          with the default Studio style, centered on the canvas — the
          animated white-on-dark-pill treatment is reserved for authored
          plain-text elements. The 22 self-hosted Studio families are bundled
          and resolved by family name from the CSS stack. Each is one static
          instance, with synthetic emboldening or thinning for weight and a
          synthetic oblique for italic (reported in warnings). An unknown
          custom family falls back to Go fonts with a render warning; generic,
          system, and web-safe fallback names do not warn. Rendering rejects
          plans with more than 300 visible text additions before rasterization.
        - Text additions with a valid `textStyle.width` or `textStyle.height`
          also preserve their text box layout, on the same static raster path
          (a text box is never animated). Width and height are independently
          optional, positive finite native canvas pixels, including fractional values;
          they control layout rather than glyph scaling. Text wraps at Unicode
          line-break opportunities within the width, preserving whitespace and
          explicit newlines; unbreakable words and text beyond the height remain
          visible as overflow. Without a width, the box uses intrinsic
          shrink-to-fit sizing from the space remaining to the right of x%,
          capped at 80% of the canvas width; without a height, the box fits the
          wrapped lines. The same 22 bundled Studio families resolve from
          the CSS stack, with synthetic weight and oblique italic from each
          static instance. Unknown custom families use Go fallback fonts and
          record a warning (generic, system, and web-safe names do not warn).
          Authored CSS is NOT applied
          to either text rendering path.

        The canvas size comes from `data-width`/`data-height` on the root
        container, else the composition's `meta.width`/`meta.height`, else
        1920x1080. Everything else — styled `<div>`s,
        GSAP-only animation, unknown tags, unresolvable media — is skipped
        and recorded in the render's `warnings` array.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRenderRequest'
      responses:
        '202':
          description: Render queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Render'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions/{id}/renders:
    get:
      tags: [Compositions]
      operationId: listCompositionRenders
      summary: List the composition's renders, newest first (at most 20).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Renders for the composition, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /compositions/{id}/export:
    get:
      tags: [Compositions]
      operationId: exportComposition
      summary: Export the composition for editing in Premiere Pro, DaVinci Resolve or After Effects.
      description: |
        Builds a ZIP synchronously from the same render plan the MP4 export uses:
        authored timed elements plus the Studio edits overlay.
        `format=fcpxml` writes `sequence.xml` (Final Cut Pro 7 XML interchange,
        xmeml version 5, 30 fps, imported by Premiere Pro and DaVinci Resolve)
        plus text additions as PNG stills under `text/`.
        `format=aejsx` writes `build.jsx`, an ExtendScript After Effects runs from
        File > Scripts > Run Script File, with native text layers, keyframed transforms and masks.
        Both carry `luts/*.cube` for color grades and `README.txt` stating the fidelity limits.
        `manifest.json` lists every referenced media file in `media[]`: `ref`, `asset_id`,
        `path` relative to the export folder, a signed download `url` valid for one hour,
        and `expires_at`. Media bytes are NOT in the ZIP: the client downloads each
        `url` into its `path` next to the project.
        Authored HTML, CSS and GSAP animation never map.
        Returns 404 for an unknown or foreign composition; 400 for an unknown format;
        422 when the timeline has no exportable clips; and 413 when the bundle's
        documents exceed the export limits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CompositionExportFormat'
      responses:
        '200':
          description: "The export ZIP (`Content-Disposition: attachment`)."
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '413':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /renders/{id}:
    get:
      tags: [Compositions]
      operationId: getRender
      summary: Fetch one render, including its status, warnings, and produced asset id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Render found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Render'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /renders/blocks:
    post:
      tags: [Compositions]
      operationId: createBlocksRender
      summary: Assemble ordered clip and narration pairs into one MP4.
      description: |
        Pairs each video clip with its narration take, in order, in fixed-length
        blocks. A shorter take is centered in its block. A longer take is sped
        up with pitch-preserving atempo, up to 1.25x. A take longer than 1.25x
        the block is refused with a 400 naming the block and both asset ids.
        Videos are trimmed from their start or have their last frame held to
        fill the block, centered on the canvas. Video audio is muted unless
        `keep_video_audio` is true.

        Durations come from stored asset rows. If a duration is not recorded
        yet, the render job measures its downloaded copy of the stored object
        and records the duration. An overlong take discovered then fails the
        render instead of the request, with the same pair-specific reason.

        Creates a named carrier composition, linked to `project_id` when given.
        Its `index.html` is an editable approximation of the block timeline:
        sped-up narration plays at normal speed in the editor. The assembled
        MP4 is published as a platform asset in the composition's project.

        Accepts 1 to 60 blocks, each 2 to 30 seconds (fractions allowed), with
        at most 600 seconds total. Defaults to 10-second blocks and a 16:9
        canvas; 9:16 and 1:1 are also supported. Renders are not billed.
        Returns the queued render; poll `GET /renders/{id}` until it succeeds
        with `asset_id` or fails with `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBlocksRenderRequest'
      responses:
        '202':
          description: Blocks render queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Render'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /assets/{id}/share:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Sharing]
      operationId: listAssetShareLinks
      summary: List the active share links on an asset.
      description: >
        Every unrevoked, unexpired share link on the asset, newest first, for management (revoke). Tokens are stored hashed, so the list carries each link's id and `token_prefix` but never the token or the URL: a URL is returned exactly once, by the create call. The asset must be visible in the caller's library scope (`404` otherwise).

      responses:
        '200':
          description: Active share links, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Sharing]
      operationId: createAssetShareLink
      summary: Create a durable public share link for an asset.
      description: |
        Mints a random 128-bit token, stores only its hash, and returns the
        token together with the public `url` to hand out (the nolgia.ai share
        page, which renders link previews and plays or downloads the media)
        and its `expires_at`. Default lifetime is 30 days; pass
        `expires_in_days` (1..365) to change it. The token and URL are
        returned ONLY by this call.

        Authority follows the library scope rules: the asset must be visible
        in the caller's scope (`404` otherwise), read-only roles (viewer,
        billing) get `403 Read-only role`, and in an organization a member may
        share only assets they created while owners and admins may share any
        (`403 Forbidden`). Only `ready`, untrashed assets can be shared
        (`409`). Every creation is recorded (the link row itself carries the
        creator, and organization context also writes an organization audit
        event).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareLinkRequest'
      responses:
        '201':
          description: The new share link, carrying its token and public URL (returned once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLink'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /assets/{id}/share/{token}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/ShareToken'
    delete:
      tags: [Sharing]
      operationId: revokeAssetShareLink
      summary: Revoke a share link on an asset.
      description: >
        Revokes the link so the public resolver answers `410` from now on. `token` is the share token returned at creation, or the link's `id` from the listing (tokens are stored hashed, so the listing cannot hand the token back). The link's creator may revoke it, and so may anyone allowed to change the asset itself (its creator; organization owners and admins); other teammates get `403`, read-only roles `403 Read-only role`. Idempotent: revoking an already revoked link is `204`. A link that does not exist, or does not belong to this asset, is `404`.

      responses:
        '204':
          description: Link revoked (or already revoked).
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /renders/{id}/share:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Sharing]
      operationId: listRenderShareLinks
      summary: List the active share links on a render.
      description: >
        The render-flavoured twin of `listAssetShareLinks`: every unrevoked, unexpired share link on the render, newest first, without tokens or URLs. The render must be visible in the caller's library scope (a render is visible exactly when its composition is; `404` otherwise).

      responses:
        '200':
          description: Active share links, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Sharing]
      operationId: createRenderShareLink
      summary: Create a durable public share link for a finished render.
      description: |
        The render-flavoured twin of `createAssetShareLink`: the link resolves
        to the MP4 the render produced and its preview carries the
        composition's name as the title. Only a `succeeded` render whose
        output asset still exists can be shared (`409` otherwise). Same
        authority rules: the render must be visible in the caller's scope
        (`404`), read-only roles get `403 Read-only role`, and in an
        organization a member may share only renders they requested while
        owners and admins may share any (`403 Forbidden`).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareLinkRequest'
      responses:
        '201':
          description: The new share link, carrying its token and public URL (returned once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLink'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /renders/{id}/share/{token}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/ShareToken'
    delete:
      tags: [Sharing]
      operationId: revokeRenderShareLink
      summary: Revoke a share link on a render.
      description: >
        The render-flavoured twin of `revokeAssetShareLink`; `token` is the share token or the link's `id`. The link's creator may revoke it, and so may anyone allowed to change the render (its requester; organization owners and admins). Idempotent `204`; `404` when the link does not exist or does not belong to this render.

      responses:
        '204':
