  /billing/transactions/summary:
    get:
      tags: [Billing]
      operationId: getCreditUsageSummary
      summary: Credits used per day and totals per kind over a window.
      description: >
        The roll-up behind the billing page's usage chart, over the same rows and the same scoping rules as `GET /billing/transactions`. `credits_used` sums the generation, agent-turn and render charges (as a positive number), `credits_refunded` the refunds of those charges and `credits_added` the grants, top-ups and redemptions. `by_day` lists only UTC days with activity (fill the gaps client-side); `by_kind` carries the signed net and row count of every kind present. Defaults to the current UTC calendar month; the window may span at most 366 days.

      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive window start (RFC 3339). Defaults to the first instant of the current UTC month.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive window end (RFC 3339). Defaults to the first instant of the next UTC month.
          schema:
            type: string
            format: date-time
        - name: member_id
          in: query
          required: false
          description: Organization context only; same rules as on `GET /billing/transactions`.
          schema:
            type: string
            format: uuid
