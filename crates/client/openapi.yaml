  /masks:validate:
    post:
      tags: [Masks]
      operationId: validateMask
      summary: Sanitize a timeline mask and report what was clamped or dropped. Public and stateless — the same sanitizer the render job and the Studio preview apply.
      description: |
        Runs the platform's mask sanitizer over an arbitrary JSON value and
        returns the canonical sparse `Mask` the renderer would draw (or
        `null` when the value is not a drawable mask, or is the identity —
        a full-frame default rectangle), plus one `problems` entry per
        clamped, dropped, or undrawable field. Use it to lint authored
        `data-mask` attributes and overlay `mask` fields before a push: an
        authored value that produces problems renders differently from the
        author's intent.

        Sanitizer contract (identical in the Studio preview and the agent
        pipeline lint): unknown keys and non-numeric / non-finite numbers
        are dropped; numbers are clamped to range and rounded to 2 decimals;
        an unknown `shape`, or a `polygon` with fewer than 3 valid vertices,
        makes the whole mask absent; shape-irrelevant fields are dropped
        (`x`/`y`/`width`/`height`/`rotation`/`cornerRadius` on a polygon,
        `points` on a rectangle/ellipse, `cornerRadius` on an ellipse);
        fields equal to their default are dropped; a default full-frame
        rectangle (with or without `opacity`) is the identity and is
        reported absent (`mask: null`, `identity: true`).
      security:
        - {}
        - bearerAuth: []
        - patAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaskValidateRequest'
      responses:
        '200':
          description: The sanitized mask and its diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaskValidation'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /motion:validate:
    post:
      tags: [Motion]
      operationId: validateMotion
      summary: Sanitize a timeline motion and report what was clamped or dropped. Public and stateless, the same sanitizer the render job and the Studio preview apply.
      description: |
        Runs the platform's motion sanitizer over an arbitrary JSON value and
        returns the canonical sparse `Motion` the renderer would apply (or
        `null` when the value is not an object, or is the identity: the
        default fit-to-frame centered placement), plus one `problems` entry
        per clamped or dropped field. Use it to lint overlay `motion` objects
        before a push: a value that produces problems renders differently
        from the author's intent.

        Sanitizer contract (identical in the Studio preview): unknown keys
        and non-numeric / non-finite numbers are dropped; numbers are clamped
        to range and rounded to 2 decimals; a non-object `anchor` is dropped;
        fields equal to their default are dropped; an object whose every
        field is the default is the identity and is reported absent
        (`motion: null`, `identity: true`).
      security:
        - {}
        - bearerAuth: []
        - patAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotionValidateRequest'
      responses:
        '200':
          description: The sanitized motion and its diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionValidation'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth.js v5 JWT issued by nolgia.ai for browser sessions.
    patAuth:
      type: http
      scheme: bearer
      bearerFormat: PAT
      description: Personal Access Token (prefix `nol_`) for CLI and MCP clients.
  parameters:
    ArenaChallengeSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        maxLength: 80
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor returned by a prior response.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    JobId:
      name: id
      in: path
      required: true
      description: Job UUID.
      schema:
        type: string
        format: uuid
    PatId:
      name: id
      in: path
      required: true
      description: PAT UUID.
      schema:
        type: string
        format: uuid
    OrganizationId:
      name: id
      in: path
      required: true
      description: Organization UUID.
      schema:
        type: string
        format: uuid
    OrganizationMemberUserId:
      name: user_id
      in: path
      required: true
      description: Member's user UUID.
      schema:
        type: string
        format: uuid
    OrganizationInviteId:
      name: invite_id
      in: path
      required: true
      description: Invite UUID.
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      description: The share link's URL token (from the create response or the share URL). The revoke endpoints also accept the link's id here.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    InviteToken:
      name: token
      in: path
      required: true
      description: The invite's URL token (from the invite email or the copy link).
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OrganizationDomainName:
      name: domain
      in: path
      required: true
      description: Email domain, lowercase.
      schema:
        type: string
        minLength: 3
        maxLength: 253
    OrganizationApiKeyId:
      name: key_id
      in: path
      required: true
      description: Organization API key UUID.
      schema:
        type: string
        format: uuid
    StorageConnectionId:
      name: connection_id
      in: path
      required: true
      description: Storage connection UUID.
      schema:
        type: string
        format: uuid
    AgentConfigKey:
      name: key
      in: path
      required: true
      description: Configuration entry key (environment-variable style).
      schema:
        type: string
        pattern: '^[A-Z][A-Z0-9_]{0,63}$'
        examples: ['TELEGRAM_BOT_TOKEN']
    AbilitySlug:
      name: slug
      in: path
      required: true
      description: Ability slug (lowercase letters, digits, hyphens).
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        examples: ['short-film']
    PresetSlug:
      name: slug
      in: path
      required: true
      description: Preset slug (lowercase letters, digits, hyphens).
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        examples: ['ugc-ad']
    ColorPresetSlug:
      name: slug
      in: path
      required: true
      description: Color-preset slug (lowercase letters, digits, hyphens).
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
        examples: ['teal-orange']
  responses:
    ProblemResponse:
      description: Error formatted per RFC 7807.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrganizationMutationForbidden:
      description: >
        Forbidden by the operation's existing authorization rules, including insufficient organization role or an invite email mismatch where applicable, or refused because the caller uses an agent PAT, a turn token, or the legacy `X-Nolgia-Surface: hermes` header. Agent refusals use code `agent_cannot_change_organization` and detail "The NOLGIA Agent cannot change your organization. Do it in the app." Other authorization failures retain their existing problem codes and details; the example is only the agent case.

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            agentRefusal:
              summary: Organization changes are refused for the NOLGIA Agent.
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: agent_cannot_change_organization
                detail: The NOLGIA Agent cannot change your organization. Do it in the app.
    CredentialAuthorizationForbidden:
      description: >
        Credential authorization is refused for callers using an agent PAT, a turn token, or the legacy `X-Nolgia-Surface: hermes` header. Returns code `agent_cannot_authorize_credentials` and detail "The NOLGIA Agent cannot authorize new credentials. Do it in the app."

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            agentRefusal:
              summary: Credential authorization is refused for the NOLGIA Agent.
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: agent_cannot_authorize_credentials
                detail: The NOLGIA Agent cannot authorize new credentials. Do it in the app.
    PatCreationForbidden:
      description: >
        Personal access token creation is refused for callers using an agent PAT, a turn token, or the legacy `X-Nolgia-Surface: hermes` header. Returns code `agent_cannot_create_personal_access_token` and detail "The NOLGIA Agent cannot create personal access tokens. Do it in the app."

      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            agentRefusal:
              summary: Personal access token creation is refused for the NOLGIA Agent.
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: agent_cannot_create_personal_access_token
                detail: The NOLGIA Agent cannot create personal access tokens. Do it in the app.
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          examples: [ok]
        version:
          type: string
          description: Build version (semver or git sha).
          examples: ['0.1.0']
        uptime_seconds:
          type: integer
          minimum: 0
          examples: [1234]
    ProviderCallbackAck:
      type: object
      description: Acknowledgement of a verified provider completion callback.
      required: [received, woken]
      properties:
        received:
          type: boolean
          description: Always true on a 200; the callback verified.
        woken:
          type: boolean
          description: >
            Whether the job poller was asked to read the job now. False for a test callback with no token and for a non-terminal status, where a read would find nothing to settle.

    SSETicket:
      type: object
      additionalProperties: false
      required: [ticket, expires_at]
      description: Single-use credential authorizing one job status stream connection.
      properties:
        ticket:
          type: string
          description: Opaque single-use secret to pass as the `ticket` query parameter.
          examples: ['9f8c2a1e6b4d7f0a3c5e8b1d4f7a0c3e6b9d2f5a8c1e4b7d0f3a6c9e2b5d8f1a']
        expires_at:
          type: string
          format: date-time
          description: Instant after which the ticket can no longer be redeemed.
    Error:
      type: object
      additionalProperties: false
      required: [type, title, status]
      description: RFC 7807 problem object.
      properties:
        code:
          type: string
          description: >
            Machine-readable error code. Agent endpoints (`/agent/chat`, `/agent/messages*`, `/agent/sessions*`, `/agent/steps`) set one of the `AgentErrorCode` values. The generation endpoints (`/generate/image`, `/generate/video`, `/generate/audio`, `/generate/3d`, `/generate/set`) set one of the `GenerationErrorCode` values when the refusal has one; a `409` duplicate-submission refusal carries no code, because the status and the named existing job already say what happened. Absent otherwise.

        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type.
          examples: ['https://nolgia.ai/errors/invalid-request']
        title:
          type: string
          examples: ['Invalid request']
        status:
          type: integer
          minimum: 400
          maximum: 599
          examples: [422]
        detail:
          type: string
          examples: ['`prompt` must be at least 1 character.']
        instance:
          type: string
          format: uri
          examples: ['https://api.nolgia.ai/v1/generate/image']
        job_id:
          type: string
          format: uuid
          description: >
            The job this refusal points at, so a client can follow it without reading `detail`. Set on the `409` duplicate-submission refusal from `/generate/*`, naming the job that already exists for this request — the one fact the submitter was missing. That refusal carries no `code` (the status and this field are the contract), and `detail` keeps its existing wording. Absent on every other problem.

        request_id:
          type: string
          examples: ['req_01J5R2M9YBX2K4Z3WQH6P8VNA1']
    User:
      type: object
      additionalProperties: false
      required: [id, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          examples: ['ada@nolgia.ai']
        name:
          type: string
          nullable: true
          examples: ['Ada Lovelace']
        image_url:
          type: string
          nullable: true
          format: uri
        created_at:
          type: string
          format: date-time
        organizations:
          type: array
          description: Every organization the user belongs to, with their role.
          items:
            $ref: '#/components/schemas/UserOrganization'
        active_organization:
          nullable: true
