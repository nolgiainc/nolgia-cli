  /share/{token}:
    parameters:
      - $ref: '#/components/parameters/ShareToken'
    get:
      tags: [Sharing]
      operationId: resolveShareLink
      summary: Public resolver (no authentication) that redirects to the shared media.
      description: |
        Trades a share token for a freshly signed, short-lived URL to the
        media (about 15 minutes) and answers `302` with it in `Location`.
        The signed URL is minted per visit and must never be stored; the
        share URL itself is the durable thing. Pass `download=true` to make
        the signed URL a download (Content-Disposition attachment).

        Unknown tokens answer `404`. Revoked and expired links, and links
        whose media has since been trashed or deleted, answer `410` with a
        detail that says which. The endpoint is rate limited per client IP
        (`429`) so tokens cannot be enumerated. Each successful redirect
        counts as one access on the link.
      security: []
      parameters:
        - name: download
          in: query
          required: false
          description: When true the signed URL carries a Content-Disposition attachment header so browsers save the file instead of playing it.
          schema:
            type: boolean
            default: false
      responses:
        '302':
          description: Redirect to a freshly signed, short-lived media URL.
          headers:
            Location:
              description: The signed media URL. Follow it immediately; it expires in about 15 minutes.
              schema:
                type: string
                format: uri
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '410':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /share/{token}/meta:
    parameters:
