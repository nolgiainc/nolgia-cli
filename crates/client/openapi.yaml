  /agent/sessions/{id}/assets:
    get:
      tags: [Agent]
      operationId: listAgentSessionAssets
      summary: List the media a chat session's agent turns produced.
      description: >
        Returns the session's agent-produced assets, newest first and de-duplicated by asset id. Assets whose generating job was causally stamped with this session (`jobs.agent_session_id`, recorded at job creation) are included regardless of turn state — so polling during a run surfaces each clip as it lands, and a run that dies before delivering still shows everything it produced. Assets from jobs that predate the stamp fall back to the legacy attribution: created inside a completed turn's active window and attributable to the agent by surface. The session must belong to the caller (`404` otherwise).

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The session's produced assets, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionAssetList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/sessions/{id}/events:
    get:
      tags: [Agent]
      operationId: streamAgentSessionEvents
      summary: Stream a chat session's transcript events over Server-Sent Events.
      description: >
        Opens a `text/event-stream` connection scoped to one chat session that pushes transcript writes as they land. This stream is the ONLY live transport (there is no client polling): reconnection is protocol-level SSE. The server opens with a `retry:` hint; every `message` frame carries a monotonic `id:` line (the row's change watermark in epoch nanoseconds); a reconnecting client presents `Last-Event-ID` and the server REPLAYS every write at/after that watermark from the database before resuming live delivery, so no event is ever lost to a disconnect. Comment heartbeats (`: heartbeat`) flow every 20 seconds.

        Connect sequence: `retry:` hint, then (given `Last-Event-ID`) the replayed `message` frames, then a `session_status` snapshot frame per session of the caller's that has an agent turn (running, queued, or settled with its `last_turn_work_observed`, so a verdict missed while disconnected is restored), then a `ready` frame whose `id:` is the session's current watermark and whose `replay` field reports `none` (no usable Last-Event-ID; hydrate via `GET /agent/messages`), `complete` (fully caught up) or `truncated` (gap exceeded the replay budget; rehydrate).

        Event names equal the envelope's `type` — `message` (a transcript row was created or settled; `data` is an `AgentSessionEvent` whose `message` is the full row as `GET /agent/messages` serves it, omitted only when the row was too large for the event bus, in which case `message_id` alone signals "refetch"), `step` (a step batch was persisted for a reply row; steps are summarized, refetch `GET /agent/steps` with a `since` cursor), and `session_status` (a session of the caller's flipped between running / queued / idle; delivered on EVERY stream the caller has open, for any of their sessions, so a sessions sidebar shows live multi-session activity). The envelope is forward-compatible: new `type` values may appear and consumers must ignore event types they do not recognize.

        Authenticated by the standard bearer schemes (send the `Authorization` header — read the stream with `fetch`, not `EventSource`, which cannot send headers). The session must belong to the caller (`404` otherwise). Events only cover session-filed rows; legacy sessionless history never streams.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          description: >
            The `id:` of the last frame the client saw (epoch nanoseconds). Presented on reconnect; the server replays everything missed.

          schema:
            type: string
      responses:
        '200':
          description: Event stream opened.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/sessions/{id}/interrupt:
    post:
      tags: [Agent]
      operationId: interruptAgentSession
      summary: Stop the session's in-flight agent turn.
      description: |
        Stops the running or queued turn of this session only. Reaches the
        running agent through the same run channel steering uses (the pod's
        run stop), marks the turn `interrupted`, and returns the turn's
        credit hold for the agent's reasoning on that turn. Generations the
        agent already submitted keep running and bill as usual.

        Steering messages still queued behind the stopped turn stay in the
        transcript but are not run. Send a new message to continue.

        Idempotent: calling it again, or on an idle session, answers `200`
        and changes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The newest turn's status after the interrupt request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionInterrupt'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/steps:
    get:
      tags: [Agent]
      operationId: listAgentSteps
      summary: Live terminal/tool/message steps of the agent's current session.
      description: |
        Streams the fine-grained steps of the agent's current session —
        terminal commands (with their input command and captured output), other
        tool calls, file operations, and message events — as a sanitized,
        chronologically-ordered feed for the chat's expandable step chips.

        The API proxies to the agent pod's dashboard server (cookie-authed,
        server-side) and maps its raw session events to a stable schema.
        Secret-looking values (tokens, keys, passwords, bearer credentials) are
        masked, and input/output payloads are size-capped — see
        `detail_input`/`detail_output` for the caps and for how a JSON payload
        is masked and capped structurally so it stays parseable.

        Poll with `since` set to the newest `at` already seen while a turn is
        pending, then stop shortly after it settles. When the agent has no
        dashboard (older deployments or not yet provisioned) the endpoint
        returns `404` — clients should treat this as "no steps" and render
        nothing rather than an error.
      parameters:
        - name: since
          in: query
          required: false
          description: Return only steps whose `at` timestamp is strictly after this value.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum steps to return (newest session's steps, oldest first).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
        - name: session_id
          in: query
          required: false
          description: >
            Chat session the caller is rendering. REQUIRED to receive live steps: the feed is scoped to the pod run backing THAT session's in-flight turn, and returns an empty list when the session has no turn in flight. A request WITHOUT session_id returns an empty list and never proxies the agent pod. The pod's agent conversation is global across the account's chat sessions, so an unscoped feed would serve whichever run touched the pod last, surfacing one session's steps, media (asset refs), and tool output inside another's. Always send it; an omitted session_id is treated as a stale or older client and served nothing rather than another session's content.

          schema:
            type: string
            format: uuid
        - name: agent_message_id
          in: query
          required: false
          description: >
            When set, return the durably persisted steps of that completed agent reply row instead of proxying the live session, so a reload recovers the turn's steps after the pod has rolled or dropped the session. Returns `200` with an empty list when no steps are stored for the id (including when it is not the caller's). The persisted list contains only steps attributed to that reply's own run, and `attribution` says how they were attributed.

          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sanitized steps, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStepList'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /agent/manifest:
