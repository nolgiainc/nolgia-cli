      tags: [Assets]
      operationId: importGoogleDriveFile
      summary: Import a Google Drive file into the library.
      description: >
        Server-side import: the API reads the file's Drive metadata, streams its bytes into NOLGIA storage through the signed-upload machinery and returns the ready asset. `access_token` is a short-lived Google OAuth token with the `drive.file` scope, obtained by the client (Google Picker); it is used for this request only and never stored or logged. Google Docs, Sheets and Slides (`application/vnd.google-apps.*`) cannot be imported (400 `Unsupported Drive file`); the accepted media types and size limits are those of `POST /assets/uploads`. Plan gate: Studio plans, Team and Enterprise. Other plans get 402 `Upgrade Required` (a plan limit, not a credit balance). Organization viewers get 403.

      requestBody:
        required: true
