  /agent/abilities/events:
    get:
      tags: [Abilities]
      operationId: streamAgentAbilityEvents
      summary: Stream ability version publishes for the current user's agent over Server-Sent Events.
      description: >
        Opens a `text/event-stream` connection scoped to the calling account's agent that pushes an `ability_published` frame whenever a new version of an installed ability is published — the push half of the ability freshness design (no polling exists anywhere in it; the pod's correctness backstop is its own turn-boundary installed-vs-latest check, not a timer). Reconnection is protocol-level SSE: the server opens with a `retry:` hint; every event frame carries a monotonic `id:` line (the version's publish instant in epoch nanoseconds); a reconnecting pod presents `Last-Event-ID` and the server REPLAYS every publish it missed for the agent's installed abilities straight from the database before resuming live delivery, so a pod that was down while a version published catches up instead of silently staying stale. Comment heartbeats (`: heartbeat`) flow every 20 seconds.

        Connect sequence: `retry:` hint, then (given `Last-Event-ID`) the replayed `ability_published` frames, then a `ready` frame whose `id:` is the agent's current watermark and whose `replay` field reports `none` (no usable Last-Event-ID; reconcile from `GET /agent/manifest`), `complete` (fully caught up) or `truncated` (gap exceeded the replay budget; reconcile from the manifest).

        Event names equal the envelope's `type` — `ability_published` (`data` carries `slug`, `version`, `at` and `seq`; fetch the content via `GET /abilities/{slug}/content`). The stream only carries abilities the agent has installed tracking latest — version-pinned installs are excluded (their desired version never moves on publish). The envelope is forward-compatible: new `type` values may appear and consumers must ignore event types they do not recognize.

        Authenticated by the standard bearer schemes — pods connect with their agent credential (`NOLGIA_TOKEN`). `404` when the account has no provisioned agent.

      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: >
            The `id:` of the last frame the pod saw (epoch nanoseconds). Presented on reconnect; the server replays everything missed.

          schema:
            type: string
      responses:
        '200':
          description: Event stream opened.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
