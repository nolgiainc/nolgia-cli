          in: query
          required: false
          description: >
            Organization context only: rows caused by this member. Owner, admin and billing roles may name any member; other roles only themselves. `400` in the personal space.

          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of ledger rows, newest first.
          content:
