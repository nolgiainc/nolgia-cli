          description: >
            Return only assets belonging to the given collection (owned by the caller). Composes with the other filters and is reflected in the page `total`.

          schema:
            type: string
            format: uuid
        - name: agent_session_id
          in: query
          required: false
          description: >
            Return only assets attributed to the given chat session — either the generating job's `agent_session_id` (causal attribution recorded at job creation, not a time window, so it holds for async video that lands long after the turn) or, for agent uploads with no job, the asset's `metadata.agent_session_id`. Jobs created before this attribution shipped are not matched. Composes with the other filters and is reflected in the page `total`.

          schema:
            type: string
