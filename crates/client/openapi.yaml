    ShareLinkKind:
      type: string
      enum: [asset, render]
      x-enum-varnames: [ShareLinkKindAsset, ShareLinkKindRender]
      description: What a share link points at.
    CreateShareLinkRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: Lifetime of the link in days from now. Defaults to 30.
    ShareLink:
      type: object
      additionalProperties: false
      required: [id, kind, target_id, token_prefix, expires_at, created_at, created_by, access_count]
      description: >
        One durable public share link. `token` and `url` are present ONLY on the create response: tokens are stored hashed, so no later read can return them.

      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ShareLinkKind'
        target_id:
          type: string
          format: uuid
          description: The shared asset's id, or the shared render's id.
        token:
          type: string
          description: The share token (base64url, 128 bits of entropy). Create response only.
        token_prefix:
          type: string
          description: The first characters of the token, for recognising a link in a listing.
        url:
          type: string
          format: uri
          description: The public share URL to hand out (the nolgia.ai share page). Create response only.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          description: The user who created the link.
        access_count:
          type: integer
          description: Successful public resolutions so far.
        last_accessed_at:
          type: string
          format: date-time
          description: When the link was last resolved. Absent until the first visit.
        revoked_at:
          type: string
          format: date-time
          description: Set once the link has been revoked. Listings only return unrevoked links.
    ShareLinkList:
      type: object
      additionalProperties: false
      required: [links]
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/ShareLink'
    MyShareLink:
      type: object
      additionalProperties: false
      required: [id, kind, target_id, title, token_prefix, access_count, expires_at, created_at]
      description: >
        One active share link as the creator-side listing shows it: the link, what it points at, and its view figures. Never carries the token or the URL.

      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ShareLinkKind'
        target_id:
          type: string
          format: uuid
          description: The shared asset's id, or the shared render's id; pair it with `kind` to revoke.
        title:
          type: string
          description: The shared item's display title (the asset's name or trimmed prompt, or the composition's name for a render).
        thumbnail_url:
          type: string
          format: uri
          description: Freshly signed short-lived poster image of the shared media, when it has one. Never store it.
        token_prefix:
          type: string
          description: The first characters of the token, for recognising the link.
        access_count:
          type: integer
          description: Successful public resolutions so far.
        last_accessed_at:
          type: string
          format: date-time
          description: When the link was last resolved. Absent until the first visit.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    MyShareLinkList:
      type: object
      additionalProperties: false
      required: [links]
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/MyShareLink'
    ShareLinkMeta:
      type: object
      additionalProperties: false
      required: [kind, title, modality, media_url, media_expires_at, expires_at, created_at]
      description: Everything a share page or link-preview crawler needs to render the shared media.
      properties:
        kind:
          $ref: '#/components/schemas/ShareLinkKind'
        title:
          type: string
          description: The asset's display name (or a trimmed prompt), or the composition's name for a render.
        description:
          type: string
          description: A short description when one is known (the generation prompt, or the composition's description).
        model:
          type: string
          description: Catalog id of the model that generated the shared media (render it with the catalog's display name, never raw). Present only when the link serves a generated library asset; absent for uploads, imports and composition renders.
        preset:
          $ref: '#/components/schemas/ShareLinkPreset'
        modality:
          $ref: '#/components/schemas/Modality'
        mime_type:
          type: string
        media_url:
          type: string
          format: uri
          description: Freshly signed short-lived URL of the media itself. Play or embed it now; never store it.
        media_expires_at:
          type: string
          format: date-time
          description: When `media_url` (and `thumbnail_url`) stop working. Fetch the metadata again for a new one.
        thumbnail_url:
          type: string
          format: uri
          description: Freshly signed short-lived poster image, when the media has one.
        duration_seconds:
          type: number
          format: float
          description: Media duration for video and audio, when known.
        size_bytes:
          type: integer
        expires_at:
          type: string
          format: date-time
          description: When the share link itself stops resolving.
        created_at:
          type: string
          format: date-time
    ShareLinkPreset:
      type: object
      additionalProperties: false
      required: [slug, name]
      description: |
        The public catalog preset the shared media was made with: the generating job's
        `preset_slug`, else the preset the agent chat that ran the job was launched from.
        Absent when there is none, or when that preset is not public (a held or private
        preset is never named on a public page).
      properties:
        slug:
          type: string
          description: The preset's catalog slug (its public page is /presets/{slug}).
        name:
          type: string
          description: The preset's display name from the catalog.
    ModelList:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    ModelPricingList:
      type: object
      additionalProperties: false
      description: |
        The public price list served by `GET /pricing/models`, in the same
        order as the `GET /models` catalog.
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelPricing'
    ModelPricing:
      type: object
      additionalProperties: false
      description: |
        One model's public identity, capabilities and published price, as a
        pricing page or a model reference page prints it. Every capability and
        price field is copied verbatim from the same model's entry in
        `GET /models`, so the two can never disagree.

        This response is world-readable. It carries no provider COGS, no
        internal routing name and no per-caller data; `maker` names who MADE a
        model, which is public knowledge about the model, never the reseller
        route we buy it through.
      required: [id, display_name, modality, min_tier, aspect_ratios]
      properties:
        id:
          type: string
          description: The catalog id a generation request sends as `model`.
          examples: ['veo-3.1']
        display_name:
          type: string
          description: >-
            What to call this model on a customer-facing surface. Always present: no published model is nameless, because a raw id is sometimes a provider route path and must never be rendered.
          examples: ['Veo 3.1']
        maker:
          type: string
          description: >-
            The company that made the model (`Google`, `Kuaishou`, `Black Forest Labs`). A fact about the model, not about how we reach it — this is never the reseller we route through. Absent when no attribution could be established that was safe to assert; an absent maker renders as nothing, never as "Unknown", and never withholds the model.
          examples: ['Google']
        summary:
          type: string
          description: >-
            One sentence about the model. Absent until written; copy arrives incrementally, and an absent summary renders as nothing.
        recommended:
          type: boolean
          description: Mirrors `Model.recommended` — the pick for its modality.
        video:
          $ref: '#/components/schemas/VideoCapabilities'
        audio:
          $ref: '#/components/schemas/AudioCapabilities'
        image:
          $ref: '#/components/schemas/ImageCapabilities'
        references:
          $ref: '#/components/schemas/ReferenceCapabilities'
        restore:
          type: boolean
          description: Mirrors `Model.restore`.
        remove_background:
          type: boolean
          description: Mirrors `Model.remove_background`.
        image_enhance:
          type: boolean
          description: Mirrors `Model.image_enhance`.
        image_expand:
          type: boolean
          description: Mirrors `Model.image_expand`.
        modality:
          $ref: '#/components/schemas/Modality'
        min_tier:
          allOf:
            - $ref: '#/components/schemas/SubscriptionTier'
          description: >-
            Minimum subscription plan required to run this model; `starter` means every plan can. Cost and eligibility are independent — an affordable model can still be out of plan, and topping up does not unlock it. Always sent (see `Model.min_tier`).
        cost:
          $ref: '#/components/schemas/ModelCost'
        quality:
          $ref: '#/components/schemas/QualityCapabilities'
        three_d:
          $ref: '#/components/schemas/ThreeDCapabilities'
        aspect_ratios:
          type: array
          description: >-
            The output aspect ratios this model renders (`video.aspect_ratios` for video models, `image.aspect_ratios` for image models), as plain strings so one field spans both enums. Empty when the model has no selectable ratio (audio models, and image models that only speak `image_size`); the choice never changes the price.
          items:
            type: string
            examples: ['16:9']
        render_quality:
          allOf:
            - $ref: '#/components/schemas/RenderQualityCapabilities'
          description: >-
            Mirrors `image.render_quality` from `GET /models`. Unlike `inpaint_mask` this one is unambiguously pricing: each option carries the credits it adds, and a page that prints a model's cost without it would understate an `xhigh` or `max` render.
        inpaint_mask:
          type: boolean
          description: >-
            Mirrors `image.inpaint_mask` from `GET /models`: this model can edit only PART of an image, guided by a mask. It is published here — on an endpoint that otherwise carries pricing only — for the same reason `aspect_ratios` is: a public page has to be able to say what a model can do before anyone signs in, and the answer must come from the catalog rather than from a second hand-kept list. It is a capability flag, never a price: a masked edit costs exactly what the same model's ordinary generation costs. Absent on every non-image model, and on any model that cannot take a mask.
          examples: [true]
        capabilities:
          type: array
          description: >-
            Mirrors `Model.capabilities`: the video capability CLASSES this model exists to serve, as opposed to the individual inputs it accepts. Published here for the same reason `aspect_ratios` and `inpaint_mask` are, and the reason is sharper for this field than for either of them: a public playground has to know that a model is a lip-sync engine before it offers a prompt box, because `lip_sync` means a portrait plus a voice track rather than a sentence, and a form generated without it would ask for the wrong thing entirely. Absent for the plain generation models, which is nearly all of them.
          items:
            $ref: '#/components/schemas/VideoCapabilityTag'
          examples: [['lip_sync']]
    ProviderStatusList:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderStatus'
    ProviderStatus:
      type: object
      additionalProperties: false
      required: [provider, state]
      properties:
        provider:
          type: string
          description: Provider route-family key (e.g. minimax, fal, google, xai).
          examples: ['minimax']
        state:
          type: string
          enum: [operational, degraded]
          x-enum-varnames: [ProviderStateOperational, ProviderStateDegraded]
        degraded_since:
          type: string
          format: date-time
          nullable: true
          description: When the hard-down detector tripped, if degraded.
        parked_jobs:
          type: integer
          description: >-
            Jobs currently parked "provider temporarily down" for this provider; they resume automatically when it recovers.
        oldest_parked_at:
          type: string
          format: date-time
          nullable: true
          description: Creation time of the oldest parked job, if any.
        message:
          type: string
          nullable: true
          description: Customer-safe explanation of a degraded state.
    RenderQualityCapabilities:
      type: object
      additionalProperties: false
      description: |
        The render-quality values a model accepts on `render_quality`, and what
        each ADDS to the price.

        Deliberately separate from `QualityCapabilities`, which for an image
        model is the native/2k/4k upscale ladder. The two are orthogonal: one
        decides how the picture is drawn, the other whether it is enlarged
        afterwards, and a request may carry both.
      required: [default, options]
      properties:
        default:
          type: string
          description: >-
            The value applied when `render_quality` is omitted. Always `auto` today, and `auto` sends nothing to the provider at all — it is the model's own choice, and the state every published base price was measured against.
          examples: ['auto']
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RenderQualityOption'
    RenderQualityOption:
      type: object
      additionalProperties: false
      required: [id, credits_added, premium]
      properties:
        id:
          type: string
          description: Value accepted by the `render_quality` request parameter.
          examples: ['xhigh']
        credits_added:
          type: integer
          minimum: 0
          description: >-
            Credits this value ADDS to the model's per-image price, on top of whatever `quality` tier the request also carries. 0 for `auto` and for every value that spends no more than it. Added per IMAGE, so a request for four images pays it four times.
          examples: [11]
        premium:
          type: boolean
          description: Whether this value costs more than the base rate.
          examples: [true]
    Model:
      type: object
      additionalProperties: false
      required: [id, modality, recommended]
      properties:
        id:
          type: string
          examples: ['veo-3.1']
        modality:
          $ref: '#/components/schemas/Modality'
        recommended:
          type: boolean
          description: Whether this model is surfaced as a priority/recommended option.
        min_tier:
          allOf:
            - $ref: '#/components/schemas/SubscriptionTier'
          description: >-
            Minimum subscription plan required to run this model. `starter` means every plan can run it. A model published as `pro` needs Pro or Studio, and submitting it on a lower plan is refused with a 402 "Upgrade Required" - that is a plan limit, so adding credits does not unlock it. Sent for every model so a picker can mark or disable what the account cannot run, rather than letting the user submit and be refused. Cost and eligibility are independent: an affordable model can still be out of plan. Optional in the schema only so that existing clients keep parsing; the API always sends it.
        cost:
          $ref: '#/components/schemas/ModelCost'
        video:
          $ref: '#/components/schemas/VideoCapabilities'
        audio:
          $ref: '#/components/schemas/AudioCapabilities'
        image:
          $ref: '#/components/schemas/ImageCapabilities'
        three_d:
          $ref: '#/components/schemas/ThreeDCapabilities'
        quality:
          $ref: '#/components/schemas/QualityCapabilities'
        references:
          $ref: '#/components/schemas/ReferenceCapabilities'
        restore:
          type: boolean
          description: >-
            True for video-restoration lane models: they are submitted via `POST /restore/video` with a source clip and NO prompt, not via `POST /generate/video`. Absent for generation models.
        remove_background:
          type: boolean
          description: |
            True for promptless background-removal utilities. Image models
            use `POST /generate/image` with exactly one source reference and
            return a transparent PNG. Video models use
            `POST /remove-background/video` and return WebM/VP9 with an alpha
            channel. No quality, prompt, or sizing controls are accepted.
            Glass and other genuinely transparent materials come back opaque.
            Absent for other models; does not imply `restore` or `image_enhance`.
        image_enhance:
          type: boolean
          description: |
            True for image-ENHANCEMENT models: they re-render one MANDATORY
            reference image at a larger output size and take NO prompt. They
            are still submitted via `POST /generate/image`, so unlike the
            video restore lane there is no second endpoint, but the request
            shape is different enough that a picker should keep them out of
            the generator list:

            - exactly one reference (`image_url`, `image_urls` with a single
              entry, or one `reference_asset_ids` entry) is required; a
              request with none is a 400
            - `prompt` and `negative_prompt` are refused
            - `aspect_ratio` is refused, because the output keeps the SOURCE
              image's aspect ratio; `image.aspect_ratios` is therefore empty
            - `quality` picks the output long edge (`2k` = 2048px, `4k` =
              4096px); the short edge follows the source

            Absent for generation models.
        image_expand:
          type: boolean
          description: |
            True for image-OUTPAINT models (`flux-expand`): they grow one
            MANDATORY reference image to a requested `aspect_ratio` by
            painting new content into the added margins, so a 16:9 still
            becomes a 9:16 cut without a regeneration. Submitted via
            `POST /generate/image`; the request shape is:

            - exactly one reference (`image_url`, `image_urls` with a single
              entry, or one `reference_asset_ids` entry) is required
            - `aspect_ratio` is REQUIRED and must be one of
              `image.aspect_ratios`; a source already at that ratio fails the
              job with a full refund rather than returning the same picture
            - `prompt` is optional and steers what the new area is painted
              with; `image_size`, `quality`, `character_id`, `element_ids` and
              `face_reference_asset_id` are refused
            - the source's own pixels are kept: the frame is extended on one
              axis only, never cropped or resampled (the reference is bounded
              to a 2048px long edge first)

            Absent for generation models.
        capabilities:
          type: array
          description: >-
            The video capability CLASSES this model exists to serve, as opposed to the individual inputs it accepts. A client builds a distinct entry point per class: `lip_sync` turns a portrait plus a voice track into a talking head, and `video_edit` rewrites footage the customer already has from a text instruction. The structured `references` and `video` blocks still say what the model TAKES, and they are what the API enforces. Absent for the plain generation models, which is nearly all of them.
          items:
            $ref: '#/components/schemas/VideoCapabilityTag'
          examples: [['lip_sync']]
    ThreeDCapabilities:
      type: object
      additionalProperties: false
      description: Photo inputs, material options and credit prices for a 3D model engine. Present only on 3d models.
      required: [max_images, multi_view, untextured, pbr, pbr_credits, multi_view_credits, untextured_credits]
      properties:
        max_images:
          type: integer
        multi_view:
          type: boolean
        untextured:
          type: boolean
        pbr:
          type: boolean
        pbr_credits:
          type: integer
          nullable: true
          description: Extra credits for PBR materials, or null when unsupported.
        multi_view_credits:
          type: integer
          nullable: true
          description: Extra credits for any additional views, charged once, or null when unsupported.
        untextured_credits:
          type: integer
          nullable: true
          description: Base credits for an untextured white model, or null when unsupported.
    VideoCapabilityTag:
      type: string
      enum: [lip_sync, video_edit]
      description: |
        A video capability class.

        * `lip_sync` - a portrait plus a voice track becomes a talking head
          whose mouth matches those words. Implies a mandatory element image, a
          mandatory reference audio track, and `video.speech` of `native`. The
          clip is as long as the track and is billed on that length, so the
          track must be one of your audio assets (`audio_asset_ids`) rather
          than a raw `audio_urls` entry, and `duration_seconds` must either
          equal the track's length rounded up or be omitted.
        * `video_edit` - footage the customer already has, rewritten from a
          text instruction. Implies a mandatory reference video. Distinct from
          a continuation or an upscale, which extend or enlarge a clip rather
          than changing what is in it.
    ReferenceCapabilities:
      type: object
      additionalProperties: false
      description: |
        Per-model reference-media support, published for every video model so
        clients can gate controls to exactly what the selected model can
        achieve. The API enforces the same limits: parameters outside a
        model's declared capabilities are rejected with a 400 naming the
        capability.
      required: [start_frame, start_frame_required, end_frame, video_refs_max, element_refs_max, audio_refs_max]
      properties:
        start_frame:
          type: boolean
          description: |
            Whether the model accepts an `image_url` start frame. Dedicated
            image-to-video variants require one; models like Veo and Omni
            Flash take one optionally alongside the text prompt.
        start_frame_required:
          type: boolean
          description: |
            Whether the start frame is MANDATORY: the model is
            image-to-video only and text-only requests are rejected with a
            400 (dedicated `image-to-video` variants, Grok Imagine 1.5,
            MiniMax Hailuo 2.3 Fast). False when `start_frame` is accepted
            but optional, and always false when `start_frame` is false.
            Clients must require an image before submitting when this is
            true.
        end_frame:
          type: boolean
          description: |
            Whether the model accepts `end_image_url` / `end_image_asset_id`
            alongside `image_url` (start+end frame pinning: Seedance 2.0
            Pro i2v, Seedance 2.5, Seedance 2.0 Fast and Mini, FLUX 3 Video,
            MiniMax Hailuo 3). Kling v3
            i2v does NOT support it: those entries route to the direct Kling
            provider, which has no end-frame field. Read this flag rather
            than assuming a family supports it.
        video_refs_max:
          type: integer
          minimum: 0
          description: |
            Maximum reference videos per request (`video_asset_ids` +
            `video_urls` combined). 0 when the model takes no reference
            videos.
        element_refs_max:
          type: integer
          minimum: 0
          description: |
            Maximum element/reference images per request
            (`element_asset_ids` + `image_urls` combined). 0 when
            unsupported.
        video_refs_min:
          type: integer
          minimum: 1
          description: |
            Minimum reference videos per request. Present only on models that
            cannot render without one (`video_edit` models rewrite footage the
            caller supplies, so the source clip is the request). Absent means
            reference videos are optional.
        video_refs_min_seconds:
          type: integer
          minimum: 1
          description: |
            Shortest reference video the model accepts, in seconds, PER CLIP:
            every reference video must be at least this long, even when the
            clips together clear `video_refs_total_min_seconds` (Seedance 2.5
            refuses any clip under 2 seconds). The API refuses a stored asset
            shorter than this with a 400 naming the limit; a raw `video_urls`
            entry carries no stored metadata and is left to the provider.
            Absent when the model publishes no such bound.
        video_refs_total_min_seconds:
          type: integer
          minimum: 1
          description: |
            Minimum combined length of the reference videos on one request, in
            seconds. On a model that takes a single reference video this is
            that clip's minimum length. The API refuses a set of stored assets
            whose total is shorter with a 400 naming the limit; the total is
            only known when every reference video is a stored asset, so a
            request carrying a raw `video_urls` entry (no stored metadata) is
            left to the provider. Absent when the model publishes no such
            bound.
        video_refs_total_max_seconds:
          type: integer
          minimum: 1
          description: |
            Longest reference footage the model accepts, in seconds: each
            reference video, and the reference videos' combined length, must
            be at most this. The API refuses a stored asset, or a set of stored
            assets, over it with a 400 naming the limit; a raw `video_urls`
            entry carries no stored metadata and is left to the provider.
            Absent when the model publishes no such bound.
        video_refs_total_max_bytes:
          type: integer
          format: int64
          minimum: 1
          description: |
            Largest reference footage the model accepts, in bytes: each
            reference video, and the reference videos' combined size, must be
            at most this (compare the asset's `size_bytes`). The API refuses a
            stored asset, or a set of stored assets, over it with a 400 naming
            the limit; a raw `video_urls` entry carries no stored metadata and
            is left to the provider. Absent when the model publishes no such
            bound.
        video_refs_min_short_edge:
          type: integer
          minimum: 1
          description: |
            Smallest shorter edge, in pixels, of each reference video (the
            Seedance 2.0 reference-to-video route takes 480p to 720p input).
            Published together with `video_refs_max_short_edge`. The API
            refuses a stored asset whose recorded width and height put its
            shorter edge outside the pair with a 400 naming the limit; a raw
            `video_urls` entry carries no stored metadata and is left to the
            provider. Absent when the model publishes no such bound.
        video_refs_max_short_edge:
          type: integer
          minimum: 1
          description: |
            Largest shorter edge, in pixels, of each reference video.
            Published together with `video_refs_min_short_edge`; the same
            400 and the same raw `video_urls` exemption apply. Absent when
            the model publishes no such bound.
        output_follows_source_video:
          type: boolean
          description: |
            True when the render keeps the source clip's length rather than
            anything the request asks for: the edit is as long as the footage
            (Kling v3 Motion Control, Gemini Omni 1.1 Video Edit).
            `duration_seconds` must be omitted or equal the stored source
            length rounded up, and the job bills that length. The source must
            be a stored video asset with a known duration: a raw `video_urls`
            entry carries no stored metadata, cannot establish the billed
            length, and is refused with a 400. Clients should take the
            duration from the attached clip rather than offer a duration
            picker. Absent when the render length follows `duration_seconds`
            as usual; never published as false.
        subject_video_reference:
          type: boolean
          description: |
            True when the reference video conditions the render on the
            performance in the clip (the performer, their body and the way
            they move, plus timing and camera), so the clip DRIVES a new
            render: motion transfer on Kling v3 Motion Control, reference
            runs on Seedance 2.5 and the Seedance 2.0 reference-to-video
            route. On a model that also publishes `video_tasks` this
            describes the default `reference` task; `edit` and `extend` treat
            the clip as footage. Absent when the clip is footage the model
            edits (every `video_edit` model) or continues (FLUX 3 Video maps
            its one video slot to a continuation source), and on models that
            take no reference video; never published as false.
        element_refs_min:
          type: integer
          minimum: 1
          description: |
            Minimum element/reference images per request. Present only on
            models that cannot render without one (`lip_sync` models animate a
            portrait the caller supplies). Absent means optional.
        element_refs_mime_types:
          type: array
          description: |
            The image content types the model's reference channel accepts, when
            the provider accepts a narrower set than the library stores (HeyGen
            Avatar IV takes JPEG only). The API refuses a stored asset whose
            recorded content type is outside this list; a raw `image_urls`
            entry carries no recorded type and is forwarded for the provider to
            validate. Absent means every image type the library stores.
          items:
            type: string
          examples: [['image/jpeg']]
        audio_refs_max_seconds:
          type: integer
          minimum: 1
          description: |
            Longest reference audio track the model accepts, in seconds. The
            API refuses a stored track longer than this. Absent when the model
            publishes no per-track ceiling.
        audio_refs_min:
          type: integer
          minimum: 1
          description: |
            Minimum reference audio tracks per request. Present only on models
            that cannot render without one (`lip_sync` models speak the voice
            track the caller supplies). Absent means optional.
        element_refs_duration_seconds:
          type: integer
          minimum: 1
          description: |
            When present, requests that attach element/reference images must
            use exactly this `duration_seconds` (Veo 3.1 reference images
            require 8-second clips). Clients should snap the duration when
            references are attached. Absent when references carry no
            duration constraint. On Veo 3.1 and Veo 3.1 Fast a reference run
            also cannot carry a start frame (`image_url`): the API refuses
            the mix with a 400.
        audio_refs_max:
          type: integer
          minimum: 0
          description: |
            Maximum reference audio tracks per request (`audio_asset_ids` +
            `audio_urls` combined; each at most `audio_refs_max_seconds`
            where the model publishes one). 0 when unsupported.
        voice_refs_max:
          type: integer
          minimum: 1
          description: |
            Maximum PRESET reference voices per request (`reference_voice_ids`),
            each a `voice_id` from xAI's Text-to-Speech roster addressed in the
            prompt as `<AUDIO_0>`..`<AUDIO_2>`. Distinct from `audio_refs_max`,
            which counts UPLOADED audio tracks: these are roster voice
            selections, not user uploads. Present only on models that expose the
            preset-voice reference-to-video path (Grok Imagine 1.5 exposes 3;
            xAI reference audio is US-only / trusted-partners and caps output at
            720p). Absent when unsupported.
        bitrate_modes:
          type: array
          description: Selectable `bitrate_mode` values; absent when the model has no bitrate knob.
          items:
            $ref: '#/components/schemas/BitrateMode'
        video_tasks:
          type: array
          description: |
            The `video_task` values the model's reference-video slot can run
            (Seedance 2.5 on its SeeGen omni-reference route: `reference`,
            `edit`, `extend`). Absent when the model classifies the task from
            the prompt alone and `video_task` is refused with a 400.
          items:
            $ref: '#/components/schemas/VideoTask'
          examples: [['reference', 'edit', 'extend']]
    VideoTask:
      type: string
      enum: [reference, edit, extend]
      nullable: true
      description: |
        What the reference video is FOR, on models that publish
        `references.video_tasks` on `GET /models` (Seedance 2.5). Omit it and
        a request that carries a reference video runs as `reference`, the
        task its `duration_seconds`, `aspect_ratio` and `quality` describe;
        the provider is not left to classify the task from the prompt, which
        failed any prompt it read as an edit. Name `edit` to change the clip
        itself.

        * `reference` - the clip drives the render (motion, choreography,
          timing, camera) and the element images recast the performer and
          the world: the Recast motion-transfer flow. Renders at the
          requested `duration_seconds`, `aspect_ratio` and `quality` exactly
          like any reference run.
        * `edit` - the clip is the footage and comes back with one change
          (a swapped product, garment, character or location). Takes exactly
          one reference video; the output keeps the source's length and
          aspect ratio (`aspect_ratio` is ignored), so `duration_seconds` is
          the source clip's length rounded up: omit it or supply that value.
          Requires a video asset with a known stored duration of 4-30 seconds;
          raw video URLs and assets without duration metadata are refused.
          Billed at the source length on the selected quality tier.
        * `extend` - the clip is continued past its last frame by
          `duration_seconds` of new footage in the source's own aspect
          ratio. Takes exactly one reference video.

        Refused with a 400 on a model whose `references.video_tasks` does not
        list the value, and without a reference video.
    ModelCost:
      type: object
      additionalProperties: false
      description: |
        Credit pricing for a model. Absent when pricing has not been published
        for the model; clients must render an unknown/pending state instead of
        inventing a rate.
      required: [credits, unit]
      properties:
        credits:
          type: integer
          minimum: 1
          description: |
            Credits charged per unit at the model's DEFAULT audio state. For a
            model with native audio on by default (most video models), this
            includes `audio_surcharge`; subtract it for the silent
            (generate_audio=false) price.

            When unit is per_character this is the headline price of a
            1,000-character script - exact for that length, and the figure to
            compare voices on. It is NOT a per-character rate and must not be
            scaled: use `characters_per_credit` for the charge on any other
            length.
          examples: [42]
        unit:
          $ref: '#/components/schemas/ModelCostUnit'
        audio_surcharge:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Extra credits (per the model's `unit`) that a soundtrack adds, when
            the provider charges more to render audio. Included in `credits`
            because audio is on by default; a request with generate_audio=false
            is charged `credits - audio_surcharge`. Absent when audio has no
            price impact (the price is identical with or without audio) or the
            model cannot toggle audio.
          examples: [11]
        baseline_seconds:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Present only when unit is per_clip. The clip duration in seconds that
            `credits` assumes. The actual charge scales with the requested duration
            as ceil(credits * duration_seconds / baseline_seconds).
          examples: [5]
        characters_per_credit:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Present only when unit is per_character. How many characters of
            prompt text one credit buys. The charge for a request is

              max(minimum_credits, ceil(characters / characters_per_credit))

            counted in Unicode characters, not bytes - the same count the
            prompt's maxLength is enforced in. The arithmetic is exact and
            integer, so a client can show the price of a script as it is typed
            without asking the API.
          examples: [180]
        minimum_credits:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Present only when unit is per_character. The charge for a request
            at or below the minimum billable length (200 characters, about one
            spoken sentence) - a short line is priced as if it were exactly
            that long. It is itself the ordinary rate applied to that length,
            not a surcharge.
          examples: [2]
    ModelCostUnit:
      type: string
      description: |
        Billing dimension for a model's credit cost. per_image multiplies by the
        requested image count, per_clip scales with video duration against
        baseline_seconds, per_character scales with the length of the prompt
        against characters_per_credit, per_generation is a flat charge per
        request.
      enum: [per_image, per_clip, per_character, per_generation]
    QualityCapabilities:
      type: object
      additionalProperties: false
      description: |
        Model-specific quality/resolution tiers. Absent when the model has a
        single fixed quality. Each option carries its own credit cost (in the
        model's `cost.unit` — for video, per `baseline_seconds` clip, scaling
        with duration like the base cost) so clients can price the choice
        before submitting.
      required: [options]
      properties:
        default:
          type: string
          description: |
            Tier applied when the request omits `quality`; it costs the
            model's base `cost.credits`.
          examples: ['720p']
        options:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QualityOption'
    QualityOption:
      type: object
      additionalProperties: false
      required: [id, credits, premium]
      properties:
        id:
          type: string
          description: Tier identifier accepted by the `quality` request parameter.
          examples: ['4k']
        credits:
          type: integer
          minimum: 1
          description: |
            Credits charged per the model's `cost.unit` when this tier is
            selected (for video, per `baseline_seconds` clip), at the model's
            DEFAULT audio state. Includes `audio_surcharge` when audio is on by
            default; subtract it for the silent price of this tier.
          examples: [778]
        audio_surcharge:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Extra credits this tier's soundtrack adds when the provider charges
            more for audio. Included in `credits` (audio on by default); a
            generate_audio=false request charges `credits - audio_surcharge`.
            Absent when audio has no price impact on this tier.
          examples: [11]
        premium:
          type: boolean
          description: |
            Marks a premium (highest-quality, higher credit cost) tier so
            clients can present it distinctly from standard options.
        aspect_ratios:
          type: array
          items:
            type: string
          description: |
            When present, the tier renders at these aspect ratios ONLY (a
            subset of the model's `video.aspect_ratios`); a request pairing
            the tier with any other `aspect_ratio` is refused with a 400
            before any credits are held. Absent when the tier renders at
            every aspect ratio the model lists. Example: `seedance-2.5` 1080p
            is published at 16:9 and 9:16 only.
          examples: [['16:9', '9:16']]
    VideoCapabilities:
      type: object
      additionalProperties: false
      description: Per-model duration and aspect-ratio support for video models.
      properties:
        durations:
          type: array
          description: Discrete set of supported durations in seconds, when the model only allows specific values.
          items:
            type: integer
          examples: [[4, 6, 8]]
        min_duration:
          type: integer
          nullable: true
          description: Minimum supported duration in seconds, when durations form a continuous range.
        max_duration:
          type: integer
          nullable: true
          description: Maximum supported duration in seconds, when durations form a continuous range.
        aspect_ratios:
          type: array
          items:
            $ref: '#/components/schemas/AspectRatio'
        image_input:
          type: boolean
          description: |
            Whether the model accepts an `image_url`. Dedicated image-to-video
            variants require one; models like Veo and Omni Flash take one
            optionally alongside the text prompt. Mirrors
            `references.start_frame`, which carries the full reference-media
            capability set. Read `references.start_frame_required` to tell
            an optional start frame from a mandatory one.
        audio:
          type: string
          enum: [none, always, optional]
          description: |
            What this model does about a soundtrack, and therefore what
            `generate_audio` can achieve on it. The API resolves and enforces
            exactly this value, so an omitted `generate_audio` never falls
            through to the provider's own default.

            * `none`: renders silent, always. `generate_audio: true` is
              accepted but cannot add a track at generation time; supply one
              with a separate `POST /generate/audio` pass.
            * `always`: native audio that cannot be switched off.
              `generate_audio: false` is refused with a 400, because nothing
              downstream can take the soundtrack back out of the render.
            * `optional`: the model honors `generate_audio`. Omitting it
              resolves to `true`.
          examples: ['optional']
        speech:
          type: string
          enum: [none, native]
          description: |
            Whether this model renders SPEECH — the words of a dialogue or
            voice-over line, spoken in the same pass that renders the picture,
            so a visible mouth matches them.

            A strictly narrower claim than `audio`, and the one to route
            on-camera dialogue by. `audio` answers "does a track come back";
            plenty of models return a real soundtrack that is ambience only.
            Grok Imagine is `audio: always` and `speech: none` — it returns a
            measured aac track with no words in it — so choosing a lip-work
            model by `audio != none` picks a model that cannot say the line.

            * `none`: the model does not render spoken words, or has not been
              measured doing so. Dialogue for these clips comes from a separate
              `POST /generate/audio` pass mixed in afterwards, which is fine for
              off-camera narration and wrong for a talking head — nothing binds
              the muxed voice to the rendered mouth.
            * `native`: the model speaks the line itself, synchronized to the
              picture. Declared only from measurement, never from a provider's
              marketing claim.

            `speech: native` always implies `audio` is `always` or `optional`;
            a silent model cannot speak. Note this flag says nothing about
            WHO the model will render: Seedance speaks but its provider refuses
            photoreal human likenesses, so its speech is product-only and never
            a talking head. Check the human-subject constraints too.
          examples: ['native']
        regeneration:
          type: boolean
          description: >-
            Whether the model can re-render one of your completed videos at its top resolution tier via the provider's native regeneration flow (`source_video_asset_id` on `POST /generate/video`; MiniMax Hailuo 3's 768P→2K Video Regeneration). The charge covers the re-rendered 2K output seconds plus the source clip's own input seconds, both at the model's 2k tier rate. Omitted means unsupported.
        seed:
          type: boolean
          description: >-
            Whether this model's provider honors the request's `seed`.

            `false` means the provider's API has no seed field at all, so a seed could only ever be discarded — sending one is refused with a 400 rather than accepted and ignored, because a discarded seed returns a DIFFERENT video than the reproducible one you asked for and still bills you for it.

            Omitted means nobody has verified this model's provider yet, and the field is accepted with no promise that it does anything. Absence is deliberately not the same as `false`: refusing on an unchecked assumption would delete a capability that may work.
        max_prompt_chars:
          type: integer
          description: |
            The longest `prompt`, in characters, this model's provider
            accepts. Absent when the provider publishes no limit of its own.

            Measured on the prompt the provider receives, after the
            `character_id` continuity description and the `shots[]`
            composition are folded in, and a request above it is rejected
            with a 400 that names the limit and your length before any
            credit hold is taken. Your prompt is never altered on a request
            you send.

            The one place the API shortens a prompt is an automatic policy
            re-route: when a model's provider refuses your reference media
            (Seedance's lifelike-human moderation) and the job is re-dispatched
            to a fallback model with a stricter cap, the prompt is cut at a
            word boundary to fit it, and the asset's generation metadata
            records `prompt_truncated_for_fallback: true` with
            `original_prompt_chars`.
          minimum: 1
          example: 4096
    ImageCapabilities:
      type: object
      additionalProperties: false
      description: |
        Per-model image-generation options beyond the shared `image_size`
        aliases. Every published image model declares its supported
        `aspect_ratio` values here — clients should drive their ratio
        pickers from this list.

        Published for EVERY image model (a model with no selectable ratios
        still declares `reference_images_max`), so a client can always tell
        whether an image model accepts a reference image.
      properties:
        aspect_ratios:
          type: array
          description: Selectable `aspect_ratio` values for this model.
          items:
            $ref: '#/components/schemas/ImageAspectRatio'
        negative_prompt_max_length:
          type: integer
          description: |
            Maximum `negative_prompt` length in characters for this model.
            Absent when the shared request-contract maximum applies. Requests
            above a published model-specific limit are rejected before any
            credit hold is taken.
          minimum: 1
          example: 500
        reference_images_max:
          type: integer
          description: |
            How many reference images this model accepts across `image_url`
            and `image_urls` for identity-preserving edits.

            `0` means the model generates from the prompt ONLY: it has no way
            to consume a reference, and sending one is rejected up front with
            a 400 (before any credit hold is taken, so a rejected request
            never costs credits). Clients MUST NOT offer a reference-image
            affordance for these models, and should filter or disable them in
            the model picker once the user has attached a reference.

            `1` means a single reference via `image_url`; sending `image_urls`
            is rejected. Values above 1 additionally accept `image_urls`, up
            to this many references combined.

            Absent on responses from an API build older than this field: treat
            unknown as permitted rather than blocking the user.
          minimum: 0
          example: 4
        reference_long_edge_max:
          type: integer
          description: |
            The largest reference image, in pixels on its longer edge, this
            model is sent. A reference above it is downscaled to exactly this
            edge (aspect ratio preserved) before the provider sees it, so
            sending a larger image costs nothing extra and changes nothing
            but the pixels the model works from. References needing resizing
            fail asynchronously if they exceed 16,777,216 pixels (4096x4096
            worth of pixels) or use 16-bit color. The request returns 202
            Accepted before the worker downloads and checks the reference;
            poll the accepted job for its failure message. Its reserved
            credits are refunded. This is not a synchronous HTTP 400.
            Clients should resize to this edge or export 8-bit images before
            uploading.

            Published only by models that bound the reference. The Microsoft
            MAI-Image family bills input image tokens per pixel with no
            ceiling, so its bound (2048) is what its price is derived from.
            Absent means references are forwarded at their native size.
          minimum: 1
          example: 2048
        num_images_max:
          type: integer
          description: |
            The largest `num_images` this model accepts in one request. Most
            models allow the contract maximum of 4; a model whose provider
            returns exactly one image per call publishes `1`, and a request
            above its ceiling is rejected up front with a 400 (before any
            credit hold, so it never costs credits).

            Clients should bound their image-count control by this value.
            Absent on responses from an API build older than this field: fall
            back to the schema maximum for `num_images`.
          minimum: 1
          maximum: 4
          example: 4
        render_quality:
          allOf:
            - $ref: '#/components/schemas/RenderQualityCapabilities'
          description: >-
            The model's render-quality ladder, the second and independent quality axis (see the `render_quality` request field). Absent on every model that does not take one, which is everything outside the GPT Image family.
        inpaint_mask:
          type: boolean
          description: |
            Whether this model can edit PART of an image: the request may name
            a mask (`mask_asset_id`), a PNG with an alpha channel and the same
            dimensions as the single reference image, and only its see-through
            areas are repainted. The rest of the picture is left alone.

            True on `gpt-image-2`, `gpt-image-2.5-sunburst` and
            `gpt-image-2.5-flare`, false everywhere else. `gpt-image-1.5` and
            `gpt-image-1` are false on purpose: they accept a mask upstream
            but were measured to repaint the whole picture around it, which
            is the silent substitution this flag exists to prevent. The other
            reference-capable models are false because their providers have
            no mask concept and would repaint the whole image instead. A
            `mask_asset_id` sent to a model publishing `false` is rejected
            with a 400 before any credit hold rather than silently ignored,
            so clients should offer the mask control only where this is true.
            Masked edits cost exactly what the same model's ordinary
            generation costs; a mask changes no price.

            Absent on responses from an API build older than this field: treat
            as false (hide the control).
          example: true
        aura_compatible:
          type: boolean
          description: |
            Whether Aura (the Nolgia character engine) composes on this model:
            true for photoreal person lanes, false for vector, anime, and
            illustration models (the recraft family). Clients drive the Aura
            toggle from this flag - show it (default ON for person prompts)
            when true, hide it entirely when false. The API mirrors the same
            stance: `aura: true` on an incompatible model is a no-op. Absent
            on responses from an API build older than this field: treat as
            false (hide the toggle).
          example: true
    AudioCapabilities:
      type: object
      additionalProperties: false
      description: Per-model voice catalog, speaking-rate range, and prompt ceiling for audio models.
      properties:
        voices:
          type: array
          description: Selectable voice identifiers for this model. Absent when the model has no enumerable voice catalog.
          items:
            $ref: '#/components/schemas/Voice'
        speed:
          allOf:
            - $ref: '#/components/schemas/SpeedRange'
          description: Accepted speaking-rate range for `speed` on POST /generate/audio. Absent when the model ignores speed.
        max_prompt_chars:
          type: integer
          examples: [2000]
          description: |
            The longest `prompt`, in characters (Unicode code points), this
            model's provider accepts on POST /generate/audio. Absent when the
            provider publishes no limit of its own below the 4000 every audio
            request is held to.

            A request above it is rejected with a 400 that names the limit
            and your length, before any credit hold is taken. Your prompt is
            never shortened.
    SpeedRange:
      type: object
      additionalProperties: false
      required: [min, max]
      properties:
        min:
          type: number
          format: double
          examples: [0.7]
        max:
          type: number
          format: double
          examples: [1.2]
    Voice:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          examples: ['af_bella']
        label:
          type: string
          nullable: true
          description: Human-friendly display name for the voice.
          examples: ['Bella (American female)']
    UploadAssetRequest:
      type: object
      additionalProperties: false
      required: [content_type, data]
      properties:
        content_type:
          type: string
          enum: [image/png, image/jpeg, image/webp]
          description: MIME type of the uploaded bytes.
        data:
          type: string
          format: byte
          minLength: 1
          maxLength: 14000000
          description: Base64-encoded file contents (max ~10MB decoded).
        filename:
          type: string
          nullable: true
          maxLength: 255
          description: >
            Original filename. Its stem (the extension is dropped) becomes the asset's `display_name`, exactly as it does on the signed-upload route, so the file is recognisable in a later listing. Omit it and the asset gets the generic automatic name for its modality.

          examples: ['brand-wordmark.png']
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Files the uploaded asset into this caller-owned project directly; an unknown or foreign project returns 400. Without it, the asset lands in the default "Library" project.

    CreateAssetUploadRequest:
      type: object
      additionalProperties: false
      required: [filename, content_type, size_bytes]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
          description: Original filename, kept as asset metadata.
          examples: ['final-cut.mp4']
        content_type:
          type: string
          enum:
            - video/mp4
            - video/quicktime
            - video/webm
            - audio/mpeg
            - audio/wav
            - audio/ogg
            - audio/webm
            - audio/mp4
            - image/png
            - image/jpeg
            - image/webp
            - model/gltf-binary
          description: >
            MIME type of the file. The signed PUT URL is bound to it, so the upload request must send exactly this Content-Type header.

        size_bytes:
          type: integer
          format: int64
          minimum: 1
          description: >
            Exact size of the file in bytes. Verified against the uploaded object on completion. Limits: 50 GiB for video, 5 GiB for audio, 100 MiB for images, 200 MiB for 3D models.

        tags:
          type: array
          maxItems: 10
          description: Tags to apply to the asset; trimmed, lowercased, and de-duplicated.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples: [['final-cut', 'campaign-x']]
        display_name:
          type: string
          nullable: true
          maxLength: 200
          description: >
            Optional human-readable display name stored on the pre-created asset (trimmed). Defaults to empty.

          examples: ['Hero shot v2']
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Files the uploaded asset into this caller-owned project directly (no tag matching involved); an unknown or foreign project returns 400. Without it, the asset lands in the default "Library" project.

    AssetUpload:
      type: object
      additionalProperties: false
      required: [upload_id, asset_id, upload_url, expires_at]
      properties:
        upload_id:
          type: string
          format: uuid
          description: Identifier for `POST /assets/uploads/{id}/complete`.
        asset_id:
          type: string
          format: uuid
          description: The pre-created asset (status `uploading`) the bytes will belong to.
        upload_url:
          type: string
          format: uri
          description: >
            Signed PUT URL. Upload with `PUT <upload_url>` and a `Content-Type` header exactly matching the declared `content_type`; no Authorization header is needed.

        expires_at:
          type: string
          format: date-time
          description: Expiry of `upload_url` (30 minutes after creation).
    AssetStatus:
      type: string
      enum: [uploading, ready]
      description: >
        Lifecycle status of an asset. `uploading` marks a signed-upload asset whose bytes have not been verified yet; `ready` assets are fully stored and downloadable.

    AssetSort:
      type: string
      enum: [created_at_desc, created_at_asc, name_asc, name_desc]
      description: >
        Orderings accepted by `GET /assets`. `created_at_desc` is the default (newest first). The `name_*` orderings compare the asset's effective title case-insensitively: display name when set, else prompt, else the model id.

    ImageModel:
      type: string
      description: |
        Image model identifier exposed by the public API.
        `gpt-image-2.5-sunburst` is OpenAI's most capable model for image
        generation and editing: built for premium visual workflows and tighter
        control across edits, at longer generation times.
        `gpt-image-2.5-flare` is the fast everyday tier and OpenAI's own
        default for most applications, higher quality than `gpt-image-2` at
        50% lower latency. Both inherit `gpt-image-2`'s twelve aspect ratios,
        its `native`/`2k`/`4k` tiers and its multi-reference editing, but cost
        markedly fewer credits: measured token consumption is far below
        `gpt-image-2`'s, and the two 2.5 models are priced identically to each
        other. `gpt-image-1.5` is
        the OpenAI model between GPT Image 1 and 2, sized like `gpt-image-1`
        (1:1, 3:2, 2:3). `nano-banana-pro`
        (Gemini 3 Pro Image) is the flagship Gemini image model and
        `nano-banana-2-lite` (Gemini 3.1 Flash Lite Image) the budget tier,
        both with the ten Gemini aspect ratios and reference-image editing.
        `grok-imagine-image-2.0` is the newest Grok Imagine image model, same
        1k/2k tiers and aspect ratios as `grok-imagine-image`. The tiers are
        not priced alike across the three Grok image models: xAI charges one
        rate at both resolutions on `grok-imagine-image`, but more at 2k on
        `grok-imagine-image-quality` and `grok-imagine-image-2.0`, where 2k is
        a premium tier. Read the per-tier credits from `GET /models` rather
        than assuming the base rate applies to every tier.

        Four families ship as ONE id each; the server dispatches
        the family's edit route whenever a reference image rides the request
        (`image_url`, `image_urls`, `reference_asset_ids`, a face or element
        reference) and the text-to-image route otherwise. `reve-2.1` (Reve
        2.1): a single reference, the shared `native`/`2k`/`4k` upscaler
        tiers. `seedream-v5-pro` (ByteDance Seedream 5 Pro): native `1k`
        (default) and `2k` output tiers, up to 4 reference images.
        `ideogram-v4` (Ideogram v4): `turbo`/`balanced`/`quality` tiers that
        select the rendering speed, a single reference. `qwen-image-3`
        (Alibaba Qwen Image 3): native `1k`/`2k` tiers, 1 to 3 reference
        images, `negative_prompt` honored (500 characters upstream). All four
        take the five alias-shaped aspect ratios (16:9, 4:3, 1:1, 3:4, 9:16);
        `seed` reaches the provider on `ideogram-v4` and `qwen-image-3` only
        (Reve and Seedream publish no seed).

        `remove-background` is a promptless foreground-extraction utility:
        submit exactly one source reference via `POST /generate/image` for
        a transparent PNG. It publishes `remove_background: true` and takes
        no prompt, negative prompt, identity conditioning, sizing, or quality
        tier. Glass and other genuinely transparent materials come back opaque.

        The five `topaz-image-*` ids are ENHANCERS, not generators, and they
        are the only image models that publish `image_enhance: true` in
        `GET /models`. Each one re-renders a reference image you already have
        at a larger output size, takes NO prompt, and requires exactly one
        reference. They keep the source's aspect ratio, so they publish no
        `image.aspect_ratios` and refuse `aspect_ratio`; `quality` picks the
        output long edge (`2k` = 2048px, `4k` = 4096px, the default) and both
        tiers cost the same. Pick by what the source is:
        `topaz-image-standard` for everyday photos and graphics,
        `topaz-image-high-fidelity` for already-sharp high-resolution photos,
        `topaz-image-low-resolution` for thumbnails and web scrapes,
        `topaz-image-cgi` for illustrations, renders and game art, and
        `topaz-image-text` for logos, screenshots and typography.

        `flux-expand` (BFL FLUX.1 Expand [pro]) is the OUTPAINT lane and the
        only image model that publishes `image_expand: true`: it grows one
        reference image you already have to a requested `aspect_ratio` by
        painting new content into the added margins (a reframe to 9:16, 1:1 or
        4:5 from a 16:9 still), keeps the source's own pixels, requires exactly
        one reference and an `aspect_ratio`, and takes an optional prompt for
        what the new area should contain. Flat per image; no quality tiers.

        Seven models reach the catalog through OpenRouter. `mai-image-2.6`,
        `mai-image-2.6-flash`, `mai-image-2.5` and `mai-image-2.5-pro` are
        Microsoft MAI-Image on Azure, four of the strongest text-to-image
        models in the catalog, and they EDIT: each takes exactly one
        reference image (`reference_images_max` of 1, `image_url` only),
        downscaled to a 2048 px long edge before dispatch
        (`reference_long_edge_max`), because the family bills input image
        tokens per pixel. They carry the shared `native`/`2k`/`4k` upscaler
        tiers, since the family has no native resolution knob, and render
        one image per request. The other three are TEXT-TO-IMAGE ONLY
        (`reference_images_max` of 0, a reference is a 400 up front) until
        each is verified with a reference on its route. `riverflow-v2.5-pro` and
        `riverflow-v2.5-fast` (Sourceful Riverflow V2.5) are the catalog's
        strongest typography and layout models, with native `1k`/`2k` output
        and `4k` on pro; both are SLOW (a 1k pro render measures over two
        minutes) and return one image per request. `seedream-4.5` (ByteDance
        Seedream) renders native `2k` and `4k` at one flat rate, so both tiers
        cost the same credits.

        All seven take five aspect ratios (16:9, 3:2, 1:1, 2:3, 9:16) and
        honor neither `seed`, `negative_prompt` nor `guidance_scale`, which
        their provider route does not carry.
      enum:
        - gpt-image-2.5-sunburst
        - gpt-image-2.5-flare
        - gpt-image-2
        - gpt-image-1.5
        - reve-2.1
        - gpt-image-1
        - imagen-4
        - nano-banana-2
        - nano-banana-pro
        - nano-banana-2-lite
        - seedream-v5-pro
        - flux-schnell
        - flux-ultra
        - flux-pro
        - flux-2-pro
