        - veo-3.1-fast
        - veo-3.1-lite
        - omni-flash
        - omni-1.1-flash
        - omni-1.1-flash-edit
        - grok-imagine-video
        - grok-imagine-video-1.5
        - minimax-h3
        - minimax-hailuo-2.3
        - minimax-hailuo-2.3-fast
