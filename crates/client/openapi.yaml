        For each key the object is streamed from the customer's bucket into NOLGIA storage through the signed-upload machinery (asset status `uploading` then `ready`), stamped with the organization, named after the key's basename, and classified by its content type (the same media types and size limits as `POST /assets/uploads`). Keys are processed in order, synchronously; each result reports `imported` with the asset or `failed` with the reason, so one bad key never fails the batch. The importing connection records the object as already mirrored.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageImportRequest'
      responses:
        '200':
          description: Per-key import results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageImportResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /organizations/{id}/storage-connections/{connection_id}/backfill:
