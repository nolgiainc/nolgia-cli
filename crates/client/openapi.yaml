  /me/share-links:
    get:
      tags: [Sharing]
      operationId: listMyShareLinks
      summary: List every active share link in the caller's library, newest first.
      description: >
        The creator-side view of sharing: every unrevoked, unexpired share link on assets and renders in the caller's library scope, newest first, each with what it points at (the target's title and a short-lived signed thumbnail when the media has one) and how it has been doing (`access_count`, `last_accessed_at`), so a "My links" page needs one call instead of one per asset. Scope follows the library rule: the personal space lists the links the caller created on personal media; organization context lists every link on the organization's media whoever created it. Tokens are stored hashed, so rows carry `token_prefix` and never the token or URL; revoke through the asset or render revoke endpoint with the row's `id`. At most 200 rows.

      responses:
        '200':
          description: Active share links across the caller's library, newest first.
