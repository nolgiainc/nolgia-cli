      description: >
        Given the most recent user message and the assistant's reply, returns
        up to 3 SHORT, imperative, tap-to-send next-step prompts a user could
        pick to continue the conversation (e.g. "Make the intro punchier",
        "Turn this into a 15s vertical cut", "Add captions"). This is a
        best-effort UX affordance: it is not credit-gated, uses a small fast
        model with a short upstream timeout, and NEVER fails the caller's
        flow — whenever the model is unavailable, errors, times out, or
        returns nothing usable it responds `200` with an empty `suggestions`
        array. Browser (JWT) sessions only — PATs are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentFollowupsRequest'
      responses:
        '200':
          description: >
            Suggested follow-up prompts (0 to 3). An empty array is a normal,
            successful response when no usable suggestions were produced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFollowupsResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /agent/transcriptions:
    post:
      tags: [Agent]
      operationId: transcribeAgentAudio
      summary: Transcribe an uploaded audio asset to text (browser sessions only).
      description: >
        Transcribes a short audio asset — typically a voice note recorded in
        the chat composer and stored via the signed-upload flow — into text
        using a speech-to-text model behind the platform's model proxy. The
        asset must be owned by the caller (`404` otherwise), have modality
        `audio`, be status `ready`, and be at most 25 MiB (`400` otherwise);
        an upstream transcription failure surfaces as `502`. Browser (JWT)
        sessions only — PATs are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscribeAgentAudioRequest'
      responses:
        '200':
          description: The transcribed text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTranscription'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /agent/sessions:
