  /jobs/{id}/sse-ticket:
    post:
      tags: [Jobs]
      operationId: createJobSSETicket
      summary: Mint a single-use ticket for the job status stream.
      description: >
        Returns a short-lived, single-use ticket that authorizes one `GET /jobs/{id}/sse` connection. Required because `EventSource` cannot send an `Authorization` header. The ticket is consumed on first use and expires after 60 seconds.

      parameters:
