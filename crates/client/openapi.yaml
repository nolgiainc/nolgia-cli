        cli_version:
          type: string
          description: Pinned nolgia CLI version the reconciler should install. Sourced from a server config default in increment 1 (not yet per-agent).
          examples: ['0.1.0']
        runtime_version:
          type: string
          description: Pinned agent runtime (base-image) version the reconciler should target. Sourced from a server config default in increment 1 (not yet per-agent).
          examples: ['0.1.0']
    PublishAbilityRequest:
      type: object
      additionalProperties: false
      required: [slug, name, version, content_base64]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,63}$'
          examples: ['short-film']
        name:
          type: string
          minLength: 1
          maxLength: 128
        version:
          type: string
          description: Semver version; must be new for this slug (versions are immutable). Each numeric field is capped at 18 digits so the version always orders numerically against the published set.
          pattern: '^[0-9]{1,18}(\.[0-9]{1,18}){2}$'
          examples: ['1.0.0']
        description:
          type: string
          maxLength: 4000
        required_env:
          type: array
          items:
            type: string
        credit_cost_hint:
          type: string
          maxLength: 500
        min_tier:
          allOf:
            - $ref: '#/components/schemas/AbilityMinTier'
          description: Minimum subscription tier required to install/download the ability. Empty (default) means free.
        access:
          allOf:
            - $ref: '#/components/schemas/AbilityAccess'
          description: Commercial access model. Defaults to `included` when omitted. `premium_addon` requires `price_cents` + `interval`.
        price_cents:
          type: integer
          nullable: true
          minimum: 0
          description: Add-on price in cents, required for `premium_addon` (and rejected for `included`). Metadata only — no purchase flow yet.
        interval:
          allOf:
            - $ref: '#/components/schemas/AbilityInterval'
          nullable: true
          description: Billing interval of `price_cents`, required for `premium_addon` (and rejected for `included`).
        visibility:
          allOf:
            - $ref: '#/components/schemas/AbilityVisibility'
          description: >-
            Audience of the newly published ability. Defaults to `private` when omitted — a safe-by-default held draft that stays out of the customer catalog until an admin promotes it, so a forgotten `visibility` never silently ships an ability public. Set `public` explicitly to publish it live to the catalog.
        manifest:
          type: object
          description: The full `ability.json` manifest, stored verbatim with the version.
        content_base64:
          type: string
          description: Base64-encoded tar.gz of the ability package directory (max 5 MiB decoded).
    ColorPreset:
      type: object
      required: [slug, name, description]
      description: One built-in color-grade preset ("LUT look") from the embedded manifest.
      properties:
        slug:
          type: string
          description: Stable identity of the preset — the value a `colorGrade`'s `preset` field references.
          examples: ['teal-orange']
        name:
          type: string
          description: Display name.
          examples: ['Teal & Orange']
        description:
          type: string
          description: One-line description of the look.
        category:
          type: string
          description: >-
            Editorial category within its group. Film-stock presets use motion | stills | mono | finish | camera; the legacy looks use look. Empty on presets recorded before the field existed.
          examples: ['motion']
        group:
          type: string
          description: >-
            Catalog group. `film` is the primary set (real film stock emulations, round 39); `looks` is the legacy stylized set kept as a secondary group. Clients should present `film` first.
          examples: ['film']
    ColorPresetList:
      type: object
      required: [version, presets]
      description: The color-grade preset catalog, embedded in the service.
      properties:
        version:
          type: integer
          description: Manifest version; bumps when the recipe set changes.
        presets:
          type: array
          items:
            $ref: '#/components/schemas/ColorPreset'
          description: Presets in manifest order.
    CameraMoveStrength:
      type: string
      enum: [subtle, medium, strong]
      x-enum-varnames: [CameraMoveStrengthSubtle, CameraMoveStrengthMedium, CameraMoveStrengthStrong]
      description: >-
        How far and how fast a camera move travels over the clip. Omitted with a `motion_id` it resolves to the move's `default_strength` (`medium`); sent without a `motion_id` it is a 400.
    CameraMoveStrengthOption:
      type: object
      required: [strength, prompt_fragment]
      properties:
        strength:
          $ref: '#/components/schemas/CameraMoveStrength'
        prompt_fragment:
          type: string
          description: The exact sentence the server appends to the prompt at this strength.
          examples: ['Camera: a steady push-in toward the subject on a smooth dolly, the framing tightening from a medium shot to a close-up over the clip.']
    CameraMove:
      type: object
      required: [id, name, description, category, default_strength, strengths, preview_url]
      properties:
        id:
          type: string
          description: The stable `motion_id` a request sends.
          examples: ['push-in']
        name:
          type: string
          description: The customer-facing label.
          examples: ['Push-in']
        description:
          type: string
          description: One sentence on what the move does on screen (the text description standing in for a preview clip).
        category:
          type: string
          description: Chip grouping (`dolly`, `orbit`, `crane`, `pan`, `focus`, `handheld`, `zoom`, `static`).
          examples: ['dolly']
        default_strength:
          $ref: '#/components/schemas/CameraMoveStrength'
        strengths:
          type: array
          description: One entry per strength, subtle first.
          items:
            $ref: '#/components/schemas/CameraMoveStrengthOption'
        preview_url:
          type: string
          nullable: true
          format: uri
          description: An example clip of the move. Reserved; `null` on every entry today.
    CameraMoveList:
      type: object
      required: [motions]
      description: The camera-move library, embedded in the service.
      properties:
        motions:
          type: array
          items:
            $ref: '#/components/schemas/CameraMove'
          description: Moves in display order.
    MaskShape:
      type: string
      enum: [rectangle, ellipse, polygon]
      x-enum-varnames: [MaskShapeRectangle, MaskShapeEllipse, MaskShapePolygon]
      description: The mask's shape kind. `rectangle` (Premiere's 4-point mask, optionally rounded), `ellipse`, or a `polygon` pen path.
    MaskPoint:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
        format: double
        minimum: -100
        maximum: 200
      description: One polygon vertex as `[x, y]`, each a percentage of the clip box (x of its width, y of its height; 0 = left/top edge, 100 = right/bottom edge).
      examples: [[50, 0]]
    Mask:
      type: object
      additionalProperties: false
      description: |
        One per-clip timeline mask — a SPARSE object: every field is
        optional and an absent field is the default. `{}` is the identity
        mask (its one job is the explicit CLEAR in the `nolgia-edits.json`
        overlay). Coordinates are percentages of the CLIP BOX — the timed
        element's CSS box in the Studio preview, the clip's fitted frame on
        export. `feather`, `expansion`, and `cornerRadius` are px at the
        composition's native canvas resolution.

        Alpha per pixel: `shape = inverted ? 1 - inside : inside`,
        `alpha = 1 - (opacity / 100) * (1 - shape)`, where `inside` is the
        coverage after expansion and feathering; the clip's own alpha is
        multiplied by it. Exactly one mask per clip; masks apply to video
        and image clips (text clips: Studio preview only; audio: ignored).
      properties:
        shape:
          $ref: '#/components/schemas/MaskShape'
          default: rectangle
        x:
          type: number
          format: double
          minimum: -100
          maximum: 200
          default: 50
          description: Shape CENTER, % of the clip box width. Rectangle and ellipse only.
        y:
          type: number
          format: double
          minimum: -100
          maximum: 200
          default: 50
          description: Shape center, % of the clip box height. Rectangle and ellipse only.
        width:
          type: number
          format: double
          minimum: 0
          maximum: 200
          default: 100
          description: Shape width, % of the clip box width. Rectangle and ellipse only.
        height:
          type: number
          format: double
          minimum: 0
          maximum: 200
          default: 100
          description: Shape height, % of the clip box height. Rectangle and ellipse only.
        rotation:
          type: number
          format: double
          minimum: -180
          maximum: 180
          default: 0
          description: Degrees, clockwise (screen coordinates) about the shape center. Rectangle and ellipse only.
        cornerRadius:
          type: number
          format: double
          minimum: 0
          maximum: 500
          default: 0
          description: Corner rounding in native canvas px. Rectangle only.
        points:
          type: array
          minItems: 3
          maxItems: 64
          items:
            $ref: '#/components/schemas/MaskPoint'
          description: Polygon vertices in draw order (the path closes itself; nonzero winding fill). Required for — and only meaningful on — `polygon`.
        feather:
          type: number
          format: double
          minimum: 0
          maximum: 500
          default: 0
          description: Edge softness in native canvas px — the alpha ramp spans about `feather` px (Gaussian, σ = feather / 3).
        expansion:
          type: number
          format: double
          minimum: -500
          maximum: 500
          default: 0
          description: Grows (positive) or shrinks (negative) the outline by that many native canvas px before feathering.
        opacity:
          type: number
          format: double
          minimum: 0
          maximum: 100
          default: 100
          description: How strongly the mask hides the outside — 100 hides it fully, 0 makes the mask a no-op.
        inverted:
          type: boolean
          default: false
          description: Reveal the OUTSIDE and hide the INSIDE instead.
      examples:
        - {shape: ellipse, x: 50, y: 40, width: 60, height: 45, feather: 30}
        - {x: 25, width: 50}
        - {shape: rectangle, x: 75, y: 22, width: 40, height: 24, cornerRadius: 24}
        - {shape: polygon, points: [[0, 0], [100, 0], [50, 100]], inverted: true}
    MaskValidateRequest:
      type: object
      additionalProperties: false
      required: [mask]
      description: A candidate mask — any JSON value; non-objects are reported as "not a mask".
      properties:
        mask:
          description: The value to sanitize (normally an object shaped like `Mask`, but any JSON is accepted so junk can be diagnosed).
          nullable: true
    MaskProblem:
      type: object
      additionalProperties: false
      required: [path, message]
      description: One sanitizer diagnostic — a field that was clamped, dropped, or that made the mask undrawable.
      properties:
        path:
          type: string
          description: JSON path of the offending value relative to the mask (`""` for the mask itself, `"x"`, `"points[2]"`, …).
          examples: ['points[2]']
        message:
          type: string
          description: What happened and why, in one sentence.
          examples: ['clamped from 250 to 200 (range -100..200)']
    MaskValidation:
      type: object
      additionalProperties: false
      required: [mask, identity, problems]
      description: The sanitizer's verdict on a candidate mask.
      properties:
        mask:
          allOf:
            - $ref: '#/components/schemas/Mask'
          nullable: true
          description: The canonical sparse mask the renderer would draw, or `null` when the input is absent — not an object, undrawable (unknown shape, polygon with fewer than 3 valid vertices), or the identity.
        identity:
          type: boolean
          description: True when the input sanitized to the identity mask (a full-frame default rectangle) — in the overlay that is the explicit CLEAR of an authored mask.
        problems:
          type: array
          items:
            $ref: '#/components/schemas/MaskProblem'
          description: Every clamp/drop/undrawable diagnostic, in field order; empty when the input was already canonical.
    MotionAnchor:
      type: object
      additionalProperties: false
      description: The transform origin (Premiere's Anchor Point) as percentages of the CLIP BOX. 50/50 (the default) is the clip's center, 0/0 its top-left corner. Scale and rotation happen about this point, and it is the point `x`/`y` place on the canvas.
      properties:
        x:
          type: number
          format: double
          minimum: -100
          maximum: 200
          default: 50
          description: Anchor X, % of the clip box width.
        y:
          type: number
          format: double
          minimum: -100
          maximum: 200
          default: 50
          description: Anchor Y, % of the clip box height.
    MotionEase:
      type: string
      enum: [linear, ease-in, ease-out, ease-in-out, hold]
      x-enum-varnames: [MotionEaseLinear, MotionEaseEaseIn, MotionEaseEaseOut, MotionEaseEaseInOut, MotionEaseHold]
      default: linear
      description: |
        The curve of the keyframe SEGMENT that starts at a keyframe and runs
        to the next one. `linear` interpolates evenly; `ease-in`, `ease-out`
        and `ease-in-out` are the CSS cubic-bezier curves (0.42, 0, 1, 1),
        (0, 0, 0.58, 1) and (0.42, 0, 0.58, 1); `hold` keeps the keyframe's
        value for the whole segment and steps to the next value exactly at
        the next keyframe. The last keyframe's ease is carried but never
        used. A missing or unknown ease reads as `linear`.
    MotionKeyframe:
      type: object
      additionalProperties: false
      required: [t, v]
      description: |
        One keyframe of an animated Motion property. A property's keyframes
        sort ascending by `t`; two at the same `t` collapse to the later
        entry; an entry without a finite `t` and `v` is dropped. Before the
        first keyframe the property holds the first `v`, at or after the last
        it holds the last `v`. A one-keyframe list is kept as a list (the
        editor's "stopwatch on" state) and behaves as the constant `v`.
      properties:
        t:
          type: number
          format: double
          description: Seconds relative to the CLIP START on the timeline (not the source media; trimming the head with `srcOffset` does not move keyframes). Any finite number, kept at full precision, so a frame-snapped keyframe is exactly `frame / fps` on every side.
          examples: [0.5]
        v:
          type: number
          format: double
          description: The property value at `t`, in the property's units and range, clamped and rounded to 2 decimals exactly like the constant form.
          examples: [80]
        ease:
          $ref: '#/components/schemas/MotionEase'
    Motion:
      type: object
      additionalProperties: false
      description: |
        One per-clip timeline motion: a SPARSE object where every field is
        optional and an absent field is the default. `{}` is the identity
        motion (its one job is the explicit reset in the `nolgia-edits.json`
        overlay). The CLIP BOX is the clip fitted to the canvas preserving
        aspect (what a motion-less clip renders as, minus the letterbox
        bars): `scale` 1 means exactly that box.

        Every property except `anchor` is either a CONSTANT number (phase 1)
        or a KEYFRAME LIST (phase 2, `MotionKeyframe[]`) animating it over
        the clip: the preview and the export sample the list at each frame's
        clip time with the same easing curves. A constant stays a constant
        (no migration). `anchor` stays a constant object in this phase.

        Transform order: fit, scale about the anchor (per axis
        `scale * scaleX`, `scale * scaleY`), rotate about the anchor,
        translate so the anchor lands at (`x` % of the canvas width,
        `y` % of the canvas height), then `opacity`. The clip's mask is
        applied in the clip box BEFORE the transform, so it moves, scales,
        and rotates with the clip. Applies to video and image clips; text
        clips are placed by their `textStyle` instead (a `motion` on a text
        clip is ignored with a warning); audio ignores it.
      properties:
        x:
          description: Where the anchor lands, % of the canvas width (0 = left edge, 100 = right edge); -100..200, default 50. A constant or a keyframe list.
          oneOf:
            - type: number
              format: double
              minimum: -100
              maximum: 200
              default: 50
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MotionKeyframe'
        y:
          description: Where the anchor lands, % of the canvas height (0 = top edge, 100 = bottom edge); -100..200, default 50. A constant or a keyframe list.
          oneOf:
            - type: number
              format: double
              minimum: -100
              maximum: 200
              default: 50
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MotionKeyframe'
        scale:
          description: Uniform scale about the anchor; 1 = fit-to-frame, 0.5 = half size, 0 = the clip vanishes; 0..10, default 1. A constant or a keyframe list.
          oneOf:
            - type: number
              format: double
              minimum: 0
              maximum: 10
              default: 1
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MotionKeyframe'
        scaleX:
          description: Horizontal multiplier on top of `scale` (the effective X scale is `scale * scaleX`); 0..10, default 1. A constant or a keyframe list.
          oneOf:
            - type: number
              format: double
              minimum: 0
              maximum: 10
              default: 1
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MotionKeyframe'
        scaleY:
          description: Vertical multiplier on top of `scale` (the effective Y scale is `scale * scaleY`); 0..10, default 1. A constant or a keyframe list.
          oneOf:
            - type: number
              format: double
              minimum: 0
              maximum: 10
              default: 1
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MotionKeyframe'
        rotation:
          description: Degrees, clockwise (screen coordinates, y down), about the anchor; -360..360, default 0. A constant or a keyframe list.
          oneOf:
            - type: number
              format: double
              minimum: -360
              maximum: 360
              default: 0
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MotionKeyframe'
        opacity:
          description: Clip opacity, 100 = fully opaque, 0 = invisible; multiplied into the clip's mask alpha; 0..100, default 100. A constant or a keyframe list.
          oneOf:
            - type: number
              format: double
              minimum: 0
              maximum: 100
              default: 100
            - type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/MotionKeyframe'
        anchor:
          $ref: '#/components/schemas/MotionAnchor'
      examples:
        - {x: 80, y: 20, scale: 0.35}
        - {scale: 1.25, rotation: -6}
        - {x: 0, y: 0, scale: 0.5, anchor: {x: 0, y: 0}}
        - {opacity: 60}
