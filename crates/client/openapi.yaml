  /assets/{id}/restore:
    post:
      tags: [Assets]
      operationId: restoreAsset
      summary: Restore a trashed asset back into the library.
      description: >
        Clears the asset's `deleted_at` stamp so it reappears in the default listings. Restoring an asset that is not in the trash is an idempotent no-op; the asset is returned either way with a fresh signed URL.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asset restored; returned with a fresh signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /assets/{id}/permanent:
    delete:
      tags: [Assets]
      operationId: permanentlyDeleteAsset
      summary: Permanently delete one of the current user's assets.
      description: >
        Irreversibly removes the asset row and deletes the stored bytes (immediately when possible, otherwise via the deferred cleanup queue). Works on both live and trashed assets — this is the "delete forever" action of the trash view.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Asset permanently deleted.
        '400':
