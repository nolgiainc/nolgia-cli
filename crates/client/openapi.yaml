    VideoPromptEnhanceRequest:
      type: object
      additionalProperties: false
      required: [model, prompt]
      description: >-
        What the video composer is about to run: the prompt as typed and the settings the rewrite must respect. Nothing here is submitted; it only shapes the rewrite.
      properties:
        model:
          $ref: '#/components/schemas/VideoModel'
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
          description: The prompt as the customer typed it, `@` references included.
          examples: ['A barista pours latte art in a sunny cafe, slow and calm']
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 60
          description: The clip length the composer is set to; the shot plan is paced to it.
        has_references:
          type: boolean
          description: >-
            True when a start frame, end frame, reference image, reference video or character is attached, so the rewrite describes action and camera rather than re-describing what the references already carry.
        generate_audio:
          type: boolean
          description: >-
            Whether the run will render audio. When true on a model with native audio the rewrite describes the sound bed and keeps any spoken line; when false no sound is described.
        aspect_ratio:
          $ref: '#/components/schemas/AspectRatio'
        motion_id:
          type: string
          nullable: true
          maxLength: 64
          description: >-
            The camera move the composer has picked (`GET /motions`), so the rewrite builds its shot plan around that move instead of choosing another; the generate request then names the same `motion_id` and the server appends the fragment only if the rewrite dropped it. Unknown ids are a 400.
          examples: ['orbit-left']
        motion_strength:
          $ref: '#/components/schemas/CameraMoveStrength'
    VideoPromptEnhanceResponse:
      type: object
      additionalProperties: false
      required: [prompt, notes, guidance, credits_charged, model]
      properties:
        prompt:
          type: string
          maxLength: 4000
          description: The rewritten prompt, runnable as it is on `POST /generate/video` for the requested model.
        notes:
          type: array
          maxItems: 6
          items:
            type: string
            maxLength: 200
          description: Short plain-English notes on what the rewrite changed or what to check. May be empty.
        guidance:
          type: string
          description: >-
            Which guidance table entry shaped the rewrite: the model id when the model has its own entry (`seedance-2.5`), else `generic`.
          examples: ['seedance-2.5']
        credits_charged:
          type: integer
          description: >-
            Credits taken for this call: `ceil(provider cost / $0.018)` with a floor of 1. On the current brain a call is 1 credit.
          examples: [1]
        model:
          type: string
          description: The brain that wrote the rewrite.
          examples: ['deepseek-v4-flash']
    RemoveBackgroundVideoModel:
      type: string
      enum: [remove-background-video]
      description: >-
        Promptless video background removal via `POST /remove-background/video`. Returns WebM/VP9 with an alpha channel. Glass and other genuinely transparent materials come back opaque.
    RemoveBackgroundVideoRequest:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model:
          $ref: '#/components/schemas/RemoveBackgroundVideoModel'
        source_asset_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            One of your video assets. Exactly one of `source_asset_id` and `source_url` is required. Stored duration, when known, takes precedence over `duration_seconds` for billing.
        source_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Raw https URL of the source clip. Exactly one of `source_asset_id` and `source_url` is required. Requires `duration_seconds`.
        duration_seconds:
          type: integer
          minimum: 1
          maximum: 120
          description: >-
            Source clip length in seconds (round up). Required for a raw URL or an asset without stored duration. Credits scale with source length at the catalog's flat per-5-second rate, independently of resolution. No quality tier or prompt is accepted.
    RestoreVideoModel:
      type: string
      description: |
        Video-restoration lane model, submitted via `POST /restore/video`.
        Every member re-renders existing footage — de-noise, de-haze, detail
        recovery and up-res to a target resolution tier — and takes no prompt.

        `seedvr2-restore` is the AI footage restorer (SeedVR2), tiers
        720p/1080p/1440p/2160p.

        The `topaz-*` ids are the Topaz master upscalers, one per engine, so
        you pick the engine that matches the footage:

        Up-res and detail, for footage that is basically sound:

        - `topaz-proteus` — general live action, the default
        - `topaz-proteus-natural` — a gentler 2x general pass, without the crunchy look
        - `topaz-rhea` — texture-heavy upscales
        - `topaz-theia` — fine-tuned detail
        - `topaz-theia-fidelity` — detail that stays stable frame to frame
        - `topaz-gaia` — live action, a high-quality general pass
        - `topaz-gaia-cg` — CG and animation: 3D renders and animation that are already clean

        Faces:

        - `topaz-iris` — faces, from a low-quality source
        - `topaz-iris-medium` — faces, from a mid-quality source; takes interlaced too

        Compression damage. Pick the one that matches how rough the source is:

        - `topaz-artemis` — high-quality sources
        - `topaz-artemis-medium` — moderately compressed
        - `topaz-artemis-low` — the roughest sources, heaviest denoise
        - `topaz-artemis-moire` — moire patterning and stair-stepped edges
        - `topaz-artemis-dehalo-medium` — halo suppression, one strength
        - `topaz-artemis-dehalo-low` — halo suppression, the other strength

        The two halo variants are not ranked here on purpose: Topaz's own
        published mapping for them contradicts the example files on the same
        page, so try both on a clip rather than trusting an ordering.

        Denoise:

        - `topaz-nyx` — denoise plus detail
        - `topaz-nyx-xl` — the heaviest denoiser, for severe noise or grain
        - `topaz-nyx-fast` — the quick one, for volume work

        Interlaced footage:

        - `topaz-dione` — robust deinterlace, the general choice
        - `topaz-dione-dv` — digital camcorder tape: DV, DVCPRO, DVCAM, 720i, 1080i
        - `topaz-dione-tv` — analog broadcast, VHS, DVD and SD (480i, 576i)
        - `topaz-dione-dehalo` — the same plus halo and colour-fringe suppression
        - `topaz-dione-robust-dehalo` — combing baked into footage already made progressive

        Generative restoration, for footage too degraded for the engines above.
        These cost several times as much per second:

        - `topaz-starlight-fast` — the fast pass
        - `topaz-starlight` — Starlight Precise 2.5
        - `topaz-wonder` — Starlight Sharp: sharper detail on clean progressive video

        Fixes that are not up-res at all. These cost the same at every tier,
        because the engine is not enlarging anything:

        - `topaz-motion-deblur` — blur from fast camera or subject movement
        - `topaz-hdr` — SDR to HDR (Hyperion). Deinterlace first: it is weak on interlaced
        - `topaz-hyperion` — SDR to HDR, second generation, for finishing

        Tiers are 720p/1080p/1440p/2160p on every engine, plus 4320p (8K) on
        most; `topaz-starlight` and `topaz-hyperion` top out at 2160p. Read
        each model's real tier list and per-tier credit rates from
        `quality.options` on `GET /models` rather than hard-coding this
        paragraph.

        Four more Topaz engines are configured but not offered yet:
        animation up-res, Starlight HQ, Starlight Mini and black-and-white
        colorization. Those four are the only ones that require the source
        clip's own dimensions and frame count to be declared upstream, which
        the generation proxy does not send yet, so they are withheld rather
        than advertised and then refused. They will appear here, with their
        rates, once that ships.
      enum:
        - seedvr2-restore
        - topaz-proteus
        - topaz-rhea
        - topaz-iris
        - topaz-nyx
        - topaz-theia
        - topaz-artemis
        - topaz-gaia
        - topaz-dione
        - topaz-starlight-fast
        - topaz-starlight
        - topaz-wonder
        - topaz-hyperion
        - topaz-proteus-natural
        - topaz-theia-fidelity
        - topaz-artemis-low
        - topaz-artemis-medium
        - topaz-artemis-moire
        - topaz-artemis-dehalo-low
        - topaz-artemis-dehalo-medium
        - topaz-gaia-cg
        - topaz-iris-medium
        - topaz-nyx-xl
        - topaz-dione-dv
        - topaz-dione-tv
        - topaz-dione-dehalo
        - topaz-dione-robust-dehalo
        - topaz-nyx-fast
        - topaz-motion-deblur
        - topaz-hdr
    ImageSize:
      type: string
      enum: [square, square_hd, portrait_4_3, portrait_16_9, landscape_4_3, landscape_16_9]
    ImageAspectRatio:
      type: string
      description: >-
        Native output aspect ratio for image models. Every published image model declares its supported values as `image.aspect_ratios` on `GET /models`; a ratio outside the selected model's list is rejected (400). Prefer this over `image_size`, whose closed aliases only express the 16:9/4:3/1:1 families.
      enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '3:2', '2:3', '21:9', '9:21', '2:1', '1:2', '5:4', '4:5', '3:1', '1:3', '4:1', '1:4']
    AspectRatio:
      type: string
      description: >-
        The shape of the rendered clip. Only the values in the selected model's `video.aspect_ratios` are accepted; anything else is a `400`. The choice never changes the price.
      enum: ['16:9', '9:16', '1:1', '4:3', '3:4', '3:2', '2:3', '21:9']
    BitrateMode:
      type: string
      description: >-
        Output bitrate profile for models that support it (see the model's `video.bitrate_modes` on `GET /models`, which is authoritative — no currently published model exposes one). `standard` is the provider default; `high` trades larger files for higher visual fidelity. Rejected (400) on models without bitrate selection.
      enum: [standard, high]
    DuplicateAssetRequest:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
