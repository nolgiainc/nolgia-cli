        installed_version:
          type: string
          nullable: true
          description: The version the agent pod itself reported as materialized (POST /agent/heartbeat). Null until a pod reports; drift is visible as installed_version differing from the tracked version (`pinned_version` when set, otherwise `latest_version`).
        version_reported_at:
          type: string
          format: date-time
