  /generate/3d:
    post:
      tags: [Generate]
      operationId: generate3D
      summary: Turn product or object photos into a 3D model.
      description: |
        Turn one to four photos into a GLB model you can view in a browser
        and download. `hunyuan3d-v3` is the standard quality engine and the
        default; it accepts front, back, left and right views. `trellis` is
        the draft engine; it accepts one photo and always adds textures.
        Returns immediately with a job. Use `GET /jobs/{id}` or
        `GET /jobs/{id}/wait` to retrieve its `3d` asset (`model/gltf-binary`,
        `.glb`), with a preview thumbnail when the engine returns one.

        Credits are charged per generation. Hunyuan costs 21 credits with
        textures or 13 for an untextured white model. PBR materials add 9
        credits and require textures. Extra views add 9 credits once,
        whether you send one, two or three extra views. The textured totals
        are 21, 30 with PBR, 30 with extra views, or 39 with both; untextured
        totals are 13 or 22 with extra views. Trellis costs 2 credits.

        **Duplicate submissions are refused, not billed.** Submitting the same
        request twice within five minutes returns `409` naming the job that
        already exists, so a lost response - a closed tab, a dropped
        connection, a `wait` that timed out - cannot turn into a second
        charge. Send a distinct `Idempotency-Key` header to declare a
        deliberate new take of an identical prompt; repeat the same key to
        make your own retries collapse onto one job.

        **Failures carry a machine-readable code.** A refusal sets `error.code` and a failed job sets
        `failure.code` to a `GenerationErrorCode`, so a client can branch without parsing prose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Generate3DRequest'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /remove-background/video:
    post:
      tags: [Generate]
      operationId: removeBackgroundVideo
      summary: Remove a video's background (asynchronous).
      description: |
        Extract the foreground of one source clip with no prompt. Returns a
        normal video job; use `GET /jobs/{id}` or `GET /jobs/{id}/wait` to
        retrieve the asset. Output is WebM/VP9 with an alpha channel, not MP4.
        Glass and other genuinely transparent materials come back opaque.

        Exactly one source asset or https URL is required. Billing uses the
        stored source duration when available; otherwise `duration_seconds`
        is required. Credits scale with source length at the flat per-5-second
        rate on `GET /models`, independently of resolution. No quality tier,
        prompt, or restore controls are accepted. These models publish
        `remove_background: true`, not `restore: true`.

        **Duplicate submissions are refused, not billed.** An identical
        request within five minutes returns `409` naming the existing job;
        send a distinct `Idempotency-Key` for a deliberate new run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveBackgroundVideoRequest'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /restore/video:
    post:
      tags: [Generate]
      operationId: restoreVideo
      summary: Submit a video restoration/upscale job (asynchronous).
      description: |
        The AI footage-restorer lane: re-renders existing footage (a video
        asset you generated or uploaded, or a URL you host) at a target
        resolution tier with de-noise, de-haze and detail recovery. Restore
        models take NO prompt — the source clip and the chosen engine are the
        whole input. Returns immediately with a job (modality `video`); use
        `GET /jobs/{id}` or `GET /jobs/{id}/wait` to retrieve the restored
        asset.

        Pick the model to match the footage: `seedvr2-restore` is the general
        AI restorer, and the `topaz-*` master upscalers expose one Topaz
        engine each (faces, CG, interlaced, generative, and so on) — see
        `RestoreVideoModel`.

        Credits scale with the source clip length at the selected quality
        tier's per-5-second rate — see the model's `quality.options` on
        `GET /models`. Restore-lane models carry `restore: true` in the
        model catalog.

        **Duplicate submissions are refused, not billed.** Same idempotency
        contract as `POST /generate/video`: an identical request within five
        minutes returns `409` naming the existing job; send a distinct
        `Idempotency-Key` header to declare a deliberate new run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreVideoRequest'
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /jobs/cost:
    post:
      tags: [Jobs]
      operationId: quoteJobCost
      summary: Price a generation before submitting it.
      description: |
        Returns the credits the matching generate call will hold for exactly
        these settings, a settings summary to show the customer, and a
        short-lived confirmation token.

        **Nothing is submitted, nothing is reserved and nothing is charged.**
        The request is validated as the generate endpoint would validate it,
        so an unpriceable or malformed request is refused here with the same
        status, detail and `error.code` it would get on submit.

        **The quote is not an estimate.** It is produced by running the real
        generate handler up to the moment it would spend, so the number here
        and the number held on submit come from one call to one pricer and
        cannot drift. A quote can still go stale: re-quote if the customer
        changes anything, and re-quote after `expires_at`.

        **Sending the token back is optional.** No surface requires it. A
        generate call with no `confirmation_token` behaves exactly as it
        always has — existing clients are unaffected. A call that DOES carry
        one is held to it: a token that is expired, malformed, issued to
        another account, or issued for a different request or a different
        price is refused with `422` and `error.code`
        `confirmation_rejected`, rather than quietly charging a price the
        customer never saw.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCostRequest'
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCostQuote'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
