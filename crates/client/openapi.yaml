    StorageConnection:
      type: object
      additionalProperties: false
      required: [id, organization_id, kind, name, bucket, region, prefix, force_path_style, access_key_id, mirror_enabled, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StorageConnectionKind'
        name:
          type: string
          maxLength: 120
          examples: ['Production archive (R2)']
        bucket:
          type: string
          examples: ['acme-media-archive']
        region:
          type: string
          description: Signing region. `auto` for Cloudflare R2, `us-east-1` for most S3-compatible endpoints.
          examples: ['us-east-1']
        prefix:
          type: string
          description: Key prefix every mirrored object is written under (no leading or trailing slash; empty for the bucket root).
          examples: ['nolgia']
        endpoint:
          type: string
          format: uri
          nullable: true
          description: Custom endpoint for S3-compatible providers. Null for AWS S3.
          examples: ['https://<account-id>.r2.cloudflarestorage.com']
        force_path_style:
          type: boolean
          description: Address the bucket in the path instead of the host (MinIO and some interop endpoints).
        access_key_id:
          type: string
          description: The access key id in use. The secret access key is never returned.
        mirror_enabled:
          type: boolean
          description: Whether assets that become ready in the organization library are copied to this bucket.
        status:
          $ref: '#/components/schemas/StorageConnectionStatus'
        last_error:
          type: string
          nullable: true
          description: Reason the last probe or copy failed. Null when the last probe succeeded or none ran.
        last_verified_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

