    patch:
      tags: [Elements]
      operationId: updateElement
      summary: Update an element's name, description, or reference images.
      description: >-
        Partial update; only provided fields change. Providing `reference_asset_ids` replaces the full reference set. Character-backed elements are read-only here - editing one answers 409 pointing at `PATCH /characters/{id}` (changes there reflect here immediately).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
