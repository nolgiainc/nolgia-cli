          nullable: true
          examples: ['cus_PXYZabc123']
        stripe_subscription_id:
          type: string
          nullable: true
          examples: ['sub_1OABCDxyz']
        scope:
          $ref: '#/components/schemas/BillingScope'
        organization_id:
          type: string
          format: uuid
          description: >
            Set when `scope` is `organization`: the organization whose
