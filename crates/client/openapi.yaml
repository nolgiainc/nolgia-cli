          type: number
          format: double
          minimum: -1000000
          maximum: 1000000
    CanvasViewport:
      type: object
      additionalProperties: false
      required: [x, y, zoom]
      properties:
        x:
          type: number
          format: double
          minimum: -1000000
          maximum: 1000000
        y:
          type: number
          format: double
          minimum: -1000000
          maximum: 1000000
        zoom:
          type: number
          format: double
          minimum: 0
          maximum: 10
          exclusiveMinimum: true
          description: Finite zoom greater than zero and at most 10.
    CanvasNodeData:
      type: object
      additionalProperties: false
      description: |
        Every type accepts label. Prompt nodes accept text; character nodes
        accept character_id; asset nodes accept asset_id and require media_type.
        Generate nodes accept model, prompt, params and run. Output nodes accept
        only label. Character and asset UUIDs may be omitted for placeholders.
        Model is a catalog id for the node's modality. The editor writes run.
        Ports (input name: accepted type, maximum inbound edges; output name: type):
        prompt: no inputs; output text: text.
        character: no inputs; output image: image.
        asset: no inputs; one output named by media_type: image, video or audio.
        image_generate: prompt: text, 1; references: image, 8; output image: image.
        video_generate: prompt: text, 1; start_frame: image, 1; end_frame: image, 1;
        references: image, 9; video_references: video, 10; audio_references: audio, 10;
        output video: video.
        audio_generate: prompt: text, 1; output audio: audio.
        output: media: image, video or audio, 50; no outputs.
      properties:
        label:
          type: string
          maxLength: 80
        text:
          type: string
          maxLength: 4000
        character_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        media_type:
          type: string
          enum: [image, video, audio]
        model:
          type: string
        prompt:
          type: string
          maxLength: 4000
        params:
          type: object
          additionalProperties: true
          maxProperties: 24
          description: >
            Scalar request fields only: strings of at most 500 characters, finite numbers or booleans. Keys match ^[a-z][a-z0-9_]{0,63}$. model, prompt and project_id are reserved. No null, arrays or objects.

        run:
          $ref: '#/components/schemas/CanvasRunState'
    CanvasRunState:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [idle, queued, running, succeeded, failed]
          x-enum-varnames: [CanvasRunStatusIdle, CanvasRunStatusQueued, CanvasRunStatusRunning, CanvasRunStatusSucceeded, CanvasRunStatusFailed]
        job_id:
          type: string
          format: uuid
        asset_ids:
          type: array
          maxItems: 8
          items:
            type: string
            format: uuid
        error:
          type: string
          maxLength: 500
        updated_at:
          type: string
          format: date-time
    CanvasEdge:
      type: object
      additionalProperties: false
      required: [id, source, source_handle, target, target_handle, type]
      description: |
        Connects existing nodes without self loops, duplicate connections or cycles.
        Type must equal the source port's type and be accepted by the target port.
        Output ports: prompt.text is text; character.image is image; asset uses its
        media_type as both port name and type; image_generate.image is image;
        video_generate.video is video; audio_generate.audio is audio; output has none.
        Input ports and maximum inbound edges: image_generate has prompt (text, 1)
        and references (image, 8); video_generate has prompt (text, 1), start_frame
        (image, 1), end_frame (image, 1), references (image, 9), video_references
        (video, 10), audio_references (audio, 10); audio_generate has prompt (text, 1);
        output has media (image, video or audio, 50). Other types have no inputs.
      properties:
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        source:
          type: string
        source_handle:
          type: string
        target:
          type: string
        target_handle:
          type: string
        type:
          type: string
          enum: [text, image, video, audio]
