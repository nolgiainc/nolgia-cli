  /credits/redeem:
    post:
      tags: [Billing]
      operationId: redeemCreditCode
      summary: Redeem a credit code for shared top-up credits.
      description: >
        Redeems an admin-issued credit code for the calling account. A valid
        code (active, unexpired, under its redemption limit, never redeemed by
        this account) grants its amount of shared top-up credits via the same
        idempotent ledger primitive the Stripe purchase path uses
        (`credits.Service.GrantTopup`, key `redeem:<code_id>:<user_id>`) — a
        double-submit can never grant twice. Each account may redeem a given
        code at most once. Rejections are explicit: `404` unknown code, `410`
        deactivated/expired/fully-redeemed code, `409` already redeemed by
        this account. Attempts are rate-limited per account (`429`) so codes
        cannot be brute-forced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRedeemRequest'
      responses:
        '200':
          description: The credits granted by this redemption and the account's resulting balance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditRedeemResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '410':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

