    post:
      tags: [Assets]
      operationId: completeAssetUpload
      summary: Finish a signed upload and make the asset available.
      description: >
        Verifies that the object was uploaded to storage and that its size matches the declared `size_bytes`, then flips the asset to `ready` and applies tag-based project auto-association. Completing an upload whose object is missing (or whose size does not match the declaration) returns 409 with details. Completing an already-completed upload is idempotent and returns the asset with 200.

      parameters:
        - name: id
          in: path
          required: true
          description: The `upload_id` returned by `POST /assets/uploads`.
