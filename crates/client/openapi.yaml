            When set to `attachment`, the returned `signed_url` serves the asset with a `Content-Disposition: attachment` header (bound into the signature) so browsers download the file instead of rendering it inline. The download filename is derived from the asset's display name (with an extension inferred from its MIME type), falling back to the original upload filename, then to `<id>.<ext>`. Omit for the default inline-viewing URL.

          schema:
