      security: []
      responses:
        '200':
          description: Preview metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkMeta'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '410':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
