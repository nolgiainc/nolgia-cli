        default:
          $ref: '#/components/responses/ProblemResponse'
  /assets/{id}/frames:
    post:
      tags: [Assets]
      operationId: extractAssetFrame
      summary: Extract a still frame from a video asset as a new image asset.
      description: >
        Extracts a single frame from one of the current user's video assets with ffmpeg and stores it as a new IMAGE asset (model `frame-extract`, tagged `frame`, linked back to the source asset via its generation metadata). Omit `t_seconds` to grab the LAST frame — useful as the `image_url` (start frame) of a follow-up image-to-video generation to chain clips seamlessly. Returns 400 for non-video assets, 422 when no frame can be decoded at the requested timestamp, and 501 when ffmpeg is not available on the deployment.

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractAssetFrameRequest'
      responses:
        '201':
          description: Frame extracted; the new image asset with a fresh signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        '501':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /assets/{id}/duplicate:
    post:
      tags: [Assets]
      operationId: duplicateAsset
      summary: Duplicate one of the current user's assets.
      description: |
        Creates an independent copy of the asset: a new `assets` row owned by
        the caller pointing at a **new** stored object, with the source's
        modality, model, prompt, MIME type, size, duration, tags, and
        metadata carried over. The bytes are duplicated with a server-side
        GCS object copy — they never travel through the API or the client, so
        duplicating a large video costs one storage-to-storage copy rather
        than a download plus a re-upload.

        The copy inherits the source's filing: it joins the same projects and
        the same collections the source belongs to (falling back to the
        default "Library" project when the source has no project). It is a
        genuine second copy of the bytes, so it consumes storage
        accordingly — nothing about it is a reference to the original, and
        deleting either one leaves the other intact.

        The copy's display name defaults to the source's name plus " copy"
        (truncated to fit 200 characters) unless `display_name` is provided.
        An unknown, foreign, or trashed asset returns 404; an asset whose
        upload has not been completed returns 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateAssetRequest'
      responses:
        '201':
          description: Duplicate created; the new asset with a fresh signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '501':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /assets/{id}/element:
    post:
      tags: [Elements]
      operationId: lockAssetAsElement
      summary: Lock an image asset as a prop or environment element.
      description: >-
        The lightweight "lock as element" action: creates a registry element with this asset as its sole reference image, ready to ride generations via `element_ids`. Prop and environment categories only - character elements come from the characters flow (`POST /characters`) or an explicit `POST /elements`. The asset must be one of the caller's image assets.
