      type: object
      additionalProperties: false
      required: [id, name, slug, kind, owner_user_id, seat_limit, contract_monthly_credits, contract_ends_at, settings, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
        kind:
