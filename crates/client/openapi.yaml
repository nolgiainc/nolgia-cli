    get:
      tags: [Organizations]
      operationId: getOrganizationCredits
      summary: Get an organization's shared credit pool and per-member budgets.
      description: >
        The organization's wallets (`app_subscription`, then `shared_topup`),
        the current subscription period and seats, and every member's monthly
        credit budget with what they have spent this UTC calendar month (held
        plus consumed reservations against the organization's wallets). Owner,
        admin and billing roles see every member; member and viewer roles see
        only their own row. Non-members get `404`.
      responses:
        '200':
          description: The organization's credit pool.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCredits'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: getOrganizationUsage
      summary: Roll up an organization's consumed credits by member, model or day.
      description: >
        Credits the organization actually paid for delivered work: CONSUMED
        reservations against the organization's wallets created in
        `[from, to)`, grouped by `group_by` (default `member`). Held and
        released holds are excluded. Defaults to the current UTC calendar
        month; the window may span at most 366 days. Owner, admin and
        billing roles see the whole organization; member and viewer roles
        see only their own spend. Non-members get `404`.
      parameters:
        - name: from
          in: query
          required: false
          description: Inclusive window start (RFC 3339). Defaults to the first instant of the current UTC month.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Exclusive window end (RFC 3339). Defaults to the first instant of the next UTC month.
          schema:
            type: string
            format: date-time
        - name: group_by
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrganizationUsageGroupBy'
      responses:
        '200':
          description: Usage roll-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUsage'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/storage-connections:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      operationId: listStorageConnections
      summary: List the organization's bring-your-own storage connections (owner or admin; Enterprise).
      description: >
        Enterprise only: team organizations get 402 `Upgrade Required` (a plan
        limit, not a credit balance). Secrets are never returned; each
        connection shows its `access_key_id` and the last probe result.
        Answers 503 when the platform has no credential encryption key
        configured (`STORAGE_CREDENTIALS_KEY`).
      responses:
        '200':
          description: The organization's storage connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageConnectionList'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    post:
      tags: [Organizations]
      operationId: createStorageConnection
      summary: Connect an S3-compatible bucket to the organization (owner or admin; Enterprise).
      description: >
        Stores the connection with the secret access key encrypted at rest
        (AES-256-GCM). The connection starts `unverified`; call
        `POST .../{connection_id}/test` to probe it. `endpoint` and
        `force_path_style` target S3-compatible providers (Cloudflare R2,
        MinIO, GCS interoperability); leave them unset for AWS S3. With
        `mirror_enabled` every asset that becomes ready in the organization
        library is copied to `<prefix>/<yyyy>/<mm>/<asset_id>.<ext>` by the
        mirror worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStorageConnectionRequest'
      responses:
        '201':
          description: Connection stored (status `unverified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageConnection'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/storage-connections/{connection_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/StorageConnectionId'
    patch:
      tags: [Organizations]
      operationId: updateStorageConnection
      summary: Update a storage connection (owner or admin; Enterprise).
      description: >
        Partial update. Toggling `mirror_enabled` never touches existing
        mirror rows; pending copies for a disabled connection simply stop
        being claimed. Rotating credentials requires `access_key_id` and
        `secret_access_key` together. Any change to the bucket, region,
        endpoint, prefix or credentials resets `status` to `unverified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStorageConnectionRequest'
      responses:
        '200':
          description: Updated connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageConnection'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
    delete:
      tags: [Organizations]
      operationId: deleteStorageConnection
      summary: Disconnect a storage connection (owner or admin; Enterprise).
      description: >
        Removes the connection and its mirror bookkeeping rows. Objects
        already copied into the customer's bucket are left untouched.
      responses:
        '204':
          description: Connection removed.
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/storage-connections/{connection_id}/test:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/StorageConnectionId'
    post:
      tags: [Organizations]
      operationId: testStorageConnection
      summary: Probe a storage connection (owner or admin; Enterprise).
      description: >
        Runs HeadBucket, then writes and deletes `<prefix>/.nolgia-probe`
        with the stored credentials. The outcome is persisted on the
        connection: `status` becomes `ok` (with `last_verified_at`) or
        `error` (with `last_error`), and the updated connection is returned
        with 200 either way.
      responses:
        '200':
          description: Probe finished; read `status` and `last_error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageConnection'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/storage-connections/{connection_id}/import:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/StorageConnectionId'
    post:
      tags: [Organizations]
      operationId: importStorageObjects
      summary: Import objects from the connected bucket into the organization library (owner or admin; Enterprise).
      description: >
        For each key the object is streamed from the customer's bucket into
        NOLGIA storage through the signed-upload machinery (asset status
        `uploading` then `ready`), stamped with the organization, named after
        the key's basename, and classified by its content type (the same
        media types and size limits as `POST /assets/uploads`). Keys are
        processed in order, synchronously; each result reports `imported`
        with the asset or `failed` with the reason, so one bad key never
        fails the batch. The importing connection records the object as
        already mirrored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageImportRequest'
      responses:
        '200':
          description: Per-key import results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageImportResponse'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

  /organizations/{id}/storage-connections/{connection_id}/backfill:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/StorageConnectionId'
    post:
      tags: [Organizations]
      operationId: backfillStorageMirrors
      summary: Queue every ready organization asset for mirroring to this connection (owner or admin; Enterprise).
      description: >
        Enqueues a pending mirror for each ready, non-trashed asset in the
        organization library that has no mirror row for this connection yet.
        The mirror worker drains the queue in the background; progress is
        visible per asset on `GET /assets/{id}` (`mirrors`).
      responses:
        '202':
          description: Mirrors enqueued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBackfillResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '503':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'

