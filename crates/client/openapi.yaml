      operationId: verifyOrganizationDomain
      summary: Check DNS for the verification TXT record and mark the domain verified (owner or admin).
      description: >
        Looks up TXT `_nolgia.<domain>` for `nolgia-verification=<token>`. A
        missing or mismatched record answers `409` with the record still to
        publish; a domain verified by another organization in the meantime
        answers `409` as well.
      responses:
        '200':
          description: Domain verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDomain'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '409':
