    post:
      tags: [Assets]
      operationId: createAssetUpload
      summary: Start a signed upload for a large media asset.
      description: >
        Pre-creates an asset in status `uploading` and returns a short-lived signed PUT URL for uploading the bytes directly to storage, bypassing the base64 JSON limit of `POST /assets`. PUT the file to `upload_url` with a `Content-Type` header exactly matching the declared `content_type` (the signature covers it), then call `POST /assets/uploads/{upload_id}/complete` to verify the object and flip the asset to `ready`. The URL expires after 30 minutes. Uploading assets are hidden from `GET /assets` until completed.

