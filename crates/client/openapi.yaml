                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /generate/video/enhance-prompt:
    post:
      tags: [Generate]
      operationId: enhanceVideoPrompt
      summary: Rewrite a video prompt for the model it will run on (signed in; 1 credit).
      description: |
        One-click, model-aware prompt enhancement for the video composer.
        Sends the customer's plain prompt plus the run's settings (`model`,
        `duration_seconds`, `has_references`, `generate_audio`, `aspect_ratio`)
        to the cheapest brain in the roster with a system prompt built from a
        per-model guidance table, and returns ONE rewritten prompt that is
        runnable as it is on `POST /generate/video` plus short `notes` on what
        changed. Seedance 2.5 (`seedance-2.5`) has its own entry (4 to 30
        second single pass, native audio and speech, a timestamped shot plan
        with one action and one camera move per beat, what to preserve, what
        to avoid, no on-screen text); every other video model gets a generic
        entry built from the model's published capabilities (durations,
        audio, speech, aspect ratios, references, end frame). The rewrite
        keeps the customer's subject, named references (`@Image1`,
        `@Name`), brands and people, and never adds a real brand or person
        the prompt did not name. Nothing is generated and nothing fires
        automatically: the caller decides whether to use the result.

        Billed like preset suggestions: a one-credit hold is taken before
        the call (`402` when the account cannot cover it), the call runs with
        strict JSON output (one retry on an invalid reply), and the hold
        settles at `ceil(provider cost / $0.018)` with a floor of 1 credit,
        refunded if the provider fails. The ledger row reads "Prompt
        enhancement · {model}". Rate limited to 20 calls per minute per
        account (`429`), shared with preset suggestions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoPromptEnhanceRequest'
            examples:
              seedance:
                summary: A plain scene for Seedance 2.5
                value:
                  model: seedance-2.5
                  prompt: 'A barista pours latte art in a sunny cafe, slow and calm'
                  duration_seconds: 8
                  generate_audio: true
                  aspect_ratio: '16:9'
      responses:
        '200':
          description: The rewritten prompt, the notes and what the call charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoPromptEnhanceResponse'
              examples:
                seedance:
                  summary: The rewrite for the example above
                  value:
                    prompt: 'A barista in a linen apron pours latte art at a sunlit wooden counter, morning light through a tall window, steam rising, a calm unhurried mood. Shot on Alexa Mini, 50mm at T2.0, Kodak Vision3 250D look, soft window light as the only source. [0-2s] Medium shot from across the counter, static tripod, the pitcher tilts and the first pour lands. [2-4s] Slow push-in to a tight close-up on the cup as the rosette forms. [4-6s] Macro rack focus from the pour to the barista''s steady hands. [6-8s] The pitcher lifts, the cup slides forward toward the lens, hold. Sound: the hiss of steam, the soft pour, quiet cafe room tone, no music. No on-screen text, no captions, no watermark.'
                    notes:
                      - 'Split the 8 seconds into four 2 second beats, one action and one camera move each.'
                      - 'Named the light source and the lens instead of "sunny" so the model picks a consistent look.'
                      - 'Audio is on, so the sound bed is described; no dialogue was added because your prompt has none.'
                    guidance: seedance-2.5
                    credits_charged: 1
                    model: 'deepseek-v4-flash'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '429':
          $ref: '#/components/responses/ProblemResponse'
        '502':
          $ref: '#/components/responses/ProblemResponse'
        default:
          $ref: '#/components/responses/ProblemResponse'
  /generate/set:
    post:
      tags: [Generate]
      operationId: generateSet
      summary: Generate a coordinated set of image Outputs.
      description: |
        A pack groups carousel slides or ad variants sharing one visual system.
        A variants set explores a named axis, such as emotion or concept.
        Each member is its own image job with its own credit hold and refund.
        Returns 202 with the set; poll `GET /sets/{id}` until its Outputs are Ready.
        An `Idempotency-Key` on this endpoint is ignored per member.
        If a later member is refused, accepted members keep running and further
        members are not submitted. `problems` lists the refused labels.

        **Failures carry a machine-readable code.** A refusal sets `error.code` and a failed job sets
        `failure.code` to a `GenerationErrorCode`, so a client can branch without parsing prose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSetRequest'
      responses:
        '202':
          description: Set accepted, Outputs are Generating.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputSet'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '402':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'
        default:
