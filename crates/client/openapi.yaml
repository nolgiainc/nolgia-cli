      summary: Get the current user's auto-refresh settings.
      description: |-
        Returns the stored auto-refresh (auto top-up) preference. It is a stored
        preference only: nothing reads it, so no top-up is ever bought
        automatically and no card is charged, whatever `enabled` says. Top up
        from the billing page when the balance runs low.
      responses:
