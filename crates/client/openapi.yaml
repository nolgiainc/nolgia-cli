    VideoModel:
      type: string
      description: "Video model identifier. Priority models are Kling v3.0, Seedance 2.0 Pro,\nand MiniMax Hailuo 3 (`minimax-h3`, the 2K multimodal flagship). BFL\nFLUX 3 (`flux-3-video`) is the native-audio t2v/i2v flagship with hd/fhd\nresolution tiers. Alibaba Wan 3.0 (`wan-3.0`) renders 5-30 second\nclips at 480p/720p/1080p from text or a start image, and is the\ndefault text-to-video route. Wan 3.0 Prime (`wan-3.0-prime`) is its\nfast variant on the same range and tiers. Wan 2.7 (`wan-2.7`) renders\n5-10 second clips at 720p/1080p from text, a start and/or end image,\nor up to 4 reference images - the only reference-to-video route\noutside the Seedance family. Wan 2.6 (`wan-2.6`) renders exactly 5 or\n10 second clips at 720p/1080p, 16:9 or 9:16, from text or a start\nimage. MiniMax H3 Max (`minimax-h3-max-t2v` and\n`minimax-h3-max-i2v`) is the post-trained H3 variant with\n480p/768p tiers. Seedance 2.5 (`seedance-2.5`): 4 to 30 second clips\nat 480p/720p/1080p (1080p at 16:9 and 9:16 only, see the tier's\n`quality.options[].aspect_ratios`) from text, a start and/or end\nimage, or references (up\nto 9 images, 10 videos and 10 audio tracks on its SeeGen\nomni-reference route: extend or edit a clip of up to 30 seconds),\noptional audio. Seedance 2.0 Fast and Mini\n(`seedance-2.0-fast`, `seedance-2.0-mini`) are the budget Seedance\nroutes: the same text, start/end-frame and image-reference modes as\n2.5 (no reference video or audio) on 4 to 15 second clips at\n480p/720p.\nVeo 3.1 Lite (`veo-3.1-lite`) is the budget Veo 3.1 tier with the\nsame 4/6/8 second and start-frame surface as `veo-3.1-fast`, 720p\ndefault and a 1080p tier, and NO reference (ingredient) images:\nGemini refuses them on Lite. `veo-3.1` and `veo-3.1-fast` take up to\nthree reference images on an 8 second clip, or a start frame, but not\nboth in one request. HappyHorse 1.1\n(`happyhorse-1.1`) and HappyHorse 1.0 (`happyhorse-1.0`) render silent\n5 to 15 second clips at 720p/1080p from text or a start image.\nSeeGen HappyHorse R2V (`happyhorse-1.1-r2v`) renders 3 to 15 second\nclips with audio from 1 to 9 required reference images. SeeGen\nHappyHorse Video Edit (`happyhorse-1.0-video-edit`) rewrites one\nrequired 2 to 15 second source clip, with up to 5 optional reference\nimages; both SeeGen routes offer 720p/1080p and an honored seed.\nKling motion control (`kling-v3-motion-control`) is the human motion\ntransfer entry: one driver video plus one performer still produces\noutput copying the driver's motion, timing and camera at the driver's\nown length.\nGemini Omni 1.1 Edit (`omni-1.1-flash-edit`) rewrites one required 3 to\n10 second source clip (a video asset with a stored duration) from a text\ninstruction and is billed at the source's length; the output keeps the\nsource's duration and framing, and it takes no reference images.\nSeedance 1.5 Pro (`seedance-1-5-pro`) is the budget Seedance flagship:\n4 to 12 second clips at 480p/720p/1080p with the same start/end frame\nand reference-image surface as 2.5, and the one Seedance route whose\noptional audio carries a price of its own. \nHeyGen Avatar IV (`heygen-avatar-iv`) is\nthe LIP SYNC entry: a portrait plus a voice track becomes a talking\nhead, and both references are mandatory. Runway\nAleph 2 (`runway-aleph-2`) is the VIDEO EDIT entry: it rewrites footage\nyou supply from a text instruction, so a reference video is mandatory.\nRunway Gen-4.5 (`runway-gen-4.5`) is Runway's cinematic generation\ntier, 2 to 10 second clips at 720p from text or a start image. Read the\n`capabilities` array on GET /models rather than inferring a model's\npurpose from its inputs. Default is `wan-3.0`.\n"
      enum:
