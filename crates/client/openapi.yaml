      description: >-
        Transcribe a video or audio asset with gpt-4o-mini-transcribe behind the model proxy. Costs 1 credit per started minute of audio measured from the file, charged only when speech was sent to the model. Supports up to 60 minutes of media. This synchronous call can take a minute or two for long media. A ready transcript is returned as it is unless force is true. One run per asset at a time, otherwise 409. Timestamps come from pause-aligned chunks of up to about 24 seconds.
      parameters:
