    AgentManifest:
      type: object
      additionalProperties: false
      required: [abilities, presets, cli_version, runtime_version]
      description: >-
        The complete server-computed desired state for an agent: the single list a pod-side reconciler materializes. Increment 1 enumerates what already exists in the DB — installed abilities (with versions), available presets, and the pinned CLI + runtime versions.
      properties:
        abilities:
