  /products/import:
    post:
      tags: [Products]
      operationId: importProduct
      summary: Import a product from a public https store link.
      description: >
        Click-to-Ad import: the server fetches the product page once, reads its JSON-LD Product, Shopify product JSON, Amazon-style markup and OpenGraph/product meta tags, stores up to eight product images as image assets in your library, and saves a Product (name, brand, price text, description and a short canonical description) that every later generation can reuse through `product_id`. The fetch is https only, on port 443, with every hop's address resolved once and refused when it is private, loopback, link-local or a metadata address, a 5 second timeout, a 5 MB page cap, a 10 MB cap per image and a content-type allow-list (HTML pages; JPEG, PNG and WebP images). Imports are rate limited per account. With `project_id` the images are filed into that project and the product is appended to the project's products.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportProductRequest'
      responses:
        '201':
          description: Product imported with up to eight images.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImportResult'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '403':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          description: The page could not be imported, due to size, content type, upstream status, timeout, or missing product data.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Per-account product import rate limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ProblemResponse'
