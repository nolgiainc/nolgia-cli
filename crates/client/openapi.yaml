        model:
          type: string
          nullable: true
          description: >-
            The brain (reasoning model) this agent is configured to run, when explicitly selected via PUT /agent/model or pinned by the deploy pipeline. Omitted/null means the platform default brain, billed at the default flat per-turn rate. The next newly executing chat turn uses and bills this brain (see GET /agent/models). Existing turns retain their durable execution model and billing rate, including when resumed or retried. Other pod surfaces follow this pin on subsequent convergence rolls. `glm-5.2` and `kimi-k3` are RETIRED: they are still accepted here on reads and still bill at their own rate for agents already pinned to them, but they can no longer be selected — see `model_advisory`.
