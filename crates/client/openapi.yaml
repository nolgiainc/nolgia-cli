    # --- Organizations -------------------------------------------------------

    OrganizationKind:
      type: string
      description: '`team` is self-serve seat billing; `enterprise` is contract-managed by the platform admin.'
      enum: [team, enterprise]
      x-enum-varnames: [OrganizationKindTeam, OrganizationKindEnterprise]

    OrganizationRole:
      type: string
      description: >
        Member role. `owner` (everything, incl. delete and transfer), `admin`
        (members, invites, domains, SSO, storage, budgets, any library item,
        audit log), `billing` (seats and invoices; reads members), `member`
        (create, generate, own items; reads the whole library), `viewer`
        (read-only library; does not consume a seat).
      enum: [owner, admin, billing, member, viewer]
      x-enum-varnames: [OrganizationRoleOwner, OrganizationRoleAdmin, OrganizationRoleBilling, OrganizationRoleMember, OrganizationRoleViewer]

