        agent_message_id:
          type: string
          format: uuid
          description: >
            Transcript id of the pending agent reply; poll `GET /agent/messages` until its status leaves `pending`. Absent when a steering send was queued behind an in-flight turn: the reply row is created automatically when that turn settles.

        session_id:
          type: string
          format: uuid
          description: >
            The chat session the message was filed under: the `session_id` sent, the session `new_session` created, or the caller's auto-created default session for a sessionless submit.

        session:
          allOf:
            - $ref: '#/components/schemas/AgentSession'
          description: >
            The session `new_session` created, so a client can show it in its session list without another read. Present only on a `new_session` submit.

