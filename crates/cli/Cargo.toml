[package]
name = "nolgia-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for the Nolgia generative media platform (image, audio, video)"
readme = "../../README.md"

[[bin]]
name = "nolgia"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
async-trait.workspace = true
clap.workspace = true
clap_complete.workspace = true
chrono.workspace = true
directories.workspace = true
futures-util.workspace = true
keyring = { workspace = true, optional = true }
nolgia-client.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
tar = "0.4"
flate2 = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[features]
default = ["keyring"]
# The OS keyring is OPT-IN at runtime (NOLGIA_TOKEN_STORE=keyring); the default
# store is a 0600 file. On Linux the backend links the C libdbus, which made
# every released binary refuse to start on an image without it and blocked
# static musl linking (NOL-1070). Building with --no-default-features drops the
# dependency entirely and yields a binary that depends on nothing; asking for
# the keyring store on such a build is a clear error, not a panic.
keyring = ["dep:keyring"]
e2e = []
