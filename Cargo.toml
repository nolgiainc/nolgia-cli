[workspace]
members = ["crates/client", "crates/cli"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
base64 = "0.23"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
nolgia-client = { path = "crates/client", version = "0.3.0" }
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
# `nolgia dit` (offline camera-card offload, verify, rename, report)
csv = "1"
filetime = "0.2"
fs2 = "0.4"
md-5 = "0.10"
quick-xml = "0.37"
sha1 = "0.10"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nolgiainc/nolgia-cli"

[profile.release]
lto = "thin"
strip = "symbols"
