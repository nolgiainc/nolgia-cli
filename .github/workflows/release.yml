name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GATE EVERYTHING ON THE TAG BEING TRUTHFUL (NOL-328).
  #
  # A binary's version comes from CARGO_PKG_VERSION — from the manifest, not
  # from the tag. v0.2.13 and v0.2.14 were tagged on trees whose manifests still
  # read 0.2.12, so both releases shipped binaries self-reporting `nolgia
  # 0.2.12`, and nolgia-agent's pods could never converge on either pin
  # (NOL-294).
  #
  # A version check already existed, but only inside `publish-npm`: it read one
  # manifest (npm/package.json) and ran in the LAST job, after crates.io had
  # been published to, the binaries built and the GitHub Release created. It
  # could redden a run; it could not prevent a bad release. This runs first,
  # checks every version-bearing manifest, and every publishing job depends on
  # it, so a mislabelled tag produces no artifacts at all.
  verify-version:
    name: Manifests match the tag
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Manifests agree with each other and with the tag
        run: |
          bash -n scripts/check-version-consistency.sh
          bash scripts/check-version-consistency.sh --tag "${{ github.ref_name }}"

  test:
    name: Test, Lint & Format
    needs: [verify-version]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: Install libdbus (keyring crate dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Run tests
        # The e2e feature gates live-API tests (real generations, needs a token); compile-check it via clippy instead.
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  build-release:
    name: Build ${{ matrix.archive }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
            binary: nolgia
            output_ext: ''
            archive: nolgia-x86_64-unknown-linux-gnu
            universal: false
          - os: macos-latest
            targets: x86_64-apple-darwin aarch64-apple-darwin
            binary: nolgia
            output_ext: ''
            archive: nolgia-x86_64-apple-darwin
            universal: true
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            binary: nolgia
            output_ext: '.exe'
            archive: nolgia-x86_64-pc-windows-msvc
            universal: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain with cross-compile targets
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
          cache: true

      - name: Install libdbus (keyring crate dependency)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Build release binary
        shell: bash
        run: |
          set -euxo pipefail
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --target "$target" --bin ${{ matrix.binary }} --locked
          done

      - name: Create universal macOS binary
        if: matrix.universal
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p target/universal-release
          lipo -create \
            -output target/universal-release/${{ matrix.binary }} \
            target/x86_64-apple-darwin/release/${{ matrix.binary }} \
            target/aarch64-apple-darwin/release/${{ matrix.binary }}

      - name: Strip and rename binary
        shell: bash
        run: |
          set -euxo pipefail
          BINARY="${{ matrix.binary }}${{ matrix.output_ext }}"
          ARCHIVE="${{ matrix.archive }}${{ matrix.output_ext }}"

          if [ "${{ matrix.universal }}" = "true" ]; then
            SRC="target/universal-release/${BINARY}"
          else
            TARGET=$(echo "${{ matrix.targets }}" | awk '{print $1}')
            SRC="target/${TARGET}/release/${BINARY}"
          fi

          case "${{ runner.os }}" in
            Linux)
              strip "${SRC}"
              ;;
            macOS)
              strip -x "${SRC}"
              ;;
          esac

          mv "${SRC}" "${ARCHIVE}"
          file "${ARCHIVE}"
          ls -la "${ARCHIVE}"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}${{ matrix.output_ext }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    # verify-version is named explicitly, not relied on transitively through
    # `test`: this job publishes an artifact, and a future rearrangement of the
    # graph must not be able to un-gate it.
    needs: [verify-version, test, build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Show downloaded artifacts
        run: |
          echo "== artifacts tree =="
          find artifacts -maxdepth 3 -print
          echo "== file types =="
          for f in $(find artifacts -type f); do
            printf '%-12s %s\n' "$(file -b "${f}")" "${f}"
          done

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          awk -v tag="${{ github.ref_name }}" '
            $0 == "## " tag {found=1; next}
            /^## / {found=0}
            found {print}
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/nolgia-x86_64-unknown-linux-gnu/nolgia-x86_64-unknown-linux-gnu
            artifacts/nolgia-x86_64-apple-darwin/nolgia-x86_64-apple-darwin
            artifacts/nolgia-x86_64-pc-windows-msvc/nolgia-x86_64-pc-windows-msvc.exe

  publish-crates:
    name: Publish to crates.io
    # See `release` above: gated explicitly because it publishes. This job also
    # reported SUCCESS on both bad tags — it tried to publish 0.2.12, hit
    # "already on crates.io" and took the skip branch — so the run looked
    # half-fine while mislabelled binaries shipped (NOL-328). verify-version
    # removes the precondition for that vacuous pass.
    needs: [verify-version, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      # OIDC for crates.io Trusted Publishing. Both nolgia-client and
      # nolgia-cli must have a trusted publisher linked on crates.io
      # (owner nolgiainc, repo nolgia-cli, workflow release.yml); the minted
      # token is scoped to exactly those crates.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Install libdbus (keyring crate dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Authenticate to crates.io via OIDC
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # cargo waits for the client to land in the index before the cli publish
          # resolves it. Already-published versions are skipped so a partial
          # release (e.g. a crates.io name cooldown) can be re-run safely.
          for crate in nolgia-client nolgia-cli; do
            if out=$(cargo publish -p "$crate" --locked 2>&1); then
              echo "$out"
            elif echo "$out" | grep -qi "already uploaded\|already exists"; then
              echo "$crate version already on crates.io; skipping"
            else
              echo "$out" >&2
              exit 1
            fi
          done

  publish-npm:
    name: Publish to npm
    needs: [verify-version, release]
    if: startsWith(github.ref, 'refs/tags/v')
    # NOT blacksmith-*: npm provenance requires a github-hosted runner (NOL-327).
    #
    # Blacksmith runners register with GitHub as `self-hosted`. npm >= 11.5.1
    # auto-detects the OIDC environment and attaches build provenance without
    # being asked, and npm's sigstore verifier then rejects the publish:
    #
    #   npm error code E422
    #   422 Unprocessable Entity - PUT https://registry.npmjs.org/@nolgia%2fcli
    #   Error verifying sigstore provenance bundle: Unsupported GitHub Actions
    #   runner environment: "self-hosted". Only "github-hosted" runners are
    #   supported when publishing with provenance.
    #
    # So this job could not succeed on Blacksmith at any version. Moving it back
    # to a github-hosted runner keeps BOTH tokenless OIDC Trusted Publishing and
    # the provenance attestation. The alternative — staying on Blacksmith and
    # disabling provenance — trades away the supply-chain attestation, which is
    # the more valuable half. `notify-tap` also runs on Blacksmith but publishes
    # nothing, so it is unaffected.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC for npm Trusted Publishing: @nolgia/cli has a trusted publisher
      # linked on npmjs.com (this repo + release.yml), so publishes are
      # tokenless — GitHub mints a short-lived id-token npm verifies. No
      # NPM_TOKEN secret exists.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      # The tag/manifest check that used to live here now runs in the
      # `verify-version` job, before anything is built or published, and covers
      # all six version declarations rather than npm/package.json alone. Leaving
      # a second copy here would imply this is where the gate lives; it is not,
      # and it never usefully could be — by this point crates.io and the GitHub
      # Release have already committed (NOL-328).

      - name: Publish @nolgia/cli
        working-directory: npm
        run: |
          set -euo pipefail
          # Tokenless publish via npm Trusted Publishing (OIDC). Needs the
          # trusted publisher linked on npmjs.com and id-token: write above;
          # npm >= 11.5.1 detects the OIDC environment automatically and also
          # attaches build provenance. No NODE_AUTH_TOKEN is set, so the
          # empty-token .npmrc line that setup-node writes cannot shadow OIDC.
          npm publish --access public --ignore-scripts

  notify-tap:
    name: Notify Homebrew tap
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      # CROSS-REPO AUTH:
      #   The built-in GITHUB_TOKEN is scoped to THIS repo and cannot dispatch
      #   to nolgiainc/homebrew-nolgia, so we use the nolgiaai bot PAT — the
      #   same secret this repo's revendor-spec workflow already uses to open
      #   PRs. This mirrors nolgia-api's propagate-openapi workflow, which
      #   dispatches the analogous `openapi-updated` event downstream.
      #
      #   nolgia-api mints a short-lived scoped token from the org's Nolgia-App
      #   instead (NOLGIA_APP_ID / NOLGIA_APP_PRIVATE_KEY). That is the tighter
      #   pattern, but those App secrets are provisioned on nolgia-api only —
      #   they do not exist on this repo — so we reuse the PAT that does.
      #
      #   As with propagate-openapi, a missing secret SKIPS cleanly rather than
      #   failing the release: the tap runs its own bump on a 6-hourly schedule,
      #   so this dispatch only makes propagation immediate, it is not the sole
      #   path. A publish must never go red over a notification.
      - name: Check for tap dispatch credentials
        id: check
        env:
          BOT_PAT: ${{ secrets.NOLGIA_BOT_PAT }}
        run: |
          if [ -n "${BOT_PAT}" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NOLGIA_BOT_PAT is not set — skipping the immediate Homebrew tap bump. The tap still self-heals within 6 hours via its scheduled Update Formula run."
          fi

      - name: Dispatch cli-released to nolgiainc/homebrew-nolgia
        if: steps.check.outputs.has_pat == 'true'
        env:
          GH_TOKEN: ${{ secrets.NOLGIA_BOT_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/nolgiainc/homebrew-nolgia/dispatches" \
            -d "$(printf '{"event_type":"cli-released","client_payload":{"tag":"%s"}}' "${TAG}")"
          echo "Dispatched cli-released (${TAG}) to nolgiainc/homebrew-nolgia"
