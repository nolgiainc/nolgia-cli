name: Commit Attribution Check

# Fails a PR when any commit in it carries a Co-authored-by trailer crediting
# Claude or Anthropic. Org convention: commits carry no third-party attribution.
#
# NOL-171: the convention was enforced in hermes-agent alone, so every other
# repo quietly accumulated `Co-authored-by: Claude ... <noreply@anthropic.com>`
# trailers on its default branch — 59 of them in a single day. Nothing looked,
# so nothing stopped it. This is the durable half of the fix; without a check
# the convention decays again the moment someone forgets.
#
# Scope is deliberately narrow: only the `Co-authored-by:` TRAILER form is a
# violation. Ordinary prose mentioning Claude or Anthropic is legitimate and
# common here (the Anthropic adapter, Claude model classification), so the
# pattern is anchored to the start of a trailer line and never judges prose.
# A check that fires on real work gets switched off, which protects nothing.
#
# No paths filter on purpose: this gates commit messages, not files, so a
# docs-only PR must not be able to skip it.
#
# Prevention only. Existing history is deliberately left alone — stripping the
# trailers already merged would mean force-pushing six default branches and
# invalidating every clone for a cosmetic gain.

on:
  pull_request:
  # NOL-479: `No third-party attribution trailers` is a required context on the
  # default branch of every repo carrying this file. As a `pull_request`-only
  # workflow the ONLY way to produce it was a webhook, so during the 2026-08-06
  # Actions outage (webhooks throttled to ~15%, delayed ~1h) a single missing
  # delivery held a PR at BLOCKED with no lever to unstick it — including the PR
  # that carried NOL-472's deploy ref guard, i.e. the fix for the incident was
  # itself unmergeable during the incident. `workflow_dispatch` is a REST call,
  # not a webhook, so it is not throttled.
  #
  # Safe to dispatch: this workflow is a pure reader. `contents: read`, no cloud
  # credentials, nothing to deploy or publish, so it carries none of the NOL-472
  # risk that came from `ci.yml` being dispatchable AND able to ship.
  #
  # The non-obvious half of the fix is in the step below: dispatchability alone
  # would have made this check pass vacuously. See the note on BASE_REF.
  workflow_dispatch:
    inputs:
      base_ref:
        description: >-
          Branch to diff the dispatched ref against. Defaults to the
          repository's default branch, which is what you want when standing in
          for a PR's checks during a webhook outage.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: No third-party attribution trailers
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history: the check walks the PR's commit range

      - name: Reject Claude/Anthropic Co-authored-by trailers
        env:
          # NOL-479: on `workflow_dispatch` there is no pull_request payload, so
          # both of these are EMPTY. Left unchanged, the script below fell
          # through to RANGE_START="", `git log "..HEAD"` resolved to the empty
          # range HEAD..HEAD, and the check exited 0 having read zero commit
          # messages — a required context reporting green without ever doing its
          # job. That is strictly WORSE than a check that cannot be dispatched,
          # so adding the trigger without this fallback chain would have been a
          # net loss. The chain is: PR base ref -> explicit dispatch input ->
          # the repository's default branch (which is why this file is portable
          # across repos whose default branch is `main` or `master`).
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.inputs.base_ref || github.event.repository.default_branch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          if [ -z "$BASE_REF" ] && [ -z "$BASE_SHA" ]; then
            echo "::error::No base ref and no base SHA — cannot determine a commit range. Refusing to report a result."
            exit 1
          fi

          # A dispatched run has never fetched the base branch. Resolve it
          # explicitly rather than letting rev-parse miss and degrade to an
          # empty range, which is the vacuous-pass path described above.
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --quiet origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
          fi

          if [ -n "$BASE_REF" ] && git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            RANGE_START=$(git merge-base "origin/$BASE_REF" HEAD)
          else
            RANGE_START="$BASE_SHA"
          fi

          if [ -z "$RANGE_START" ]; then
            echo "::error::Could not resolve a range start (base ref '$BASE_REF' not found and no base SHA). Refusing to report a result."
            exit 1
          fi

          COMMITS=$(git log --no-merges --format=%H "$RANGE_START..HEAD")
          if [ -z "$COMMITS" ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              # Dispatched at (or behind) the base ref, so there is no branch
              # range to walk. Inspect the tip commit instead of reporting green
              # without reading a single commit message. Guarantees the dispatch
              # path always judges at least one commit.
              COMMITS=$(git log --no-merges -1 --format=%H HEAD)
              echo "No commits ahead of origin/$BASE_REF — checking the tip commit only."
            else
              echo "No non-merge commits in range — nothing to check."
              exit 0
            fi
          fi

          FAILED=0
          for sha in $COMMITS; do
            HITS=$(git log -1 --format=%B "$sha" | grep -Ei '^Co-authored-by:.*(claude|anthropic)' || true)
            if [ -n "$HITS" ]; then
              FAILED=1
              echo "::error::${sha} carries a disallowed attribution trailer"
              git log -1 --format='  %h %s' "$sha"
              echo "$HITS" | sed 's/^/    /'
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "Org commits carry no third-party attribution."
            echo "Reword the offending commit(s) on this PR branch and update it:"
            echo "    git rebase -i $RANGE_START"
            echo "Never rewrite a default branch to fix this."
            exit 1
          fi

          # Count the commits actually inspected, not the range: in the dispatch
          # tip-commit fallback above the range is empty but one commit was
          # judged, and reporting "0 commit(s)" there reads exactly like the
          # vacuous pass this change exists to eliminate.
          echo "OK — no Claude/Anthropic Co-authored-by trailers in $(echo "$COMMITS" | wc -l | tr -d ' ') commit(s)."
