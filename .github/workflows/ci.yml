name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Lint & Format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: Install libdbus (keyring crate dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Run tests
        # The e2e feature gates live-API tests (real generations, needs a token); compile-check it via clippy instead.
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test install.sh (hermetic sandbox, no network)
        run: bash tests/install_sh_test.sh

  spec-check:
    name: OpenAPI spec drift
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The Rust client is generated at build time from the vendored spec at
      # crates/client/openapi.yaml. That copy must never drift from the
      # canonical nolgia-api contract. The canonical spec is published
      # unauthenticated to the public docs bucket on every push to
      # nolgia-api main that touches api/openapi.yaml (see
      # nolgia-api/.github/workflows/docs.yml), so we can diff against it
      # with no cross-repo token. Override the URL via NOLGIA_CANONICAL_SPEC_URL
      # if the docs host ever moves.
      # Re-fetch + re-diff with a few retries. The canonical spec is served from
      # a CDN-fronted bucket that is eventually-consistent during a publish: when
      # a nolgia-api merge is mid-propagation, two fetches seconds apart can hit
      # different edge states, so a single diff can transiently "drift" against a
      # spec that is really in sync (observed on the revendor PR right after an
      # api merge). Retrying rides out that window; a genuine drift still fails
      # after all attempts.
      - name: Verify vendored spec matches canonical
        env:
          SPEC_URL: ${{ vars.NOLGIA_CANONICAL_SPEC_URL || 'https://docs.nolgia.ai/api/openapi.yaml' }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if ! curl -fsSL --retry 3 --retry-delay 2 "$SPEC_URL" -o /tmp/canonical-openapi.yaml; then
              echo "::notice::Attempt $attempt: fetch of $SPEC_URL failed — retrying…"
              sleep 20; continue
            fi
            echo "Attempt $attempt: fetched $(wc -c < /tmp/canonical-openapi.yaml) bytes from $SPEC_URL"
            if diff -u crates/client/openapi.yaml /tmp/canonical-openapi.yaml; then
              echo "Vendored spec matches canonical nolgia-api contract."
              exit 0
            fi
            echo "::notice::Attempt $attempt: vendored spec differs from canonical — the docs bucket may be mid-publish (CDN eventual consistency). Retrying…"
            sleep 20
          done
          echo "::error::crates/client/openapi.yaml has drifted from the canonical nolgia-api spec (after retries)."
          echo "::error::Run the 're-vendor OpenAPI spec' workflow (workflow_dispatch), or locally: curl -fsSL https://docs.nolgia.ai/api/openapi.yaml -o crates/client/openapi.yaml && cargo build && cargo fmt --all, then fix any command code and commit."
          exit 1
