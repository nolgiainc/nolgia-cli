name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  # NOL-479: `Test, Lint & Format` and `OpenAPI spec drift` are both required
  # contexts on main and both come from this workflow, so while it was
  # `pull_request`-only a throttled webhook left PRs here BLOCKED with no way to
  # produce either check. `workflow_dispatch` is a REST call, not a webhook, so
  # it stays available during exactly the outage that breaks the PR trigger.
  #
  # Safe and non-vacuous by inspection: both jobs act on the checked-out tree.
  # `test` runs cargo test/clippy/fmt plus the install.sh sandbox, and
  # `spec-check` diffs the checked-out crates/client/openapi.yaml against the
  # canonical published spec over HTTPS. Neither reads
  # `github.event.pull_request`, so neither can pass without having actually
  # inspected the tree. (Contrast commit-attribution-check.yml, whose commit
  # range came from the PR payload and which needed a base-ref fallback added
  # before its dispatch path did any work at all.)
  #
  # But the tree is not the same tree by default, and that gap mattered:
  # `pull_request` sets GITHUB_SHA to the synthetic merge commit of the PR head
  # with its base, while `workflow_dispatch` gives the tip of the selected
  # branch. A branch that is green on its own tip but broken once merged into a
  # moved `main` would therefore produce both required contexts from a dispatch
  # while the real merge fails. The `Build the PR merge tree` step below closes
  # that: on dispatch each job merges the default branch into the checked-out
  # ref before doing any work, and refuses to report a result if that merge
  # conflicts. Dispatch is then a substitute for the PR trigger, not a weaker
  # variant of it. (The run must still be dispatched on the PR's head branch,
  # not on a merge ref: the check run attaches to the dispatched ref's tip, and
  # only a check on the PR head SHA satisfies branch protection.)
  #
  # No deploy or publish surface: releasing is release.yml, which is triggered
  # only by `push: tags: ['v*']` and additionally gates every publishing job on
  # `startsWith(github.ref, 'refs/tags/v')`. It has no `workflow_dispatch`, so
  # nothing here becomes shippable by making CI dispatchable (NOL-472's rule:
  # a workflow may be dispatchable, or it may publish, not both unguarded).
  #
  # Deliberately takes NO inputs, for the same reason
  # commit-attribution-check.yml takes none: a caller-supplied merge base is a
  # bypass, not a convenience. Pointing it at the dispatched branch itself makes
  # the merge a no-op, which is exactly the branch-tip-only run this step exists
  # to prevent. The base is always the repository's default branch, which is
  # protected and not dispatcher-controlled, and is also the only branch this
  # workflow's `pull_request` trigger fires for.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Lint & Format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # A dispatched run has to merge the base branch in below, which needs
          # real history; the PR trigger already gets the merge commit.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      - name: Build the PR merge tree
        if: github.event_name == 'workflow_dispatch'
        env:
          # Not configurable: see the note on the trigger above. Read from the
          # payload rather than hardcoded so the step stays correct in repos
          # whose default branch is `main` or `master`.
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          if ! git fetch --no-tags --quiet origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"; then
            echo "::error::Could not fetch base branch '$BASE_REF', so the merge tree cannot be built. Refusing to report a result."
            exit 1
          fi
          # Throwaway identity: runners have none configured and `git merge`
          # demands one even with --no-commit. Nothing is committed here: the
          # merge only lands in the worktree the steps below inspect.
          if ! git -c user.name=ci -c user.email=ci@local \
            merge --no-commit --no-ff "origin/$BASE_REF"; then
            git merge --abort || true
            echo "::error::Merging origin/$BASE_REF into the dispatched ref conflicts, so the merge tree the PR would produce does not exist. Update the branch and dispatch again."
            exit 1
          fi
          echo "Testing $(git rev-parse --short HEAD) merged with origin/$BASE_REF ($(git rev-parse --short "origin/$BASE_REF"))."

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache: true

      - name: Install libdbus (keyring crate dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Run tests
        # The e2e feature gates live-API tests (real generations, needs a token); compile-check it via clippy instead.
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test install.sh (hermetic sandbox, no network)
        run: bash tests/install_sh_test.sh

      # Runs on every PR, not just at tag time: a manifest left behind by a
      # partial bump reddens here, days before someone tries to tag it. The
      # release workflow re-runs this same script with --tag as a hard gate.
      - name: Test the release version guard (offline)
        run: |
          bash -n scripts/check-version-consistency.sh
          bash tests/check-version-consistency_test.sh

  spec-check:
    name: OpenAPI spec drift
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}

      # Same reason as the `test` job: without this, a dispatch would diff the
      # branch tip's vendored spec while the PR merge would diff a different
      # file, so the required context could go green on a tree that does not
      # match what merging produces.
      - name: Build the PR merge tree
        if: github.event_name == 'workflow_dispatch'
        env:
          # Not configurable: see the note on the trigger above. Read from the
          # payload rather than hardcoded so the step stays correct in repos
          # whose default branch is `main` or `master`.
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          if ! git fetch --no-tags --quiet origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"; then
            echo "::error::Could not fetch base branch '$BASE_REF', so the merge tree cannot be built. Refusing to report a result."
            exit 1
          fi
          # Throwaway identity: runners have none configured and `git merge`
          # demands one even with --no-commit. Nothing is committed here: the
          # merge only lands in the worktree the steps below inspect.
          if ! git -c user.name=ci -c user.email=ci@local \
            merge --no-commit --no-ff "origin/$BASE_REF"; then
            git merge --abort || true
            echo "::error::Merging origin/$BASE_REF into the dispatched ref conflicts, so the merge tree the PR would produce does not exist. Update the branch and dispatch again."
            exit 1
          fi
          echo "Diffing $(git rev-parse --short HEAD) merged with origin/$BASE_REF ($(git rev-parse --short "origin/$BASE_REF"))."

      # The Rust client is generated at build time from the vendored spec at
      # crates/client/openapi.yaml. That copy must never drift from the
      # canonical nolgia-api contract. The canonical spec is published
      # unauthenticated to the public docs bucket on every push to
      # nolgia-api main that touches api/openapi.yaml (see
      # nolgia-api/.github/workflows/docs.yml), so we can diff against it
      # with no cross-repo token. Override the URL via NOLGIA_CANONICAL_SPEC_URL
      # if the docs host ever moves.
      # Re-fetch + re-diff with a few retries. The canonical spec is served from
      # a CDN-fronted bucket that is eventually-consistent during a publish: when
      # a nolgia-api merge is mid-propagation, two fetches seconds apart can hit
      # different edge states, so a single diff can transiently "drift" against a
      # spec that is really in sync (observed on the revendor PR right after an
      # api merge). Retrying rides out that window; a genuine drift still fails
      # after all attempts.
      - name: Verify vendored spec matches canonical
        env:
          SPEC_URL: ${{ vars.NOLGIA_CANONICAL_SPEC_URL || 'https://docs.nolgia.ai/api/openapi.yaml' }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if ! curl -fsSL --retry 3 --retry-delay 2 "$SPEC_URL" -o /tmp/canonical-openapi.yaml; then
              echo "::notice::Attempt $attempt: fetch of $SPEC_URL failed — retrying…"
              sleep 20; continue
            fi
            echo "Attempt $attempt: fetched $(wc -c < /tmp/canonical-openapi.yaml) bytes from $SPEC_URL"
            if diff -u crates/client/openapi.yaml /tmp/canonical-openapi.yaml; then
              echo "Vendored spec matches canonical nolgia-api contract."
              exit 0
            fi
            echo "::notice::Attempt $attempt: vendored spec differs from canonical — the docs bucket may be mid-publish (CDN eventual consistency). Retrying…"
            sleep 20
          done
          echo "::error::crates/client/openapi.yaml has drifted from the canonical nolgia-api spec (after retries)."
          echo "::error::Run the 're-vendor OpenAPI spec' workflow (workflow_dispatch), or locally: curl -fsSL https://docs.nolgia.ai/api/openapi.yaml -o crates/client/openapi.yaml && cargo build && cargo fmt --all, then fix any command code and commit."
          exit 1
